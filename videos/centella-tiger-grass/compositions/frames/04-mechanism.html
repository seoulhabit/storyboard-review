<script>
(function () {
  var kicker = document.getElementById('mec-kicker');
  var card = document.getElementById('mec-card');
  var jag = document.getElementById('mec-jag');
  var dot = document.getElementById('mec-dot');
  var calm = document.getElementById('mec-calm');
  var labCalm = document.getElementById('mec-lab-calm');
  var syms = ['mec-s1','mec-s2','mec-s3'].map(function (i) { return document.getElementById(i); });
  var strikes = ['mec-k1','mec-k2','mec-k3'].map(function (i) { return document.getElementById(i); });
  var tag = document.getElementById('mec-tag');

  // #6: measure the real path length so the draw starts moving on frame one
  var jagLen = jag.getTotalLength();
  jag.style.strokeDasharray = jagLen;
  jag.style.strokeDashoffset = jagLen;

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  tl.fromTo(kicker, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45 }, 0.20);
  tl.fromTo(card, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45 }, 0.55);

  // "Here is the mechanism." → jagged red signal scrawls across (violent draw-on).
  tl.to(jag, { strokeDashoffset: 0, duration: 0.85, ease: 'power1.out' }, 1.10);

  // "shuts down" (local 3.76): the line freezes — aqua inflection dot marks the moment
  // (glitch SFX lands here) — then the calm layer wipes left→right (3.9→5.6).
  tl.to(dot, { opacity: 1, duration: 0.18 }, 3.70);
  tl.to(calm, { clipPath: 'inset(0 0% 0 0)', duration: 0.7, ease: 'power2.inOut' }, 3.95);
  // Marker rides the wipe's leading edge (two segments approximate the inOut ease + path y).
  tl.to(dot, { attr: { cx: 350, cy: 164 }, duration: 0.35, ease: 'power2.in' }, 3.95);
  tl.to(dot, { attr: { cx: 684, cy: 157 }, duration: 0.35, ease: 'power2.out' }, 4.30);
  tl.to(dot, { opacity: 0, duration: 0.3 }, 4.75);
  tl.to(labCalm, { opacity: 1, duration: 0.4 }, 4.85);

  // Tags land once the claim is on screen, before the symptom run.
  tl.to(tag, { opacity: 1, duration: 0.4 }, 6.50);

  // "Redness, stinging, that hot tight feeling" (8.25 / 9.0 / 9.95): chips appear…
  tl.fromTo(syms[0], { y: 12 }, { opacity: 1, y: 0, duration: 0.35, immediateRender: false }, 8.10);
  tl.fromTo(syms[1], { y: 12 }, { opacity: 1, y: 0, duration: 0.35, immediateRender: false }, 8.90);
  tl.fromTo(syms[2], { y: 12 }, { opacity: 1, y: 0, duration: 0.35, immediateRender: false }, 9.85);

  // "the alarm gets switched off" (12.6→13.5): each chip gets struck and dims.
  strikes.forEach(function (k, i) {
    tl.to(k, { width: '80%', duration: 0.15, ease: 'power4.in' }, 12.55 + i * 0.16);
    tl.to(syms[i], { opacity: 0.52, duration: 0.3 }, 12.62 + i * 0.16);
  });


  // G1 underlay drift + G2 push-in (rework brief) — seek-safe, one direction per scene.
  var uvid = document.getElementById('mec-uvid');
  tl.fromTo(uvid, { scale: 1.06, xPercent: -2 }, { scale: 1.12, xPercent: 2, duration: 13.95, ease: 'none', immediateRender: true }, 0);
  ['mec-all'].forEach(function (id) {
    var el = document.getElementById(id);
    gsap.set(el, { transformOrigin: '50% 45%' });
    tl.fromTo(el, { scale: 1.0 }, { scale: 1.05, duration: 13.95, ease: 'power1.inOut', immediateRender: false }, 0);
  });

  window.__timelines = window.__timelines || {};
  window.__timelines['04-mechanism'] = tl;
})();
