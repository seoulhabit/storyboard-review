<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">PDRN identity card</title>
  <desc id="desc">Editorial identity card defining PDRN and emphasizing that route and preparation matter.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#131516" flood-opacity="0.11"/>
    </filter>
  </defs>
  <rect width="1080" height="600" fill="#F7F5F0"/>
  <rect x="56" y="50" width="968" height="500" rx="36" fill="#FBFAF4" stroke="#131516" stroke-opacity="0.15" filter="url(#shadow)"/>
  <g transform="translate(770 92) rotate(-8)" fill="none" stroke-linecap="round">
    <path d="M0 36 C55 5 90 78 145 44 C195 13 222 77 270 50" stroke="#59B8AE" stroke-width="10"/>
    <path d="M0 118 C55 87 90 160 145 126 C195 95 222 159 270 132" stroke="#6F8F72" stroke-width="10"/>
    <g stroke="#C97A5C" stroke-width="5" stroke-opacity="0.65">
      <line x1="24" y1="31" x2="24" y2="113"/><line x1="73" y1="34" x2="73" y2="116"/>
      <line x1="123" y1="46" x2="123" y2="128"/><line x1="174" y1="38" x2="174" y2="120"/>
      <line x1="226" y1="52" x2="226" y2="134"/>
    </g>
  </g>
  <text x="112" y="132" fill="#59B8AE" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">INGREDIENT IDENTITY</text>
  <text x="108" y="255" fill="#131516" font-family="Georgia, 'Times New Roman', serif" font-size="112">PDRN</text>
  <line x1="112" y1="292" x2="670" y2="292" stroke="#C97A5C" stroke-width="5"/>
  <text x="112" y="356" fill="#131516" font-family="Arial, Helvetica, sans-serif" font-size="31">Polydeoxyribonucleotide</text>
  <text x="112" y="417" fill="#59605C" font-family="Arial, Helvetica, sans-serif" font-size="24">DNA-fragment preparation</text>
  <g transform="translate(112 458)">
    <rect width="184" height="54" rx="27" fill="#E7EFEC"/><text x="92" y="35" text-anchor="middle" fill="#315D56" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">SOURCE</text>
    <rect x="200" width="214" height="54" rx="27" fill="#EDF0E9"/><text x="307" y="35" text-anchor="middle" fill="#4F6B52" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">FRAGMENT SIZE</text>
    <rect x="430" width="170" height="54" rx="27" fill="#F2E9E4"/><text x="515" y="35" text-anchor="middle" fill="#8B4F39" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">ROUTE</text>
  </g>
</svg>
