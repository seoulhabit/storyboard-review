<script>
(function () {
  var zoom = document.getElementById('cta-zoom');
  var glow = document.getElementById('vl-glow');
  var name = document.getElementById('cta-name');
  var divider = document.getElementById('cta-divider');

  var check = document.getElementById('cta-check');

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  // Word timings, installed take 05: "glow without the burn" 0.20-2.05 ·
  // "checked your ingredient list" 3.10-4.70 · "comments" 6.27 ·

  // Scene 1-2: the backing glow blooms behind the name; name + divider land.

  tl.to(name, { opacity: 1, duration: 0.45 }, 1.60);
  tl.to(divider, { opacity: 1, duration: 0.4 }, 1.95);

  // Scene 3: neon lines, per-word — "GLOW," then "WITHOUT THE BURN."

  tl.fromTo([words[1], words[2], words[3]], { y: 18 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.18 }, 2.95);

  // Scene 4: "CHECK YOUR INGREDIENT LIST" rides the spoken question.

  // Scene 5: the big comment/subscribe line lands with the spoken CTA.

  // One bounded glow-breathe under the final CTA words, settled before the cut-out.

  window.__timelines = window.__timelines || {};
  window.__timelines['05-cta'] = tl;
})();
