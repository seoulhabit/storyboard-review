<script>
(function () {
  var DURATION = 15.125;

  function buildWords(containerId, words) {
    var el = document.getElementById(containerId);
    var spans = [];
    words.forEach(function (w) {
      var span = document.createElement("span");
      span.className = "phrase-word";
      span.textContent = w;
      el.appendChild(span);
      spans.push(span);
    });
    return spans;
  }

  // Scene 1 — "In the 1960s, a Spanish doctor trying to heal severe radiation burns"
  var s1Words = buildWords("s1-phrase", [
    "In", "the", "1960s,", "a", "Spanish", "doctor", "trying", "to", "heal", "severe", "radiation", "burns"
  ]);
  // Scene 2 — "stumbled onto a bizarre, miraculous cure"
  var s2Words = buildWords("s2-phrase", [
    "stumbled", "onto", "a", "bizarre,", "miraculous", "cure"
  ]);
  // Scene 3 — "Fast forward to today,"
  var s3Words = buildWords("s3-phrase", [
    "Fast", "forward", "to", "today,"
  ]);
  // Scene 4 — "and that exact same goo is the beauty industry's biggest, weirdest" (obsession = payoff word)
  var s4Words = buildWords("s4-phrase", [
    "and", "that", "exact", "same", "goo", "is", "the", "beauty", "industry's", "biggest,", "weirdest"
  ]);

  // ---- yt-camera-move helpers (copied verbatim from compositions/components/yt-camera-move.html) ----
  window.ytCameraMove = function (tl, target, at, opts) {
    opts = opts || {};
    var dur = opts.dur === undefined ? 1.2 : opts.dur;
    gsap.set(target, {
      transformPerspective: 1200,
      transformOrigin: opts.origin || "50% 50%",
    });
    tl.to(
      target,
      {
        scale: 1 + (opts.zoom === undefined ? 0.11 : opts.zoom),
        x: opts.slideX || 0,
        y: opts.slideY || 0,
        rotationX: opts.tilt || 0,
        rotationY: opts.pan || 0,
        rotation: opts.roll || 0,
        duration: dur,
        ease: opts.ease || "power2.inOut",
      },
      at,
    );
  };
  window.ytCameraReset = function (tl, target, at, opts) {
    opts = opts || {};
    tl.to(
      target,
      {
        scale: 1,
        x: 0,
        y: 0,
        rotationX: 0,
        rotationY: 0,
        rotation: 0,
        duration: opts.dur === undefined ? 1.2 : opts.dur,
        ease: opts.ease || "power2.inOut",
      },
      at,
    );
  };
  window.ytDefocusPulse = function (tl, target, at, dur) {
    dur = dur === undefined ? 1.2 : dur;
    tl.to(target, { opacity: 1, duration: dur * 0.45, ease: "power2.out" }, at);
    tl.to(target, { opacity: 0, duration: dur * 0.55, ease: "power2.in" }, at + dur * 0.45);
  };

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  // full-span anchor
  tl.to({}, { duration: DURATION }, 0);

  // ---------- Scene 1 (0.0-5.4s) ----------
  // spring-pop mechanic (fromScale 0.9, overshoot 1.7) driving the archival label badge
  (function () {
    var badgeIn = 0.4, fromScale = 0.9, overshoot = 1.7, opacityIn = Math.min(0.3, badgeIn);
    tl.fromTo("#s1-label", { scale: fromScale }, { scale: 1, duration: badgeIn, ease: "back.out(" + overshoot + ")" }, 0.15);
    tl.fromTo("#s1-label", { opacity: 0 }, { opacity: 1, duration: opacityIn, ease: "power2.out" }, 0.15);
  })();

  // per-word reveal, evenly paced across the VO window 0.10-5.20s
  (function () {
    var start = 0.10, end = 5.20, n = s1Words.length;
    var step = (end - start) / n;
    s1Words.forEach(function (el, i) {
      var at = start + i * step;
      tl.fromTo(el, { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, at);
    });
  })();

  // Ken Burns — subtle drift on the archival still, via the shared yt-camera-move helper
  window.ytCameraMove(tl, "#scene1-kb", 0, { zoom: 0.05, dur: 5.4, ease: "sine.inOut" });

  // Zoom-Through cut, Scene 1 -> Scene 2/3/4 (state change: history -> the macro slime hero shot)
  // Phase 1: exit (5.10-5.40) — accelerate toward viewer, full-frame blur peak 20px

  tl.fromTo("#scene1-cut", { filter: "blur(0px)" }, { filter: "blur(20px)", duration: 0.3, ease: "power3.in" }, 5.10);
  tl.to("#scene1-cut", { opacity: 0.15, duration: 0.3, ease: "none" }, 5.10);
  // Phase 2: hard cut at t=5.4 — outgoing gone, incoming pre-set oversized/blurred
  tl.set("#scene1-cut", { opacity: 0 }, 5.4);
  tl.set("#scene234-cut", { opacity: 0.15, scale: 0.75, filter: "blur(20px)" }, 5.4);
  // Phase 3: entry (5.4-5.9) — continue forward, resolve sharp
  tl.to("#scene234-cut", { scale: 1.0, filter: "blur(0px)", opacity: 1.0, duration: 0.5, ease: "expo.out" }, 5.4);

  // ---------- Scenes 2-4 (5.4-15.125s) ----------
  // Continuous Ken Burns push-in across the whole macro-slime hold, settling to a stop
  window.ytCameraMove(tl, "#scene234-kb", 5.4, { zoom: 0.16, dur: 9.725, ease: "power2.out" });

  // Scene 2 — "stumbled onto a bizarre, miraculous cure" (5.64-8.52s), upper third
  (function () {
    tl.set("#s2-phrase", { display: "flex" }, 5.4);
    var start = 5.64, end = 8.52, n = s2Words.length;
    var step = (end - start) / n;
    s2Words.forEach(function (el, i) {
      var at = start + i * step;
      tl.fromTo(el, { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, at);

    var gaps = [0, 0.05, 0.092, 0.127];
    s3Words.forEach(function (el, i) {
      var at = cutAt + gaps[i];

  (function () {
    var cutAt = 10.30;
    tl.set("#s4-phrase", { display: "flex", x: 230, opacity: 0 }, cutAt);

    var step = (end - start) / n;

    });

    // dim the running line slightly as the payoff scrim/word take over
    tl.to("#s4-phrase", { opacity: 0.55, duration: 0.3, ease: "power1.out" }, 14.0);
  })();

  // Payoff — "Obsession." spring-pops dead-center on a translucent scrim (14.28-14.86s), holds to the end
  tl.to("#payoff-scrim", { opacity: 1, duration: 0.28, ease: "power1.out" }, 14.0);
  // spring-pop mechanic (fromScale 0.9, overshoot 1.7) — bare word, no badge chrome, since this isn't a pill
  (function () {
    var wordIn = 0.58, fromScale = 0.9, overshoot = 1.7, opacityIn = Math.min(0.3, wordIn);
    tl.fromTo("#payoff", { scale: fromScale }, { scale: 1, duration: wordIn, ease: "back.out(" + overshoot + ")" }, 14.28);
    tl.fromTo("#payoff", { opacity: 0 }, { opacity: 1, duration: opacityIn, ease: "power2.out" }, 14.28);
  })();

  window.__timelines["01-hook"] = tl;
})();
</script>
