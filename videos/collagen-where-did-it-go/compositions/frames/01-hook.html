<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>01-hook</title></head>
<body>
<template>
  <div id="root" data-composition-id="01-hook"
       data-width="1920" data-height="1080" data-duration="5.500">
    <style>
      #root {
    --paper:#F7F5F0; --ink:#131516; --ink-soft:#211F1B; --mist:#F0EBE1; --white:#FCFBF9;
    --aqua:#59B8AE; --leaf:#6F8F72; --coral:#C97A5C; --highlighter:#E0A32B;
    --moss:#4F6B52; --celadon:#93B896;
    --ink-2:#6B6B6B; --ink-3:#9C978D; --ink-2-dark:#878B8C; --ink-3-dark:#7C8082;
    /* --ink-2 is scoped to --paper (4.89:1). On --mist it measures 4.49:1,
       under the 4.5 floor -- so any secondary ink sitting ON a --mist panel
       uses this instead (5.13:1). Measured, not assumed: the channel's
       --ink-2/--ink-2-dark split exists for exactly this reason. */
    --ink-2-mist:#626262;
    --rule:#E3E3E3; --rule-strong:#D9D3C6; --rule-dark:#333333;

    --font-display:"EB Garamond",Georgia,"Times New Roman",serif;
    --font-body:"Inter",system-ui,-apple-system,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;

    --t-hero:96px; --t-figure:60px; --t-frame:50px; --t-body:40px;
    --t-caption:24px; --t-label:40px; --t-chip:40px; --t-floor:20px;
    /* --t-label / --t-chip raised from 32px: at a 25% phone-scale preview
       (480x270), 32px source text becomes ~8px on screen -- below what a
       viewer can read for citations, chart axis labels, filter pills and
       size-limit annotations, none of which are duplicated as on-screen
       kinetic text. --t-floor (20px) and --t-caption (24px) are unused --
       nothing in this project's scenes references them; the real shipped
       floor before this change was 32px, and is now 40px. */
    --lh-tight:1.06; --lh-snug:1.2; --lh-body:1.45;
    --tr-display:-0.018em; --tr-body:0em; --tr-mono:0.04em; --tr-mono-wide:0.1em;

    --s-2:8px; --s-3:12px; --s-4:20px; --s-5:32px; --s-6:60px; --s-7:96px; --s-8:144px;
    --r-2:6px; --r-3:10px; --r-pill:999px;

    /* landscape canvas + reserved zones -- see tokens.css for the derivation */
    --canvas-w:1920px; --canvas-h:1080px;
    --safe-top:54px; --safe-bottom:108px; --safe-left:96px; --safe-right:96px;
    --safe-margin:6px;
    /* End-screen reserve -- SCENE-SCOPED, consumed by 05-verdict alone. Present
       in EVERY scene because an inlined token block that omits a token used by
       any scene fails SILENTLY: the calc() is invalid and the whole declaration
       is dropped. That shipped 41 frames of safe-area intrusion on ectoin. */
    --endscreen-right:640px; --endscreen-bottom:200px;
    /* NO burned-in caption band in this project, so no --cap-band-* tokens.
       The on-screen language is the curated beat text (<= 10 words a beat,
       never a transcript); a caption band would fight it for the same frame.
       The caption DELIVERABLE is a real sidecar .srt/.vtt built from the
       measured word manifest -- required for long-form, which is watched in a
       player that surfaces it.
       Consequence for QC: check-static-hold.py's CAPTION_BAND_EXCLUDE must be
       False here, and it asserts that against index.html at runtime. */
}

    @font-face { font-family:"EB Garamond"; src:url("assets/fonts/eb-garamond-400.woff2") format("woff2");
                 font-weight:400; font-display:block; }
    @font-face { font-family:"Inter"; src:url("assets/fonts/inter-800.woff2") format("woff2");
                 font-weight:800; font-display:block; }
    @font-face { font-family:"JetBrains Mono"; src:url("assets/fonts/jetbrains-mono-500.woff2") format("woff2");
                 font-weight:500; font-display:block; }


    *,*::before,*::after { box-sizing:border-box; }
    html,body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; }
    #root { position:absolute; inset:0; overflow:hidden; background:var(--paper); }
    .stage { position:relative; width:100%; height:100%;
             padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); }
    /* The stage's single child fills the SAFE BOX exactly, so clipping it clips
       at the safe line. Confirmed necessary on the ectoin build: the hard
       safe-area gate found 81 frames with ink in a reserved zone, all of them
       entrance-transform or scale transients. Containment beats a bigger margin
       -- a margin is sized against today's token and goes stale silently. */
    .stage > * { overflow: hidden; }
    .flexmin { min-height:0; }

    /* ---- camera ----------------------------------------------------------
       One .world wrapper, one cam {scale,x,y} state per scene. Consecutive
       scenes are framings of ONE space, not separate slides. .world sits INSIDE
       .stage so the safe-box clip above still bounds every camera move. */
    /* TWO layers, and the split is load-bearing.
       .worldclip is a NORMAL block filling the stage's CONTENT box -- never
       `position:absolute; inset:0`, because an abspos child with inset:0
       resolves against the containing block's PADDING box and would spill
       straight back over the safe-area padding the stage just reserved. As a
       flow child at 100%/100% it fills the content box exactly, so clipping it
       clips AT the safe line.
       .world carries the CAMERA and must be a separate, inner element. Putting
       `overflow:hidden` and the camera transform on the SAME element does not
       work: a transform scales the element's own clip boundary with it, so a
       camera at scale 1.045 moves the clip edge ~39px OUTSIDE the safe box and
       the containment quietly stops containing. Measured on the first full
       render -- the hard safe-area gate found ink in a reserved zone on 460
       frames, and an independent per-frame check against a uniform border ring
       reproduced it (left 5774px at t=38.0s), so it was the composition and not
       the estimator. */
    .worldclip { position:relative; width:100%; height:100%; overflow:hidden; }
    .world { position:relative; width:100%; height:100%;
             transform-origin:50% 50%; will-change:transform; }

    /* Citation chip: `Journal / Year` ONLY. Never an internal id or a PMID --
       those live in BRIEF.md's claim table and the video description. */
    .cite { font-family:var(--font-mono); font-weight:500; font-size:var(--t-chip);
            letter-spacing:var(--tr-mono); color:var(--ink-2);
            border:2px solid var(--rule-strong); border-radius:var(--r-pill);
            padding:10px 26px; right:auto; width:max-content; bottom:auto;
            background:var(--mist); }
    .cite.on-ink { color:var(--ink-2-dark); border-color:var(--rule-dark);
                   background:var(--ink-soft); }

    /* ---- panel-scale beat primitives -------------------------------------
       Ectoin's Act 1 measured 5.8% active steps against 11.7-23.1% on shipped
       9:16 projects. Cause: on a 1920-wide frame a headline sits in a grid cell,
       so a text fade changes ~0.7% of the pixels. These move a whole panel or
       column instead -- which is what actually reads, and what the cadence
       check can actually see. Working rule: area >= 8% AND luma delta >= 80,
       inside <= 0.8s. */
    .panel { position:relative; background:var(--mist); border-radius:var(--r-3);
             padding:var(--s-6); min-height:0; overflow:hidden; }
    .panel.on-ink { background:var(--ink-soft); }
    .wash { position:absolute; inset:0; transform:scaleX(0); transform-origin:0% 50%;
            border-radius:inherit; z-index:0; }
    /* Every following sibling of a wash sits ABOVE it.
       CAVEAT this rule cannot cover: a BARE TEXT NODE has no element to carry
       position/z-index, so a wash paints straight over it and the card renders
       EMPTY. The engine's own text_occluded pass walks text ELEMENTS and is
       blind to text that never became one -- it survived into ectoin's shipped
       payoff line at 1.72:1. ALWAYS wrap copy in an element inside a washed
       container; the :only-child guard below makes a stray case visible. */
    .wash ~ * { position:relative; z-index:1; }
    .wash:only-child { outline:3px dashed #C97A5C; }
    .wash.aqua { background:var(--aqua); } .wash.coral { background:var(--coral); }
    .wash.moss { background:var(--moss); } .wash.dim { background:var(--ink-3); }
    .wash.ink  { background:var(--ink); }
    .wash.paper { background:var(--paper); }   /* the only light wash: used to
       invert a panel on an INK ground, which is a 214-luma step -- the largest
       beat available anywhere in the palette. */
    /* WASH COLOUR IS BOUND TO TEXT COLOUR. A wash replaces what sits behind the
       text, so a token that passed against the panel's ORIGINAL ground can fail
       against the wash -- measured on ectoin: --ink-2 on aqua is 2.26:1, --paper
       on aqua ~1.9:1. Safe pairings only:
         light ground -> .wash.aqua / .wash.coral / .wash.dim -> --ink text
         dark  ground -> .wash.moss / .wash.ink              -> --paper text
       Anything else must be re-measured against the wash, not the panel. */
    .wash.aqua ~ *, .wash.coral ~ *, .wash.dim ~ *, .wash.paper ~ *, .washed-light { color:var(--ink) !important; }
    .wash.moss ~ *, .wash.ink ~ *, .washed-dark { color:var(--paper) !important; }

    /* A panel-sized strike: covers the whole card, not a 5px line through a word. */
    .void { position:absolute; inset:0; background:var(--coral); opacity:0;
            border-radius:inherit; }

    .p-title { font-family:var(--font-body); font-weight:800; font-size:var(--t-frame);
               line-height:var(--lh-snug); margin:0 0 var(--s-3); }
    .p-body { font-family:var(--font-display); font-size:var(--t-body);
              line-height:var(--lh-body); margin:0; color:var(--ink-2); }
    .p-body.on-ink { color:var(--ink-2-dark); }
    .kicker { font-family:var(--font-mono); font-size:var(--t-label);
              letter-spacing:var(--tr-mono-wide); text-transform:uppercase;
              color:var(--ink-2); margin:0; }
    .kicker.on-ink { color:var(--ink-2-dark); } /* was --ink-3-dark (4.13:1 on ink-soft, fails 4.5 text floor); --ink-2-dark measures 4.78:1 */
    .hero { font-family:var(--font-display); font-size:var(--t-hero);
            line-height:var(--lh-tight); letter-spacing:var(--tr-display); margin:0; }
    .fig { font-family:var(--font-display); font-size:var(--t-figure);
           line-height:var(--lh-snug); margin:0; }
    .col { display:flex; flex-direction:column; min-height:0; }
    .row { display:flex; min-width:0; }
    .grow { flex:1 1 0; min-height:0; min-width:0; }

    /* ---- kinetic type + chips ---------------------------------------
       Text is a BEAT, not a transcript: every phrase is <= 10 words, sized at
       or above the 32px chrome floor, and enters with spatial meaning (a rise,
       a slam, a strike). On a 1920-wide frame type alone is ~0.5-3% of the
       pixels, so every kinetic phrase is PAIRED with a panel-scale change (a
       .wash under it, a ground flood, a camera leg) that the cadence checker
       can actually see. Never name any of these `caption-*`: the static-hold
       gate greps for that family to detect a burned-in caption track. */
    .kt { display:flex; flex-wrap:wrap; column-gap:.28em; row-gap:0; margin:0;
          font-family:var(--font-body); font-weight:800; font-size:var(--t-frame);
          line-height:var(--lh-snug); color:var(--ink); }
    .kt.serif { font-family:var(--font-display); font-weight:400;
                font-size:var(--t-hero); line-height:var(--lh-tight);
                letter-spacing:var(--tr-display); }
    .kt.on-ink { color:var(--paper); }
    .kt-word { display:inline-block; opacity:0; will-change:transform; }
    .kt-strike { position:relative; display:inline-block; }
    .kt-bar { position:absolute; left:0; right:0; top:52%; height:.09em;
              background:var(--coral); transform:scaleX(0); transform-origin:0 50%; }
    .chip { font-family:var(--font-mono); font-weight:500; font-size:var(--t-chip);
            letter-spacing:var(--tr-mono); color:var(--ink-2-mist); background:var(--mist);
            border-radius:var(--r-pill); padding:8px 22px; width:max-content;
            white-space:nowrap; margin:0; }
    .chip.on-ink { color:#93989A; background:var(--ink-soft); }   /* 5.64:1 */
    .chip.solid { color:var(--ink); background:var(--aqua); }      /* 7.9:1 */
    .chip.warn  { color:var(--ink); background:var(--coral); }     /* 5.60:1 */
    /* the one 132px moment in the piece: two lines, Inter 800, on a paper wash */
    .stops-t { font-family:var(--font-body); font-weight:800; font-size:132px;
               line-height:var(--lh-tight); letter-spacing:var(--tr-display);
               margin:0; color:var(--ink); }
    .late { opacity:0; }   /* revealed by reveal() as its wash begins */
    .wash.sun { background:var(--highlighter); }
    .wash.sun ~ * { color:var(--ink) !important; }                 /* 8.3:1 */
    .wash.celadon { background:var(--celadon); }
    .wash.celadon ~ * { color:var(--ink) !important; }             /* 8.9:1 */

    /* Debug overlay -- toggled by a class on #root, never on <body>.
       Confirm it is OFF by checking frame zero before any real render. */
    #root.debug-layout * { outline:1px solid rgba(255,0,0,.55) !important; }
    #root.debug-layout::after {
      content:""; position:absolute; inset:0; pointer-events:none; z-index:99;
      background:
        linear-gradient(to bottom, rgba(255,0,168,.22) var(--safe-top), transparent var(--safe-top)),
        linear-gradient(to top,    rgba(255,0,168,.22) var(--safe-bottom), transparent var(--safe-bottom)),
        linear-gradient(to right,  rgba(255,0,168,.22) var(--safe-left), transparent var(--safe-left)),
        linear-gradient(to left,   rgba(255,0,168,.22) var(--safe-right), transparent var(--safe-right));
    }


    .mol-body { fill:none; stroke:var(--coral); stroke-linecap:round; }

    .bar-band { fill:var(--mist); }
    .bar-brick { fill:var(--paper); stroke:var(--ink); stroke-width:3; }
    .bar-jamb { stroke:var(--ink); stroke-width:4; }
    .bar-doorgap { fill:var(--paper); }
    .bar-surface { fill:none; stroke:var(--ink); stroke-width:4; opacity:.7; }
    .bar-boundary { stroke:var(--ink); stroke-width:4; stroke-dasharray:14 10; opacity:.55; }
    .bar-h { stroke:var(--aqua); stroke-width:7; stroke-linecap:round; opacity:.55; }
    .bar-label { font-family:var(--font-mono); font-size:32px; letter-spacing:.1em;
                 fill:var(--ink-2); opacity:1; }
    /* was opacity:.7 -- composites to 2.78:1 on paper, failing the 4.5 text
       floor; full opacity measures 4.89:1. The dim was cosmetic, not
       load-bearing (EPIDERMIS/DERMIS are the only text on these labels). */

    .abs { position:absolute; left:0; top:0; }
    #hook-slam { position:absolute; left:120px; top:120px; width:820px; }
    #hook-slam .kt-word.em { color:var(--coral); }
    .lab { opacity:0; }
    #powder { position:absolute; left:60px; top:560px; width:820px; height:320px;
              background:var(--mist); padding:var(--s-4) var(--s-5); }
    #powder .chip { position:relative; }
    .glass { fill:none; stroke:var(--ink); stroke-width:5; }
    .glass-fill { fill:var(--aqua); opacity:.35; }
    .arrow { fill:none; stroke:var(--ink); stroke-width:5; stroke-dasharray:18 14; opacity:.8; }
    .strike { fill:var(--coral); opacity:0; }
    .hidden-path { fill:none; stroke:none; }
    #epi-wash { position:absolute; left:1067px; top:0; width:177px; height:918px; background:var(--coral); }

    </style>

      <div class="stage">
       <div class="worldclip">
       <div class="world" id="world">
        <div class="panel " id="powder" style="position:absolute;left:60px;top:560px;width:820px;height:320px;"><div class="wash aqua" id="powder-wash"></div><p class="chip lab" id="lab-powder" style="position:absolute;left:32px;top:24px;">POWDER</p></div>
        <svg id="stageA" class="abs" viewBox="0 0 1728 918" width="1728" height="918" aria-hidden="true">
          <path id="run" class="hidden-path" d="M 320 470 L 790 470"/>
          <path id="drop" class="hidden-path" d="M 470 230 C 470 400 470 520 470 690"/>
          <path class="glass" d="M 400 640 L 540 640 L 522 830 L 418 830 Z"/>
          <rect class="glass-fill" x="412" y="760" width="116" height="66"/>

        <p class="kt " id="hook-slam"><span class="kt-word">does</span> <span class="kt-word em">NOT</span> <span class="kt-word" id="hook-slam-last">replace</span></p>

      </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    // No `defaults: {ease}` -- every tween names its own. See _preamble.py.
    var tl = gsap.timeline({ paused: true });
    var EASE = {"arrive": "power2.out", "slam": "back.out(1.7)", "wipe": "power4.inOut", "count": "none", "swap": "expo.inOut", "exit": "power2.in", "hold": "sine.inOut", "camera": "power2.inOut"};

    var NS = "http://www.w3.org/2000/svg";
    function el(t, a, parent) { var n = document.createElementNS(NS, t);
      for (var k in a) n.setAttribute(k, a[k]); if (parent) parent.appendChild(n); return n; }
    function txt(parent, x, y, s, cls, anchor) {
      var t = el("text", { x:x, y:y, "class":cls || "", "text-anchor":anchor || "start" }, parent);
      t.textContent = s; return t; }

    // pathFollow: move `node` along `pathEl` between progress `from` and `to`
    // WITHOUT MotionPathPlugin and WITHOUT onUpdate. The path is SAMPLED at
    // build time into a chain of short linear x/y (and rotation) tweens, so the
    // pose at any timeline time is a plain property tween -- a pure function of
    // time under any seek. (An onUpdate proxy was tried first: the runtime seeks
    // with callbacks suppressed, and frame zero rendered the molecule at the END
    // of its run.) Convention: the node is DRAWN at the path's start point, so
    // the translation is (q - p0). Returns the end pose for the caller's next
    // fromTo. Easing is applied to the sampled progress, so the motion keeps its
    // curve while every sub-tween stays linear.
    function pathFollow(tl, node, pathEl, at, dur, ease, o) {
      o = o || {}; var from = o.from == null ? 0 : o.from, to = o.to == null ? 1 : o.to;
      var L = pathEl.getTotalLength(), p0 = pathEl.getPointAtLength(0);
      var ox = o.ox == null ? p0.x : o.ox, oy = o.oy == null ? p0.y : o.oy;
      var N = o.samples || Math.max(12, Math.round(dur * 30)), ef = gsap.parseEase(ease || "none");
      function pose(p) {
        var q = pathEl.getPointAtLength(p * L), r = { x:q.x - ox, y:q.y - oy };
        if (o.rotate) { var a = pathEl.getPointAtLength(Math.min(L, p * L + 4)),
                            b = pathEl.getPointAtLength(Math.max(0, p * L - 4));
                        r.rotation = Math.atan2(a.y - b.y, a.x - b.x) * 57.2958; }
        return r;
      }
      var start = pose(from);
      // frame zero, and any cold seek before `at`. A node that is walked by TWO
      // pathFollows (tract, then a branch) must pass { set:false } on the second:
      // two zero-duration sets at t=0 render in insertion order and the LATER
      // one wins every frame before `at` (measured: dispatch dots drawn at the
      // tract exit before "absorbed").
      if (o.set !== false) tl.set(node, start, 0);
      var prev = start;
      for (var i = 1; i <= N; i++) {
        var p = from + (to - from) * ef(i / N), nxt = pose(p);
        var t0 = at + dur * (i - 1) / N;
        tl.fromTo(node, prev, Object.assign({ duration: dur / N, ease: "none" }, nxt), t0);
        prev = nxt;
      }
      return prev;
    }
    // stroke draw-in; dasharray set from the measured length
    function drawIn(tl, sel, at, dur, stagger, ease) {
      gsap.utils.toArray(sel).forEach(function (p, i) {
        var L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
        tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur,
                  ease: ease || "power4.inOut" }, at + i * (stagger || 0));
      });
    }
    // numeral count -- ease none, or it lies. A PROPERTY tween on innerText
    // with a modifier (no onUpdate), so any seek renders the right numeral.
    function count(tl, id, from, to, at, dur, fmt) {
      var node = document.getElementById(id);
      var f = fmt || function (n) { return n.toLocaleString("en-GB"); };
      node.textContent = f(from);
      tl.fromTo(node, { innerText: from }, { innerText: to, duration: dur, ease: "none",
                modifiers: { innerText: function (v) { return f(Math.round(parseFloat(v))); } } }, at);
    }
    // a panel that must not leak its copy before its wash: CSS .late holds it at
    // opacity 0; reveal() switches it on right as the wash begins
    function reveal(tl, sel, at) { tl.to(sel, { opacity:1, duration:0.1 }, at); }
    // kinetic words: "rise" (a claim settling) or "slam" (a payoff landing)
    function kineticWords(tl, sel, at, step, mode) {
      var w = gsap.utils.toArray(sel + " .kt-word");
      if (mode === "slam") tl.fromTo(w, { opacity:0, scale:1.6 }, { opacity:1, scale:1,
            duration:0.32, stagger:step, ease:"back.out(1.7)" }, at);
      else tl.fromTo(w, { opacity:0, y:18 }, { opacity:1, y:0, duration:0.34,
            stagger:step, ease:"power2.out" }, at);
    }

    // The collagen molecule: three sine ribbons 120deg apart, drawn as `segs`
    // groups (#id-seg-i) so digestion can tween segments apart without a
    // second drawing. o = { id, x, y, w, h, turns, strokeW, segs, cls }
    function drawHelix(svg, o) {
      var STEP = 8, N = Math.round(o.w / STEP), segs = o.segs || 1, turns = o.turns || 1.5;
      var g = el("g", { id:o.id, "class":"mol" }, svg);
      for (var s = 0; s < segs; s++) {
        var sg = el("g", { id:o.id + "-seg-" + s }, g);
        var i0 = Math.floor(N * s / segs), i1 = Math.min(N, Math.floor(N * (s + 1) / segs) + 1);
        for (var k = 0; k < 3; k++) {
          var d = "", ph = k * 2.0944;
          for (var i = i0; i <= i1; i++) {
            var x = i * STEP;
            d += (i === i0 ? "M" : "L") + (o.x + x).toFixed(1) + " " +
                 (o.y + Math.sin(x / o.w * turns * 6.2832 + ph) * o.h / 2).toFixed(2) + " ";
          }
          var p = el("path", { d:d, "class":o.cls || "mol-body", opacity:(0.45 + k * 0.27).toFixed(2) }, sg);
          p.style.strokeWidth = (o.strokeW || 14) + "px";
        }
      }
      return g;
    }

    // Skin cross-section: wavy surface, a brick-course stratum corneum, a
    // dashed epidermis/dermis boundary, an optional dermis hatch (aqua braces
    // = the collagen under the surface) and 32px labels. Geometry is a pure
    // function of o.w / o.h -- no PRNG. Adapted from catalog skin-band +
    // barrier-wall.
    //   o = { id, w, h, surf, boundary, brickRows, door:{col}, hatch:{n, cut:[i]},
    //         orient:"top"|"left", x, y, labels:true }
    // "left": drawn horizontally then rotated so the SURFACE faces left and the
    // band stands vertically at o.x with width o.h and height o.w.
    function drawBarrier(svg, o) {
      var g = el("g", { id:o.id, "class":"barrier" }, svg);
      var inner = g;
      if (o.orient === "left") {
        inner = el("g", { transform:"translate(" + o.x + " 0) rotate(-90) translate(-" + o.w + " 0)" }, g);
      } else if (o.x || o.y) {
        inner = el("g", { transform:"translate(" + (o.x||0) + " " + (o.y||0) + ")" }, g);
      }
      var w = o.w, h = o.h, surf = o.surf, bnd = o.boundary;
      // washes FIRST so everything paints above them
      el("rect", { x:0, y:surf, width:w, height:bnd - surf, "class":"bar-band", id:o.id + "-epi" }, inner);
      el("rect", { x:0, y:bnd, width:w, height:h - bnd, "class":"bar-band", id:o.id + "-derm" }, inner);
      // NO wash rects here: transform-scaling an SVG rect inside a translated group
      // rendered around the SVG origin, not the rect's edge. Washes are HTML divs
      // laid over the band by the file that owns it (see frames_c.py).
      // dermis hatch
      if (o.hatch) {
        var n = o.hatch.n || Math.max(2, Math.round(w / 150)), hx = w / n;
        for (var i = 0; i < n; i++) {
          var x0 = i * hx + 14, x1 = (i + 1) * hx - 14;
          var a = el("line", { x1:x0, y1:h - 14, x2:x1, y2:bnd + 14, "class":"bar-h", id:o.id + "-h-" + i }, inner);
          var b = el("line", { x1:x1, y1:h - 14, x2:x0, y2:bnd + 14, "class":"bar-h", id:o.id + "-hb-" + i }, inner);
          [a, b].forEach(function (L) { var len = Math.hypot(x1 - x0, h - bnd - 28);
            L.style.strokeDasharray = len; L.style.strokeDashoffset = 0; L.setAttribute("data-len", len); });
        }
        (o.hatch.cut || []).forEach(function (i) {
          ["-h-", "-hb-"].forEach(function (s) {
            var L = document.getElementById(o.id + s + i);
            L.style.strokeDashoffset = L.getAttribute("data-len"); L.style.opacity = "0.25"; });
        });
      }
      // brick courses (running bond)
      var BW = 130, BH = 58, J = 16, rows = o.brickRows == null ? 2 : o.brickRows;
      for (var r = 0; r < rows; r++) {
        var yb = surf + 10 + r * (BH + J), off = (r % 2) ? -73 : 0, c = 0;
        for (var xb = off; xb < w; xb += BW + J, c++) {
          if (o.door && r === 0 && c === o.door.col) {
            el("line", { x1:xb + 20, y1:yb, x2:xb + 20, y2:yb + BH, "class":"bar-jamb" }, inner);
            el("line", { x1:xb + BW - 20, y1:yb, x2:xb + BW - 20, y2:yb + BH, "class":"bar-jamb" }, inner);
            el("rect", { x:xb + 20, y:yb, width:BW - 40, height:BH, "class":"bar-doorgap", id:o.id + "-door" }, inner);
            continue;
          }
          el("rect", { x:Math.max(0, xb), y:yb, width:Math.min(w, xb + BW) - Math.max(0, xb), height:BH, rx:9,
                       "class":"bar-brick", id:o.id + "-b-" + r + "-" + c }, inner);
        }
      }
      // surface wave and boundary
      var d = "";
      for (var k = 0; k <= 24; k++) {
        var x = w * k / 24, y = surf + 7 * Math.sin(2.2 * 6.2832 * x / w) + 3 * Math.sin(5.1 * 6.2832 * x / w);
        d += (k ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1) + " ";
      }
      el("path", { d:d, "class":"bar-surface", id:o.id + "-surface" }, inner);
      el("line", { x1:0, y1:bnd, x2:w, y2:bnd, "class":"bar-boundary", id:o.id + "-boundary" }, inner);
      if (o.labels !== false) {
        if (o.orient === "left") {
          txt(g, o.x + surf + 22, 52, "EPIDERMIS", "bar-label");
          txt(g, o.x + h - 22, 52, "DERMIS", "bar-label", "end");
        } else {
          txt(inner, 22, surf - 16, "EPIDERMIS", "bar-label");
          txt(inner, 22, h - 18, "DERMIS", "bar-label");
        }
      }
      return g;
    }

    var svg = document.getElementById("stageA");
    gsap.set("#epi-wash", { scaleX:0, transformOrigin:"0% 50%" });
    // the barrier stands on the right, surface facing the molecule
    drawBarrier(svg, { id:"bar", w:918, h:691, surf:30, boundary:207, brickRows:2,
                       orient:"left", x:1037, hatch:{ n:6 } });
    var mol = drawHelix(svg, { id:"mol", x:40, y:470, w:560, h:140, strokeW:16 });
    var molb = drawHelix(svg, { id:"mol-b", x:330, y:230, w:280, h:70, strokeW:11 });
    molb.style.opacity = "0";
    var run = document.getElementById("run"), drop = document.getElementById("drop");

    // THE RACE: frame zero already has the molecule moving; it reaches the
    // surface exactly as "replace" is spoken.
    var tR = 1.014;
    var end = pathFollow(tl, mol, run, 0.12, Math.max(0.6, tR - 0.30 - 0.12), "power2.in");
    // IMPACT: the epidermis flashes coral, the wall flexes, the molecule recoils
    tl.fromTo("#epi-wash", { scaleX:0 }, { scaleX:1, duration:0.18, yoyo:true, repeat:1, ease:EASE.slam }, tR - 0.05);
    tl.fromTo("#bar", { scaleX:1, transformOrigin:"100% 50%" },
              { scaleX:0.97, duration:0.16, yoyo:true, repeat:1, ease:EASE.slam }, tR - 0.05);
    tl.fromTo(mol, { x:end.x, y:end.y }, { x:end.x - 70, duration:0.45, ease:EASE.slam }, tR);
    kineticWords(tl, "#hook-slam", 0.820 - 0.05, 0.08, "slam");
    tl.fromTo("#lab-cream", { opacity:0, scale:0.8 }, { opacity:1, scale:1, duration:0.3, ease:EASE.slam }, 0.244);

    // THE SPLIT: the powder route opens below
    tl.fromTo("#powder-wash", { scaleX:0 }, { scaleX:1, duration:0.5, ease:EASE.wipe }, 2.520 - 0.10);
    tl.fromTo("#lab-powder", { opacity:0, scale:0.8 }, { opacity:1, scale:1, duration:0.3, ease:EASE.slam }, 2.520);
    // the powder route is the SAME actor splitting off, not a new one fading in
    tl.fromTo(molb, { opacity:1, scale:0.2, transformOrigin:"50% 50%" },
              { scale:1, duration:0.32, ease:EASE.slam }, 2.520);
    pathFollow(tl, molb, drop, 3.650, 0.7, "power2.in");
    drawIn(tl, "#arrow-face", 3.650 + 0.25, 0.5, 0, EASE.wipe);
    // "...to your face": the route is struck out, the panel retracts
    tl.fromTo("#arrow-x", { opacity:1, scaleX:0, transformOrigin:"0% 50%" },
              { scaleX:1, duration:0.25, ease:EASE.wipe }, 4.705);
    tl.to("#powder-wash", { scaleX:0, duration:0.4, ease:EASE.exit }, 4.705 + 0.30);
    tl.to(["#arrow-face", "#arrow-x", molb, "#lab-powder"], { opacity:0, duration:0.3, ease:EASE.exit }, 4.705 + 0.30);
    // converge: the molecule parks at the frame centre, where the iris opens
    tl.fromTo(mol, { x:end.x - 70, y:end.y }, { x:864 - 320, y:506 - 470, duration:0.55, ease:EASE.camera }, 4.900 - 0.20);
    tl.to("#hook-slam", { opacity:0, duration:0.3, ease:EASE.exit }, 4.900 - 0.20);

    // departure: push under the iris wipe into the next file
    tl.to("#world", { scale:1.06, duration:0.55, ease:"power2.inOut" }, 4.950);

    tl.to({}, { duration: 5.500 }, 0);   // full-span anchor -- always last
    window.__timelines["01-hook"] = tl;
  </script>
</template>
