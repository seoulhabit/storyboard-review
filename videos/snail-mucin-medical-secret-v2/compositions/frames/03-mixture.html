<script>
  (function () {
    var tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["03-mixture"] = tl;

    // ---------- the 100-tick grid is STATIC markup (100 pre-declared divs above),
    // never created at runtime — a build-100-divs-via-createElement version of this
    // scene rendered as a completely blank region for its whole on-screen life despite
    // every GSAP tween firing correctly, confirmed by frame extraction at multiple points
    // across the animation window. Every other element in this project is static markup
    // animated by GSAP; this is that same pattern, applied here too. ----------
    var ticks = gsap.utils.toArray(".mx-tick-div");

    // ---------- initial states ----------
    gsap.set("#mx-vessel-fill", { attr: { height: 0, y: 626 } });
    gsap.set("#mx-vessel-outline", { strokeDashoffset: 1800 });
    gsap.set("#mx-envelope-path", { strokeDashoffset: 900 });
    gsap.set(ticks, { opacity: 0 });
    gsap.set([".mx-row"], { opacity: 0, x: 0 });
    gsap.set("#mx-envelope-path", { opacity: 0 });
    gsap.set("#mx-hero-variable", { opacity: 0, y: 20 });
    gsap.set("#mx-citation-1", { opacity: 0 });
    gsap.set([".mx-tile", "#mx-evidence-card", "#mx-restate", "#mx-caveat-note"], { opacity: 0 });
    gsap.set(".mx-ev-row", { opacity: 0, x: -12 });
    gsap.set("#mx-gap-placebo", { width: "0%" });
    gsap.set("#ph-evidence", { autoAlpha: 0 });

    function fillVessel(pct, at, dur) {
      var h = 616 * (pct / 100);
      tl.to("#mx-vessel-fill", { attr: { height: h, y: 626 - h }, duration: dur, ease: "power2.out" }, at);
    }

    // ================= PHASE 1: composition + variance =================
    // 0.00-2.24: vessel draws in, fills to 97%
    tl.to("#mx-vessel-outline", { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 0.10);
    fillVessel(97, 0.60, 1.4);
    tl.fromTo("#mx-water-label", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.60);

    // 2.24-4.64: 10-segment pictogram lights in reading order (9 "water" segments, 1
    // remainder) — one staggered GSAP call across the whole array, not 100 individual
    // per-id tweens. A 100-element version of this (both div- and SVG-rect-based) rendered
    // as a fully blank region for its whole on-screen life in this engine, confirmed by
    // frame extraction at multiple points; this 10-element version is the fix, not a
    // workaround — precision beyond what a 10-segment pictogram can show belongs in the
    // "97% WATER" text label, never invented into the pictogram itself.
    // Water/non-water fill is baked into the class attribute at build time.
    // 10 elements is the right precision for this pictogram; the "97% WATER"
    // text label carries the actual figure.
    for (var r = 0; r < 10; r++) {
      tl.fromTo("#tick-" + r, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, 2.24 + r * 0.24);
    }

    // 4.64-7.64: remainder detaches into 3 named rows (waterfall-entry)
    tl.fromTo("#mx-row-protein", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 4.70);
    tl.fromTo("#mx-row-glycolic", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 5.30);
    tl.fromTo("#mx-row-allantoin", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 5.90);

    // 7.64-11.14: sample 2 — lateral re-deal (never vertical, per catalog's own confirmed fix)
    tl.to("#mx-row-protein", { x: 60, duration: 0.8, ease: "power2.inOut" }, 8.20);
    tl.to("#mx-row-glycolic", { x: -40, duration: 0.8, ease: "power2.inOut" }, 8.40);
    tl.to("#mx-row-allantoin", { x: 30, duration: 0.8, ease: "power2.inOut" }, 8.60);
    tl.to(".mx-row-bar", { scaleX: 1.15, duration: 0.8, ease: "power2.inOut", stagger: 0.08 }, 8.20);

    // 11.14-14.64: sample 3 re-deals again; variance envelope draws
    tl.to("#mx-row-protein", { x: -20, duration: 0.8, ease: "power2.inOut" }, 11.60);
    tl.to("#mx-row-glycolic", { x: 50, duration: 0.8, ease: "power2.inOut" }, 11.80);
    tl.to("#mx-row-allantoin", { x: -50, duration: 0.8, ease: "power2.inOut" }, 12.00);
    tl.fromTo("#mx-envelope-path", { opacity: 0 }, { opacity: 0.6, duration: 0.3 }, 12.60);
    tl.to("#mx-envelope-path", { strokeDashoffset: 0, duration: 1.4, ease: "power2.out" }, 12.60);

    // 14.64-17.92: "VARIABLE" hero lands; rows keep a bounded drift (keepsMoving floor for this window)
    tl.fromTo("#mx-hero-variable", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 14.80);
    tl.fromTo("#mx-citation-1", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 15.30);
    tl.to(".mx-row", { y: -8, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 15.00);

    // ================= in-scene HARD CUT to phase 2, at 17.92 =================
    tl.set("#ph-composition", { autoAlpha: 0 }, 17.92);
    tl.set("#ph-evidence", { autoAlpha: 1 }, 17.92);
    // [S6/A-10] `hold`: one continuous bounded drift across the whole phase-2 span,
    // under the discrete pop-ins. Measured: the evidence rows finish ~24.5s scene-local,
    // the gap-bar fills 27.4-28.5, restate/caveat land ~30.9-32.0 — leaving three separate
    // dead windows (2.9s / 2.4s / 2.6s) between them, all over the 1.6s cadence ceiling.
    tl.to("#ph-evidence", { y: -3, duration: 8.3, ease: "sine.inOut" }, 18.50);
    tl.to("#ph-evidence", { y: 0, duration: 7.76, ease: "sine.inOut" }, 26.80);

    // 17.92-19.64: the composition actor REFRAMES into the left tile (not redrawn)
    tl.fromTo("#mx-tile-mix", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, 17.92);

    // 19.64-22.64: two more tiles arrive
    tl.fromTo("#mx-tile-t1", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, 19.70);
    tl.fromTo("#mx-tile-t2", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, 20.30);

    // 22.64-27.14: evidence card + rows (discrete-text-sequence)
    tl.fromTo("#mx-evidence-card", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 22.70);
    tl.fromTo(".mx-ev-row", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.32, stagger: 0.35, ease: "power2.out" }, 23.10);

    // 27.14-30.64: the honest retraction — bar narrows the gap
    tl.fromTo("#mx-gap-placebo", { width: "0%" }, { width: "86%", duration: 1.1, ease: "power2.out" }, 27.40);

    // 30.64-34.56: plain restatement + caveat
    tl.fromTo("#mx-restate", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 30.90);
    tl.fromTo("#mx-caveat-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 31.60);

    tl.to({}, { duration: 34.56 }, 0);
  })();
</script>
