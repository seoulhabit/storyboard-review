<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["01-hook"] = tl;

  // ---- word content: single source of truth for markup + timing ----
  // (dynamic-content-sequencing pattern, applied at word granularity: each
  // word's start is computed from content length, never a hardcoded offset)
  const CLAUSE_1_WORDS = ["The", "strongest", "ginseng", "study", "never", "touched", "skin."];
  const CLAUSE_2_WORDS = ["It", "was", "swallowed."];
  const WORD_BASE = 0.16;
  const WORD_PER_CHAR = 0.012;

  function schedule(words, startTime) {
    let t = startTime;
    return words.map((w) => {
      const dur = WORD_BASE + w.length * WORD_PER_CHAR;
      const start = t;
      t += dur;
      return { word: w, start };
    });
  }

  const clause1Schedule = schedule(CLAUSE_1_WORDS, 0.6);
  const clause2Schedule = schedule(CLAUSE_2_WORDS, 3.0);

  function mount(lineEl, entries) {
    entries.forEach((entry) => {
      const span = document.createElement("span");
      span.className = "hook-word";
      span.textContent = entry.word;
      lineEl.appendChild(span);
      entry.el = span;
    });
  }

  mount(document.getElementById("hook-line-1"), clause1Schedule);
  mount(document.getElementById("hook-line-2"), clause2Schedule);

  // Scene 2 (0.6-2.6s) — clause 1, per-word stagger, confident power3 settle.
  clause1Schedule.forEach((entry) => {
    tl.fromTo(
      entry.el,
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      entry.start,
    );
  });

  // Scene 4 (3.0-4.4s) — clause 2, same family, smaller displacement:
  // flat, quiet delivery, no emphasis pop. The reversal is in the plainness.
  clause2Schedule.forEach((entry) => {
    tl.fromTo(
      entry.el,
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      entry.start,
    );
  });

  // Scene 1 (0.0-0.6s) into Scene 3 settle (~2.6-2.8s) — root-vein self-draw.
  const veinPaths = document.querySelectorAll(".hook-vein");
  veinPaths.forEach((p) => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = String(len);
    p.style.strokeDashoffset = String(len);
  });

  const VEIN_SEG_DUR = 0.58;
  const VEIN_STAGGER = VEIN_SEG_DUR * 0.75;
  const VEIN_START = 0.05;
  veinPaths.forEach((p, i) => {
    tl.to(
      p,
      { strokeDashoffset: 0, duration: VEIN_SEG_DUR, ease: "power2.out" },
      VEIN_START + i * VEIN_STAGGER,
    );
  });

  // Scene 5 (4.4-5.0s) — supporting tag, small and low-opacity.
  tl.fromTo(
    "#hook-tag-text",
    { opacity: 0 },
    { opacity: 0.6, duration: 0.5, ease: "power1.out" },
    4.4,
  );

  // Scene 5 — both clauses hold still, subtle jitter only (sine-wave-loop,
  // low amplitude; phase starts at 0 so there is no jump off the entry tail).
  const textZoneEl = document.querySelector(".hook-textzone");
  const jitterPhase = { p: 0 };
  tl.to(
    jitterPhase,
    {
      p: Math.PI * 2 * 0.3,
      duration: 0.6,
      ease: "none",
      onUpdate: () => {
        const s = Math.sin(jitterPhase.p);
        textZoneEl.style.transform = `translateY(${(s * 2).toFixed(2)}px)`;
      },
    },
    4.4,
  );
</script>
