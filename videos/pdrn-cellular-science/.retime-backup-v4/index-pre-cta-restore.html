    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];

        // 1 -> 2 : cut (glitch SFX removed per audio-cleanup directive; the hard cut stands alone)

        // 2 -> 3 : crossfade
        tl.to("#el-02-identity", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 18.231);
        tl.fromTo("#el-03-history", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 18.231);

        // 3 -> 4 : crossfade (continuous "just under the surface" world)
        tl.to("#el-03-history", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 28.831);
        tl.fromTo("#el-04-mechanism", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 28.831);

        // 4 -> 5 : crossfade
        tl.to("#el-04-mechanism", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 42.150);
        tl.fromTo("#el-05-fibroblast", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 42.150);

        // 5 -> 6 : cut (matches the CTA's "pop" SFX hard-cut open)

        tl.to({}, { duration: 61.000 }, 0); // full-span anchor — main.duration() == composition total
