<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingredient Hero Actor — Catalog V2</title>
  <link rel="stylesheet" href="../../system-tokens.css">
  <style>
    .stage{background:linear-gradient(112deg,#e4e9e3 0 43%,#f5f4ee 43%)}
    .topline{position:absolute;z-index:4;top:5%;left:4%;right:4%;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:clamp(12px,1vw,18px);font-weight:680}.rule{max-width:31ch;color:var(--ll-ink-soft);font-size:clamp(10px,.78vw,14px);line-height:1.35;text-align:right}
    .identity{position:absolute;z-index:3;left:5%;top:22%;width:34%;display:grid;align-content:center}.ordinal{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--ll-line);border-radius:50%;color:var(--ll-ink-soft);font-size:12px}.title{margin:clamp(18px,2vw,34px) 0 12px;font-size:clamp(44px,5.6vw,104px);font-weight:610;letter-spacing:-.068em;line-height:.82}.definition{max-width:33ch;color:var(--ll-ink-soft);font-size:clamp(12px,1vw,18px);line-height:1.45}.signature{display:flex;gap:10px;align-items:center;margin-top:clamp(18px,2vw,34px);font-size:clamp(10px,.8vw,14px)}.signature::before{content:"";width:34px;height:1px;background:var(--ll-ink)}
    .actor-field{position:absolute;z-index:2;inset:12% 4% 8% 43%;display:grid;place-items:center}.lens{position:relative;width:min(74%,640px);aspect-ratio:1;border:1px solid rgba(23,35,50,.18);border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.98),rgba(255,255,255,.46) 58%,rgba(127,157,136,.10) 59% 100%);box-shadow:inset 0 0 0 14px rgba(255,255,255,.28),0 35px 70px rgba(23,35,50,.12)}.lens::before,.lens::after{content:"";position:absolute;background:var(--ll-line)}.lens::before{left:-12%;right:-12%;top:50%;height:1px}.lens::after{top:-12%;bottom:-12%;left:50%;width:1px}.actor{position:absolute;z-index:2;inset:11%;display:grid;place-items:center}.actor svg{width:100%;height:100%;overflow:visible}.actor-caption{position:absolute;z-index:3;right:-4%;bottom:10%;width:41%;border-left:3px solid var(--ll-celadon);padding:8px 0 8px 14px;color:var(--ll-ink-soft);font-size:clamp(10px,.82vw,15px);line-height:1.35;background:rgba(245,244,238,.72)}
    .orbit{position:absolute;inset:4%;border:1px dashed rgba(99,88,167,.26);border-radius:50%;animation:orbit 16s linear infinite}.orbit::before{content:"";position:absolute;left:14%;top:8%;width:11px;height:11px;border-radius:50%;background:var(--ll-assay);box-shadow:0 0 0 7px rgba(99,88,167,.11)}@keyframes orbit{to{transform:rotate(360deg)}}
    .mode-strip{position:absolute;z-index:4;left:44%;right:5%;bottom:7%;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ll-line)}.mode{padding:12px 9px;border-right:1px solid var(--ll-line);color:var(--ll-ink-soft);font-size:clamp(9px,.68vw,12px)}.mode:last-child{border-right:0}.mode.active{color:var(--ll-ink);font-weight:650}.mode.active::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--ll-celadon)}
    @media(max-width:840px){.stage{background:linear-gradient(#e4e9e3 0 42%,#f5f4ee 42%)}.rule{display:none}.identity{left:7%;right:7%;top:10%;width:auto}.title{font-size:53px;margin:12px 0 8px}.definition{max-width:38ch}.signature{margin-top:12px}.actor-field{inset:42% 4% 13%}.lens{width:min(90%,480px)}.actor-caption{right:1%;bottom:5%;width:48%}.mode-strip{left:7%;right:7%;bottom:5%}.mode{padding:8px 4px;font-size:8px}.ll-disclosure{display:none}}
  </style>
</head>
<body>
  <main class="ll-shell">
    <header class="ll-toolbar"><div class="ll-toolbar-copy"><strong>Ingredient Hero Actor</strong><span>The ingredient remains recognizable while the surrounding story changes.</span></div><div class="ll-switcher" role="tablist" aria-label="Ingredient fixture"><button role="tab" aria-selected="true" data-fixture="snail">Snail Mucin</button><button role="tab" aria-selected="false" data-fixture="pdrn">PDRN</button><button role="tab" aria-selected="false" data-fixture="cica">Cica demo</button></div></header>
    <section class="ll-stage stage" aria-label="Ingredient actor preview">
      <div class="topline"><div class="brand">SeoulHabit ingredient review</div><div class="rule">One actor. Four contexts. Products support the explanation; they never replace the ingredient.</div></div>
      <div class="identity"><div class="ordinal">01</div><h1 class="title" id="title"></h1><div class="definition" id="definition"></div><div class="signature" id="signature"></div></div>
      <div class="actor-field"><div class="lens"><div class="orbit"></div><div class="actor" id="actor"></div><div class="actor-caption" id="actorCaption"></div></div></div>
      <div class="mode-strip"><div class="mode active">Identity</div><div class="mode">Source</div><div class="mode">Formula</div><div class="mode">Recap</div></div>
      <div class="ll-disclosure" id="disclosure"></div><div class="ll-version">Label Literacy 0.3</div>
    </section>
  </main>
  <script>
    const art={
      snail:`<svg viewBox="0 0 500 500" role="img" aria-label="Illustrative clear elastic gel strand"><defs><linearGradient id="gel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".94"/><stop offset=".48" stop-color="#adc9bc" stop-opacity=".72"/><stop offset="1" stop-color="#c5944d" stop-opacity=".42"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="7"/></filter></defs><path d="M76 308C118 205 172 331 219 224C261 129 306 181 334 271C359 351 402 327 429 209" fill="none" stroke="#426b50" stroke-opacity=".13" stroke-width="42" stroke-linecap="round" filter="url(#blur)"/><path d="M76 298C118 195 172 321 219 214C261 119 306 171 334 261C359 341 402 317 429 199" fill="none" stroke="url(#gel)" stroke-width="27" stroke-linecap="round"/><path d="M82 289C124 210 170 310 216 207" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/><g fill="#fff" fill-opacity=".78" stroke="#7f9d88" stroke-opacity=".25"><circle cx="167" cy="288" r="12"/><circle cx="278" cy="153" r="7"/><circle cx="354" cy="311" r="9"/></g></svg>`,
      pdrn:`<svg viewBox="0 0 500 500" role="img" aria-label="Illustrative short DNA-fragment actor"><defs><linearGradient id="frag" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6358a7"/><stop offset="1" stop-color="#5f9294"/></linearGradient></defs><g fill="none" stroke-linecap="round"><path d="M92 174C144 126 193 222 247 175C301 128 348 217 407 164" stroke="url(#frag)" stroke-width="15"/><path d="M105 219C156 171 205 266 259 220C313 173 360 261 417 211" stroke="#7f9d88" stroke-width="15"/><path d="M90 319C132 282 171 350 215 315" stroke="url(#frag)" stroke-width="15"/><path d="M274 324C315 286 356 355 405 310" stroke="url(#frag)" stroke-width="15"/></g><g stroke="#172332" stroke-opacity=".38" stroke-width="4"><path d="M130 165l10 51M172 168l11 50M214 183l10 48M266 172l10 52M309 166l11 50M352 178l10 47"/></g><g fill="#f1f2ed" stroke="#6358a7" stroke-width="4"><circle cx="91" cy="174" r="10"/><circle cx="407" cy="164" r="10"/><circle cx="90" cy="319" r="10"/><circle cx="215" cy="315" r="10"/><circle cx="274" cy="324" r="10"/><circle cx="405" cy="310" r="10"/></g></svg>`,
      cica:`<svg viewBox="0 0 500 500" role="img" aria-label="Illustrative Centella leaf actor"><defs><linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8cdbd"/><stop offset="1" stop-color="#5f826c"/></linearGradient></defs><path d="M250 411C215 351 157 312 126 244C88 162 146 85 236 104C271 54 358 79 373 154C429 184 411 282 345 312C318 344 286 379 250 411Z" fill="url(#leaf)" stroke="#426b50" stroke-width="6"/><g fill="none" stroke="#eef4ec" stroke-opacity=".82" stroke-width="4"><path d="M250 405V123M250 231L154 165M250 274L350 170M250 319L153 257M250 349L345 280"/></g><circle cx="250" cy="123" r="12" fill="#f1f2ed" stroke="#426b50" stroke-width="4"/></svg>`
    };
    const fixtures={
      snail:{title:"Snail\nMucin",definition:"A filtered secretion ingredient whose identity stays separate from the finished formula.",signature:"Elastic strand · slow settle",caption:"Clear, elastic strand with controlled viscosity—not a molecule or a product.",disclosure:"Illustrative ingredient actor. It explains visual identity, not collection conditions or efficacy."},
      pdrn:{title:"PDRN",definition:"A category of DNA-fragment preparations whose source, specification and route can differ.",signature:"Short fragments · precise assembly",caption:"Short paired fragments—not a generic full-genome helix.",disclosure:"Illustrative ingredient actor. Exact source, fragment profile and equivalence require product-specific evidence."},
      cica:{title:"Cica",definition:"A consumer-facing name that must be connected to the exact declaration and extract version.",signature:"Leaf source · version required",caption:"Botanical source cue—not proof of extraction method or formula performance.",disclosure:"Fictional source-story fixture. Verify the selected product declaration and extract details."}
    };
    function render(key){const f=fixtures[key];document.querySelector('#title').innerHTML=f.title.replace('\n','<br>');document.querySelector('#definition').textContent=f.definition;document.querySelector('#signature').textContent=f.signature;document.querySelector('#actorCaption').textContent=f.caption;document.querySelector('#disclosure').textContent=f.disclosure;document.querySelector('#actor').innerHTML=art[key]}
    document.querySelectorAll('[data-fixture]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-fixture]').forEach(item=>item.setAttribute('aria-selected','false'));button.setAttribute('aria-selected','true');render(button.dataset.fixture)}));render('snail');
  </script>
</body>
</html>
