       determinism-rules: never pair a CSS transform with a GSAP tween on

    padding: 0 60px;

    justify-content: center;
    opacity: 0;

       multi-line wrap for free. */

    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.01em;
