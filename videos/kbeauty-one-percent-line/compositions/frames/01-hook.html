<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "EB Garamond";
          font-weight: 400;
          font-style: normal;
          src: url("assets/fonts/eb-garamond-400.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          font-weight: 800;
          font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "JetBrains Mono";
          font-weight: 100 900;
          font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2");
          font-display: block;
        }
        #root {
          --paper: #F7F5F0;
          --ink: #131516;
          --ink-2: #6B6B6B;
          --ink-3: #9C978D;
          --aqua: #59B8AE;
          --highlighter: #E0A32B;
          --font-display: "EB Garamond", Georgia, "Times New Roman", serif;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --t-hero: 96px;
          --t-figure: 60px;
          --t-body: 32px;
          --t-label: 24px;
          --e-out: cubic-bezier(0.215, 0.61, 0.355, 1);
          --e-inout: cubic-bezier(0.455, 0.03, 0.515, 0.955);
          --safe-top: 120px;
          --safe-left: 60px;
          --safe-right: 162px;

          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper);
          font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }

        .hook-silhouettes {
          top: var(--safe-top);
          left: 0; width: 100%; height: 420px;
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 64px;
        }
        .hook-bottle {
          width: 120px; height: 280px;
          border: 3px solid var(--ink-3);
          border-radius: 12px 12px 28px 28px;
          opacity: 0;
        }
        .hook-bottle::before {
          content: "";
          display: block;
          width: 44px; height: 40px;
          margin: -3px auto 0;
          border: 3px solid var(--ink-3);
          border-bottom: none;
          border-radius: 6px 6px 0 0;
        }

        .hook-stat-zone {
          top: 760px;
          left: var(--safe-left);
          width: 960px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 40px;
        }
        .hook-stat-80 {
          position: relative;
          font-family: var(--font-body);
          font-weight: 800;
          font-size: 108px;
          line-height: 1;
          letter-spacing: -0.01em;
          color: var(--ink);
          text-align: center;
        }
        .hook-strike {
          position: absolute;
          left: -20px; right: -20px; top: 50%;
          height: 10px;
          background: var(--ink);
          transform: scaleX(0);
          transform-origin: left center;
        }
        .hook-stat-05-wrap {
          position: relative;
          display: inline-flex;
          opacity: 0;
        }
        .hook-stat-05-mark {
          position: absolute;
          left: -16px; right: -16px; bottom: 6px; height: 28px;
          background: var(--aqua);
          opacity: 0.28;
          transform: scaleX(0);
          transform-origin: left center;
        }
        .hook-stat-05 {
          position: relative;
          font-family: var(--font-body);
          font-weight: 800;
          font-size: 88px;
          line-height: 1;
          color: var(--ink);
          text-align: center;
        }

        .hook-vo-zone {
          top: 1320px;
          left: var(--safe-left);
          width: 960px;
        }
        .hook-vo-line {
          font-family: var(--font-display);
          font-weight: 400;
          font-size: 44px;
          line-height: 1.22;
          color: var(--ink-2);
          text-align: center;
        }
        .hook-word { display: inline-block; margin-right: 0.22em; opacity: 0; }
      </style>

      <div data-hf-id="hf-hook-root" id="root" data-composition-id="01-hook" data-width="1080" data-height="1920" data-duration="8.7">
        <div data-hf-id="hf-hook-silo" id="hook-silhouettes" class="clip hook-silhouettes" data-start="0" data-duration="8.7">
          <div data-hf-id="hf-hb1" class="hook-bottle" id="hook-bottle-1"></div>
          <div data-hf-id="hf-hb2" class="hook-bottle" id="hook-bottle-2"></div>
          <div data-hf-id="hf-hb3" class="hook-bottle" id="hook-bottle-3"></div>
        </div>

        <div data-hf-id="hf-hook-stats" id="hook-stat-zone" class="clip hook-stat-zone" data-start="0" data-duration="8.7">
          <div data-hf-id="hf-hook-80" id="hook-stat-80" class="hook-stat-80">
            80% GINSENG?
            <div data-hf-id="hf-hook-strike" id="hook-strike" class="hook-strike"></div>
          </div>
          <div data-hf-id="hf-hook-05wrap" id="hook-stat-05-wrap" class="hook-stat-05-wrap">
            <div data-hf-id="hf-hook-05mark" id="hook-stat-05-mark" class="hook-stat-05-mark"></div>
            <div data-hf-id="hf-hook-05" id="hook-stat-05" class="hook-stat-05">0.5% GINSENG.</div>
          </div>
        </div>

        <div data-hf-id="hf-hook-vo" id="hook-vo-zone" class="clip hook-vo-zone" data-start="0" data-duration="8.7">
          <div data-hf-id="hf-hook-voline" class="hook-vo-line" id="hook-vo-line"></div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // silhouettes: soft fade-in, subtle finite drift, out before crossfade
        const BOTTLES = ["#hook-bottle-1", "#hook-bottle-2", "#hook-bottle-3"];
        BOTTLES.forEach((id, i) => {
          tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 0.35, y: 0, duration: 0.5, ease: "power3.out" }, 0.1 + i * 0.08);
        });
        BOTTLES.forEach((id) => {
          tl.to(id, { y: -6, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.6);
        });
        BOTTLES.forEach((id) => {
          tl.to(id, { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 6.8);
        });

        // "80% GINSENG?" is on screen from frame zero (never blank — it's the scroll-stop),
        // settling in on scale only rather than fading up from nothing.
        tl.fromTo("#hook-stat-80", { scale: 0.9 }, { scale: 1, duration: 0.35, ease: "power3.out" }, 0);

        // buzzer strike (ink-weight, not coral — coral is Frame 4's sole voltage moment)
        tl.to("#hook-strike", { scaleX: 1, duration: 0.18, ease: "power2.in" }, 3.0);
        tl.to("#hook-stat-80", { opacity: 0.45, duration: 0.3, ease: "power2.out" }, 3.05);

        // "0.5% GINSENG." reveal with the frame's one aqua mark
        tl.fromTo("#hook-stat-05-wrap", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.3);
        tl.to("#hook-stat-05-mark", { scaleX: 1, duration: 0.4, ease: "power3.out" }, 3.35);

        // VO line, two-clause word reveal (estimated per-word schedule, dynamic-content-sequencing)
        const CLAUSE_1 = ["Does", "your", "favorite", "Korean", "serum", "claim", "to", "be", "packed", "with", "80%", "Ginseng?"];
        const CLAUSE_2 = ["What", "if", "the", "actual", "amount", "is", "less", "than", "a", "single", "drop?"];
        const WORD_BASE = 0.15, WORD_PER_CHAR = 0.012;
        function schedule(words, startTime) {
          let t = startTime;
          return words.map((w) => { const dur = WORD_BASE + w.length * WORD_PER_CHAR; const start = t; t += dur; return { word: w, start }; });
        }
        const sched1 = schedule(CLAUSE_1, 0.0);
        const sched2 = schedule(CLAUSE_2, 3.3);
        const lineEl = document.getElementById("hook-vo-line");
        [...sched1, ...sched2].forEach((entry) => {
          const span = document.createElement("span");
          span.className = "hook-word";
          span.textContent = entry.word;
          lineEl.appendChild(span);
          entry.el = span;
        });
        [...sched1, ...sched2].forEach((entry) => {
          tl.fromTo(entry.el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, entry.start);
        });

        // hold, then clear everything before the 0.5s cross-fade tail begins at 8.2
        tl.to(["#hook-stat-zone", "#hook-vo-zone"], { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 7.85);

        tl.to({}, { duration: 8.7 }, 0); // full-span anchor

        window.__timelines["01-hook"] = tl;
      </script>
    </template>
  </body>
</html>
