       at the safe line. Confirmed necessary on the ectoin build: the hard
       safe-area gate found 81 frames with ink in a reserved zone, all of them
       entrance-transform or scale transients. Containment beats a bigger margin
       -- a margin is sized against today's token and goes stale silently. */
    .stage > * { overflow: hidden; }

    /* ---- camera ----------------------------------------------------------
       One .world wrapper, one cam {scale,x,y} state per scene. Consecutive
       scenes are framings of ONE space, not separate slides. .world sits INSIDE
       .stage so the safe-box clip above still bounds every camera move. */

       .worldclip is a NORMAL block filling the stage's CONTENT box -- never
       `position:absolute; inset:0`, because an abspos child with inset:0
       resolves against the containing block's PADDING box and would spill
       straight back over the safe-area padding the stage just reserved. As a
       flow child at 100%/100% it fills the content box exactly, so clipping it
       clips AT the safe line.

       `overflow:hidden` and the camera transform on the SAME element does not
       work: a transform scales the element's own clip boundary with it, so a
       camera at scale 1.045 moves the clip edge ~39px OUTSIDE the safe box and
       the containment quietly stops containing. Measured on the first full
       render -- the hard safe-area gate found ink in a reserved zone on 460
       frames, and an independent per-frame check against a uniform border ring
       reproduced it (left 5774px at t=38.0s), so it was the composition and not
       the estimator. */

       so a text fade changes ~0.7% of the pixels. These move a whole panel or

       check can actually see. Working rule: area >= 8% AND luma delta >= 80,
       inside <= 0.8s. */

       position/z-index, so a wash paints straight over it and the card renders

       blind to text that never became one -- it survived into ectoin's shipped
       payoff line at 1.72:1. ALWAYS wrap copy in an element inside a washed
       container; the :only-child guard below makes a stray case visible. */

       beat available anywhere in the palette. */

       text, so a token that passed against the panel's ORIGINAL ground can fail

    // pathFollow: move `node` along `pathEl` between progress `from` and `to`
    // WITHOUT MotionPathPlugin and WITHOUT onUpdate. The path is SAMPLED at
    // build time into a chain of short linear x/y (and rotation) tweens, so the
    // pose at any timeline time is a plain property tween -- a pure function of
    // time under any seek. (An onUpdate proxy was tried first: the runtime seeks
    // with callbacks suppressed, and frame zero rendered the molecule at the END
    // of its run.) Convention: the node is DRAWN at the path's start point, so
    // the translation is (q - p0). Returns the end pose for the caller's next
    // fromTo. Easing is applied to the sampled progress, so the motion keeps its
    // curve while every sub-tween stays linear.
    function pathFollow(tl, node, pathEl, at, dur, ease, o) {
      o = o || {}; var from = o.from == null ? 0 : o.from, to = o.to == null ? 1 : o.to;
      var L = pathEl.getTotalLength(), p0 = pathEl.getPointAtLength(0);
      var ox = o.ox == null ? p0.x : o.ox, oy = o.oy == null ? p0.y : o.oy;
      var N = o.samples || Math.max(12, Math.round(dur * 30)), ef = gsap.parseEase(ease || "none");
      function pose(p) {

        if (o.rotate) { var a = pathEl.getPointAtLength(Math.min(L, p * L + 4)),

      for (var s = 0; s < STOREYS; s++) {
        var y = TOP + s*H, yb = y + H;
        el("line", { x1:X0, y1:yb, x2:X1, y2:yb, "class":"b-floor", id:"floor-"+s }, P);
        el("line", { x1:X0+16, y1:yb-6, x2:X1-16, y2:y+6, "class":"beam", id:"beam-"+s+"a" }, P);
        el("line", { x1:X1-16, y1:yb-6, x2:X0+16, y2:y+6, "class":"beam", id:"beam-"+s+"b" }, P);
        for (var w = 0; w < 3; w++)
          el("rect", { x:X0+34+w*140, y:y+30, width:74, height:46, rx:3, "class":"b-win", id:"win-"+s+"-"+w }, P);
      }
      if (o.door) el("rect", { x:280, y:620, width:60, height:70, rx:3, "class":"b-door", id:"b-door" }, P);
    }
    // the same six beams the demolition cuts, in the order it cuts them
    var CUT_ORDER = ["4a","4b","3a","2b","3b","1a"];
    function setBeamsCut(tl, ids, offset) {
      ids.forEach(function (k) {
        var e = document.getElementById("beam-" + k);
        e.style.strokeDashoffset = "640"; e.style.opacity = "0.25";
        tl.set("#beam-" + k, { strokeDashoffset:640, opacity:0.25 }, 0);
      });
    }

    var svg = document.getElementById("bldg");
    drawBuilding(svg, { door:true, into:document.getElementById("bwrap") });
    // the building comes back DAMAGED: same beams 04 cut, restated at 0 for cold seeks
    setBeamsCut(tl, CUT_ORDER);
    document.getElementById("bwrap").setAttribute("transform", "translate(40 40) scale(0.9) skewX(-1.4)");
    gsap.set("#bwrap", { skewX:-1.4, y:9 });
    // camera settles in from the invert
    tl.fromTo("#world", { scale:1.06 }, { scale:1, duration:1.2, ease:EASE.camera }, 0);
    // rows are authored in their final slots; frame zero shows them UNSORTED
    ["#rank-1", "#rank-2", "#rank-3", "#rank-4"].forEach(function (id, i) {
      tl.fromTo(id, { y:[300, -150, 150, -300][i] }, { y:0, duration:0.7, ease:EASE.swap }, 1.764 - 0.2 + i * 0.08);
    });
    // each action locks in as it is named; sunscreen locks into the FOUNDATION
    tl.fromTo("#rank-1-wash", { scaleX:0 }, { scaleX:1, duration:0.4, ease:EASE.wipe }, 3.083);
    tl.to("#slab-lock", { opacity:1, duration:0.3, ease:EASE.slam }, 3.083 + 0.10);
    tl.to("#shield", { opacity:0.30, duration:0.6, ease:EASE.swap }, 3.083 + 0.10);
    tl.fromTo("#rank-2-wash", { scaleX:0 }, { scaleX:1, duration:0.4, ease:EASE.wipe }, 4.525);
    tl.to("#cite-smoke", { opacity:1, duration:0.3, ease:EASE.arrive }, 4.525 + 0.3);
    // the repair: SOME beams come back and the building straightens -- protecting
    // beats replacing; the damage is not undone
    ["4a", "3a", "1a"].forEach(function (k, i) {
      tl.to("#beam-" + k, { strokeDashoffset:0, opacity:1, duration:0.55, ease:EASE.wipe }, 4.525 + 0.4 + i * 0.3);
    });
    tl.to("#bwrap", { skewX:0, y:0, duration:1.1, ease:EASE.swap }, 4.525 + 0.6);
    tl.fromTo("#rank-3-wash", { scaleX:0 }, { scaleX:1, duration:0.4, ease:EASE.wipe }, 5.447);
    tl.fromTo("#rank-4-wash", { scaleX:0 }, { scaleX:1, duration:0.4, ease:EASE.wipe }, 8.385);
    tl.to("#cite-ret", { opacity:1, duration:0.3, ease:EASE.arrive }, 8.385 + 0.4);

    // ---- unit 15: cream and powder are OPTIONAL, kept apart from the first line
    tl.fromTo("#opt-wash", { scaleX:0 }, { scaleX:1, duration:0.4, ease:EASE.wipe }, 12.438 - 0.2);
    tl.to("#w1", { scale:1.05, duration:0.25, yoyo:true, repeat:1, ease:EASE.slam }, 12.438);
    tl.to("#w2", { scale:1.05, duration:0.25, yoyo:true, repeat:1, ease:EASE.slam }, 14.626);
    tl.fromTo("#opt-chip", { opacity:0, scale:0.8 }, { opacity:1, scale:1, duration:0.3, ease:EASE.slam }, 15.170);
    tl.to("#final", { opacity:1, duration:0.1 }, 15.784 - 0.1);
    tl.fromTo("#final-wash", { scaleX:0 }, { scaleX:1, duration:0.6, ease:EASE.wipe }, 15.784 - 0.1);
    tl.to("#bricks", { x:420, duration:0.6, ease:EASE.exit }, 18.417);

    // departure: push under the curtain wipe into the next file
    tl.to("#world", { scale:1.06, duration:0.90, ease:"power2.inOut" }, 18.950);

    tl.to({}, { duration: 19.850 }, 0);   // full-span anchor -- always last
    window.__timelines["14-hierarchy"] = tl;
  </script>
