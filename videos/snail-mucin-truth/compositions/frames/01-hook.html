  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const TOTAL_DURATION = 10.061;

    // full-span anchor so the timeline's own duration always matches the frame
    tl.to({}, { duration: TOTAL_DURATION }, 0);

    // ───────────────────────── Scene 1 (0.0–2.2s) — goo-drip glyph self-draws ─────────────────────────
    const blobPath = document.getElementById("mh01-blob");
    const tendrilPath = document.getElementById("mh01-tendril");
    const blobLen = blobPath.getTotalLength();
    const tendrilLen = tendrilPath.getTotalLength();

    blobPath.style.strokeDasharray = String(blobLen);
    blobPath.style.strokeDashoffset = String(blobLen);
    tendrilPath.style.strokeDasharray = String(tendrilLen);
    tendrilPath.style.strokeDashoffset = String(tendrilLen);

    // blob outline self-draws
    tl.to(blobPath, { strokeDashoffset: 0, duration: 1.2, ease: "power1.inOut" }, 0.0);
    // blob fill catches up behind the completing outline
    tl.fromTo(blobPath, { fillOpacity: 0 }, { fillOpacity: 0.92, duration: 0.8, ease: "power2.out" }, 0.8);
    // glossy sheen catches the fill — sells the blob as wet/viscous, not flat
    tl.fromTo(
      "#mh01-sheen",
      { opacity: 0, scale: 0.85 },
      { opacity: 0.55, scale: 1, duration: 0.5, ease: "power2.out", transformOrigin: "235px 110px" },
      1.3,
    );
    // tendril first drip — reveals to ~52% of its length
    tl.to(tendrilPath, { strokeDashoffset: tendrilLen * 0.48, duration: 1.0, ease: "power1.inOut" }, 1.0);

    // ───────────────────────── Scene 2 (2.2–4.5s) — glow blooms, clause A per-word reveals ─────────────────────────
    tl.fromTo(
      "#mh01-glow",
      { opacity: 0, scale: 0.85 },
      { opacity: 0.3, scale: 1, duration: 0.9, ease: "power2.out" },
      2.2,
    );

    function schedule(words, startTime, base, perChar) {
      let t = startTime;
      return words.map((w) => {
        const dur = base + w.length * perChar;
        const start = t;
        t += dur;
        return { word: w, start };
      });
    }

    function mount(containerEl, entries, extraClass) {
      entries.forEach((entry) => {
        const span = document.createElement("span");
        span.className = extraClass ? "mh01-word " + extraClass : "mh01-word";
        span.textContent = entry.word;
        containerEl.appendChild(span);
        entry.el = span;
      });
    }

    const CLAUSE_A = ["What", "if", "the", "secret", "to", "glowing,", "glass", "skin..."];
    const CLAUSE_B = ["is", "rubbing", "snail", "slime", "on", "your", "face?"];

    const clauseASchedule = schedule(CLAUSE_A, 2.3, 0.17, 0.013);
    const clauseBSchedule = schedule(CLAUSE_B, 4.7, 0.17, 0.013);

    mount(document.getElementById("mh01-clauseA"), clauseASchedule);
    mount(document.getElementById("mh01-clauseB"), clauseBSchedule, "mh01-word--b");

    clauseASchedule.forEach((entry) => {
      tl.fromTo(entry.el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, entry.start);
    });

    // ───────────────────────── Scene 3 (4.5–6.8s) — tendril extends further, clause B reveals beneath ─────────────────────────
    tl.to(tendrilPath, { strokeDashoffset: tendrilLen * 0.06, duration: 1.0, ease: "power1.inOut" }, 4.6);

    // a bead separates from the tendril tip and drips — a concrete, legible "viscous liquid" cue
    tl.fromTo("#mh01-bead", { opacity: 0, y: 0, scale: 0.6 }, { opacity: 0.95, scale: 1, duration: 0.25, ease: "power2.out" }, 5.6);
    tl.to("#mh01-bead", { y: 22, duration: 0.5, ease: "power1.in" }, 5.85);
    tl.to("#mh01-bead", { opacity: 0, duration: 0.3, ease: "power1.in" }, 6.35);

    clauseBSchedule.forEach((entry) => {
      tl.fromTo(entry.el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, entry.start);
    });

    // ───────────────────────── Scene 4 (6.8–9.0s → hold) — hard cut, payoff spring-pop, faint trail reprise ─────────────────────────
    tl.set(["#mh01-clauseA", "#mh01-clauseB", "#mh01-glow"], { opacity: 0 }, 6.8);
    tl.to("#mh01-glyph-stage", { opacity: 0.16, duration: 0.25, ease: "power1.out" }, 6.8);

    tl.fromTo(
      "#mh01-hero",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.4)" },
      6.85,
    );

    // bounded settle jitter — finite phase tween, never a yoyo/repeat:-1 loop
    const heroEl = document.getElementById("mh01-hero");
    const jitterStart = 7.45;
    const jitterDur = TOTAL_DURATION - jitterStart;
    const heroPhase = { p: 0 };
    tl.to(
      heroPhase,
      {
        p: Math.PI * 2 * 2.3,
        duration: jitterDur,
        ease: "none",
        onUpdate: () => {
          const s = Math.sin(heroPhase.p);
          heroEl.style.transform = "scale(" + (1 + s * 0.012) + ") translateY(" + (s * 2) + "px)";
        },
      },
      jitterStart,
    );

    window.__timelines["01-hook"] = tl;
  </script>
