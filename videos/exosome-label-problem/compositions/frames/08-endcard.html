<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        *, *::before, *::after { box-sizing: border-box; }
        h1, h2, h3, p, figure, blockquote, ul, ol, dl { margin: 0; }

        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "Noto Sans KR Video"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/NotoSansKR-500-subset.woff2") format("woff2"); font-display: block; }

        /* PAPER GROUND -- matches scene 01 exactly, which is half of the loop
           contract; the other half is the hero plate's position and scale. */
        #root {
          --paper: #F7F5F0; --ink: #131516; --mist: #F0EBE1;
          --ink-2: #6B6B6B; --ink-3: #9C978D;
          --celadon: #93B896; --moss: #4F6B52;
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --font-kr: "Noto Sans KR Video", "Noto Sans KR", sans-serif;
          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--paper); font-family: var(--font-body);
        }

        /* Spatial plan
           1. .stage reuses scene 01's skeleton -- same flex column, same
              --safe-* padding, same 30px gap, and a hero row whose right track
              is the same 400x765 plate panel, bottom-aligned. That is the loop
              device: the final frame hands back to frame zero with matched
              ground AND matched hero geometry.
           2. The left track carries the brand lockup instead of scene 01's
              figure annotations -- the 습 mark in a bordered square beside the
              wordmark, the same relationship the channel avatar uses.
           3. The plate's Ken Burns wrapper is the only absolute element and it
              lives inside .plate-panel's overflow:hidden context, so no
              --safe-*-zoomed math is needed. */
        .stage {
          display: flex; flex-direction: column; height: 1920px;
          padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
          gap: 30px;
        }

        /* The 습 mark is set as TYPE, not an image: the glyph is present in the
           project's own NotoSansKR subset (verified U+C2B5), so it renders
           crisp at any size and takes the ink colour directly. The channel
           avatar is the same glyph in the same relationship to its frame. */
        .brand { flex: 0 0 auto; display: flex; align-items: center; gap: 26px; opacity: 0; }
        /* Origin pinned to the TOP-LEFT corner: this mark sits exactly on both the
           top and left safe lines, so a centre-origin scale (entrance pop and the
           later pulse) pushed 560px of ink into both reserved zones. Growing
           down-and-right keeps the whole move inside the box. */
        .mark { transform-origin: 0% 0%; width: 132px; height: 132px; flex: 0 0 auto; border: 5px solid var(--ink);
                display: flex; align-items: center; justify-content: center;
                background: var(--paper); }
        .mark span { font-family: var(--font-kr); font-size: 84px; line-height: 1;
                     color: var(--ink); }
        .wordmark { font-weight: 800; font-size: 56px; line-height: 1.0;
                    letter-spacing: -0.02em; color: var(--ink); }
        .wordmark b { display: block; font-family: var(--font-mono); font-weight: 500;
                      font-size: 32px; letter-spacing: 0.04em; color: var(--ink-2);
                      margin-top: 12px; }

        .headline { font-weight: 800; font-size: 82px; line-height: 1.04;
                    letter-spacing: -0.035em; color: var(--ink); flex: 0 0 auto; }
        .rule { height: 8px; background: var(--celadon); width: 0; flex: 0 0 auto; }

        .hero { flex: 1 1 auto; min-height: 0; display: grid;
                grid-template-columns: 1fr 400px; gap: 34px; align-items: end; }
        .cta { display: flex; flex-direction: column; justify-content: flex-end;
               gap: 16px; padding-bottom: 6px; min-width: 0; }
        .cta p { font-family: var(--font-mono); font-size: 32px; line-height: 1.34;
                 color: var(--ink); opacity: 0; }
        .cta p b { display: block; font-weight: 500; color: var(--moss); }

        .plate-panel { width: 400px; height: 765px; position: relative;
                       overflow: hidden; background: #1A1A1A; }
        .plate-zoom { position: absolute; inset: 0; }
        .plate-zoom img { width: 100%; height: 100%; object-fit: cover; display: block; }

        #root.debug-layout * { outline: 1px solid rgba(255,0,0,0.6) !important; }
        #root.debug-layout .stage { outline: 2px solid #00E5FF !important; }
        #root.debug-layout .plate-panel { outline: 2px solid #FFD400 !important; }
        #root.debug-layout::after {
          content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 99;
          background:
            linear-gradient(to left,   rgba(255,0,168,.22) 15%, transparent 15%),
            linear-gradient(to top,    rgba(255,0,168,.22) 20%, transparent 20%),
            linear-gradient(to bottom, rgba(255,0,168,.22) 10%, transparent 10%);
        }
      </style>

      <div id="root" data-composition-id="08-endcard"
           data-width="1080" data-height="1920" data-duration="4.330">
        <div class="stage">

          <div class="brand" id="ec-brand">
            <div class="mark"><span>&#xC2B5;</span></div>
            <p class="wordmark">SeoulHabit<b>Korean skincare, answered</b></p>
          </div>

          <h1 class="headline" id="ec-head">Promising science.<br>Incomplete label.</h1>
          <div class="rule" id="ec-rule"></div>

          <div class="hero">
            <div class="cta">
              <p id="ec-cta">Check your bottle for the source.<b>Comment it &mdash; we&rsquo;ll decode the label.</b></p>
            </div>
            <figure class="plate-panel">
              <div class="plate-zoom" id="ec-zoom" data-layout-allow-overflow>
                <img src="assets/plates/01-serum-bottle-crop.png" alt=""
                     width="900" height="1720" loading="eager" decoding="sync">
              </div>
            </figure>
          </div>

        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        // THE LOOP. Scene 01 opens with this same plate at scale 1.0 and drifts
        // OUT to 1.080. This end card runs that move in reverse, so its final
        // frame sits at exactly scale 1.0 in exactly the same 400x765 box on the
        // same paper ground -- a replay hands back with no visible reset. The
        // plate stays in continuous motion throughout, so it never ships static.
        tl.fromTo('#ec-zoom', { scale: 1.080 }, { scale: 1.0, duration: 4.33, ease: 'none' }, 0);

        // The headline is composed at t=0: the card opens on its own verdict.
        // The brand lockup then arrives, so the mark is an event rather than
        // wallpaper that was always there.
        // Enters from BELOW, never above: this row is on the top safe line.
        tl.fromTo('#ec-brand', { opacity: 0, y: 26 },
                               { opacity: 1, y: 0, duration: 0.42 }, 0.20);
        tl.fromTo('.mark', { scale: 0.72 },
                           { scale: 1, duration: 0.46, ease: 'back.out(1.9)' }, 0.24);

        tl.to('#ec-rule', { width: 620, duration: 0.48, ease: 'power2.inOut' }, 1.10);
        tl.fromTo('#ec-cta', { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.34 }, 1.75);

        // 2.60 a single bounded pulse on the mark, then a settle -- the last
        // 1.7s of the card keeps real change on screen while the plate finishes
        // its reverse drift into the loop seam.
        tl.to('.mark', { scale: 1.06, duration: 0.40, yoyo: true, repeat: 1,
                         ease: 'sine.inOut' }, 2.60);
        tl.to('#ec-brand', { x: 16, duration: 0.70, ease: 'power2.out' }, 3.45);

        tl.to({}, { duration: 4.330 }, 0); // full-span anchor -- always last
        window.__timelines["08-endcard"] = tl;
      </script>
    </template>
  </body>
</html>
