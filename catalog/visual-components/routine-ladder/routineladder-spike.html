<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RoutineLadder — SPIKE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
/* Latin faces: Google Fonts CDN, verbatim URL from tokens/fonts.css (flagged there as a
   render-time network dependency the real pipeline still carries — not fixed here, just
   matched as-is). Korean: self-hosted, matching the video-specific subset every project that
   needs Hangul copies in locally rather than importing the CDN face. */
@font-face{font-family:"Noto Sans KR Video";src:url("assets/NotoSansKR-500-subset.woff2") format("woff2");font-weight:500;font-style:normal;font-display:block}

:root{
  /* ---- tokens/colors.css — verbatim subset actually used here ---- */
  --paper:#F7F5F0;
  --ink:#131516;
  --aqua:#59B8AE;         /* the one aqua-family accent this frame uses */
  --white:#FCFBF9;
  --ink-2:#6B6B6B;
  --ink-3:#9C978D;
  --ink-2-dark:#878B8C;
  --ink-3-dark:#7C8082;
  --rule:#E3E3E3;
  --rule-dark:#333333;
  --empty-dark:#57534C;

  /* ---- tokens/typography.css — verbatim ---- */
  --font-display:"EB Garamond",Georgia,"Times New Roman",serif;
  --font-body:"Inter","Noto Sans KR Video","Noto Sans KR",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --font-kr:"Noto Sans KR Video","Noto Sans KR",sans-serif;

  --t-chapter:72px;
  --t-subtitle:48px;
  --t-body:32px;
  --t-annot:28px;
  --t-label:24px;
  --t-chip:22px;

  --lh-tight:1.05;
  --lh-snug:1.2;
  --lh-body:1.45;

  --tr-mono:0.04em;
  --tr-mono-wide:0.10em;

  /* ---- tokens/spacing.css — verbatim ---- */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:20px; --s-5:32px; --s-6:60px; --s-7:96px;
  --r-2:6px; --r-3:10px;
  --rule-w-thin:1px;

  /* ---- tokens/motion.css — verbatim ---- */
  --e-out:cubic-bezier(.215,.61,.355,1);
  --e-in:cubic-bezier(.55,.055,.675,.19);
  --e-inout:cubic-bezier(.455,.03,.515,.955);
  --d-fast:400ms;
  --d-base:500ms;
  --stagger-step:220ms;   /* named in tokens/motion.css as "pillars, ladder rungs" */

  /* ---- tokens/layout.css — verbatim, short (9:16) lane: every shipped video is 1080x1920 ---- */
  --canvas-w:1080px; --canvas-h:1920px;
  --short-safe-top:120px; --short-safe-bottom:360px; --short-safe-left:60px; --short-safe-right:162px;
  --elev-2:0 18px 32px -20px rgba(19,21,22,.35);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#000;}
body{
  display:flex;align-items:flex-start;justify-content:center;
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}

.canvas{
  position:relative;
  width:var(--canvas-w);height:var(--canvas-h);
  background:var(--ink);
  overflow:hidden;
}

/* ---- chrome: matches the wordmark / doc-tag convention already used by sibling catalog entries ---- */
.chrome{
  position:absolute;left:var(--short-safe-left);right:var(--short-safe-right);top:var(--short-safe-top);
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--font-mono);font-size:var(--t-chip);font-weight:600;
  letter-spacing:var(--tr-mono-wide);text-transform:uppercase;
  color:var(--ink-2-dark);
}
.chrome .brand{color:var(--white);}

.spike-tag{
  position:absolute;left:var(--short-safe-left);bottom:calc(var(--short-safe-bottom) - 56px);
  font-family:var(--font-mono);font-size:var(--t-chip);font-weight:500;
  letter-spacing:var(--tr-mono);color:var(--ink-3-dark);
}

/* ---- stage: perspective field the six rungs sit inside ---- */
.stage{
  position:absolute;
  left:var(--short-safe-left);right:var(--short-safe-right);
  top:calc(var(--short-safe-top) + 160px);bottom:var(--short-safe-bottom);
  perspective:1800px;perspective-origin:50% 38%;
}
.ladder{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
}

.rung{
  position:absolute;left:0;top:50%;
  width:100%;height:236px;
  transform:translate3d(0, calc(-50% + var(--y)), var(--z));
  will-change:transform;backface-visibility:hidden;
  border-radius:var(--r-3);
  display:flex;align-items:center;gap:var(--s-5);
  padding:0 var(--s-6);
}

.rung-index{
  font-family:var(--font-mono);font-weight:600;
  letter-spacing:var(--tr-mono-wide);
  flex:none;
}

.rung-icon{
  flex:none;box-sizing:border-box;
  --icon-size:32px;
  width:var(--icon-size);height:var(--icon-size);
}
.rung-icon svg{display:block;width:100%;height:100%;}

.rung-body{min-width:0;flex:1;}
.rung-name{
  --name-size:28px;
  font-family:var(--font-display);font-weight:700;
  font-size:var(--name-size);line-height:var(--lh-tight);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rung-kr{
  font-family:var(--font-kr);font-size:var(--t-body);line-height:var(--lh-body);
  margin-top:var(--s-2);
  opacity:0;
}

/* ---- active rung: the one focal card — --paper surface, --elev-2 lift, --aqua accent ---- */
.rung[data-state="active"]{
  background:var(--paper);box-shadow:var(--elev-2);
}
.rung[data-state="active"] .rung-index{font-size:var(--t-label);color:var(--aqua);}
.rung[data-state="active"] .rung-icon{--icon-size:72px;color:var(--aqua);}
.rung[data-state="active"] .rung-name{--name-size:72px;color:var(--ink);}
.rung[data-state="active"] .rung-kr{color:var(--ink-2);opacity:1;}

/* ---- occupied (queued) rungs: transparent field, dimmed per depth tier.
   Solid per-tier colors, not container opacity — opacity-based dimming lets whatever sits
   behind a "solid" card bleed through it, a bug already found and fixed once this session
   on the same kind of depth stack. ---- */
.rung[data-state="occupied"]{
  background:transparent;border:var(--rule-w-thin) solid var(--rule-dark);
}
.rung[data-state="occupied"] .rung-index{font-size:var(--t-chip);}
.rung[data-state="occupied"] .rung-name{color:var(--white);}

.rung[data-depth="1"]{border-color:var(--ink-2-dark);}
.rung[data-depth="1"] .rung-index,.rung[data-depth="1"] .rung-icon{color:var(--ink-2-dark);}
.rung[data-depth="1"] .rung-name{color:var(--ink-2-dark);}

.rung[data-depth="2"]{border-color:var(--ink-3-dark);}
.rung[data-depth="2"] .rung-index,.rung[data-depth="2"] .rung-icon{color:var(--ink-3-dark);}
.rung[data-depth="2"] .rung-name{color:var(--ink-3-dark);}

.rung[data-depth="3"]{border-color:var(--empty-dark);}
.rung[data-depth="3"] .rung-index,.rung[data-depth="3"] .rung-icon{color:var(--empty-dark);}
.rung[data-depth="3"] .rung-name{color:var(--empty-dark);}

.rung[data-depth="4"]{border-color:var(--rule-dark);}
.rung[data-depth="4"] .rung-index,.rung[data-depth="4"] .rung-icon{color:var(--rule-dark);}
.rung[data-depth="4"] .rung-name{color:var(--rule-dark);}

/* ---- debug scrubber, ?debug=1 only ---- */
.debug-bar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:rgba(19,21,22,.92);
  color:var(--white);font-family:var(--font-mono);font-size:13px;padding:10px 16px;
  display:flex;align-items:center;gap:12px;}
.debug-bar input[type="range"]{flex:1;}
.debug-bar button{font-family:inherit;font-size:12px;padding:6px 12px;border-radius:var(--r-2);
  border:1px solid var(--rule-dark);background:transparent;color:var(--white);cursor:pointer;}
</style>
</head>
<body>

<div class="canvas">
  <div class="chrome">
    <span class="brand">SeoulHabit</span>
    <span>Routine Ladder</span>
  </div>

  <div class="stage">
    <div class="ladder" id="ladder">
      <div class="rung" id="rung-1" data-state="active" style="--z:0px;--y:0px;">
        <span class="rung-index">01</span>
        <span class="rung-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg></span>
        <span class="rung-body">
          <span class="rung-name">Cleanse</span>
          <span class="rung-kr">클렌저</span>
        </span>
      </div>

      <div class="rung" id="rung-2" data-state="occupied" data-depth="1" style="--z:-140px;--y:-46px;">
        <span class="rung-index">02</span>
        <span class="rung-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/></svg></span>
        <span class="rung-body">
          <span class="rung-name">Toner</span>
          <span class="rung-kr">토너</span>
        </span>
      </div>

      <div class="rung" id="rung-3" data-state="occupied" data-depth="2" style="--z:-280px;--y:-92px;">
        <span class="rung-index">03</span>
        <span class="rung-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/></svg></span>
        <span class="rung-body">
          <span class="rung-name">Essence &middot; Serum</span>
          <span class="rung-kr">에센스 · 세럼</span>
        </span>
      </div>

      <div class="rung" id="rung-4" data-state="occupied" data-depth="3" style="--z:-420px;--y:-138px;">
        <span class="rung-index">04</span>
        <span class="rung-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg></span>
        <span class="rung-body">
          <span class="rung-name">Ampoule</span>
          <span class="rung-kr">앰플</span>
        </span>
      </div>

      <div class="rung" id="rung-5" data-state="occupied" data-depth="4" style="--z:-560px;--y:-184px;">
        <span class="rung-index">05</span>
        <span class="rung-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg></span>
        <span class="rung-body">
          <span class="rung-name">Moisturiser</span>
          <span class="rung-kr">크림</span>
        </span>
      </div>

      <div class="rung" id="rung-6" data-state="occupied" style="--z:-280px;--y:-92px;opacity:0;">
        <span class="rung-index">06</span>
        <span class="rung-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>
        <span class="rung-body">
          <span class="rung-name">SPF</span>
          <span class="rung-kr">선크림</span>
        </span>
      </div>
    </div>
  </div>

  <div class="spike-tag">SPIKE — not wired to build.mjs</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function(){
  var STEP_Z = 140, STEP_Y = 46;
  var D_FAST = 0.4, D_PACK = 0.6, STAGGER = 0.22, HOLD = 0.9, ENTRY_DELAY = 0.3;

  var rungs = [1,2,3,4,5,6].map(function(n){ return document.getElementById('rung-' + n); });

  function setState(el, state, depth){
    el.setAttribute('data-state', state);
    if (depth === undefined || depth === null) el.removeAttribute('data-depth');
    else el.setAttribute('data-depth', depth);
  }

  var tl = gsap.timeline({paused:true});

  function addFocusShift(startTime, exitEl, enterEl, packEls, depthShifts){
    // exit: outgoing active rung moves toward camera and fades. Keeps data-state="active" —
    // and full active icon/name size — for its whole exit instead of snapping to "occupied"
    // styling at the first frame: flipping data-state at tween start downgraded it from a
    // solid paper card to a transparent wireframe before it had visibly moved at all, a flash
    // confirmed on screen. Since it's fading to opacity 0 regardless, the style distinction is
    // moot — better to let it recede exactly as it looked, and vanish.
    // data-state flips to "occupied" once the fade is ~90% done, derived from the tween's own
    // live progress() on every update rather than a discrete start/end callback — direction-
    // agnostic by construction, so it's correct under forward play, reverse play, and arbitrary
    // seeks alike. Two callback-pair attempts before this one both failed under seeking:
    // onStart/onReverseComplete-at-tween-start flipped the style at the very first frame, while
    // still at full opacity — a confirmed-on-screen flash. onComplete/onReverseComplete-at-a-
    // later-point failed differently: onComplete only fires crossing the end forward, with no
    // matching un-fire crossing back over that same point, so reverse-seeking past it left both
    // cards reading "occupied" at once (confirmed via a full-sweep state audit). Deriving from
    // progress() on every update sidesteps both failure modes — it re-evaluates from the current
    // value instead of reacting to which boundary was last crossed in which direction.
    tl.to(exitEl, {'--z':'90px','--y':'-60px',opacity:0,duration:D_FAST,ease:'power1.in',
      onUpdate:function(){
        var p = this.progress();
        setState(exitEl, p >= 0.9 ? 'occupied' : 'active', p >= 0.9 ? 1 : null);
      },
    }, startTime);

    // entry: next rung becomes the focal card. Delayed slightly after exit starts — starting
    // both at once put two full-size cards briefly on top of each other (a double-exposure
    // ghosting, confirmed on screen, not just in the state data). The queue-pack rides with
    // entry rather than exit: once the new card is visibly arriving, the rest of the queue
    // shuffling up behind it reads as one coherent step rather than a separate event.
    var entryStart = startTime + ENTRY_DELAY;
    tl.to(enterEl, {'--z':'0px','--y':'0px',opacity:1,duration:D_FAST,ease:'power3.out',
      onStart:function(){ setState(enterEl,'active'); },
      onReverseComplete:function(){ setState(enterEl,'occupied',1); },
    }, entryStart);
    tl.to(enterEl.querySelector('.rung-icon'), {'--icon-size':'72px',duration:D_FAST,ease:'power3.out'}, entryStart);
    tl.to(enterEl.querySelector('.rung-name'), {'--name-size':'72px',duration:D_FAST,ease:'power3.out'}, entryStart);
    tl.to(enterEl.querySelector('.rung-kr'), {opacity:1,duration:D_FAST,ease:'power3.out'}, entryStart);
    tl.to(exitEl.querySelector('.rung-kr'), {opacity:0,duration:D_FAST,ease:'power1.in'}, startTime);

    // pack: remaining queued rungs step forward one depth, staggered by --stagger-step.
    // One .to() per element with an explicit hand-computed start time, each with its own
    // closed-over callback — not GSAP's built-in `stagger` option targeting an array. The
    // built-in form fires one shared onStart/onReverseComplete per sub-tween and expects
    // `this.targets()` to identify which element just fired; under seek-driven playback
    // (tl.time(t), not natural play) that indexing did not reliably match the element whose
    // tween had actually started, so data-depth stopped updating for later-staggered elements.
    // Per-element tweens with directly-closed-over elements sidestep the ambiguity entirely,
    // matching the pattern already proven for --z/--y and --icon-size in this file.
    packEls.forEach(function(el, i){
      var shift = depthShifts[i];
      var elStart = entryStart + i * STAGGER;
      tl.to(el, {'--z':'+=' + STEP_Z + 'px','--y':'+=' + STEP_Y + 'px',
        duration:D_PACK,ease:'power3.out',
        onStart:function(){ setState(shift.el, 'occupied', shift.forward); },
        onReverseComplete:function(){ setState(shift.el, 'occupied', shift.reverse); },
      }, elStart);
    });

    var packSettleTime = packEls.length ? (entryStart + (packEls.length - 1) * STAGGER + D_PACK) : (entryStart + D_FAST);
    return Math.max(entryStart + D_FAST, packSettleTime);
  }

  var t1 = addFocusShift(0, rungs[0], rungs[1],
    [rungs[2],rungs[3],rungs[4]],
    [{el:rungs[2],forward:1,reverse:2},{el:rungs[3],forward:2,reverse:3},{el:rungs[4],forward:3,reverse:4}]);

  var t2 = addFocusShift(t1 + HOLD, rungs[1], rungs[2],
    [rungs[3],rungs[4]],
    [{el:rungs[3],forward:1,reverse:2},{el:rungs[4],forward:2,reverse:3}]);

  var t3 = addFocusShift(t2 + HOLD, rungs[2], rungs[3],
    [rungs[4]],
    [{el:rungs[4],forward:1,reverse:2}]);

  // rung-6 fades in as it enters the queue for the first time. It waits, invisible, at the
  // same --z/--y as the depth-2 slot it will visually occupy the instant it appears — so
  // fading it in needs no position tween, only opacity + the matching depth label (and the
  // reverse of both, back to its true fresh-load state: no depth, invisible).
  tl.to(rungs[5], {opacity:1,duration:D_FAST,ease:'power3.out',
    onStart:function(){ setState(rungs[5],'occupied',2); },
    onReverseComplete:function(){ setState(rungs[5],'occupied',null); },
  }, t3);

  var t4 = addFocusShift(t3 + HOLD, rungs[3], rungs[4],
    [rungs[5]],
    [{el:rungs[5],forward:1,reverse:2}]);

  var t5 = addFocusShift(t4 + HOLD, rungs[4], rungs[5], [], []);

  function renderFrame(t){
    if (t === 0) tl.progress(0);
    else tl.time(t);
  }
  window.renderFrame = renderFrame;
  window.__routineLadderTimeline = tl;
  renderFrame(0);

  if (/[?&]debug=1\b/.test(location.search)){
    var bar = document.createElement('div');
    bar.className = 'debug-bar';
    bar.innerHTML = '<button id="dbg-0">t=0</button><input id="dbg-range" type="range" min="0" max="' +
      tl.duration() + '" step="0.01" value="0"><button id="dbg-end">t=end</button><span id="dbg-t">0.00</span>';
    document.body.appendChild(bar);
    var range = bar.querySelector('#dbg-range'), label = bar.querySelector('#dbg-t');
    range.addEventListener('input', function(){ renderFrame(parseFloat(range.value)); label.textContent = parseFloat(range.value).toFixed(2); });
    bar.querySelector('#dbg-0').addEventListener('click', function(){ range.value = 0; renderFrame(0); label.textContent = '0.00'; });
    bar.querySelector('#dbg-end').addEventListener('click', function(){ var d = tl.duration(); range.value = d; renderFrame(d); label.textContent = d.toFixed(2); });
  }
})();
</script>
</body>
</html>
