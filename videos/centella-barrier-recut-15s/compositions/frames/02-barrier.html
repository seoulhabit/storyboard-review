  .stage { display:flex; flex-direction:column;

  /* Bricks stay visible; opacity:0 lives on the course <g> only — stacking both

  .wall-brick { fill:rgba(247,245,240,0.07); stroke:rgba(247,245,240,0.55); stroke-width:2.4; }

  .wall-label { font-family:var(--font-mono); font-size:32px; font-weight:500;

  /* Togglable layout debug — add to #root. Verified OFF

  #root.debug-layout .clip { outline: 2px solid #00E5FF !important; }
  #root.debug-layout .plate-wrap { outline: 2px solid #FFD400 !important; }
  #root.debug-layout::after {

<div data-composition-id="02-barrier" id="root" data-width="1080" data-height="1920" data-duration="4.400">

<script>
(function () {
  // Mechanism adapted from catalog/visual-components/barrier-wall (its 4th use;
  // three prior videos each rebuilt it from scratch). Same paused, seek-safe clock.
  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  var DUR = 4.400;
  var shards = ['shard-1','shard-2','shard-3'].map(function (id) { return document.getElementById(id); });
  var bricksTop = ['bt-1','bt-2','bt-3','bt-4'].map(function (id) { return document.getElementById(id); });

  // Baselines registered INSIDE the timeline at 0 — a bare gsap.set() is not
  // evaluated on a seek, so elements hit by a later fromTo would bleed through.
  tl.set('#bw-wash',     { y: -110 }, 0);
  tl.set('#bw-washline', { y: -110 }, 0);

  tl.to(['#course-top', '#course-mid', '#course-bot'], { opacity: 1, duration: 0.22 }, 0.05);
  tl.to('#bw-label', { opacity: 1, duration: 0.30 }, 0.30);
  tl.to('#bw-h1', { opacity: 1, y: 0, duration: 0.34 }, 0.25);
  tl.to('#bw-h2', { opacity: 1, y: 0, duration: 0.34 }, 0.72);

  // The barrier separates — the one idea this scene exists to show.
  tl.to(['#bw-wash', '#bw-washline'], { y: 0, opacity: 1, duration: 0.62, ease: 'power2.inOut' }, 1.70);
  shards.forEach(function (s, i) {
    tl.to(s, { opacity: 1, duration: 0.20 }, 2.20 + i * 0.26);
    tl.to(s, { y: 30 + i * 8, rotation: 7 - i * 5, opacity: 0, duration: 0.95, ease: 'power2.in' }, 2.42 + i * 0.26);
  });
  bricksTop.forEach(function (b, i) {
    tl.to(b, { opacity: 0.45, duration: 0.52 }, 2.36 + i * 0.13);
  });

  tl.to('#bw-qual', { opacity: 1, duration: 0.36 }, 3.05);

  // The payoff of the mechanism, and a beat that actually reads at frame scale: the
  // wrecked course collapses out and the wall visibly drops to two courses. Dimming
  // an already-near-transparent brick measured ~0 rendered change (verified against
  // the render, not the source) — this is the fix for that, not extra decoration.
  tl.to('#course-top', { opacity: 0.10, y: -18, duration: 0.60, ease: 'power2.in' }, 3.35);
  tl.to(['#bw-wash', '#bw-washline'], { y: 62, duration: 0.75, ease: 'power2.inOut' }, 3.35);
  tl.to('#wall', { scale: 1.05, transformOrigin: '50% 62%', duration: 1.05, ease: 'power1.inOut' }, 3.35);

  tl.to({}, { duration: DUR }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines['02-barrier'] = tl;
})();
</script>
