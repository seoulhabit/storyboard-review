<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<style data-brand-tokens="">
  @font-face { font-family: 'Bricolage Grotesque'; src: url('assets/fonts/bricolage-grotesque-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }
  @font-face { font-family: 'JetBrains Mono'; src: url('assets/fonts/jetbrains-mono-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }
  :root {
    --green: #2c4a34; --green-deep: #0f2016; --green-lite: #cddfb9;
    --pink: #b9835a; --pink-deep: #8a5a37;
    --cream: #fbfaf4; --cream-2: #e8efdd; --ink: #0f2016;
    --font-display: "Bricolage Grotesque", system-ui, serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    /* Safe-area tokens (9:16 Shorts UI): right ~15%, bottom ~20%, top ~10% of 1080x1920 */
    --safe-top: 192px; --safe-bottom: 384px; --safe-right: 162px; --safe-left: 162px;
    --cap-band-top: 1168px;
    --content-bottom-limit: calc(1920px - var(--cap-band-top) + 32px); /* clears the caption band, not just the safe-bottom UI zone */
  }
</style>

<style>
  #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--green-deep); font-family: var(--font-display); }
  #root.debug-layout * { outline: 1px solid rgba(255,0,0,.6) !important; }
  #root.debug-layout .clip { outline: 2px solid #00E5FF !important; }
  #root.debug-layout .media-plate { outline: 2px solid #FFD400 !important; }
  #root.debug-layout::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to left,  rgba(255,0,168,.25) 15%, transparent 15%),
      linear-gradient(to top,   rgba(255,0,168,.25) 20%, transparent 20%),
      linear-gradient(to bottom, rgba(255,0,168,.25) 10%, transparent 10%);
  }


  .media-plate { position: absolute; inset: 0; background: #1A1A1A; }
  .media-plate img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%;
    display: block; transform: scale(var(--kb-scale, 1)); transform-origin: 50% 30%; }

  .scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(15,32,22,.15) 0%, rgba(15,32,22,.55) 62%, rgba(15,32,22,.86) 100%); }

  /* Structure inside the clip is Flex — headline sits in the lower-safe column, never
     centered in empty canvas (9:16-native composition: fill the safe column). */
  .content { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex;
    flex-direction: column; justify-content: flex-end;
    padding: 0 72px var(--content-bottom-limit) 72px; }

  .mistake-head { font-weight: 700; font-size: 116px; line-height: 1.02; color: var(--cream);
    letter-spacing: -0.01em; text-shadow: 0 2px 24px rgba(0,0,0,.4);
    transform: scale(var(--head-scale, 0.98)); transform-origin: 0% 100%; }
  .mistake-sub { margin-top: 28px; font-family: var(--font-mono); font-size: 38px;

    transform: translateY(calc((1 - var(--sub-p, 0)) * 16px)); }
</style>

<div id="root" class="clip" data-composition-id="01-mistake" data-width="1080" data-height="1920">
  <div class="media-plate">
    <img src="assets/plates/06-cheekbone-glow.png" alt="" width="1152" height="2048"
         loading="eager" decoding="sync">
  </div>
  <div class="scrim"></div>
  <div class="content">
    <div class="mistake-head" id="mistake-head">YOU'RE DOING<br>THIS WRONG.</div>
    <div class="mistake-sub" id="mistake-sub">SNAIL MUCIN · THE MISTAKE</div>
  </div>
</div>

<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  // Frame zero is the payoff, already composed: headline is legible and effectively
  // at rest at t=0 (0.98 -> 1.0 is a barely-perceptible settle, never a fade from
  // invisible). "No raw static plate": a slow, deterministic Ken Burns creep runs the
  // whole 2.0s via the --kb-scale custom property (Consuming --p in CSS pattern).
  var kb = { scale: 1.0 };
  tl.to(kb, {
    scale: 1.05, duration: 2.0, ease: "none",
    onUpdate: function () { document.getElementById("root").style.setProperty("--kb-scale", kb.scale); }
  }, 0);

  tl.to("#mistake-head", { "--head-scale": 1.0, duration: 0.22, ease: "power2.out" }, 0);

  // Second beat inside the 2.0s window (cadence: state change well under 2.5s).
  tl.to("#mistake-sub", { "--sub-p": 1, duration: 0.32, ease: "power3.out" }, 0.9);

  tl.to({}, { duration: 2.0 }, 0); // anchor
  window.__timelines["01-mistake"] = tl;
})();
</script>
</template>
