<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "EB Garamond";
          font-weight: 400;
          font-style: normal;
          src: url("assets/fonts/eb-garamond-400.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          font-weight: 800;
          font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "JetBrains Mono";
          font-weight: 100 900;
          font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2");
          font-display: block;
        }
        #root {
          --paper: #F7F5F0;
          --ink: #131516;
          --ink-2: #6B6B6B;
          --aqua: #59B8AE;
          --font-display: "EB Garamond", Georgia, "Times New Roman", serif;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --t-frame: 50px;
          --t-body: 32px;
          --t-label: 24px;
          --safe-top: 120px;
          --safe-bottom: 360px;
          --safe-left: 60px;
          --safe-right: 162px;

          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper);
          font-family: var(--font-mono);
        }
        .clip { position: absolute; inset: 0; }

        .loop-title {
          top: 130px; left: 0; width: 100%;
          text-align: center;
          font-family: var(--font-display);
          font-size: 56px;
          color: var(--ink);
        }

        .loop-split { top: 300px; left: 0; width: 100%; height: 760px; display: flex; }
        .loop-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 60px; gap: 28px; }
        .loop-col-west { background: var(--paper); color: var(--ink); }
        .loop-col-kr { background: var(--ink); color: var(--paper); }
        .loop-rule { position: absolute; top: 300px; left: 540px; width: 3px; height: 760px; background: var(--ink); opacity: 0; }
        .loop-kicker { font-family: var(--font-mono); font-size: var(--t-label); letter-spacing: 0.08em; opacity: 0.7; }
        .loop-chip {
          font-family: var(--font-mono);
          font-size: 30px;
          font-weight: 500;
          padding: 18px 28px;
          border-radius: 10px;
          opacity: 0;
          transform: translateY(14px) scale(0.94);
        }
        .loop-chip-west { background: rgba(19,21,22,0.08); color: var(--ink); }
        .loop-chip-kr { background: rgba(89,184,174,0.22); color: var(--aqua); border: 2px solid var(--aqua); }

        /* Round-8 feedback: once the split comparison fades at 6.6s, everything above
           this zone (title, both columns) goes fully blank — only the equation's own
           small content was left, reading as if the photos "dominate" a frame that's
           mostly empty canvas. Fix isn't smaller photos, it's more real content: grew
           this zone from a 500px island (1050-1550) to 900px (550-1450), using most of
           the safe vertical band the split vacated, still clear of safe-bottom
           (1920-360=1560). */
        .loop-equation {
          top: 550px; left: 0; width: 100%; height: 900px;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
        }
        /* Recap callback: closes the loop between the split's own K-BEAUTY chip
           ("CENTELLA EXTRACT — 70%") and the water+plant equation below — without it,
           a viewer who's forgotten the chip by the time the equation lands has no text
           telling them what the equation is actually proving. Reuses the hook's own
           big-stat/small-qualifier two-tier pattern (compare Frame 1's "80%"/"0.5%")
           for visual consistency across the video, not a new type treatment. */
        .loop-eq-recap { display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0; }
        .loop-eq-recap-pct { font-family: var(--font-body); font-weight: 800; font-size: 128px; line-height: 1; color: var(--ink); }
        .loop-eq-recap-label { font-family: var(--font-mono); font-size: 34px; font-weight: 500; letter-spacing: 0.04em; color: var(--ink-2); }
        .loop-eq-word {
          font-family: var(--font-body);
          font-weight: 800;
          font-size: 96px;
          color: var(--ink);
          opacity: 0;
        }
        .loop-eq-split { display: flex; align-items: center; gap: 28px; }
        .loop-eq-part {
          font-family: var(--font-mono);
          font-size: 42px;
          font-weight: 500;
          color: var(--ink);
          background: rgba(19,21,22,0.06);
          padding: 20px 30px;
          border-radius: 10px;
          opacity: 0;
        }
        .loop-eq-plus { font-family: var(--font-body); font-weight: 800; font-size: 64px; color: var(--ink-2); opacity: 0; }

        /* Round-4 feedback: swap the hand-drawn beaker/leaf SVG for real catalog photos —
           water/plant is a literal, on-topic pairing (this frame's own K-BEAUTY chip
           already says "CENTELLA EXTRACT — 70%"), not a decorative photo. Sourced from
           ingredient-photography/02-centella-asiatica.png (the actual named ingredient)
           and product-photography/B01-01.png (droplet macro, cropped to the droplet).
           Downsampled/cropped to project-local assets/images/, matching every other
           asset in this project. */
        .loop-eq-photos { display: flex; align-items: center; justify-content: center; gap: 40px; }
        .loop-eq-term { display: flex; flex-direction: column; align-items: center; gap: 20px; opacity: 0; transform: scale(0.85); }
        /* border added (was shadow-only): both source photos are shot on near-white
           backgrounds (this catalog's own house style), so against the paper canvas
           they measured as near-blank on a real render — the blank-frame scanner
           regressed this scene back to its pre-round-1 flagged state. A solid ink
           border gives the card real edge contrast without needing a busier photo.
           Round-7 feedback: sized up 220->300px — the 500px-tall equation zone was
           vertically centering a much shorter content block, leaving real unused
           space above/below during the ~5s hold; the zone itself didn't move, so this
           stays centered well clear of safe-bottom (verified via re-render). */
        .loop-eq-photo {
          width: 300px; height: 300px;
          border-radius: 24px;
          border: 3px solid var(--ink);
          object-fit: cover;
          box-shadow: 0 18px 32px -20px rgba(19,21,22,0.35);
          background: var(--paper);
        }
        .loop-eq-term-label {
          font-family: var(--font-mono);
          font-size: 32px;
          font-weight: 500;
          color: var(--ink);
          text-align: center;
        }
      </style>

      <div data-hf-id="hf-loop-root" id="root" data-composition-id="03-extract-loophole" data-width="1080" data-height="1920" data-duration="15.26">
        <div data-hf-id="hf-loop-title" id="loop-title" class="clip loop-title" data-start="0" data-duration="15.26">THE EXTRACT LOOPHOLE</div>
        <div data-hf-id="hf-loop-split" id="loop-split" class="clip loop-split" data-start="0" data-duration="15.26">
          <div data-hf-id="hf-loop-west" class="loop-col loop-col-west" id="loop-col-west">
            <div data-hf-id="hf-loop-wk" class="loop-kicker" id="loop-kicker-west">WESTERN</div>
            <div data-hf-id="hf-loop-wc" class="loop-chip loop-chip-west" id="loop-chip-west">WATER — 1st ingredient</div>
          </div>
          <div data-hf-id="hf-loop-kr" class="loop-col loop-col-kr" id="loop-col-kr">
            <div data-hf-id="hf-loop-kk" class="loop-kicker" id="loop-kicker-kr">K-BEAUTY</div>
            <div data-hf-id="hf-loop-kc" class="loop-chip loop-chip-kr" id="loop-chip-kr">CENTELLA EXTRACT — 70%</div>
          </div>
        </div>
        <div data-hf-id="hf-loop-rule" id="loop-rule" class="clip loop-rule" data-start="0" data-duration="15.26"></div>

        <div data-hf-id="hf-loop-eq" id="loop-equation" class="clip loop-equation" data-start="0" data-duration="15.26">
          <div data-hf-id="hf-loop-eqrecap" class="loop-eq-recap" id="loop-eq-recap">
            <div data-hf-id="hf-loop-eqrecappct" class="loop-eq-recap-pct">70%</div>
            <div data-hf-id="hf-loop-eqrecaplabel" class="loop-eq-recap-label">CENTELLA EXTRACT</div>
          </div>
          <div data-hf-id="hf-loop-eqword" class="loop-eq-word" id="loop-eq-word">"EXTRACT"</div>
          <div data-hf-id="hf-loop-eqphotos" class="loop-eq-photos" id="loop-eq-photos">
            <div data-hf-id="hf-loop-termwater" class="loop-eq-term" id="loop-term-water">
              <img data-hf-id="hf-loop-photowater" class="loop-eq-photo" id="loop-eq-photo-water-img" src="assets/images/loop-water-droplet.png" alt="" width="700" height="700" loading="eager" decoding="sync">
              <div data-hf-id="hf-loop-labelwater" class="loop-eq-term-label">WATER</div>
            </div>
            <div data-hf-id="hf-loop-eqplus" class="loop-eq-plus" id="loop-eq-plus">+</div>
            <div data-hf-id="hf-loop-termplant" class="loop-eq-term" id="loop-term-plant">
              <img data-hf-id="hf-loop-photoplant" class="loop-eq-photo" id="loop-eq-photo-plant-img" src="assets/images/loop-centella-leaf.png" alt="" width="700" height="700" loading="eager" decoding="sync">
              <div data-hf-id="hf-loop-labelplant" class="loop-eq-term-label">TINY BIT OF PLANT</div>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#loop-title", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.1);
        tl.fromTo("#loop-rule", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out" }, 0.4);
        tl.fromTo(["#loop-kicker-west", "#loop-kicker-kr"], { opacity: 0 }, { opacity: 0.7, duration: 0.3, ease: "power3.out" }, 0.6);

        // chip pops (SFX pop.mp3 fires alongside each, see index.html)
        tl.fromTo("#loop-chip-west", { opacity: 0, y: 14, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 1.6);
        tl.fromTo("#loop-chip-kr", { opacity: 0, y: 14, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 2.4);
        // the frame's one aqua highlight lives on the K-beauty chip — settle with a brief pulse
        tl.to("#loop-chip-kr", { scale: 1.04, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, 2.8);

        // fade the split away before the fracture beat
        tl.to(["#loop-split", "#loop-rule", "#loop-title"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 6.6);

        // "EXTRACT" breaks into the equation (SFX glitch-shatter.mp3 on the break).
        // Starts the instant the split's fade-out finishes (6.6+0.4=7.0) rather than
        // 0.2s later, closing a blank-canvas gap between the two beats.
        tl.fromTo("#loop-eq-word", { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 7.0);
        tl.to("#loop-eq-word", { opacity: 0, y: -18, duration: 0.22, ease: "power2.in" }, 8.7);
        // Real photo terms pop in (was: a leaf dropping into an SVG beaker + ripples).
        // WATER lands first, then the plus, then the actual Centella leaf for "TINY BIT
        // OF PLANT" — the ingredient this frame's own K-BEAUTY chip already names.
        tl.fromTo("#loop-term-water", { opacity: 0, x: -24, scale: 0.85 }, { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 8.85);
        tl.fromTo("#loop-eq-plus", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power3.out" }, 9.15);
        tl.fromTo("#loop-term-plant", { opacity: 0, x: 24, scale: 0.85 }, { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 9.3);
        // Recap callback lands right after both terms have — "EXTRACT" flew apart into
        // this equation, so this closes the loop it opened: the 70% claim IS this.
        tl.fromTo("#loop-eq-recap", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 9.75);

        // Sustained motion through the hold (was the ripple bursts + waterline shimmer) —
        // a slow, bounded breathing scale on each photo so the ~5s hold before fade-out
        // isn't just two static images sitting still on a mostly-white canvas.
        tl.to("#loop-eq-photo-water-img", { scale: 1.05, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 9.6);
        tl.to("#loop-eq-photo-plant-img", { scale: 1.05, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 10.0);

        tl.to("#loop-equation", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 14.4);

        tl.to({}, { duration: 15.26 }, 0);
        window.__timelines["03-extract-loophole"] = tl;
      </script>
    </template>
  </body>
</html>
