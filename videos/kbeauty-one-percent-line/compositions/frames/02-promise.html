<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          font-weight: 800;
          font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "JetBrains Mono";
          font-weight: 100 900;
          font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2");
          font-display: block;
        }
        #root {
          --ink: #131516;
          --ink-soft: #211F1B;
          --paper: #F7F5F0;
          --aqua: #59B8AE;
          --ink-3: #9C978D;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --t-frame: 50px;
          --t-label: 24px;
          --safe-top: 120px;
          --safe-bottom: 360px;
          --safe-left: 60px;
          --safe-right: 162px;

          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--ink);
          font-family: var(--font-mono);
        }
        .clip { position: absolute; inset: 0; }

        .promise-kicker {
          top: 640px;
          left: 0; width: 100%;
          text-align: center;
          font-family: var(--font-body);
          font-weight: 800;
          font-size: 88px;
          letter-spacing: 0.01em;
          color: var(--paper);
        }
        .promise-char { display: inline-block; opacity: 0; }

        .promise-diagram {
          top: 940px;
          left: 0; width: 100%; height: 320px;
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 64px;
        }
        .promise-icon {
          width: 260px; height: 260px;
          border: 3px solid var(--aqua);
          border-radius: 20px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: var(--font-mono);
          font-size: 26px;
          color: var(--aqua);
          text-align: center;
          padding: 24px;
          opacity: 0;
          transform: scale(0.85);
        }
        /* Round-7 feedback: "show relevant image here" — the diagram was two bordered
           text boxes with no photography anywhere in the frame. Reuses the same
           ginseng ingredient-photography still from Frame 1/4b/5/7/8 (no new
           generation) on the "what gets tested" side — it's this video's own running
           example ingredient, not a generic stock choice. Column layout only on this
           one icon; the label-side icon stays text-only (no catalog photo represents
           "a printed ingredient label" specifically). */
        .promise-icon-photo { flex-direction: column; gap: 14px; }
        .promise-icon-img {
          width: 108px; height: 108px;
          border-radius: 14px;
          object-fit: cover;
          border: 2px solid var(--aqua);
        }
        .promise-arrow {
          width: 90px; height: 4px;
          background: var(--ink-3);
          opacity: 0;
        }

        /* VO-synced follow-up — fills what was a 5s freeze after the icon snap with the
           actual next two clauses of the line, timed to real onsets, and gives the frame
           real content in the lower half instead of leaving it empty. */
        .promise-follow {
          top: 1360px;
          left: var(--safe-left); width: 858px;
          display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        .promise-follow-line {
          font-family: var(--font-mono);
          font-size: 30px;
          letter-spacing: 0.04em;
          color: var(--ink-3);
          text-align: center;
          opacity: 0;
        }
        .promise-follow-next {
          font-family: var(--font-mono);
          font-size: 32px;
          font-weight: 500;
          color: var(--aqua);
          text-align: center;
          opacity: 0;
        }
      </style>

      <div data-hf-id="hf-promise-root" id="root" data-composition-id="02-promise" data-width="1080" data-height="1920" data-duration="8.78">
        <div data-hf-id="hf-promise-kicker" id="promise-kicker" class="clip promise-kicker" data-start="0" data-duration="8.78"></div>
        <div data-hf-id="hf-promise-diagram" id="promise-diagram" class="clip promise-diagram" data-start="0" data-duration="8.78">
          <div data-hf-id="hf-pi1" class="promise-icon promise-icon-photo" id="promise-icon-chemist"><img data-hf-id="hf-pi1img" class="promise-icon-img" src="assets/images/ingredient-ginseng.png" alt="" width="1400" height="1400" loading="eager" decoding="sync">BEAKER<br data-hf-id="hf-x5px">+ TEST</div>
          <div data-hf-id="hf-pa1" class="promise-arrow" id="promise-arrow"></div>
          <div data-hf-id="hf-pi2" class="promise-icon" id="promise-icon-label">INGREDIENT<br data-hf-id="hf-rsrt">LABEL</div>
        </div>

        <div data-hf-id="hf-promise-follow" id="promise-follow" class="clip promise-follow" data-start="0" data-duration="8.78">
          <div data-hf-id="hf-promise-followline" class="promise-follow-line" id="promise-follow-line">SPOT THE MARKETING FLUFF</div>
          <div data-hf-id="hf-promise-follownext" class="promise-follow-next" id="promise-follow-next">NEXT &#8594; THE EXTRACT LOOPHOLE</div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const kicker = document.getElementById("promise-kicker");
        const TEXT = "CRACKING THE CODE";
        TEXT.split("").forEach((ch) => {
          const span = document.createElement("span");
          span.className = "promise-char";
          span.textContent = ch === " " ? " " : ch;
          kicker.appendChild(span);
        });
        const chars = Array.from(kicker.children);
        chars.forEach((el, i) => {
          tl.fromTo(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.out" }, 0.15 + i * 0.045);
        });

        tl.fromTo("#promise-icon-chemist", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 1.6);
        tl.fromTo("#promise-icon-label", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 1.85);
        tl.fromTo("#promise-arrow", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, 2.1);
        // snap-together beat on the "trick" reveal
        tl.to(["#promise-icon-chemist", "#promise-icon-label"], { scale: 1.05, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 2.5);

        // VO (local, from renders/transcript.json): "...cosmetic chemists use to spot the
        // marketing fluff" ends ~6.70; "First, the extract loophole." runs 6.70-8.67. This
        // replaces what was a flat 5s freeze (2.86->7.90) with two real content beats tied
        // to the actual line, the second of which also sets up Frame 3's title.
        tl.fromTo("#promise-arrow", { scaleX: 1 }, { scaleX: 1.15, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.6);
        tl.fromTo("#promise-follow-line", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 3.5);
        tl.fromTo("#promise-follow-next", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 6.9);

        tl.to(["#promise-kicker", "#promise-diagram", "#promise-follow"], { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 7.9);

        tl.to({}, { duration: 8.78 }, 0);
        window.__timelines["02-promise"] = tl;
      </script>
    </template>
  </body>
</html>
