<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        *, *::before, *::after { box-sizing: border-box; }
        /* UA MARGIN RESET -- load-bearing, not cosmetic. Without it the browser
           default margins silently inflate every fixed-height flex stack:
           h1 carries margin .67em (= 100px at this scene's display size), p
           carries 1em, and figure carries `1em 40px`. Measured on the round-1
           render, that pushed 01/05/07's hero panel 64-75px BELOW the safe
           bottom line and the figure 39px PAST the right line -- a hard
           safe-area gate failure -- while the scenes still looked plausible in
           isolation. `gap` on the flex column does the spacing here, so every
           one of these margins is unwanted. */
        h1, h2, h3, p, figure, blockquote, ul, ol, dl { margin: 0; }

        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "Noto Sans KR Video"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/NotoSansKR-500-subset.woff2") format("woff2"); font-display: block; }

        /* Tokens inlined from assets/tokens/tokens.css (single source of truth).
           INK GROUND -- so secondary text uses --ink-2-dark / --ink-3-dark, never
           the paper-scoped --ink-2. The token's documented scope is a constraint:
           --ink-2 (#6B6B6B) on ink measures 3.44:1 and would fail the 4.5:1 floor. */
        #root {
          --paper: #F7F5F0; --ink: #131516; --ink-soft: #211F1B;
          --ink-2-dark: #878B8C; --ink-3-dark: #7C8082;
          --celadon: #93B896; --aqua: #59B8AE; --rule-dark: #333333;
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
          --safe-margin: 6px;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --font-kr: "Noto Sans KR Video", "Noto Sans KR", sans-serif;
          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--ink); font-family: var(--font-body);
        }

        /* Spatial plan
           1. .stage is one flex column, explicit 1920px height, real --safe-*
              padding on all four sides, space-between so the three zones
              (lockup / diagram / turn) distribute without absolute positioning.
           2. The term lockup is a plain block stack -- name, Korean, category,
              definition -- inheriting TermDefinition's structure but not its
              array-cycling clock (single entry here).
           3. The diagram is ONE inline SVG sized by its own viewBox; every
              animated part is an <g> with transform-box:fill-box so GSAP's
              scale/opacity land on the element itself. No absolute siblings,
              no transform outside the padded box, so no --safe-*-zoomed math. */
        /* Sized so the three zones leave real slack. Enlarging the diagram to
           620px made them sum to ~1344px against a 1344px content box, which
           left space-between nothing to distribute and pushed the citation
           pill's bottom border onto y=1536 -- measured as 552px of ink in the
           reserved zone. Adding a --safe-margin guard made it worse, because
           the column was over-full rather than mis-rounded: the fix is fewer
           pixels of content, not a smaller box. The diagram is 540px here,
           still well up from its original 430px. */
        .stage {
          display: flex; flex-direction: column; justify-content: space-between;
          height: 1920px;
          padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }

        .lockup { flex: 0 0 auto; }
        .term-name { font-weight: 800; font-size: 104px; line-height: 1.0;
                     letter-spacing: -0.03em; color: var(--paper); }
        .term-kr { font-family: var(--font-kr); font-size: 44px; line-height: 1.3;
                   color: var(--celadon); margin-top: 10px; opacity: 0; }
        .term-cat { font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.12em;
                    text-transform: uppercase; color: var(--ink-2-dark);
                    margin-top: 22px; opacity: 0; }
        .term-def { font-size: 42px; line-height: 1.30; color: var(--paper);
                    margin-top: 20px; max-width: 800px; opacity: 0; }
        .term-def em { font-style: normal; color: var(--celadon); }

        .diagram { flex: 0 0 auto; width: 100%; }
        .diagram svg { width: 100%; height: auto; display: block; }
        .dlabel { font-family: "JetBrains Mono", monospace; font-size: 32px;
                  letter-spacing: 0.14em; fill: #878B8C; opacity: 0; }
        #w-cellgrp, #w-vesicles, #w-vesicles-tinted { transform-box: fill-box;
                    transform-origin: 50% 50%; }
        .vesicle { transform-box: fill-box; transform-origin: 50% 50%; }

        .turn { flex: 0 0 auto; }
        .turn-rule { height: 3px; background: var(--rule-dark); width: 0; margin-bottom: 26px; }
        .turn-line { font-weight: 800; font-size: 60px; line-height: 1.14;
                     color: var(--paper); opacity: 0; }
        .turn-line b { color: var(--aqua); font-weight: 800; }
        /* STACKED, not a space-between row. Side by side, the note's
           min-content width plus this pill measured 875px against an 846px
           safe content box, which put the pill's RESTING right edge 29px
           inside the reserved engagement rail -- a hard-gate failure that no
           transform-origin fix could reach, because it was the static layout,
           not the entrance overshoot. */
        .turn-foot { display: flex; flex-direction: column; align-items: flex-start;
                     gap: 18px; margin-top: 26px; }
        .turn-note { font-family: var(--font-mono); font-size: 32px; line-height: 1.3;
                     color: var(--ink-2-dark); opacity: 0; }
        /* Citation pill: right:auto + width:max-content so the inherited
           inset:0 from .clip can never stretch it into a full-width slab. */
        /* TRANSFORM-ORIGIN IS A SAFE-AREA CONTROL HERE, not styling. Every
           scale entrance below uses a back.out() ease, which overshoots PAST
           1.0 before settling. On an element whose box already touches a safe
           edge, that overshoot walks its edge into the reserved zone for the
           length of the tween -- measured on the round-2 render as 5-8px, i.e.
           ~500px of masked ink, and a hard safe-area gate failure. Anchoring
           the origin to the touched edge makes the overshoot grow INWARD, which
           keeps the pop and removes the geometry risk. */
        /* Origin at the bottom-left corner this pill sits on: the foot is stacked and
           its bottom edge is the 1536 safe line, so a centre-origin back.out()
           overshoot put ~6px of the pill into the reserved zone. */
        .cite { transform-origin: 0% 100%; right: auto; width: max-content; flex: 0 0 auto;
                font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.04em;
                color: var(--paper); border: 2px solid rgba(147,184,150,0.55);
                background: rgba(147,184,150,0.14); border-radius: 999px;
                padding: 10px 22px; white-space: nowrap; opacity: 0; }

        #root.debug-layout * { outline: 1px solid rgba(255,0,0,0.6) !important; }
        #root.debug-layout .stage { outline: 2px solid #00E5FF !important; }
        #root.debug-layout::after {
          content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 99;
          background:
            linear-gradient(to left,   rgba(255,0,168,.22) 15%, transparent 15%),
            linear-gradient(to top,    rgba(255,0,168,.22) 20%, transparent 20%),
            linear-gradient(to bottom, rgba(255,0,168,.22) 10%, transparent 10%);
        }
      </style>

      <div id="root" data-composition-id="02-what"
           data-width="1080" data-height="1920" data-duration="9.050">
        <div class="stage">

          <div class="lockup">
            <h1 class="term-name" id="w-name">EXOSOME</h1>
            <p class="term-kr" id="w-kr">엑소좀</p>
            <p class="term-cat" id="w-cat">Extracellular vesicle</p>
            <p class="term-def" id="w-def">A package a cell releases to carry <em>signals</em> to other cells.</p>
          </div>

          <div class="diagram">
            <svg viewBox="0 0 846 540" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <!-- One mechanism, two labels (CELL / RELEASED). -->
              <g id="w-cellgrp">
                <circle cx="168" cy="248" r="152" fill="none" stroke="#93B896" stroke-width="5"/>
                <circle cx="168" cy="248" r="76" fill="#93B896" fill-opacity="0.20"
                        stroke="#93B896" stroke-width="3"/>
              </g>
              <text class="dlabel" x="168" y="492" text-anchor="middle" id="w-lab-cell">CELL</text>

              <!-- Base (uniform celadon) set. -->
              <g id="w-vesicles" fill="#93B896" fill-opacity="0.92" data-layout-allow-overflow>
                <circle class="vesicle" id="w-v1" cx="420" cy="132" r="33"/>
                <circle class="vesicle" id="w-v2" cx="500" cy="306" r="25"/>
                <circle class="vesicle" id="w-v3" cx="584" cy="112" r="37"/>
                <circle class="vesicle" id="w-v4" cx="652" cy="340" r="29"/>
                <circle class="vesicle" id="w-v5" cx="712" cy="194" r="35"/>
                <circle class="vesicle" id="w-v6" cx="774" cy="362" r="24"/>
                <circle class="vesicle" id="w-v7" cx="788" cy="250" r="30"/>
              </g>
              <text class="dlabel" x="600" y="492" text-anchor="middle" id="w-lab-ves">RELEASED</text>
            </svg>
          </div>

          <div class="turn">
            <div class="turn-rule" id="w-rule"></div>
            <p class="turn-line" id="w-turn">On a label, that word is<br><b>not an ingredient identity.</b></p>
            <div class="turn-foot">
              <p class="turn-note" id="w-note">Naming and testing<br>are still being standardised.</p>
              <span class="cite" id="w-cite">J Extracell Vesicles · 2024</span>
            </div>
          </div>

        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        // The cell is composed at t=0 (its CSS carries no opacity:0), so frame
        // zero of this scene is a finished diagram waiting to emit, never an
        // empty canvas.

        // Every vesicle is hit by more than one tween (release, then drift), so
        // each one's t=0 state is registered as a REAL timeline tween via
        // tl.set(...,0). A bare gsap.set() outside the timeline does NOT work:
        // the engine seeks straight to arbitrary times without passing through
        // t=0, and the element would otherwise render at its first fromTo's
        // "from" value for the whole stretch before its scheduled release.
        var V = ['#w-v1','#w-v2','#w-v3','#w-v4','#w-v5','#w-v6','#w-v7'];
        V.forEach(function (s) { tl.set(s, { opacity: 0, scale: 0.3, x: -200, y: 30 }, 0); });

        // 0.15-1.15 the term lockup builds, four staggered arrivals on
        // deliberately different curves so it does not read as one template.
        // #w-name carries NO opacity:0 -- it is composed at t=0 along with the
        // cell. The blank-frame scan measured 267ms of near-blank right after
        // the 01->02 cut when the name faded in at 0.15: a celadon outline on a
        // full ink canvas is not enough ink to read as a composed frame.
        tl.fromTo('#w-kr',   { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.38 }, 0.42);
        tl.to('#w-cat', { opacity: 1, duration: 0.34, ease: 'none' }, 0.70);
        tl.fromTo('#w-def', { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.46 }, 0.98);

        // 1.85-4.15 vesicles bud off the cell, staggered 0.33 apart -- the
        // scene's mechanism beat, landing under "cells use to carry signals".
        V.forEach(function (s, i) {
          tl.to(s, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.60, ease: 'power2.out' },
                1.85 + i * 0.33);
        });
        tl.to('#w-lab-cell', { opacity: 1, duration: 0.30, ease: 'none' }, 1.70);
        tl.to('#w-lab-ves',  { opacity: 1, duration: 0.35, ease: 'none' }, 4.25);

        // A single slow breath on the membrane keeps the diagram alive through
        // the stretch where the voice is still on the definition. Bounded
        // repeat, never infinite -- an infinite repeat is wall-clock behaviour.
        tl.to('#w-cellgrp', { scale: 1.05, duration: 1.10, yoyo: true, repeat: 3,
                              ease: 'sine.inOut' }, 1.60);

        // 5.10 onward: the turn. Rule draws, then the claim, then the qualifier
        // and its citation -- the back half of the scene is not a frozen hold.
        tl.to('#w-rule', { width: 846, duration: 0.55, ease: 'power2.inOut' }, 5.10);
        // The vesicles SCATTER outward as the turn lands: the particles the
        // scene just built are shown dispersing under "not an ingredient
        // identity" -- motion that carries the argument, and the largest pixel
        // change available in this scene.
        tl.to('#w-vesicles', { x: 84, scale: 1.14, duration: 0.70, ease: 'power2.out' }, 5.20);
        tl.fromTo('#w-turn', { opacity: 0, y: 56 }, { opacity: 1, y: 0, duration: 0.34 }, 5.55);
        tl.fromTo('#w-note', { opacity: 0 }, { opacity: 1, duration: 0.40 }, 6.60);
        tl.fromTo('#w-cite', { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.40,
                               ease: 'back.out(2)' }, 7.05);

        // 7.30 the cell membrane contracts and the scattered vesicles drift on:
        // the last 1.7s keeps two independent elements in real motion.
        tl.to('#w-cellgrp', { scale: 0.90, duration: 0.80, ease: 'power2.inOut' }, 7.30);
        tl.to('#w-vesicles', { x: 132, opacity: 0.55, duration: 1.70, ease: 'sine.inOut' }, 7.30);

        tl.to({}, { duration: 9.050 }, 0); // full-span anchor -- always last
        window.__timelines["02-what"] = tl;
      </script>
    </template>
  </body>
</html>
