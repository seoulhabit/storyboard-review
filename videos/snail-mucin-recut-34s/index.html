    <audio id="vo-01" src="assets/voice/01.wav" data-start="0.15" data-duration="1.12"

           data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.1,"v":1},{"t":1.02,"v":1},{"t":1.12,"v":0}]}]}'></audio>

    <div id="scene-02-why" class="scene clip" data-composition-id="02-why"

    <!-- BGM: same track the source project uses (assets/bgm/, cropped to 34.0s, head/tail
         fades baked into the file). Flat data-volume="0.12" under VO — no data-fx-carve
         ducking, matching the real convention this project's own source already ships
         (confirmed by inspection: the source has no hf-audio-group / fx-carve wiring at all). -->
    <audio id="el-bgm" src="assets/bgm/track.mp3" data-start="0" data-duration="34.0"
           data-track-index="11" data-volume="0.12"></audio>

    <div id="scene-captions" class="scene clip" data-composition-id="captions"
         data-composition-src="compositions/captions.html"
         data-start="0" data-duration="34.0" data-track-index="2"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    // Root timeline's only job is scene handoff — each sub-composition owns its own content.
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    // All 6 scene-to-scene boundaries are hard cuts (Cuts vs crossfades) — ground colour
    // changes at every boundary in this build, which makes a crossfade structurally unsafe
    // everywhere. No opacity tween added here on purpose.
    tl.to({}, { duration: 34.0 }, 0); // anchor: tl.duration() === root duration
    window.__timelines["main"] = tl;
  </script>
