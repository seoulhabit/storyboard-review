<template data-composition-id="06-loop" data-duration="4.0">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<style data-brand-tokens="">
  @font-face { font-family: 'Bricolage Grotesque'; src: url('assets/fonts/bricolage-grotesque-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }
  @font-face { font-family: 'JetBrains Mono'; src: url('assets/fonts/jetbrains-mono-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }
  :root {
    --green: #2c4a34; --green-deep: #0f2016; --green-lite: #cddfb9;
    --pink: #b9835a; --pink-deep: #8a5a37;
    --cream: #fbfaf4; --cream-2: #e8efdd; --ink: #0f2016;
    --font-display: "Bricolage Grotesque", system-ui, serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --safe-top: 192px; --safe-bottom: 384px; --safe-right: 162px; --safe-left: 162px;
    --cap-band-top: 1168px;
    --content-bottom-limit: calc(1920px - var(--cap-band-top) + 32px); /* clears the caption band, not just the safe-bottom UI zone */
  }
</style>

<style>
  /* Loop mechanism: identical plate, identical crop/position/ground-colour to
     Scene 01's frame zero, so the last frame hands back to the first for a
     seamless replay (The hook: "engineer the loop"). */
  #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--green-deep); font-family: var(--font-display); }
  #root.debug-layout * { outline: 1px solid rgba(255,0,0,.6) !important; }

  .media-plate { position: absolute; inset: 0; background: #1A1A1A; }
  /* D1/D4 fix: this plate never moved (0.00 diff for the final 2.75s of the whole
     render). Ken Burns creep matching Scene 01's own --kb-scale pattern, but run
     IN REVERSE — it must settle at scale(1) by t=4.0 so the last frame still lands
     on Scene 01's frame-zero geometry exactly (The hook: engineer the loop). */
  .media-plate img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%;
    display: block; transform: scale(var(--kb-scale, 1)); transform-origin: 50% 30%; }
  .scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(15,32,22,.15) 0%, rgba(15,32,22,.55) 62%, rgba(15,32,22,.86) 100%); }

  .content { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex;
    flex-direction: column; justify-content: flex-end;
    padding: 0 72px var(--content-bottom-limit) 72px; }

  .close-line { font-weight: 700; font-size: 84px; line-height: 1.05; color: var(--cream);
    opacity: 0; text-shadow: 0 2px 24px rgba(0,0,0,.4); }
</style>

<div id="root" class="clip" data-composition-id="06-loop" data-width="1080" data-height="1920">
  <div class="media-plate">
    <img id="loop-plate" src="assets/plates/06-cheekbone-glow.png" alt="" width="1152" height="2048"
         loading="eager" decoding="sync">
  </div>
  <div class="scrim"></div>
  <div class="content">
    <!-- D4 fix: this was literally "Mist first. Then apply." over the caption pill
         showing the exact same two lines below it — the same words on screen twice.
         The caption stays the true VO transcript (per The captions' production
         order, transcript accuracy isn't the thing to change); this decorative
         hero line is reworded to the same lesson, not the same sentence. -->
    <div class="close-line" id="close-line">Damp skin.<br>Every time.</div>
  </div>
</div>

<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  // D1 fix: measured 0.00 pixel diff from local t=1.0 to t=3.75 (absolute 31.0-33.75)
  // — the close-line finished its fade by 0.9s and nothing moved for the remaining
  // ~3.1s. Ken Burns creep runs the whole 4.0s, easing scale DOWN to exactly 1.0 by
  // t=4.0 so the true final frame is pixel-identical in geometry to Scene 01's t=0
  // (same --kb-scale=1.0, same 50%/30% origin) — the loop match is preserved, not
  // just "the plate moves."
  var kb = { scale: 1.045 };
  tl.to(kb, {
    scale: 1.0, duration: 4.0, ease: "sine.inOut",
    onUpdate: function () { document.getElementById("root").style.setProperty("--kb-scale", kb.scale); }
  }, 0);

  // One specific, lesson-tied action — not a generic subscribe/like card.
  tl.fromTo("#close-line", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.5);

  // Hold to the exact end of the render: the last frame (t=4.0) matches Scene
  // 01's frame zero — same plate, same crop, same ground colour, same hero
  // position — so a replay reads as continuous rather than a hard reset.
  tl.to({}, { duration: 4.0 }, 0); // anchor
  window.__timelines["06-loop"] = tl;
})();
</script>
</template>
