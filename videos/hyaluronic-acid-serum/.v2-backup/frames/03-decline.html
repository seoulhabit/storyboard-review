  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      // ---- SVG path draw setup: measure real geometry, never guessed. ----
      var axisLine = document.getElementById("decline-axis-line");
      var ticks = document.querySelectorAll(".decline-tick");
      var staircase = document.getElementById("decline-staircase");

      [axisLine, staircase].concat(Array.prototype.slice.call(ticks)).forEach(function (p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      var tl = gsap.timeline({ paused: true });

      // ============================================================
      // Scene 1 (0.0-2.5s) — face settles; fist enters and touches the cheek.
      // ============================================================
      tl.fromTo(
        ".decline-face",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        0.05,
      );

      // Fist reaches in from off-frame (right) and its extended finger lands on the cheek.
      // Container is anchored at (0,0); x/y below are the container's absolute screen
      // position, chosen so the pointing fingertip (local ~88,8) lands on the cheek point
      // (face container at left:140/top:380/400x467, viewBox "5 -5 210 245" -> local face
      // point ~178,125 maps to screen ~470,628; minus the fingertip offset = 382,620).
      tl.fromTo(
        ".decline-fist",
        { x: 1100, y: 480, opacity: 0 },
        { x: 382, y: 620, opacity: 1, duration: 0.75, ease: "power2.out" },
        0.2,
      );
      // Holds touching the cheek through the rest of Scene 1 ("point to your own skin").

      // ============================================================
      // Scene 2 (2.5-4.5s) — fist lifts to a second, lower point (implying a joint),
      // then retreats off-frame.
      // ============================================================
      tl.to(".decline-fist", { x: 292, y: 892, duration: 0.8, ease: "power2.inOut" }, 2.5);
      // Holds touching the lower point ("...to cushion skin and joints") before retreating.

      tl.to(
        ".decline-fist",
        { x: -260, y: 1150, opacity: 0, duration: 0.5, ease: "power2.out" },
        4.0,
      );

      // ============================================================
      // Scene 3 (4.5-7.0s) — with the point made, the decade axis self-draws beneath the face.
      // ============================================================
      tl.to(axisLine, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 4.9);

      var TICK_START = 5.35;
      var TICK_STAGGER = 0.08;
      ticks.forEach(function (t, i) {
        tl.to(
          t,
          { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
          TICK_START + i * TICK_STAGGER,
        );
      });

      // ============================================================
      // Scene 4 (7.0-11.285s) — dots land on the ticks, the staircase draws and drops each
      // dot onto its step, the stat counts up, and the source chip resolves. Holds to end.
      // ============================================================
      var dots = document.querySelectorAll(".decline-dot");
      var ENTRY_AT = 7.0;
      var STAGGER = 0.065;
      var EXPAND_DUR = 0.85;
      dots.forEach(function (el, i) {
        var tx = Number(el.dataset.targetX);
        var start = ENTRY_AT + i * STAGGER;
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          { x: tx, y: 0, scale: 1, opacity: 1, duration: EXPAND_DUR, ease: "power3.out" },
          start,
        );
      });

      // The staircase decline self-draws left to right at a constant rate. Each dot after the
      // first (decade 0 is the "now" baseline, undisturbed) drops to the freshly-drawn step the
      // instant the line reaches its x-position — the drop amounts match the staircase's own
      // levels exactly.
      tl.to(staircase, { strokeDashoffset: 0, duration: 1.0, ease: "none" }, 8.15);

      var dropTargets = [65, 130, 195, 260]; // px drop for decades 1-4, mirrors the staircase levels
      for (var i = 1; i < dots.length; i++) {
        var dropStart = 8.15 + i * 0.25;
        tl.to(dots[i], { y: dropTargets[i - 1], duration: 0.22, ease: "power2.inOut" }, dropStart);
      }

      // Landing stat — counting-dynamic-scale: the value counts 0 to 6 while the whole signed
      // group grows to its final size on the same timing/ease. Kept small and clean (Adapt: a
      // guest-star beat, not the video's climax) rather than an escalating hero number.
      var counterEl = document.getElementById("decline-counter");
      var counterState = { value: 0 };
      tl.fromTo(
        "#decline-stat-value",
        { scale: 0.55, opacity: 0 },
        { scale: 1, opacity: 1, duration: 1.15, ease: "power2.out" },
        9.2,
      );
      tl.to(
        counterState,
        {
          value: 6,
          duration: 1.15,
          ease: "power2.out",
          onUpdate: function () {
            counterEl.textContent = Math.round(counterState.value);
          },
        },
        9.2,
      );

      tl.fromTo(
        ".decline-stat-copy",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        10.35,
      );

      // Source chip fades in beside the landed stat.
      tl.fromTo(
        ".decline-chip",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power1.out" },
        10.55,
      );

      // Holds to 11.285s — no exit tween (frame 3 of 6; the root crossfade transition is the exit).

      window.__timelines["03-decline"] = tl;
    })();
