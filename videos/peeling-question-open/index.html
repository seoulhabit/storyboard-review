<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #4F6B52; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.000" data-width="1080" data-height="1920">

      <!-- Scene 1 -- question (0.000-1.800), moss, frosted-glass peel -->
      <div id="el-01-question" class="scene" data-composition-id="01-question" data-composition-src="compositions/frames/01-question.html" data-start="0.000" data-duration="1.800" data-track-index="0"></div>
      <audio id="el-sfx-01a" src="assets/sfx/whoosh-soft-question-to-headline-wipe.mp3" data-start="0.10" data-duration="1.580" data-track-index="20" data-volume="0.34" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:0.08,&quot;v&quot;:0.34},{&quot;t&quot;:1.50,&quot;v&quot;:0.34},{&quot;t&quot;:1.58,&quot;v&quot;:0}]}]}"></audio>
      <audio id="el-sfx-01b" src="assets/sfx/glass-clink.mp3" data-start="1.55" data-duration="0.312" data-track-index="21" data-volume="0.42"></audio>

      <!-- Scene 2 -- answer (1.800-5.000), ink-soft, stamp card -->
      <div id="el-02-answer" class="scene" data-composition-id="02-answer" data-composition-src="compositions/frames/02-answer.html" data-start="1.800" data-duration="3.200" data-track-index="1"></div>
      <audio id="el-sfx-02a" src="assets/sfx/sharp-text-stamp-impact-hit.trimmed.mp3" data-start="1.95" data-duration="1.100" data-track-index="20" data-volume="0.52" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:0.04,&quot;v&quot;:0.52},{&quot;t&quot;:0.95,&quot;v&quot;:0.52},{&quot;t&quot;:1.10,&quot;v&quot;:0}]}]}"></audio>
      <audio id="el-sfx-02b" src="assets/sfx/click-soft-chip-pair-lands.mp3" data-start="2.40" data-duration="0.264" data-track-index="21" data-volume="0.30"></audio>

      <!-- Scene 3 -- reaction (5.000-10.000), moss, horizontal split -->
      <div id="el-03-reaction" class="scene" data-composition-id="03-reaction" data-composition-src="compositions/frames/03-reaction.html" data-start="5.000" data-duration="5.000" data-track-index="0"></div>
      <audio id="el-sfx-03a" src="assets/sfx/click-soft-chip-pair-lands.mp3" data-start="5.10" data-duration="0.264" data-track-index="20" data-volume="0.30"></audio>
      <audio id="el-sfx-03b" src="assets/sfx/click-soft-chip-pair-lands.mp3" data-start="5.85" data-duration="0.264" data-track-index="21" data-volume="0.30"></audio>
      <audio id="el-sfx-03c" src="assets/sfx/glass-clink.mp3" data-start="6.25" data-duration="0.312" data-track-index="22" data-volume="0.36"></audio>

      <!-- Scene 4 -- evidence (10.000-15.000), ink-soft, asymmetric + dose row -->
      <div id="el-04-evidence" class="scene" data-composition-id="04-evidence" data-composition-src="compositions/frames/04-evidence.html" data-start="10.000" data-duration="5.000" data-track-index="1"></div>
      <audio id="el-sfx-04a" src="assets/sfx/paper-stamp-thump-the-myth-stamp-landing.mp3" data-start="10.20" data-duration="0.720" data-track-index="20" data-volume="0.40" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:0.04,&quot;v&quot;:0.40},{&quot;t&quot;:0.62,&quot;v&quot;:0.40},{&quot;t&quot;:0.72,&quot;v&quot;:0}]}]}"></audio>
      <audio id="el-sfx-04b" src="assets/sfx/click-soft-chip-pair-lands.mp3" data-start="13.35" data-duration="0.264" data-track-index="21" data-volume="0.28"></audio>

      <!-- Scene 5 -- boundary (15.000-20.000), moss, verdict card pair -->
      <div id="el-05-boundary" class="scene" data-composition-id="05-boundary" data-composition-src="compositions/frames/05-boundary.html" data-start="15.000" data-duration="5.000" data-track-index="0"></div>
      <audio id="el-sfx-05a" src="assets/sfx/click-soft-chip-pair-lands.mp3" data-start="15.50" data-duration="0.264" data-track-index="20" data-volume="0.30"></audio>
      <audio id="el-sfx-05b" src="assets/sfx/paper-stamp-thump-golden-rule-landing-de.mp3" data-start="17.20" data-duration="1.200" data-track-index="21" data-volume="0.46" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:0.05,&quot;v&quot;:0.46},{&quot;t&quot;:1.05,&quot;v&quot;:0.46},{&quot;t&quot;:1.20,&quot;v&quot;:0}]}]}"></audio>
      <audio id="el-sfx-05c" src="assets/sfx/click-soft-chip-pair-lands.mp3" data-start="19.10" data-duration="0.264" data-track-index="22" data-volume="0.28"></audio>

      <!-- Scene 6 -- open (20.000-25.000), moss, loop-matched to scene 1 -->
      <div id="el-06-open" class="scene" data-composition-id="06-open" data-composition-src="compositions/frames/06-open.html" data-start="20.000" data-duration="5.000" data-track-index="1"></div>
      <audio id="el-sfx-06a" src="assets/sfx/click-soft-chip-pair-lands.mp3" data-start="21.05" data-duration="0.264" data-track-index="20" data-volume="0.28"></audio>
      <audio id="el-sfx-06b" src="assets/sfx/glass-clink.mp3" data-start="23.15" data-duration="0.312" data-track-index="21" data-volume="0.40"></audio>

      <!-- BGM: flat 25.000s crop of the 57s source. Envelope lands at a LOW
           FLOOR (0.15) at both ends rather than true silence -- a deliberate
           departure from the usual declick-to-zero convention, because this
           video is designed to loop and a hard fade-to-silence-then-restart
           creates an audible dead spot exactly at the seam every replay. Both
           ends land on the same low floor so the loop boundary stays
           continuous rather than resetting through silence. -->
      <audio id="el-bgm" src="assets/bgm/track.mp3" data-start="0" data-duration="25.000" data-track-index="11" data-volume="0.32"
             data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.15},{&quot;t&quot;:0.6,&quot;v&quot;:0.32},{&quot;t&quot;:24.4,&quot;v&quot;:0.32},{&quot;t&quot;:25.0,&quot;v&quot;:0.15}]}]}"></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 25.000 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
