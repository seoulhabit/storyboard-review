<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="ifr-title ifr-desc">
  <title id="ifr-title">Ingredient route fork</title>
  <desc id="ifr-desc">One collagen actor arrives at a junction and separates into topical and oral routes with different destinations.</desc>
  <defs>
    <linearGradient id="ifr-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFDF8"/><stop offset="1" stop-color="#E9E2DE"/></linearGradient>
    <filter id="ifr-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#ifr-bg)"/>
  <text x="72" y="72" fill="#172332" font-family="Arial, sans-serif" font-size="24" font-weight="700">Same ingredient story. Different route.</text>
  <text x="1528" y="72" text-anchor="end" fill="#6E6670" font-family="Arial, sans-serif" font-size="20">Route controls the explanation</text>
  <path id="ifr-entry-path" d="M196 450H700" stroke="#172332" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
  <path id="ifr-topical-path" data-layer="topical-path" d="M700 450C822 450 845 275 982 275H1320" stroke="#204E58" stroke-width="8" stroke-linecap="round"/>
  <path id="ifr-oral-path" data-layer="oral-path" d="M700 450C822 450 845 625 982 625H1320" stroke="#7D3155" stroke-width="8" stroke-linecap="round"/>
  <g id="ifr-junction" data-layer="junction">
    <circle cx="700" cy="450" r="48" fill="#FFFDF8" stroke="#172332" stroke-width="5"/>
    <circle cx="700" cy="450" r="12" fill="#C66F61"/>
  </g>
  <g id="ifr-ingredient" data-layer="ingredient" transform="translate(138 285) scale(.34)"><image href="../../../../ingredients/collagen/components/ingredient-actor.svg" width="800" height="800"/></g>
  <g id="ifr-topical-destination" data-layer="topical-destination">
    <rect x="1050" y="160" width="430" height="228" rx="26" fill="#DCE8E4" stroke="#204E58" stroke-opacity=".34" stroke-width="3"/>
    <path d="M1092 284C1150 244 1211 315 1268 274C1322 236 1377 286 1438 251" stroke="#172332" stroke-opacity=".34" stroke-width="4"/>
    <path d="M1092 308H1438" stroke="#204E58" stroke-width="12" stroke-linecap="round"/>
    <text x="1092" y="215" fill="#204E58" font-family="Arial, sans-serif" font-size="20" font-weight="700">Topical route</text>
    <text x="1092" y="354" fill="#172332" font-family="Georgia, serif" font-size="34">Skin surface</text>
  </g>
  <g id="ifr-oral-destination" data-layer="oral-destination">
    <rect x="1050" y="512" width="430" height="228" rx="26" fill="#F0E0D8" stroke="#7D3155" stroke-opacity=".34" stroke-width="3"/>
    <path d="M1095 605C1152 552 1196 650 1258 597C1316 548 1363 636 1438 576" stroke="#7D3155" stroke-width="7" stroke-linecap="round"/>
    <g fill="#C66F61"><circle cx="1160" cy="652" r="8"/><circle cx="1210" cy="674" r="6"/><circle cx="1270" cy="646" r="9"/><circle cx="1330" cy="675" r="7"/></g>
    <text x="1092" y="567" fill="#7D3155" font-family="Arial, sans-serif" font-size="20" font-weight="700">Oral route</text>
    <text x="1092" y="706" fill="#172332" font-family="Georgia, serif" font-size="34">Digestion + distribution</text>
  </g>
  <g transform="translate(72 790)"><rect width="1016" height="58" rx="29" fill="#172332"/><text x="28" y="38" fill="#FFFDF8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Evidence and destination do not transfer across routes.</text></g>
  <circle cx="1490" cy="819" r="31" fill="#172332"/><text x="1490" y="830" text-anchor="middle" fill="#FFFDF8" font-family="Arial, sans-serif" font-size="26" font-weight="700">습</text>
</svg>
