<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face { font-family:'InterT'; src: local('Inter'); }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1280px; height:720px; overflow:hidden; font-family:'Inter','Helvetica Neue',sans-serif; background:#101314; }
.stage { position:relative; width:1280px; height:720px; }
.plate { position:absolute; inset:0; }
.plate img { width:100%; height:100%; object-fit:cover; object-position:0% 60%; filter:saturate(1.15) contrast(1.06); }
.scrim { position:absolute; inset:0; background:linear-gradient(to left, rgba(16,19,20,0.86) 0%, rgba(16,19,20,0.62) 34%, rgba(16,19,20,0.05) 62%); }
.type { position:absolute; right:56px; top:70px; width:560px; text-align:right; }
.kicker { font-weight:700; font-size:26px; letter-spacing:0.16em; color:#93B896; text-transform:uppercase; margin-bottom:18px; }
h1 { font-weight:800; font-size:92px; line-height:0.98; letter-spacing:-0.01em; color:#F7F5F0; text-transform:uppercase; text-shadow:0 4px 24px rgba(16,19,20,0.6); }
h1 em { font-style:normal; color:#93B896; }
.pill { display:inline-block; margin-top:26px; background:rgba(247,245,240,0.94); color:#131516;
  font-weight:800; font-size:30px; letter-spacing:0.08em; text-transform:uppercase;
  padding:16px 30px; border-radius:999px; }
</style></head><body>
<div class="stage">
  <div class="plate"><img src="tiger-169.png"></div>
  <div class="scrim"></div>
  <div class="type">
    <div class="kicker">The Tiger Grass Legend</div>
    <h1>Why tigers<br>roll in<br><em>this plant</em></h1>
    <div class="pill">Centella · Cica</div>
  </div>
</div>
</body></html>
