<script>
(function () {
  var card = document.getElementById('cf-card');
  var mediaZoom = document.getElementById('cf-media-zoom');
  var f1 = document.getElementById('cf-f1');
  var f2 = document.getElementById('cf-f2');
  var f3 = document.getElementById('cf-f3');
  var name = document.getElementById('cf-name');
  var star = document.getElementById('cf-star');
  var claimBlock = document.getElementById('cf-claim-block');

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  // Cues (tightened take): flushes red@0.59-1.13 · missing@4.55-5.01 ·
  // dozens of compounds@5.93-6.94 · star is Eupatilin@7.37-8.64.

  // Hard cut in — the intake document resolves at full density immediately.
  tl.fromTo(card, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 0.0);
  tl.fromTo(name, { clipPath: 'inset(0 100% 0 0)' },
    { clipPath: 'inset(0 0% 0 0)', duration: 0.7, ease: 'power2.inOut' }, 0.2);

  // The three fields stagger through the dead middle of the take instead of landing as one
  // block — this is what turns 5.5s of the prior cut's frozen hold into real cadence.
  tl.fromTo(f1, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 0.9);
  tl.fromTo(f2, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 2.6);
  tl.fromTo(f3, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 4.3);

  tl.to(claimBlock, { opacity: 1, duration: 0.5 }, 5.93);

  // "the star is Eupatilin": the frame's one aqua accent — an underline draws beneath it.
  gsap.set(star, { backgroundImage: 'linear-gradient(#59B8AE,#59B8AE)', backgroundRepeat: 'no-repeat', backgroundPosition: '0 100%', backgroundSize: '0% 4px' });
  tl.to(star, { backgroundSize: '100% 4px', duration: 0.5, ease: 'power2.out' }, 7.37);
