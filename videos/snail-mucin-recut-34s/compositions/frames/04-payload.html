<style>
  #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--ink); font-family: var(--font-display); }
  #root.debug-layout * { outline: 1px solid rgba(255,0,0,.6) !important; }

  /* D1 fix: this plate never moved at all (only the card swaps registered any
     pixel change, at a mean diff of 2-4/255 — just antialiasing on the fading
     card edges, not real motion). inset:-4% + allow-overflow, same convention

  .media-plate { position: absolute; inset: -4%; background: #1A1A1A; }
  .media-plate img { width: 100%; height: 100%; object-fit: cover; display: block; }

<script>
(function () {
  window.__timelines = window.__timelines || {};

  // ytCameraMove helper, pasted per hyperframes add convention (same helper
  // installed via `npx hyperframes add yt-camera-move`, compositions/components/).
  window.ytCameraMove = window.ytCameraMove || function (tl, target, at, opts) {
    opts = opts || {};
    var dur = opts.dur === undefined ? 1.2 : opts.dur;
    gsap.set(target, { transformPerspective: 1200, transformOrigin: opts.origin || "50% 50%" });
    tl.to(target, {
      scale: 1 + (opts.zoom === undefined ? 0.11 : opts.zoom),
      x: opts.slideX || 0, y: opts.slideY || 0,
      duration: dur, ease: opts.ease || "power2.inOut",
    }, at);
  };

  var tl = gsap.timeline({ paused: true });

  // D1 fix: continuous push under the card swaps, replacing the fixed scale(1.06)
  // that never animated. Was carrying the original 6% starting punch-in as its
  // zoom target so frame zero doesn't jump.
  window.ytCameraMove(tl, "#payload-plate", 0.1, { zoom: 0.09, slideX: -12, slideY: 10, dur: 7.7, ease: "sine.inOut", origin: "50% 40%" });

  // One mechanism (same-slot card swap), two labels max per card (name + function) —
  // three cards in 8s instead of the source's three in 25s.
  function showCard(id, at) {
    tl.to(id, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.4)" }, at);
    tl.to(id, { opacity: 0, scale: 0.94, duration: 0.3, ease: "power2.in" }, at + 2.0);
  }
  showCard("#card-1", 0.8);
  showCard("#card-2", 3.1);
  tl.to("#card-3", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.4)" }, 5.4);
  // card-3 stays up (no exit) — it hands off directly to the payoff line

  tl.to("#payoff-line", { opacity: 1, duration: 0.4, ease: "power2.out" }, 7.0);

  tl.to({}, { duration: 8.0 }, 0); // anchor
  window.__timelines["04-payload"] = tl;
})();
</script>
