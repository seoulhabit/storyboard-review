    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];

        // 1 -> 2 : cut (no tween — matches this beat's punchy tech-glitch SFX cut)

        // 2 -> 3 : crossfade
        tl.to("#el-02-identity", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 25.970);

        // 3 -> 4 : crossfade (continuous "just under the surface" world)
