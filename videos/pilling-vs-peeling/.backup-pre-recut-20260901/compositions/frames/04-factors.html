<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }

        #root {
          --paper: #F7F5F0; --ink: #131516; --ink-2: #6B6B6B; --aqua: #59B8AE;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
          --safe-margin: 6px;

          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--paper); font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }

        /* Spatial plan (new mechanism -- a several-inputs-converge-on-one-node
           diagram; catalog-contribution candidate, see BRIEF.md § Notes):
           1. #root is a single flex column: headline zone (top) / diagram zone
              (flex:1, centered SVG) / caption zone (bottom).
           2. The 3 outer nodes, 3 connector lines, and 1 center node are one
              self-contained SVG; nothing outside it gets its own absolute
              position. */
        .stage { display: flex; flex-direction: column; height: 100%;
                 padding: calc(var(--safe-top) + var(--safe-margin)) var(--safe-right)
                          var(--safe-bottom) calc(var(--safe-left) + var(--safe-margin)); }

        .headline-zone { flex: 0 0 auto; }
        .headline { font-weight: 800; font-size: 60px; line-height: 1.2; color: var(--ink);
                    max-width: 800px; }

        .diagram-zone { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; }
        .diagram-zone svg { width: 760px; height: 540px; display: block; }
        .connector { fill: none; stroke: var(--ink); stroke-width: 2.5; opacity: 0.5; }
        .node-outer { fill: var(--paper); stroke: var(--ink); stroke-width: 2.4; opacity: 0; }
        .node-center { fill: var(--aqua); opacity: 0; }
        .node-label { font-family: var(--font-mono); font-size: 26px; font-weight: 500;
                      letter-spacing: 0.06em; fill: var(--ink); text-anchor: middle; opacity: 0; }

        .caption-zone { flex: 0 0 auto; padding-top: 12px; }
        .caption { font-family: var(--font-mono); font-weight: 500; font-size: 34px;
                   line-height: 1.4; color: var(--ink-2); max-width: 760px; opacity: 0; }
      </style>

      <div id="root" data-composition-id="04-factors" data-width="1080" data-height="1920" data-duration="2.600">
        <div class="clip stage">
          <div class="headline-zone">
            <h2 class="headline">Not automatically the product&rsquo;s fault.</h2>
          </div>
          <div class="diagram-zone">
            <svg viewBox="0 0 700 500">
              <path class="connector" id="line-skin" d="M180,140 L350,270"/>
              <path class="connector" id="line-formula" d="M520,140 L350,270"/>
              <path class="connector" id="line-app" d="M350,420 L350,270"/>

              <circle class="node-outer" id="node-skin" cx="180" cy="140" r="64"/>
              <text class="node-label" id="label-skin" x="180" y="148">SKIN</text>

              <circle class="node-outer" id="node-formula" cx="520" cy="140" r="64"/>
              <text class="node-label" id="label-formula" x="520" y="148">FORMULA</text>

              <circle class="node-outer" id="node-app" cx="350" cy="420" r="64"/>
              <text class="node-label" id="label-app" x="350" y="428">APPLICATION</text>

              <circle class="node-center" id="node-center" cx="350" cy="270" r="30"/>
            </svg>
          </div>
          <div class="caption-zone">
            <p class="caption">Doesn&rsquo;t mean the product is bad.</p>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        ['#line-skin', '#line-formula', '#line-app'].forEach(function (id) {
          var el = document.querySelector(id);
          var len = el.getTotalLength();
          gsap.set(id, { strokeDasharray: len, strokeDashoffset: len });
        });

        // t0.15: 3 outer nodes settle in, staggered.
        tl.fromTo(['#node-skin', '#label-skin'], { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.8)" }, 0.15);
        tl.fromTo(['#node-formula', '#label-formula'], { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.8)" }, 0.25);
        tl.fromTo(['#node-app', '#label-app'], { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.8)" }, 0.35);

        // t0.6-1.3: connector lines draw in toward the center, staggered.
        tl.to('#line-skin', { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 0.60);
        tl.to('#line-formula', { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 0.75);
        tl.to('#line-app', { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 0.90);

        // t1.35: center node arrives and pulses -- the convergence payoff.
        tl.set('#node-center', { transformOrigin: '50% 50%' }, 0);
        tl.to('#node-center', { opacity: 1, duration: 0.2 }, 1.35);
        tl.to('#node-center', { scale: 1.2, duration: 0.4, ease: "power1.inOut", yoyo: true, repeat: 1 }, 1.55);

        tl.to('.caption', { opacity: 1, duration: 0.3 }, 1.70);

        tl.to({}, { duration: 2.600 }, 0); // full-span anchor
        window.__timelines["04-factors"] = tl;
      </script>
    </template>
  </body>
</html>
