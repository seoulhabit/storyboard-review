      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ---- chip schedule (dynamic-content-sequencing) ----
        const CHIP_IDS = ["#hook-chip-0", "#hook-chip-1", "#hook-chip-2"];
        const CHIP_ENTER_START = 0.25;
        const CHIP_STAGGER = 0.3;
        const CHIP_ENTER_DUR = 0.4;
        const CHIP_HOLD_END = 7.0; // retimed for the shorter Kimberly VO (2026-08-29) — was 8.2
        const CHIP_EXIT_DUR = 0.6;

        CHIP_IDS.forEach((id, i) => {
          const start = CHIP_ENTER_START + i * CHIP_STAGGER;
          tl.fromTo(
            id,
            { opacity: 0, y: 16, scale: 0.9 },
            { opacity: 1, y: 0, scale: 1, duration: CHIP_ENTER_DUR, ease: "power3.out" },
            start,
          );
        });
        CHIP_IDS.forEach((id, i) => {
          tl.to(id, { y: -3, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.4 + i * 0.2);
        });
        CHIP_IDS.forEach((id) => {
          tl.to(id, { opacity: 0, y: -14, duration: CHIP_EXIT_DUR, ease: "power2.inOut" }, CHIP_HOLD_END);
        });

        // ---- two-clause kinetic headline: word-by-word reveal, content-driven timing ----
        const CLAUSE_1_WORDS = ["Korean", "skincare", "is", "pure", "magic,"];
        const CLAUSE_2_WORDS = ["but", "the", "ingredient", "lists?", "An", "advanced", "chemistry", "exam."];
        const WORD_BASE = 0.17;
        const WORD_PER_CHAR = 0.013;

        function schedule(words, startTime) {
          let t = startTime;
          return words.map((w) => {
            const dur = WORD_BASE + w.length * WORD_PER_CHAR;
            const start = t;
            t += dur;
            return { word: w, start };
          });
        }

        const clause1Schedule = schedule(CLAUSE_1_WORDS, 0.7);
        const clause2Schedule = schedule(CLAUSE_2_WORDS, 3.0);

        function mount(lineEl, entries) {
          entries.forEach((entry) => {
            const span = document.createElement("span");
            span.className = "hook-word";
            span.textContent = entry.word;
            lineEl.appendChild(span);
            entry.el = span;
          });
        }
        mount(document.getElementById("hook-line-1"), clause1Schedule);
        mount(document.getElementById("hook-line-2"), clause2Schedule);

        clause1Schedule.forEach((entry) => {
          tl.fromTo(entry.el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, entry.start);
        });
        clause2Schedule.forEach((entry) => {
          tl.fromTo(entry.el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, entry.start);
        });

        // ---- reaction callout: pops in the gap between the two clauses, clears before clause 2 ----
        tl.fromTo("#hook-reaction", { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power3.out" }, 1.95);
        tl.to("#hook-reaction", { opacity: 0, y: -8, duration: 0.35, ease: "power2.inOut" }, 2.6);

        tl.to({}, { duration: 8 }, 0); // full-span anchor

        window.__timelines["01-hook"] = tl;
      </script>
