<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>17-preference</title></head>
<body>
<template>
  <div id="root" data-composition-id="17-preference"
       data-width="1920" data-height="1080" data-duration="13.513">
    <style>
      #root {
    --paper:#F7F5F0; --ink:#131516; --ink-soft:#211F1B; --mist:#F0EBE1; --white:#FCFBF9;
    --aqua:#59B8AE; --leaf:#6F8F72; --coral:#C97A5C; --highlighter:#E0A32B;
    --moss:#4F6B52; --celadon:#93B896;
    /* MEASURED against the grounds they actually land on, not against paper
       alone. --ink-2 was 4.49:1 on --mist (the .cite chip, .sh.from) and
       --ink-2-dark 4.78:1 on --ink-soft with no headroom for the retention
       plates behind it; both now clear 4.5:1 with room. --ink-3-dark (4.13:1
       on --ink-soft) is kept for non-text use only -- no text binds to it. */
    --ink-2:#666666; --ink-3:#9C978D; --ink-2-dark:#8E9293; --ink-3-dark:#7C8082;
    --rule:#E3E3E3; --rule-strong:#D9D3C6; --rule-dark:#333333;

    --font-display:"EB Garamond",Georgia,"Times New Roman",serif;
    --font-body:"Inter",system-ui,-apple-system,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;

    /* Raised for the 2026-09-05 accessibility pass: essential informational
       text sits at 48px+ in the 1080p master, chrome and labels at 36px, and
       nothing a viewer is expected to read is under 30px. The display sizes
       (hero/figure/frame) are unchanged -- they were never the problem. */
    --t-hero:96px; --t-figure:60px; --t-frame:50px; --t-body:48px;
    --t-caption:30px; --t-label:36px; --t-chip:36px; --t-floor:20px;
    --lh-tight:1.06; --lh-snug:1.2; --lh-body:1.45;
    --tr-display:-0.018em; --tr-body:0em; --tr-mono:0.04em; --tr-mono-wide:0.1em;

    --e-out:cubic-bezier(0.215,0.61,0.355,1);
    --e-inout:cubic-bezier(0.455,0.03,0.515,0.955);

    --s-2:8px; --s-3:12px; --s-4:20px; --s-5:32px; --s-6:60px; --s-7:96px; --s-8:144px;
    --r-2:6px; --r-3:10px; --r-pill:999px;

    /* landscape canvas + reserved zones -- see tokens.css for the derivation */
    --canvas-w:1920px; --canvas-h:1080px;
    --safe-top:54px; --safe-bottom:108px; --safe-left:96px; --safe-right:96px;
    --safe-margin:6px;
    /* End-screen reserve -- SCENE-SCOPED, consumed by 29-cta alone. Present here
       because an inlined token block that omits a token used by any scene fails
       SILENTLY: the calc() is invalid and the whole declaration is dropped. */
    --endscreen-right:640px; --endscreen-bottom:200px;
}

    @font-face { font-family:"EB Garamond"; src:url("assets/fonts/eb-garamond-400.woff2") format("woff2");
                 font-weight:400; font-display:block; }
    @font-face { font-family:"Inter"; src:url("assets/fonts/inter-800.woff2") format("woff2");
                 font-weight:800; font-display:block; }
    @font-face { font-family:"JetBrains Mono"; src:url("assets/fonts/jetbrains-mono-500.woff2") format("woff2");
                 font-weight:500; font-display:block; }


    *,*::before,*::after { box-sizing:border-box; }
    html,body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; }
    #root { position:absolute; inset:0; overflow:hidden; }
    .stage { position:relative; width:100%; height:100%;
             padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); }
    /* The stage's single child fills the SAFE BOX exactly, so clipping it clips
       at the safe line. Confirmed necessary: on the first full render the hard
       safe-area gate found 81 frames with ink in a reserved zone, all of them
       entrance-transform transients (a panel offset x:-90 from a resting edge
       that IS the safe line) or scale-up transients. Containment beats a bigger
       margin -- a margin is sized against today's token and goes stale silently. */
    .stage > * { overflow: hidden; }
    .flexmin { min-height:0; }

    /* Citation chip: `Journal · Year` ONLY. Never an internal id or a PMID --
       those live in BRIEF.md's claim table and the video description. */
    .cite { font-family:var(--font-mono); font-weight:500; font-size:var(--t-chip);
            letter-spacing:var(--tr-mono); color:var(--ink-2);
            border:2px solid var(--rule-strong); border-radius:var(--r-pill);
            padding:10px 26px; right:auto; width:max-content; bottom:auto;
            background:var(--mist); }
    .cite.on-ink { color:var(--ink-2-dark); border-color:var(--rule-dark);
                   background:var(--ink-soft); }

    /* ---- panel-scale beat primitives -------------------------------------
       Act 1 measured 4-5.8% active steps against 11.7-23.1% on shipped 9:16
       projects. Cause: on a 1920-wide frame a headline sits in a grid cell, so
       a text fade changes ~0.7% of the pixels. These move a whole panel or
       column instead -- 15-50% per beat -- which is what actually reads. */
    .panel { position:relative; background:var(--mist); border-radius:var(--r-3);
             padding:var(--s-6); min-height:0; overflow:hidden; }
    .panel.on-ink { background:var(--ink-soft); }
    /* A full-panel colour wash. scaleX from the left = a large area changing. */
    .wash { position:absolute; inset:0; transform:scaleX(0); transform-origin:0% 50%;
            border-radius:inherit; z-index:0; }
    /* Every following sibling of a wash sits ABOVE it. The earlier rule was
       scoped to .panel children only, so .arm/.stt/.action labels rendered
       UNDER their own wash (check: text_occluded, a hard error).
       CAVEAT this rule cannot cover: a BARE TEXT NODE has no element to carry
       position/z-index, so a wash paints straight over it and the card renders
       EMPTY -- confirmed on three cards, caught by the region-aware content-void
       check and verified by frame extraction. Always wrap copy in an element
       inside a washed container; the `:empty` guard below makes a stray case
       visible in review instead of silently blank. */
    .wash ~ * { position:relative; z-index:1; }
    .wash:only-child { outline:3px dashed #C97A5C; }   /* a wash with no sibling
                                                          content is authoring error */
    .wash.aqua { background:var(--aqua); } .wash.coral { background:var(--coral); }
    .wash.moss { background:var(--moss); } .wash.mist { background:var(--mist); }
    /* --rule-strong, for washing a panel that is ALREADY --mist. `.wash.mist` on
       a --mist panel is the same colour on the same colour: it renders nothing,
       and a scene relying on it as a beat holds silently. Measured on scene 08. */
    /* Full-canvas layer, for a scene that stacks TWO complete grounds and
       reveals one over the other (09-exclusion: paper "tidy version" under
       an ink "honest correction", swept in by clip-path). Each .world fills
       its own .stage internally -- this class only pins position/overflow so
       stacking two of them under #root does not double the safe-area padding. */
    .world { position:absolute; inset:0; overflow:hidden; }
    .wash.dim  { background:var(--ink-3); }   /* 82-luma step off --mist; a
       --rule-strong wash was only 20 luma and barely registered as a beat */
    /* WASH COLOUR IS BOUND TO TEXT COLOUR. A wash replaces what sits behind the
       text, so the token that passed against the panel's ORIGINAL ground can fail
       against the wash -- measured: --ink-2 on aqua is 2.26:1, and --paper on aqua
       is ~1.9:1. Two safe pairings only:
         light ground -> .wash.aqua    + --ink text   (7.76:1)
         dark  ground -> .wash.moss    + --paper text (5.42:1)
       Anything else must be re-measured against the wash, not the panel. */
    .wash.aqua ~ *, .wash.coral ~ *, .washed-light { color:var(--ink) !important; }
    .wash.moss ~ *, .washed-dark  { color:var(--paper) !important; }
    .wash.dim ~ *  { color:var(--ink) !important; }

    /* A panel-sized strike: covers the whole card, not a 5px line through a word. */
    .void { position:absolute; inset:0; background:var(--coral); opacity:0;
            border-radius:inherit; }
    .p-title { font-family:var(--font-body); font-weight:800; font-size:var(--t-frame);
               line-height:var(--lh-snug); margin:0 0 var(--s-3); }
    .p-body { font-family:var(--font-display); font-size:var(--t-body);
              line-height:var(--lh-body); margin:0; color:var(--ink-2); }
    .p-body.on-ink { color:var(--ink-2-dark); }
    .kicker { font-family:var(--font-mono); font-size:var(--t-label);
              letter-spacing:var(--tr-mono-wide); text-transform:uppercase;
              color:var(--ink-2); margin:0; }
    .kicker.on-ink { color:var(--ink-2-dark); }
    .hero { font-family:var(--font-display); font-size:var(--t-hero);
            line-height:var(--lh-tight); letter-spacing:var(--tr-display); margin:0; }
    .fig { font-family:var(--font-display); font-size:var(--t-figure);
           line-height:var(--lh-snug); margin:0; }
    .col { display:flex; flex-direction:column; min-height:0; }
    .grow { flex:1 1 0; min-height:0; }

    /* Debug overlay -- toggled by a class on #root, never on <body>.
       Confirm it is OFF by checking frame zero before any real render. */
    #root.debug-layout * { outline:1px solid rgba(255,0,0,.55) !important; }
    #root.debug-layout::after {
      content:""; position:absolute; inset:0; pointer-events:none; z-index:99;
      background:
        linear-gradient(to bottom, rgba(255,0,168,.22) var(--safe-top), transparent var(--safe-top)),
        linear-gradient(to top,    rgba(255,0,168,.22) var(--safe-bottom), transparent var(--safe-bottom)),
        linear-gradient(to right,  rgba(255,0,168,.22) var(--safe-left), transparent var(--safe-left)),
        linear-gradient(to left,   rgba(255,0,168,.22) var(--safe-right), transparent var(--safe-right));
    }


    #root { background:var(--paper); color:var(--ink); }
    .g17 { display:flex; flex-direction:column; justify-content:center;
           gap:var(--s-6); height:100%; }
    .arms { display:grid; grid-template-columns:1fr 1fr; gap:var(--s-6); }
    .arm { position:relative; background:var(--mist); border-radius:var(--r-3);
           padding:var(--s-6); overflow:hidden; text-align:center; }
    .arm .lbl { font-family:var(--font-body); font-weight:800; font-size:var(--t-frame); }
    .qual { position:relative; background:var(--ink); color:var(--paper);
            border-radius:var(--r-3); padding:var(--s-6) var(--s-7); }
    /* CARRY from 16-trial104: its cohort grid, same 13-column geometry and
       final split colours, held in the same screen quadrant it ended in --
       pixel-identical at t=0, no entrance fade -- then collapses into the
       ectoin arm on the word that names the finding. */
    .carry16 { position:absolute; top:var(--safe-top); right:var(--safe-right);
               width:40%; display:grid; grid-template-columns:repeat(13,1fr);
               gap:7px; z-index:5; }
    .carry16 i { display:block; width:100%; aspect-ratio:1/1; border-radius:50%; }

    .plate { position:absolute; inset:0; overflow:hidden; z-index:0; }
    .plate > video, .plate > img { position:absolute; left:0; top:0;
             width:1920px; height:1080px; object-fit:cover; display:block;
             transform-origin:50% 50%; }
    .scrim { position:absolute; inset:0; z-index:1; pointer-events:none; }
    .scrim.l { background:linear-gradient(90deg, rgba(19,21,22,.88) 0%,
               rgba(19,21,22,.72) 36%, rgba(19,21,22,.18) 60%, rgba(19,21,22,0) 74%); }
    .scrim.r { background:linear-gradient(270deg, rgba(19,21,22,.88) 0%,
               rgba(19,21,22,.72) 36%, rgba(19,21,22,.18) 60%, rgba(19,21,22,0) 74%); }
    .scrim.b { background:linear-gradient(0deg, rgba(19,21,22,.90) 0%,
               rgba(19,21,22,.62) 28%, rgba(19,21,22,.10) 52%, rgba(19,21,22,0) 66%); }
    .scrim.t { background:linear-gradient(180deg, rgba(19,21,22,.70) 0%,
               rgba(19,21,22,.20) 22%, rgba(19,21,22,0) 40%); }
    .scrim.full { background:rgba(19,21,22,.58); }
    .scrim.ink { background:rgba(19,21,22,.74); }
    .scrim.paper { background:rgba(247,245,240,.82); }
    .flash { position:absolute; inset:0; z-index:3; background:#DCEFEC; opacity:0;
             pointer-events:none; }
    .stage { position:relative; z-index:2; }
    .chband { z-index:10; }
    /* CONCEPTUAL VISUALIZATION chip -- top-right, inside the safe box. */
    .cv { position:absolute; top:calc(var(--safe-top) + 6px); right:var(--safe-right);
          z-index:4; margin:0; width:max-content;
          font-family:var(--font-mono); font-size:var(--t-caption);
          letter-spacing:var(--tr-mono-wide); text-transform:uppercase;
          color:rgba(247,245,240,.82); background:rgba(19,21,22,.46);
          border:1.5px solid rgba(247,245,240,.38); border-radius:var(--r-pill);
          padding:8px 18px; opacity:0; }
    /* lower-third block: translucent ink card */
    .lt { position:absolute; left:var(--safe-left); bottom:var(--safe-bottom);
          z-index:4; max-width:1040px; background:rgba(19,21,22,.70);
          border-radius:var(--r-3); padding:var(--s-5) var(--s-6);
          display:flex; flex-direction:column; gap:var(--s-3); }
    .lt .kicker { color:var(--ink-2-dark); }
    .lt .line { font-family:var(--font-display); font-size:var(--t-figure);
                line-height:var(--lh-snug); margin:0; color:var(--paper); }
    .lt .line b { font-weight:400; color:var(--coral); }
    .lt .line i { font-style:normal; color:var(--aqua); }
    .pill { display:inline-flex; align-items:center; background:rgba(19,21,22,.78);
            color:var(--paper); border-radius:var(--r-pill); padding:14px 30px;
            font-family:var(--font-body); font-weight:800; font-size:var(--t-body);
            white-space:nowrap; border:2px solid rgba(247,245,240,.16); }
    .pill.coral { background:var(--coral); color:var(--ink); border-color:transparent; }
    .pill.aqua { background:var(--aqua); color:var(--ink); border-color:transparent; }
    .cite.on-plate { color:var(--paper); border-color:rgba(247,245,240,.45);
                     background:rgba(19,21,22,.55); }
    /* headline backing: copy over a bright plate needs a ground of its own */
    .hd { background:rgba(19,21,22,.74); padding:var(--s-4) var(--s-5);
          border-radius:var(--r-3); width:max-content; max-width:100%; }
    /* COLUMN backing, for a block of copy rather than one line. MEASURED on
       the shipped master with an Otsu split of the text region: a directional
       .scrim plus a 20-26px text-shadow left 05's 60px note at 2.31:1, 09's
       body at 3.78:1 and 28's 96px headline at 1.91:1 -- a soft halo under a
       400-weight serif is not a contrast floor, and 05's aqua screen-blend
       tint actively BRIGHTENS the plate under its own type. A stated ground
       is the only thing that holds regardless of what the plate does. */
    .deck { background:rgba(19,21,22,.78); border-radius:var(--r-3);
            padding:var(--s-5) var(--s-6); }
    .mark { position:absolute; left:var(--safe-left); bottom:var(--safe-bottom);
            right:auto; width:max-content; margin:0; z-index:4;
            font-family:var(--font-mono); font-size:var(--t-label);
            letter-spacing:0.42em; color:var(--aqua); text-transform:uppercase; }

    .ground { position:absolute; inset:0; overflow:hidden; z-index:0; }
    .ground img { position:absolute; left:0; top:0; width:1920px; height:1080px;
                  object-fit:cover; transform-origin:50% 50%; }

    </style>
    <div class="ground" id="gnd"><img id="gi" src="assets/plates/C-baseskin.jpg" alt="" style="opacity:0.16; filter:blur(8px) saturate(.6)"></div>
    <div class="stage">
      <div class="carry16" id="carry-grid" data-layout-allow-occlusion="true"></div>
      <div class="g17">
        <div class="arms">
          <div class="arm" id="pr-a"><div class="wash mist" id="pr-wa"
               style="background:var(--aqua)"></div><div class="lbl">With 2% ectoin</div></div>
          <div class="arm" id="pr-b"><div class="lbl">Same cream, without</div></div>
        </div>
        <p class="fig" id="pr-h">On the study&rsquo;s own measure, the women themselves
          preferred the ectoin version.</p>
        <div class="qual" id="pr-q">
          <p class="hero" style="font-size:var(--t-figure)">That is a preference
            &mdash; not a machine reading their skin.</p>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

  // CARRY: build the handed-off grid already in its 16-trial104 end state --
  // split two-tone, fully opaque, no entrance -- so frame zero here reads as
  // a continuation of the previous scene, not a fresh one.
  var cg = document.getElementById('carry-grid');
  for (var k = 0; k < 52; k++) {
    var ci = document.createElement('i'); ci.id = 'cg-' + k;
    ci.style.background = k % 2 ? '#59B8AE' : '#9C978D';
    cg.appendChild(ci);
    tl.set('#cg-' + k, { opacity:1, scale:1 }, 0);
  }
  tl.fromTo('#pr-a', { opacity:0, y:50 }, { opacity:1, y:0, duration:0.50 }, 0.15);
  tl.fromTo('#pr-b', { opacity:0, y:50 }, { opacity:1, y:0, duration:0.50 }, 0.35);
  tl.fromTo('#pr-h', { opacity:0 }, { opacity:1, duration:0.50 }, 1.20);
  // BOUND TO WORDS, not to literal seconds. These three beats were authored at
  // 3.00 / 3.20 / 5.90 against an 11.5s read; re-paced to 130 wpm the scene runs
  // 13.1s and the last beat landed at 6.6s, leaving 6.5s in which only a 0.16-
  // opacity blurred ground moved -- a dead shot the motion gate caught. A beat
  // pinned to the word it illustrates follows the read wherever the read goes.
  // the winning arm floods with colour -- a whole half-width panel, ~20% of frame
  tl.fromTo('#pr-wa', { scaleX:0 }, { scaleX:1, duration:0.90, ease:'power2.inOut' }, 2.556);
  tl.to('#pr-b', { opacity:0.65, duration:0.70 }, 2.946);
  // The carried grid COLLAPSES into the ectoin arm on "preferred" -- the word
  // that states the finding the grid was standing in for.
  tl.to('#carry-grid', { scale:0.18, x:-360, y:60, opacity:0,
                         transformOrigin:'50% 0%', duration:0.65,
                         ease:'power2.inOut' }, 3.852);
  // the qualifier slides up over the result -- the honest beat, and a big one
  tl.set('#pr-q', { opacity:0, y:90 }, 0);
  tl.to('#pr-q', { opacity:1, y:0, duration:0.65, ease:'power3.out' }, 8.770-0.35);
  // and it settles across the rest of the line rather than stopping dead on it
  tl.to('#pr-q', { y:-10, duration:13.513-(8.770+0.30), ease:'none' },
        8.770+0.30);
  tl.fromTo('#gi', { scale:1.16, x:80, y:0 }, { scale:1.0, x:-80, y:40, duration:13.513, ease:'none' }, 0.000);

    tl.to({}, { duration: 13.513 }, 0);   // full-span anchor -- always last
    window.__timelines["17-preference"] = tl;
  </script>
</template>
