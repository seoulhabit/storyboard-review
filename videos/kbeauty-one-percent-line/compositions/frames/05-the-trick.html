<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "EB Garamond";
          font-weight: 400;
          font-style: normal;
          src: url("assets/fonts/eb-garamond-400.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "JetBrains Mono";
          font-weight: 100 900;
          font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2");
          font-display: block;
        }
        #root {
          --ink: #131516;
          --paper: #F7F5F0;
          --aqua: #59B8AE;
          --ink-3: #9C978D;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --font-display: "EB Garamond", Georgia, "Times New Roman", serif;
          --t-body: 32px;
          --t-label: 24px;
          --safe-top: 120px;
          --safe-bottom: 360px;
          --safe-left: 60px;
          --safe-right: 162px;

          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--ink);
          font-family: var(--font-mono);
        }
        .clip { position: absolute; inset: 0; }

        .trick-chips { top: 340px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .trick-chip {
          font-family: var(--font-mono);
          font-size: 40px;
          font-weight: 500;
          color: var(--ink);
          background: var(--aqua);
          padding: 20px 36px;
          border-radius: 12px;
          opacity: 0;
          transform: scale(0.9);
        }
        /* one aqua-family highlight per frame: the second chip is a lighter tint of
           the same family, subordinate to the first, not a second independent hit */
        .trick-chip-sub { background: rgba(89, 184, 174, 0.35); color: var(--paper); border: 2px solid var(--aqua); }

        .trick-note {
          top: 700px; left: 111px; width: 858px;
          display: flex; flex-direction: column; gap: 20px;
          font-family: var(--font-display);
          font-size: 36px;
          line-height: 1.3;
          color: var(--paper);
          text-align: center;
        }
        .trick-note-line { opacity: 0; }

        .trick-fan-capstone {
          top: 1500px; left: 0; width: 100%; text-align: center;
          font-family: var(--font-mono);
          font-size: 34px;
          font-weight: 500;
          color: var(--aqua);
          opacity: 0;
        }

        .trick-arrow { top: 900px; left: 0; width: 100%; display: flex; justify-content: center; }
        .trick-arrow-glyph { font-size: 90px; color: var(--aqua); opacity: 0; transform: scaleY(0.6); transform-origin: top center; }

        .trick-fan { top: 1140px; left: 0; width: 100%; padding: 0 162px 0 60px; display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .trick-fan-chip {
          font-family: var(--font-mono);
          font-size: 26px;
          color: var(--ink-3);
          border: 1px solid var(--ink-3);
          padding: 12px 20px;
          border-radius: 999px;
          opacity: 0;
        }
        .trick-fan-tag { top: 1040px; left: 0; width: 100%; height: 60px; text-align: center; font-size: var(--t-label); color: var(--ink-3); opacity: 0; }
      </style>

      <div data-hf-id="hf-trick-root" id="root" data-composition-id="05-the-trick" data-width="1080" data-height="1920" data-duration="20.54">
        <div data-hf-id="hf-trick-chips" id="trick-chips" class="clip trick-chips" data-start="0" data-duration="20.54">
          <div data-hf-id="hf-trick-c1" class="trick-chip" id="trick-chip-phenoxy">PHENOXYETHANOL</div>
          <div data-hf-id="hf-trick-c2" class="trick-chip trick-chip-sub" id="trick-chip-ehg">ETHYLHEXYLGLYCERIN</div>
        </div>
        <div data-hf-id="hf-trick-note" id="trick-note" class="clip trick-note" data-start="0" data-duration="20.54">
          <div data-hf-id="hf-trick-note1" class="trick-note-line" id="trick-note-1">Phenoxyethanol: an actual legal cap, ~1%.</div>
          <div data-hf-id="hf-trick-note2" class="trick-note-line" id="trick-note-2">Ethylhexylglycerin: same fractions-of-a-percent range.</div>
        </div>
        <div data-hf-id="hf-trick-arrow" id="trick-arrow" class="clip trick-arrow" data-start="0" data-duration="20.54">
          <div data-hf-id="hf-trick-arrowg" class="trick-arrow-glyph" id="trick-arrow-glyph">&#8595;</div>
        </div>
        <div data-hf-id="hf-trick-fantag" id="trick-fan-tag" class="clip trick-fan-tag" data-start="0" data-duration="20.54">EVERYTHING AFTER THIS &mdash; UNDER 1%</div>
        <div data-hf-id="hf-trick-fan" id="trick-fan" class="clip trick-fan" data-start="0" data-duration="20.54">
          <div data-hf-id="hf-trick-f1" class="trick-fan-chip" id="trick-fan-1">Camellia Sinensis Leaf Extract</div>
          <div data-hf-id="hf-trick-f2" class="trick-fan-chip" id="trick-fan-2">Panax Ginseng Root Extract</div>
          <div data-hf-id="hf-trick-f3" class="trick-fan-chip" id="trick-fan-3">Artemisia Princeps Extract</div>
          <div data-hf-id="hf-trick-f4" class="trick-fan-chip" id="trick-fan-4">Tocopherol</div>
        </div>
        <div data-hf-id="hf-trick-capstone" id="trick-fan-capstone" class="clip trick-fan-capstone" data-start="0" data-duration="20.54">&lt;1% EACH</div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // aqua highlight chips (this frame's one aqua family use — two chips, one concept)
        tl.fromTo("#trick-chip-phenoxy", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0.3);
        tl.fromTo("#trick-chip-ehg", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0.75);
        tl.to(["#trick-chip-phenoxy", "#trick-chip-ehg"], { scale: 1.04, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 3 }, 1.3);

        // Note split into its own two VO clauses (was one block sitting static 2.6->8.6,
        // a 6s freeze) so each half appears when the line is actually spoken (local
        // 5.08-8.28 and 8.33-12.33). Chip emphasis pulses tie the existing chips to the
        // same two moments instead of adding new DOM for it.
        tl.fromTo("#trick-note-1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.6);
        tl.to("#trick-chip-phenoxy", { scale: 1.08, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 5.1);
        tl.fromTo("#trick-note-2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 8.3);
        tl.to("#trick-chip-ehg", { scale: 1.08, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 8.35);
        tl.to("#trick-note", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 8.9);

        tl.fromTo("#trick-arrow-glyph", { opacity: 0, scaleY: 0.6 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: "power3.out" }, 9.2);
        tl.to("#trick-arrow-glyph", { y: 14, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 9.7);

        tl.fromTo("#trick-fan-tag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out" }, 9.6);
        const FAN = ["#trick-fan-1", "#trick-fan-2", "#trick-fan-3", "#trick-fan-4"];
        FAN.forEach((id, i) => {
          tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 9.9 + i * 0.18);
        });

        // VO local 12.33-18.94: "Once you spot them, every single ingredient listed after
        // makes up less than 1% of the bottle." Was a flat 6.4s freeze (13.3->19.7) — a
        // second emphasis pass across the fan chips plus a capstone stat fills it with
        // beats tied to the actual sentence instead of idle decoration.
        FAN.forEach((id, i) => {
          tl.to(id, { scale: 1.06, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 13.6 + i * 0.35);
        });
        tl.fromTo("#trick-fan-capstone", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 16.8);

        tl.to(["#trick-chips", "#trick-arrow", "#trick-fan", "#trick-fan-tag", "#trick-fan-capstone"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 19.7);

        tl.to({}, { duration: 20.54 }, 0);
        window.__timelines["05-the-trick"] = tl;
      </script>
    </template>
  </body>
</html>
