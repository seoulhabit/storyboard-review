<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Pilling vs. Peeling — Which One Is It?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #131516; }
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="26.000"
       data-width="1080" data-height="1920">

    <!-- Scene 1 -- hook (0.000-3.000), ink, fingertip+crumb diagram -->
    <div id="el-01-hook" class="scene" data-composition-id="01-hook"
         data-composition-src="compositions/frames/01-hook.html"
         data-start="0.000" data-duration="3.000" data-track-index="0"></div>

    <!-- Scene 2 -- split (3.000-5.400), paper, neutral bisector -->
    <div id="el-02-split" class="scene" data-composition-id="02-split"
         data-composition-src="compositions/frames/02-split.html"
         data-start="3.000" data-duration="2.400" data-track-index="1"></div>

    <!-- Scene 3 -- residue (5.400-8.600), ink, 3-band shed diagram -->
    <div id="el-03-residue" class="scene" data-composition-id="03-residue"
         data-composition-src="compositions/frames/03-residue.html"
         data-start="5.400" data-duration="3.200" data-track-index="0"></div>

    <!-- Scene 4 -- factors (8.600-11.200), paper, 3-node convergence -->
    <div id="el-04-factors" class="scene" data-composition-id="04-factors"
         data-composition-src="compositions/frames/04-factors.html"
         data-start="8.600" data-duration="2.600" data-track-index="1"></div>

    <!-- Scene 5 -- flaking (11.200-14.400), ink, BarrierWall adaptation -->
    <div id="el-05-flaking" class="scene" data-composition-id="05-flaking"
         data-composition-src="compositions/frames/05-flaking.html"
         data-start="11.200" data-duration="3.200" data-track-index="0"></div>

    <!-- Scene 6 -- clue (14.400-17.600), paper, bisector payoff + UnsourcedFlag -->
    <div id="el-06-clue" class="scene" data-composition-id="06-clue"
         data-composition-src="compositions/frames/06-clue.html"
         data-start="14.400" data-duration="3.200" data-track-index="1"></div>

    <!-- Scene 7 -- fix-pilling (17.600-20.800), ink, 3-card protocol -->
    <div id="el-07-fix-pilling" class="scene" data-composition-id="07-fix-pilling"
         data-composition-src="compositions/frames/07-fix-pilling.html"
         data-start="17.600" data-duration="3.200" data-track-index="0"></div>

    <!-- Scene 8 -- fix-peeling (20.800-23.600), paper, 3-icon reset -->
    <div id="el-08-fix-peeling" class="scene" data-composition-id="08-fix-peeling"
         data-composition-src="compositions/frames/08-fix-peeling.html"
         data-start="20.800" data-duration="2.800" data-track-index="1"></div>

    <!-- Scene 9 -- close (23.600-26.000), ink, loop-matched to scene 1 -->
    <div id="el-09-close" class="scene" data-composition-id="09-close"
         data-composition-src="compositions/frames/09-close.html"
         data-start="23.600" data-duration="2.400" data-track-index="0"></div>

    <!-- BGM: re-cut to exactly 26.0s with 200ms declick fades baked into the file.
         Envelope floor 0.15 (not 0) at both ends -- this is a hard-loop piece, and
         fading fully to silence at either boundary leaves the replay seam dead even
         when the picture matches (peeling-question-open's fix for the same issue). -->
    <audio id="bgm-track" src="assets/bgm/track.mp3" data-start="0" data-duration="26.0"
           data-track-index="11" data-volume="0.32"
           data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.15},{&quot;t&quot;:0.6,&quot;v&quot;:0.32},{&quot;t&quot;:25.4,&quot;v&quot;:0.32},{&quot;t&quot;:26.0,&quot;v&quot;:0.15}]}]}"></audio>

    <!-- SFX, one lane per cue, absolute timeline positions -->
    <audio id="sfx-crumb-01" src="assets/sfx/crumb-scatter-soft-granular-tick.mp3" data-start="0.15" data-duration="0.24"
           data-track-index="20" data-volume="0.4"></audio>
    <audio id="sfx-stamp-01" src="assets/sfx/sharp-text-stamp-impact-hit.trimmed.mp3" data-start="1.25" data-duration="1.1"
           data-track-index="21" data-volume="0.5"></audio>
    <audio id="sfx-whoosh-01-02" src="assets/sfx/whoosh-soft-question-to-headline-wipe.mp3" data-start="3.0" data-duration="1.58"
           data-track-index="22" data-volume="0.4"></audio>
    <audio id="sfx-chip-03" src="assets/sfx/click-soft-chip-pair-lands.mp3" data-start="6.9" data-duration="0.26"
           data-track-index="23" data-volume="0.35"></audio>
    <audio id="sfx-chip-05" src="assets/sfx/click-soft-chip-pair-lands.mp3" data-start="13.9" data-duration="0.26"
           data-track-index="24" data-volume="0.35"></audio>
    <audio id="sfx-clink-06" src="assets/sfx/glass-clink.mp3" data-start="15.1" data-duration="0.31"
           data-track-index="25" data-volume="0.35"></audio>
    <audio id="sfx-card1-07" src="assets/sfx/click-soft-chip-pair-lands.mp3" data-start="17.7" data-duration="0.26"
           data-track-index="26" data-volume="0.32"></audio>
    <audio id="sfx-card2-07" src="assets/sfx/click-soft-chip-pair-lands.mp3" data-start="17.95" data-duration="0.26"
           data-track-index="27" data-volume="0.32"></audio>
    <audio id="sfx-card3-07" src="assets/sfx/click-soft-chip-pair-lands.mp3" data-start="18.2" data-duration="0.26"
           data-track-index="28" data-volume="0.32"></audio>
    <audio id="sfx-chime-09" src="assets/sfx/chime.mp3" data-start="23.6" data-duration="2.5"
           data-track-index="29" data-volume="0.4"></audio>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"
          integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2"
          crossorigin="anonymous"></script>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = gsap.timeline({ paused: true });
    (function () {
      var tl = window.__timelines["main"];
      tl.to({}, { duration: 26.000 }, 0); // full-span anchor -- main.duration() == composition total
    })();
  </script>
</body>
</html>
