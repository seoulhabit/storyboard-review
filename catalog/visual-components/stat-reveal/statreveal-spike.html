  :root {

    --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
    --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
    --safe-margin: 6px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
  #root {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: var(--ink); font-family: var(--font-body);
  }
  .clip { position: absolute; inset: 0; }

  /* Spatial plan: a single flex column -- numeral zone (top) / qualifier+chip
     zone (middle) / tick-fraction zone (flex:1, bottom). The tick grid is a
     pictogram (discrete unit squares), never an axis/gridline/plotted-point
     chart -- see the parent skill's "a diagram is not a chart" rule. */
  .sr-stage {
    display: flex; flex-direction: column; height: 100%;
    padding: calc(var(--safe-top) + var(--safe-margin)) calc(var(--safe-right) + var(--safe-margin))
             calc(var(--safe-bottom) + var(--safe-margin)) calc(var(--safe-left) + var(--safe-margin));
  }
  .sr-numeral-zone { flex: 0 0 auto; padding-top: 24px; padding-bottom: 48px; }
  .sr-numeral { font-family: var(--font-display); font-weight: 400; font-size: 220px;

  .sr-meta-zone { flex: 0 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .sr-qualifier { font-family: var(--font-mono); font-weight: 500; font-size: 40px;

  .sr-chip { align-self: flex-start; font-family: var(--font-mono); font-size: 32px;
             letter-spacing: 0.04em; color: rgba(247,245,240,0.85);
             border: 1.5px solid rgba(247,245,240,0.35); border-radius: 999px;
             padding: 8px 20px; opacity: 0; }
  .sr-tick-zone { flex: 1 1 auto; display: flex; align-items: flex-end; justify-content: center;
                  padding-bottom: 8px; }
  .sr-tick-wrap { display: flex; flex-direction: column; align-items: center; }
  .sr-tick { fill: rgba(247,245,240,0.14); }
  .sr-tick-caption { font-family: var(--font-mono); font-size: 26px; letter-spacing: 0.06em;
                      color: var(--ink-3); text-align: center; margin-top: 16px; }

  .debug-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: rgba(19,21,22,.92); color: var(--paper); font-family: ui-monospace, monospace; font-size: 13px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }

  .debug-bar button { font-family: inherit; font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid #9C978D; background: transparent; color: var(--paper); cursor: pointer; }

<script>
(function () {
  // Field contract -- swap this object per use. `percent` drives the numeral
  // count-up AND the tick-fraction (percent of 100 ticks lit, so it only reads
  // cleanly for a percentage out of a rounded base -- for a raw count instead
  // of a percent, light `tickLit` ticks directly and skip the count-up-to-percent
  // coupling). Generalized sample data below -- not the source video's real
  // content (see catalog contribution convention).
  var DATA = {
    percent: 58,
    qualifier: "of 300 survey respondents",
    citation: "Consumer Study · 2024",
    tickCaption: "58 OF 100 RESPONDENTS"
  };

  document.getElementById("sr-qualifier").textContent = DATA.qualifier;
  document.getElementById("sr-chip").textContent = DATA.citation;
  document.getElementById("sr-tick-caption").textContent = DATA.tickCaption;

  var TOTAL = 4.0;
  var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

  // t0.0-0.6: numeral counts up 0 -> DATA.percent, a pure function of tween progress.
  var counter = { v: 0 };
  var numeralEl = document.getElementById('sr-numeral');
  tl.to(counter, {
    v: DATA.percent, duration: 0.6, ease: "power2.out",
    onUpdate: function () { numeralEl.textContent = Math.round(counter.v) + '%'; }
  }, 0);

  tl.to('#sr-qualifier', { opacity: 1, duration: 0.32 }, 1.1);
  tl.to('#sr-chip', { opacity: 1, duration: 0.3 }, 1.9);

  // t2.6-4.0: tick grid lights DATA.percent of 100 units in reading order --
  // the continuous back-half motion. Deterministic stagger, not a loop/rAF.
  var order = [];
  for (var i = 0; i < DATA.percent; i++) { order.push('#sr-tick' + i); }
  tl.to(order, { fill: '#59B8AE', duration: 0.05, stagger: (1.3 / Math.max(DATA.percent, 1)) }, 2.6);

  tl.to({}, { duration: TOTAL }, 0);

  function renderFrame(t) { if (t === 0) tl.progress(0); else tl.time(t); }
  window.renderFrame = renderFrame;
  window.__statRevealTimeline = tl;
  renderFrame(0);

  if (/[?&]debug=1\b/.test(location.search)) {
    var bar = document.createElement("div");
    bar.className = "debug-bar";
    bar.innerHTML = '<button id="dbg-0">t=0</button><input id="dbg-range" type="range" min="0" max="' +
      tl.duration() + '" step="0.01" value="0"><button id="dbg-end">t=end</button><span id="dbg-t">0.00</span>';
    document.body.appendChild(bar);
    var range = bar.querySelector("#dbg-range"), label = bar.querySelector("#dbg-t");
    range.addEventListener("input", function () { renderFrame(parseFloat(range.value)); label.textContent = parseFloat(range.value).toFixed(2); });
    bar.querySelector("#dbg-0").addEventListener("click", function () { range.value = 0; renderFrame(0); label.textContent = "0.00"; });
    bar.querySelector("#dbg-end").addEventListener("click", function () { var d = tl.duration(); range.value = d; renderFrame(d); label.textContent = d.toFixed(2); });
  }
})();
</script>
