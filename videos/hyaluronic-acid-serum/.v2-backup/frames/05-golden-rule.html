    (function () {

      window.__timelines = window.__timelines || {};

      /* ================= Scene 1 (0.0-2.0s) =================

        "#fr05-opener-inner",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power2.out" },
        0,

      /* three fixed aqua mist-fan strokes at the nozzle tip self-draw in a tight stagger */
      tl.to("#fr05-mist-fan-a", { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 0.4);
      tl.to("#fr05-mist-fan-b", { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 0.52);

      var MIST_ENTRY_AT = 0.55;
      var MIST_STAGGER = 0.25;
      var MIST_DROP_DUR = 0.5;

        var tx = Number(el.dataset.targetX);
        var ty = Number(el.dataset.targetY);
        var start = MIST_ENTRY_AT + i * MIST_STAGGER;
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.7, opacity: 0 },
          { x: tx, y: ty, scale: 0.85, duration: MIST_DROP_DUR, ease: "power2.out" },
          start,
        );
        tl.to(el, { opacity: 1, duration: 0.12, ease: "power1.out" }, start);
        tl.to(el, { opacity: 0, duration: 0.25, ease: "power1.in" }, start + MIST_DROP_DUR - 0.25);
      });

         The spray-bottle-and-face group clears/shrinks aside as the split-tilt-cards

      tl.to(
        ".fr05-card-left",
        { y: -6, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 4 },
        2.9,
      );
      tl.to(
        ".fr05-card-right",
        { y: 6, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 4 },

         "Apply it to damp skin, not dry" — RIGHT panel resolves. Spring-pop-entrance's

      window.__timelines["05-golden-rule"] = tl;
