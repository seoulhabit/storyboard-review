<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Source">
  <!-- Semantic icon family: shared geometry (ring + centered glyph + one accent),
       inherits the brand mark's circular-field grammar without repeating the
       mark itself. Ring/glyph use currentColor so scene context sets ink vs.
       paper; exactly one fixed accent color per icon for restrained warmth. -->
