<script>

  // Deterministic seeded strand field — ported verbatim from madecassoside-flat-matrix

  // (ink here, not red — this cut carries no dark/damaged-red register at all).
  function lcg(seed) { var s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  var rnd = lcg(20260829);
  var NS = 'http://www.w3.org/2000/svg';
  var knot = document.getElementById('st-knot');
  var strands = [];
  var CX = 320, CY = 280;
  for (var i = 0; i < 14; i++) {
    var a0 = rnd() * Math.PI * 2, a1 = rnd() * Math.PI * 2, a2 = rnd() * Math.PI * 2;
    var r0 = 26 + rnd() * 64, r1 = 20 + rnd() * 70, r2 = 24 + rnd() * 60;
    var x0 = CX + Math.cos(a0) * r0, y0 = CY + Math.sin(a0) * r0 * 0.8;
    var x1 = CX + Math.cos(a1) * (r1 + 40), y1 = CY + Math.sin(a1) * r1;
    var x2 = CX + Math.cos(a2) * r2, y2 = CY + Math.sin(a2) * r2 * 0.85;
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M' + x0.toFixed(1) + ',' + y0.toFixed(1) +
      ' Q' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' ' + x2.toFixed(1) + ',' + y2.toFixed(1));
    p.setAttribute('stroke', i % 3 === 0 ? '#131516' : 'rgba(19,21,22,0.55)');
    p.setAttribute('stroke-width', (2.6 + rnd() * 1.6).toFixed(1));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke-linecap', 'round');
    knot.appendChild(p);
    var ea = rnd() * Math.PI * 2;
    strands.push({ el: p, fx: Math.cos(ea) * 420, fy: Math.sin(ea) * 420 - 160 });
  }

  var field = document.getElementById('st-field');
  var surfL = document.getElementById('st-surface-l');
  var surfR = document.getElementById('st-surface-r');
  var tearL = document.getElementById('st-tear-l');
  var tearR = document.getElementById('st-tear-r');
  var kicker = document.getElementById('st-kicker');
  var caption = document.getElementById('st-caption');
  var card = document.getElementById('st-card');
  var knotG = document.getElementById('st-knot');
  var tick = document.getElementById('st-margin-tick');

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  // Local VO cues (real take): tears-end@1.23 · panics@3.30-3.81 · dumps@4.90-5.38 ·
  // chaotic@5.53-5.93 · collagen@6.72-7.00 · hole@7.85-8.24.
  gsap.set(knotG, { scale: 1.3, svgOrigin: '320 280' });

  // "tears": the surface splits — the wound margin tick lands with it (this frame's one aqua use).
  tl.to(surfL, { x: -34, duration: 0.4, ease: 'power2.out' }, 0.87);
  tl.to(surfR, { x: 34, duration: 0.4, ease: 'power2.out' }, 0.87);
  tl.to(tearL, { x: -34, duration: 0.4, ease: 'power2.out' }, 0.87);
  tl.to(tearR, { x: 34, duration: 0.4, ease: 'power2.out' }, 0.87);
  tl.to([tearL, tearR], { opacity: 1, duration: 0.3 }, 0.95);
  tl.to(tick, { opacity: 1, duration: 0.35 }, 0.95);

  // "panics": kicker lands, one bounded stage shudder (a slow, precise micro-jitter, not chaos-fast),
  // and a sharp coral alert mark pulses once on the tear — restrained color, not a glow.
  tl.to(kicker, { opacity: 1, duration: 0.35 }, 3.30);
  var alert = document.getElementById('st-alert');
  gsap.set(alert, { scale: 0.6, transformOrigin: '304px 260px' });
  tl.to(alert, { opacity: 1, scale: 1.3, duration: 0.22, ease: 'power2.out' }, 3.30);
  tl.to(alert, { opacity: 0, scale: 1.0, duration: 0.5, ease: 'power2.in' }, 3.60);
  (function () {
    var j = { p: 0 };
    tl.to(j, { p: Math.PI * 3, duration: 0.5, ease: 'none', onUpdate: function () {
      gsap.set(field, { x: Math.sin(j.p) * 3 });
    } }, 3.30);
    tl.set(field, { x: 0 }, 3.80);
  })();

  // "dumps ... chaotic unorganized collagen": strands pour in, staggered — slow and deliberate,
  // never frantic; the disorder reads through un-aligned rest positions, not tempo.
  strands.forEach(function (s, i) {
    var t0 = 4.90 + i * 0.14;
    tl.fromTo(s.el, { x: s.fx, y: s.fy, opacity: 0 },
      { x: 0, y: 0, opacity: 1, duration: 0.6, ease: 'power2.out' }, t0);

    // once landed, a small bounded restless wobble — this is what "actively tangling" means
    // here: tension in the rest state, not speed. Index-derived phase/rate (not a fresh LCG
    // draw) so the shared strand-generation sequence stays aligned with the other beats.
    var wobStart = t0 + 0.6;
    var wobDur = 9.600 - wobStart;
    if (wobDur > 0.3) {
      var phase = i * 1.31;
      var freq = 1.5 + (i % 4) * 0.3;
      var amp = 1.6 + (i % 3) * 0.3;
      var w = { p: 0 };
      tl.to(w, { p: wobDur, duration: wobDur, ease: 'none', onUpdate: function () {
        gsap.set(s.el, { x: Math.sin(w.p * freq + phase) * amp, y: Math.cos(w.p * freq * 0.7 + phase) * amp * 0.6 });
      } }, wobStart);
    }
  });
  tl.fromTo(caption, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45 }, 5.53);

  // "plug the hole": the knot settles fully into place; surface edges ease back together.
  tl.to(knotG, { y: -20, duration: 0.85, ease: 'power2.inOut' }, 7.22);
  tl.to([surfL, surfR], { x: 0, duration: 0.9, ease: 'power2.inOut' }, 7.30);

  // claim card
  tl.fromTo(card, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6 }, 6.30);

})();
