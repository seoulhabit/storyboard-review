<script>
  (function () {
    // ---- SVG self-draw setup (measured, not guessed) ----
    var drawIds = ["htu-droplet1", "htu-skinline1", "htu-seal-arc"];
    drawIds.forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      var len = el.getTotalLength();
      el.style.strokeDasharray = String(len);
      el.style.strokeDashoffset = String(len);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    var SHELL = "#b9835a";
    var CREAM2 = "#e8efdd";

    // ---- t=0 baselines (GSAP-driven hidden states, not CSS-hidden) ----
    tl.set("#htu-badge-1", { opacity: 0, scale: 0.8, transformOrigin: "0% 50%" }, 0);
    tl.set(["#htu-fleck-a", "#htu-fleck-b"], { opacity: 0 }, 0);
    tl.set("#htu-label-1 .htu-word", { opacity: 0, y: 44 }, 0);
    tl.set("#htu-step-2", { opacity: 0, x: 0 }, 0);
    tl.set("#htu-step-3", { opacity: 0, x: 0 }, 0);
    tl.set(".htu-ripple", { opacity: 0, scale: 0.35, transformOrigin: "150px 150px" }, 0);
    tl.set("#htu-label-3", { opacity: 0 }, 0);
    tl.set("#htu-topbar-label", { opacity: 0, y: -16 }, 0);
    tl.set(".htu-dot", { backgroundColor: CREAM2 }, 0);

    // ---- Scene 1 (0.0-0.7262s): stage establishes ----
    tl.fromTo("#htu-bg", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
    tl.fromTo(
      "#htu-card",
      { opacity: 0, scale: 0.94 },
      { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out", transformOrigin: "50% 50%" },
      0.05
    );
    tl.to("#htu-topbar-label", { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.05);
    tl.fromTo(
      ".htu-dot",
      { opacity: 0, scale: 0.6 },
      { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.7)", stagger: 0.05, transformOrigin: "50% 50%" },
      0.2
    );

    // ---- Scene 2 (0.7262-2.9048s): step 01 populates, per-word label reveal ----
    var STEP1_START = 0.7262;
    tl.to("#htu-badge-1", { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" }, STEP1_START);
    tl.to("#htu-dot-1", { backgroundColor: SHELL, duration: 0.25, ease: "power2.out" }, STEP1_START);

    var droplet1Start = STEP1_START + 0.12; // 0.8462
    tl.to("#htu-droplet1", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, droplet1Start);
    var skinlineStart = droplet1Start + 0.55 * 0.75; // ~1.259
    tl.to("#htu-skinline1", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, skinlineStart);
    var fleckStart = skinlineStart + 0.4; // ~1.659
    tl.to(["#htu-fleck-a", "#htu-fleck-b"], { opacity: 1, duration: 0.2, ease: "power1.out", stagger: 0.08 }, fleckStart);

    // per-word waterfall entry for the label — binary opacity flip (tl.set) at the
    // instant each word's whip-in begins, then the offset tweens to rest (never fade)
    var words1 = document.querySelectorAll("#htu-label-1 .htu-word");
    var w1t = 1.75;
    var wordGap = 0.133;
    words1.forEach(function (w, i) {
      var start = w1t + i * wordGap;
      tl.set(w, { opacity: 1 }, start);
      tl.to(w, { y: 0, duration: 0.16, ease: "power4.out" }, start);
    });

    // ---- Seam 1 (cut-the-curve, leftward) — step 01 clears, step 02 lands ----
    var SEAM1 = 2.9048;
    var exit1Start = SEAM1 - 0.34;
    tl.to("#htu-step-1", { x: -230, duration: 0.34, ease: "power4.in" }, exit1Start);
    tl.to("#htu-step-1", { opacity: 0, duration: 0.22, ease: "power1.in" }, exit1Start);
    tl.set("#htu-step-1", { opacity: 0 }, SEAM1);
    tl.set("#htu-step-2", { x: 230, opacity: 0.35 }, SEAM1);
    tl.to("#htu-step-2", { x: 0, duration: 0.4, ease: "power4.out" }, SEAM1);
    tl.to("#htu-step-2", { opacity: 1, duration: 0.3, ease: "power1.out" }, SEAM1);
    tl.to("#htu-dot-2", { backgroundColor: SHELL, duration: 0.25, ease: "power2.out" }, SEAM1);

    // ---- Scene 3 (2.9048-5.0834s): step 02 — two ripple pulses ("pat, pat") ----
    var pulse1 = 3.5;
    var pulse2 = 4.05;
    [pulse1, pulse2].forEach(function (start) {
      tl.set(".htu-ripple", { opacity: 0.85, scale: 0.35 }, start);
      tl.to(".htu-ripple", { opacity: 0, scale: 1.15, duration: 0.55, ease: "power1.out", stagger: 0.06 }, start);
    });

    // ---- Seam 2 (cut-the-curve, leftward) — step 02 clears, step 03 lands ----
    var SEAM2 = 5.0834;
    var exit2Start = SEAM2 - 0.34;
    tl.to("#htu-step-2", { x: -230, duration: 0.34, ease: "power4.in" }, exit2Start);
    tl.to("#htu-step-2", { opacity: 0, duration: 0.22, ease: "power1.in" }, exit2Start);
    tl.set("#htu-step-2", { opacity: 0 }, SEAM2);
    tl.set("#htu-step-3", { x: 230, opacity: 0.35 }, SEAM2);
    tl.to("#htu-step-3", { x: 0, duration: 0.4, ease: "power4.out" }, SEAM2);
    tl.to("#htu-step-3", { opacity: 1, duration: 0.3, ease: "power1.out" }, SEAM2);
    tl.to("#htu-dot-3", { backgroundColor: SHELL, duration: 0.25, ease: "power2.out" }, SEAM2);

    // ---- Scene 4 (5.0834-7.262s): step 03 — sealing arc draws, label confirms, settles ----
    var arcStart = SEAM2 + 0.47; // 5.5534
    tl.to("#htu-seal-arc", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, arcStart);
    var label3Start = arcStart + 0.6; // 6.1534
    tl.to("#htu-label-3", { opacity: 1, duration: 0.3, ease: "power1.out" }, label3Start);
    // holds settled to the end of the frame — no exit tween (not the final frame in the video)

    window.__timelines["05-how-to-use"] = tl;
  })();
</script>
