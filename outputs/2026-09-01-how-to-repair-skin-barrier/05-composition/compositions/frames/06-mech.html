<template>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@500;700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  #root{
    --ink:#131516; --paper:#F7F5F0; --ground:#101314; --card:#FBF9F5;
    --aqua:#59B8AE; --coral:#C97A5C; --celadon:#93B896;
    --muted:rgba(247,245,240,.62); --line-dark:rgba(247,245,240,.14); --line:rgba(19,21,22,.12);
    --ink-faint:rgba(19,21,22,.62);
    --safe-t:192px; --safe-b:384px; --safe-r:162px; --safe-l:72px;
    --display:'EB Garamond',Georgia,serif; --body:'Inter','Noto Sans KR',system-ui,sans-serif;
    position:relative;width:1080px;height:1920px;overflow:hidden;
    background:var(--ground);font-family:var(--body);
  }
  .clip{position:absolute;inset:0}
  .stage{padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
         display:flex;flex-direction:column;justify-content:center}
  /* The channel's display face. Serif, 400 — not a bold sans. */
  .display{font-family:var(--display);font-weight:400;line-height:1.08;
           letter-spacing:-.015em;color:var(--paper);margin:0}
  .d-xl{font-size:132px} .d-lg{font-size:104px} .d-md{font-size:78px}
  .label{font-weight:700;text-transform:uppercase;letter-spacing:.08em;
         font-size:32px;color:var(--muted)}
  .label-aqua{color:var(--aqua)}
  .body{font-weight:500;line-height:1.4;font-size:46px;color:var(--paper)}
  .rule{height:2px;background:var(--aqua);transform-origin:0 50%;width:100%}
  .flag{font-weight:500;font-size:34px;letter-spacing:.04em;color:var(--muted)}
  .cite{font-weight:700;font-size:32px;letter-spacing:.10em;text-transform:uppercase;color:var(--aqua)}
  /* uc-card — position:absolute on the rule is REQUIRED (PDRN Round-4 bug class) */
  .uc-card{position:absolute;background:var(--card);border:1px solid var(--line);
           border-radius:28px;box-shadow:0 24px 64px rgba(0,0,0,.34)}

  .citewrap{display:inline-block}
  .citerule{height:2px;background:var(--aqua);margin-top:12px;opacity:.75}

  .bar{display:grid;grid-template-columns:180px 1fr;align-items:center;gap:26px}
  .bar .bl{font-size:38px;font-weight:700;color:var(--paper);letter-spacing:.02em}
  .bar .tr{display:block;height:26px;background:rgba(247,245,240,.09);border-radius:4px;overflow:hidden}
  .bar .tr i{display:block;height:100%;background:var(--aqua);transform-origin:0 50%;border-radius:4px}
</style>

<div id="root" data-composition-id="mech" data-width="1080" data-height="1920"
     data-duration="7.999">
  <div class="clip stage">
    <div class="citewrap">
      <div class="cite" id="me-cite">PMID 35328954 · 4-TRIAL REVIEW</div>
      <div class="citerule" id="me-citerule"></div>
    </div>
    <h2 class="display d-md" id="me-h" style="margin-top:26px">A four-trial review reports<br>an anti-inflammatory effect.</h2>

      <div class="bar" id="bar-1"><span class="bl">IL-1β</span><span class="tr"><i></i></span></div>
      <div class="bar" id="bar-2"><span class="bl">IL-6</span><span class="tr"><i></i></span></div>
      <div class="bar" id="bar-3"><span class="bl">TNF-α</span><span class="tr"><i></i></span></div>
    </div>
    <div class="label" id="me-scope" style="margin-top:44px">IN WOUND HEALING — NOT A BARRIER STUDY</div>
  </div>
</div>
<script>
(function(){
  var tl = gsap.timeline({ paused:true, defaults:{ ease:"power3.out" } });
  gsap.set("#me-h",{opacity:0,y:18});
  gsap.set("#me-scope",{opacity:0});
  gsap.set(["#bar-1","#bar-2","#bar-3"],{opacity:0});
  tl.to("#me-h",{opacity:1,y:0,duration:.45},0.50);
  // each cytokine bar draws full, then RETRACTS — the reduction is the motion
  tl.to("#bar-1",{opacity:1,duration:.3},1.55);
  tl.fromTo("#bar-1 i",{scaleX:1},{scaleX:.38,duration:.85,ease:"power2.inOut",immediateRender:false},1.85);
  tl.to("#bar-2",{opacity:1,duration:.3},2.85);
  tl.fromTo("#bar-2 i",{scaleX:1},{scaleX:.44,duration:.85,ease:"power2.inOut",immediateRender:false},3.15);
  tl.to("#bar-3",{opacity:1,duration:.3},4.15);
  tl.fromTo("#bar-3 i",{scaleX:1},{scaleX:.31,duration:.85,ease:"power2.inOut",immediateRender:false},4.45);
  tl.to("#me-scope",{opacity:1,duration:.45},5.75);
  // transform-only (see 01-hook): the citation underlines itself.
  gsap.set("#me-citerule",{scaleX:0,transformOrigin:"0 50%"});
  tl.to("#me-citerule",{scaleX:1,duration:1.05,ease:"power2.inOut"},6.55);
  tl.to({},{duration:7.999},0);
  window.__timelines = window.__timelines || {};
  window.__timelines["mech"] = tl;
})();
</script>
</template>
