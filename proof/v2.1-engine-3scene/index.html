<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
<head>
  <meta charset="UTF-8">
  <title>proof-3scene</title>
  <style>
    /* Mandatory rule: border-box reset first, every composition.
       The shipped blank template carries this same reset
       (templates/blank/index.html). An explicit height plus padding under the
       CSS default renders LARGER than declared and pushes bottom-anchored
       content out of the safe zone. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { width: 1080px; height: 1920px; overflow: hidden; background: #101314; }
    .scene { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <!-- GENERATED from 03-beat-sheet.json by scripts/beats_to_composition.py.
       Do not hand-edit timing here; edit the beat sheet and re-run. -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="9.000"
       data-width="1080" data-height="1920">

    <div class="scene clip" id="scene-s01" data-composition-id="s01"
         data-composition-src="compositions/frames/01-s01.html"
         data-start="0.000" data-duration="3.000"
         data-track-index="0"></div>
    <div class="scene clip" id="scene-s02" data-composition-id="s02"
         data-composition-src="compositions/frames/02-s02.html"
         data-start="3.000" data-duration="3.000"
         data-track-index="1"></div>
    <div class="scene clip" id="scene-s03" data-composition-id="s03"
         data-composition-src="compositions/frames/03-s03.html"
         data-start="6.000" data-duration="3.000"
         data-track-index="0"></div>
  </div>

  <!-- GSAP from CDN is the shipped template's own pattern
       (templates/blank/index.html loads gsap from jsdelivr). -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    // The root timeline's only job is scene handoff; each sub-composition owns
    // its own beats. docs/gsap.md: paused, registered on window.__timelines.
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 9.000 }, 0);   // anchor: tl.duration() === root duration
    window.__timelines['main'] = tl;
  </script>
</body>
</html>
