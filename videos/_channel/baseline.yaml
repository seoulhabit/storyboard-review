# Channel baseline — measured numbers, rewritten by S0 and S9.
#
# Migrated 2026-09-03 from the v2 skill's references/channel-baseline.md, which
# was removed when faceless-video-craft moved to its standalone repo. Every
# measured value below is carried over unchanged; only the layout was re-ordered
# onto assets/channel-baseline.template.yaml. Per SKILL.md §Paths this file is
# the channel's own state and lives in the project repo, never inside the skill.
#
# The longer-form provenance — the 2026-09-02 reconciliation and the
# "read before trusting any field" notes — is preserved beside this file in
# baseline-notes.md. Read it before relying on any field marked CAVEAT.
#
# Rules for editing (from the shipped template):
# - Only S0 (full refresh) and S9 (`[S9/L-2]` write-back) write here.
# - A field a call could not fill stays `null` and the ledger records
#   `not available via vidIQ` — never a guessed number.
# - `overrides` is append-only; it is the audit trail of every rule that changed.

populated: true
updated: 2026-09-03             # S0 refresh; prior state 2026-09-01, preserved below
channel:
  id: UCzqEGQ9uAU43AgyxGtLT7MA
  handle: SeoulHabit
  subs: 8                       # channel created 2026-07-07
  # --- 2026-09-03 S0 refresh (vidiq_channel_stats) ---
  views_total: 2834             # was 2,693 on 2026-09-01
  videos_public: 17             # was 14. Volatile: 24 on 08-22, 0 on 08-25, 17 today.
                                # `corpus.public: 14` below is the 09-01 figure the
                                # medians in that block were computed over — do NOT
                                # re-read it as current.
  authenticated_as: hello@seoulhabit.com

# --- Not in the shipped template, kept deliberately -------------------------
# `corpus` and `views` are absent from the template's field list. They are kept
# because `curve.ratio_method` below cites `views.*` by name, and because the
# public/private split is what makes every median in this file readable at all.
corpus:                         # merged from the root analysis doc, 2026-09-02
  uploads_total: 48
  shorts: 46
  long: 2                       # a 34s clip and a 48s ex-livestream, BOTH private
  public: 14                    # the only uploads carrying a distribution signal
  unlisted: 1
  private: 33
  # Private/unlisted view counts reflect no algorithmic delivery and must never be
  # ranked against public ones.
  shorts_over_50s: 21           # of 46 — v1 SKILL.md's "14 of 23" is stale on both terms
views:
  # TWO SOURCES, NOT INTERCHANGEABLE. Never build a ratio with a numerator from one
  # and a denominator from the other — see curve.ratio_method below.
  public_median: 58             # n=14, vidiq_video_stats (lifetime public counts)
  public_median_ex_outliers: 45 # n=12, excluding the two >1,000-view videos
  public_mean: 211.8            # 3.6x the median — DO NOT USE on this corpus

formats:                        # window 2026-06-03..2026-09-01 (covers ALL uploads)
  long:  { uploads_90d: 2,  median_views_per_upload: null }   # both private; no public long-form
  short: { uploads_90d: 46, median_views_per_upload: 58 }     # median over the 14 PUBLIC shorts
traffic:                        # share of views, last 90 d, n=4756 views — [S0/B-3]
  shorts_feed: 0.881            # 88.1% of all views; the four-slot schema had no room
  browse: 0.925                 # SHORTS feed 88.1% + YT_CHANNEL 3.8% + YT_OTHER_PAGE 0.5%
  suggested: 0.0025             # RELATED_VIDEO
  search: 0.042                 # YT_SEARCH
  external: 0.015               # EXT_URL
  # --- 2026-09-03 S0 refresh: [S0/B-3] verbatim labels -----------------------
  # B-3 requires EVERY source recorded with ITS OWN label. The four slots above
  # are a lossy roll-up kept for rules that read them; these are what YouTube
  # actually returned (2026-06-05..2026-09-03, n=4756). Note there is NO browse
  # row and NO suggested row at all: `browse: 0.925` above is a CONSTRUCTED sum,
  # not a measurement, and `suggested` is RELATED_VIDEO standing in for a slot
  # YouTube never filled.
  other:
    SHORTS: 0.8814                # 4192
    YT_SEARCH: 0.0416             # 198
    YT_CHANNEL: 0.0383            # 182
    EXT_URL: 0.0154               # 73
    SUBSCRIBER: 0.0067            # 32
    PLAYLIST: 0.0055              # 26
    YT_OTHER_PAGE: 0.0053         # 25
    NO_LINK_OTHER: 0.0029         # 14
    RELATED_VIDEO: 0.0025         # 12
    SHORTS_CONTENT_LINKS: 0.0004  # 2
curve:                          # vidiq_channel_performance_trends — SHORTS, not long-form
                                # built from PUBLIC view counts, same family as
                                # vidiq_video_stats — NOT from channel_analytics
  p50_24h: 9.5
  p50_48h: 15.5
  perc30_48h: 7                 # noise-floor band, lower bound
  perc70_48h: 31.5              # was mis-named p75_48h; the tool returns perc70
  p50_7d: 25
  p50_28d: 28
  sample_n: 8                   # uploads the percentiles were computed from
  full:                         # merged from the root analysis doc, 2026-09-02
    #  age    p30   median   p70
    - [  "1h", 0.1,   1,      1  ]
    - [  "2h", 1.1,   2,      2.9]
    - [  "6h", 3.0,   6,      8  ]
    - [ "12h", 5.0,   6.5,   10.5]
    - [ "24h", 6.5,   9.5,   18.5]
    - [ "48h", 7.0,  15.5,   31.5]
    - [ "72h", 7.0,  21,     39.5]
    - [  "7d", 7.0,  25,     64.5]
    - [ "28d", 8.5,  28,    109  ]
  max_28d: 389                  # neither 1,000+ video is in the curve's own sample
  ratio_method: age-matched     # views ÷ the channel median AT THAT VIDEO'S AGE, not
                                # ÷ a fixed p50_7d. A fixed denominator understates a
                                # young video and overstates an old one; on d6DPiORuPO4
                                # the two methods give 0.82 vs 0.28. Use age-matched,
                                # and take the numerator from vidiq_video_stats so it
                                # matches the curve's own source.
retention:
  avg_view_pct_long: 43.07      # n=2, both private — not usable
  avg_view_pct_short: 61.28     # per-video median, n=34
  avg_view_pct_short_weighted: 38.26   # view-weighted, from the SHORTS traffic row
  avg_view_pct_median_per_video: 61.28
  median_duration_top_quartile_avp_s: 19      # LOGGED, NOT USED — see baseline-notes.md
  median_duration_top_quartile_curve_s: 49.0  # [S1/S-2] short target. COMPUTED 2026-09-02
                                              # from the root analysis doc's age-matched
                                              # ratios: top quartile is 4 of 14 public
                                              # (2NGeQYjsR7Y 56s, D4e2xnNQm1M 42s,
                                              # Yc1hH5Bz4t8 42s, cGbokt_B_vE 116s),
                                              # median 49.0s — INSIDE the 30-58s clamp,
                                              # so no baseline-below-clamp fires.
                                              # CAVEAT: the quartile holds 4 videos, below
                                              # [S9/L-2]'s "≥ 8 in the quartile calc" bar
                                              # for replacing a [default]. Treat as
                                              # provisional; it is still measured, where
                                              # the 45s it replaces was not.
  replay_inflated_share: 0.176                # 6 of 34 shorts score >100% avg-view-%; max 603.86%
  first_drop_s: null            # audience_retention returns zero rows for this channel.
                                # This blocks the CURVE only. Per-video averageViewPercentage
                                # IS retrievable via channel_analytics(report=top_videos) —
                                # see baseline-notes.md before recording retention
                                # as unavailable anywhere.
  section_curve:
    top:    []                  # not available via vidIQ
    bottom: []                  # not available via vidIQ
  # --- 2026-09-03 S0 refresh (report=top_videos + explicit averageViewPercentage,
  #     365 d window, n=39 vs the 09-01 n=34). Recorded ALONGSIDE the 09-01
  #     figures rather than replacing them: the windows and n differ, and the
  #     older ones are what `corpus`/`views` above were computed against.
  refresh_2026_09_03:
    n_videos: 39
    avg_view_pct_median: 48.81        # vs 61.28 at n=34 on 09-01
    median_views: 34.0
    replay_inflated_share: 0.154      # same 6 videos over a larger denominator (was 6/34)
    median_duration_top_quartile_curve_s_FIXED_DENOM: 39.8
    # ^ RECOMPUTED WITH THE SUPERSEDED METHOD, FOR CROSS-CHECK ONLY. It divides by
    #   a fixed curve.p50_7d; `curve.ratio_method: age-matched` above says that is
    #   wrong and baseline-notes.md §Correction 3 explains why. The live field
    #   `median_duration_top_quartile_curve_s: 49.0` stands unchanged.
    # Independent reproduction of [S1/S-2]'s own stated reasoning: ranking the
    # quartile by avg-view-% instead gives 18.9 s here, against the 19 s the rule
    # records — below the rule's own 30 s clamp floor, on fresh data, exactly as
    # the rule predicts. The avp path stays forbidden for shorts.
packaging:
  median_ctr: null              # not available via vidIQ (Studio only)
  title_scorer_discriminative: false      # [S3/P-1] — ranked the failing title above every
