<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: "Bricolage Grotesque";
    font-style: normal;
    font-weight: 500;
    src: url("../assets/fonts/bricolage-grotesque-500.woff2") format("woff2");
  }
  @font-face {
    font-family: "JetBrains Mono";
    font-style: normal;
    font-weight: 100 800;
    src: url("../assets/fonts/jetbrains-mono-500.woff2") format("woff2");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0f2016; }
  #root {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: "Bricolage Grotesque", sans-serif;
    --ink-dark: #0f2016;
    --shell: #b9835a;
    --pearl: #fbfaf4;
    --sage-pale: #cddfb9;
  }
  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: contrast(1.08) brightness(0.98);
  }
  .scrim-bottom {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 1180px;
    background: linear-gradient(to top, rgba(15,32,22,0.97) 0%, rgba(15,32,22,0.86) 38%, rgba(15,32,22,0.35) 72%, rgba(15,32,22,0) 100%);
  }
  .scrim-top {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 420px;
    background: linear-gradient(to bottom, rgba(15,32,22,0.55) 0%, rgba(15,32,22,0) 100%);
  }
  .content {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .kicker {
    display: inline-flex;
    align-items: center;
    padding: 18px 34px;
    border-radius: 999px;
    background: var(--shell);
    box-shadow: 0 0 30px rgba(185, 131, 90, 0.5);
    margin-bottom: 44px;
  }
  .kicker span {
    font-family: "JetBrains Mono", monospace;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--pearl);
  }
  .headline {
    font-weight: 500;
    font-size: 132px;
    line-height: 1.0;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--pearl);
    text-shadow: 0 0 40px rgba(251, 250, 244, 0.4), 0 8px 30px rgba(0,0,0,0.6);
  }
  .subline {
    margin-top: 36px;
    font-family: "JetBrains Mono", monospace;
    font-weight: 500;
    font-size: 32px;
    letter-spacing: 0.06em;
    color: var(--sage-pale);
  }
</style>
</head>
<body>
  <div id="root">
    <img class="photo" src="../public/01a-archival-lab.png" alt="">
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>
    <div class="content">
      <div class="kicker"><span>1960s &middot; Spain</span></div>
      <div class="headline">The<br>Skincare<br>Accident</div>
      <div class="subline">the real origin of snail mucin</div>
    </div>
  </div>
</body>
</html>
