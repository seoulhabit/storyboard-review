<script>
(function () {
  // ---- deterministic coil geometry (pure math, fixed constants) ----
  // Coils thread the gaps BETWEEN the rod rows — scaffold layering, not scatter.
  var COILS = [
    { el: 'mtx-coil-0', x: 70,  y: 218, deg: 2,  loops: 5, adv: 64, R: 15, dots: [1, 2, 4] },
    { el: 'mtx-coil-1', x: 408, y: 222, deg: -2, loops: 4, adv: 64, R: 15, dots: [1, 2, 3] },
    { el: 'mtx-coil-2', x: 205, y: 372, deg: 1,  loops: 6, adv: 64, R: 15, dots: [1, 3, 5] }
  ];
  function coilD(c) {
    var th = c.deg * Math.PI / 180, ct = Math.cos(th), st = Math.sin(th);
    var A = c.adv / (2 * Math.PI), T1 = c.loops * 2 * Math.PI + 1.35, d = '';
    for (var t = -1.35; t <= T1; t += 0.12) {
      var lx = A * t + c.R * Math.sin(t), ly = -c.R * Math.cos(t);
      d += (d ? ' L ' : 'M ') + (c.x + lx * ct - ly * st).toFixed(1) + ' ' + (c.y + lx * st + ly * ct).toFixed(1);
    }
    return d;
  }
  function apex(c, k) {
    var th = c.deg * Math.PI / 180, lx = c.adv * k;
    return { x: c.x + lx * Math.cos(th) + c.R * Math.sin(th),
             y: c.y + lx * Math.sin(th) - c.R * Math.cos(th) };
  }

  var coilEls = [], dotSeats = [];
  COILS.forEach(function (c) {
    var p = document.getElementById(c.el);
    p.setAttribute('d', coilD(c));
    coilEls.push(p);
    c.dots.forEach(function (k) { dotSeats.push(apex(c, k)); });
  });

  var dots = document.querySelectorAll('.mtx-dot');
  dots.forEach(function (dot, i) {
    dot.setAttribute('cx', dotSeats[i].x.toFixed(1));
    dot.setAttribute('cy', dotSeats[i].y.toFixed(1));
  });
  var heroDot = dots[4]; // middle chain — Scene 5's one bounded glint lives here
  var glint = document.getElementById('mtx-glint');
  glint.setAttribute('cx', dotSeats[4].x.toFixed(1));
  glint.setAttribute('cy', dotSeats[4].y.toFixed(1));
  gsap.set(glint, { scale: 0.35, transformOrigin: '50% 50%' });

  // ---- svg-path-draw setup: measured lengths, dash = offset = length ----
  var stratumTop = document.getElementById('mtx-stratum-top'),
      stratumBot = document.getElementById('mtx-stratum-bot'),
      rods = document.querySelectorAll('.mtx-rod'),
      fibroBody = document.getElementById('mtx-fibro-body'),
      fibroNucleus = document.getElementById('mtx-fibro-nucleus'),
      leader = document.getElementById('mtx-leader'),
      sparkBase = document.getElementById('mtx-spark-base'),
      sparkStep = document.getElementById('mtx-spark-step');

  var drawables = [stratumTop, stratumBot, fibroBody, fibroNucleus, leader, sparkBase, sparkStep];
  rods.forEach(function (r) { drawables.push(r); });
  coilEls.forEach(function (p) { drawables.push(p); });
  drawables.forEach(function (el) {
    var len = el.getTotalLength() * 1.02;
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
  });

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  // Scene 1 (0.0–1.4): card + kicker + tag settle; the two strata hairlines rule across.
  tl.fromTo('#mtx-card', { opacity: 0, scale: 1.045 }, { opacity: 1, scale: 1, duration: 0.6 }, 0.05);
  tl.fromTo('.mtx-glyph', { opacity: 0 }, { opacity: 1, duration: 0.8, stagger: 0.09, ease: 'power1.out' }, 0.10);
  tl.fromTo('#mtx-kicker', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 0.30);
  tl.fromTo('#mtx-tag', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, 0.45);
  tl.to(stratumTop, { strokeDashoffset: 0, duration: 0.5, ease: 'power2.out' }, 0.55);
  tl.to(stratumBot, { strokeDashoffset: 0, duration: 0.5, ease: 'power2.out' }, 0.70);

  // Ambient drift — bounded slow sine settle, never a loop.
  document.querySelectorAll('.mtx-glyph').forEach(function (el, i) {
    tl.to(el, { y: '+=' + (10 + i * 4), duration: 8.3, ease: 'sine.inOut' }, 0.30);
  });

  // Scene 2 (1.4–4.2) "structures the extracellular matrix": collagen rods stagger in,
  // then the three HA coil chains self-draw between them (svg dash draw, constant pen trace).
  tl.to(rods, { strokeDashoffset: 0, duration: 0.28, stagger: 0.08, ease: 'power2.out' }, 1.05);
  tl.to(coilEls[0], { strokeDashoffset: 0, duration: 1.00, ease: 'none' }, 1.55);
  tl.to(coilEls[1], { strokeDashoffset: 0, duration: 1.00, ease: 'none' }, 1.85);
  tl.to(coilEls[2], { strokeDashoffset: 0, duration: 0.95, ease: 'none' }, 2.15);

  // Scene 3 (3.4–5.4) "the scaffold your fibroblasts build": spindle outline draws lower-left,
  // leader + mono label land; water dots dock onto the coils with a capped stagger.
  tl.to(fibroBody, { strokeDashoffset: 0, duration: 0.65, ease: 'power2.out' }, 2.75);
  tl.to(fibroNucleus, { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out' }, 3.35);
  tl.to(leader, { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, 3.60);
  tl.fromTo('#mtx-fibro-label', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power1.out' }, 3.80);
  tl.fromTo(dots, { opacity: 0, y: -26, scale: 0.4, transformOrigin: '50% 50%' },
    { opacity: 1, y: 0, scale: 1, duration: 0.4, stagger: 0.07 }, 3.05);

  // Scene 4 (6.6–10.2) "past your twenties, output falls": the sourced decline row reveals
  // beneath the card; stepped sparkline ticks down left→right; citation pill lands ~9.6s.
  tl.fromTo('#mtx-claim', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5 }, 4.45);
  tl.to(sparkBase, { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, 5.35);
  tl.to(sparkStep, { strokeDashoffset: 0, duration: 1.5, ease: 'none' }, 5.60);
  tl.fromTo('#mtx-pill', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45 }, 7.90);

  // Scene 5 (10.2–11.643): held read — one bounded dot-glint on the coils, nothing else.
  // (No exit: frame 4 of 6 — the root crossfade is the exit.)
  tl.to(heroDot, { scale: 1.28, duration: 0.3, ease: 'power2.out' }, 8.55);
  tl.to(heroDot, { scale: 1, duration: 0.5 }, 8.88);
  tl.to(glint, { opacity: 0.85, scale: 1, duration: 0.18, ease: 'power1.out' }, 8.55);
  tl.to(glint, { opacity: 0, scale: 2.3, duration: 0.8, ease: 'power2.out' }, 8.73);

  window.__timelines = window.__timelines || {};
  window.__timelines['04-matrix'] = tl;
})();
