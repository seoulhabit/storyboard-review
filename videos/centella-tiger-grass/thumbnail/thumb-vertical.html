<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; overflow:hidden; font-family:'Inter','Helvetica Neue',sans-serif; background:#101314; }
.stage { position:relative; width:1080px; height:1920px; }
.plate { position:absolute; inset:0; }
.plate img { width:100%; height:100%; object-fit:cover; object-position:50% 78%; filter:saturate(1.15) contrast(1.06); }
.scrim { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(16,19,20,0.72) 0%, rgba(16,19,20,0.42) 30%, rgba(16,19,20,0) 55%); }
.type { position:absolute; left:72px; top:120px; width:940px; }
.kicker { font-weight:700; font-size:40px; letter-spacing:0.16em; color:#93B896; text-transform:uppercase; margin-bottom:28px; text-shadow:0 2px 12px rgba(16,19,20,0.7); }
h1 { font-weight:800; font-size:150px; line-height:1.0; letter-spacing:-0.01em; color:#F7F5F0; text-transform:uppercase; text-shadow:0 4px 28px rgba(16,19,20,0.65); }
h1 em { font-style:normal; color:#93B896; }
.pill { position:absolute; left:72px; bottom:120px; background:rgba(247,245,240,0.95); color:#131516;
  font-weight:800; font-size:46px; letter-spacing:0.08em; text-transform:uppercase;
  padding:26px 48px; border-radius:999px; box-shadow:0 6px 28px rgba(16,19,20,0.4); }
</style></head><body>
<div class="stage">
  <div class="plate"><img src="tf4.7.png"></div>
  <div class="scrim"></div>
  <div class="type">
    <div class="kicker">The Tiger Grass Legend</div>
    <h1>Why tigers<br>roll in<br><em>this plant</em></h1>
  </div>
  <div class="pill">Centella · Cica</div>
</div>
</body></html>
