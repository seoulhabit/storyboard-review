<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="ise-title ise-desc">
  <title id="ise-title">Skin entry gate component</title>
  <desc id="ise-desc">An intact-skin cross-section compares a small reference with a much larger collagen actor and marks the larger form as remaining at the surface.</desc>
  <defs>
    <linearGradient id="ise-epi" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EAD8CC"/><stop offset="1" stop-color="#F7EDE6"/></linearGradient>
    <linearGradient id="ise-derm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E5EDE8"/><stop offset="1" stop-color="#C8D7D2"/></linearGradient>
    <filter id="ise-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1600" height="900" rx="28" fill="#FFFDF8"/>
  <text x="74" y="74" fill="#172332" font-family="Arial, sans-serif" font-size="24" font-weight="700">Skin entry gate</text>
  <text x="1526" y="74" text-anchor="end" fill="#6E6670" font-family="Arial, sans-serif" font-size="20">Intact-skin topical route</text>
  <g id="ise-skin-band" data-layer="skin-band">
    <path d="M0 500C124 472 234 526 350 496C476 463 590 525 720 494C850 463 982 526 1110 496C1242 465 1370 518 1600 486V650H0V500Z" fill="url(#ise-epi)"/>
    <rect y="650" width="1600" height="250" fill="url(#ise-derm)"/>
    <path d="M0 500C124 472 234 526 350 496C476 463 590 525 720 494C850 463 982 526 1110 496C1242 465 1370 518 1600 486" stroke="#172332" stroke-opacity=".55" stroke-width="5"/>
    <path d="M0 650H1600" stroke="#204E58" stroke-opacity=".35" stroke-width="3" stroke-dasharray="12 16"/>
    <text x="74" y="592" fill="#6E6670" font-family="Arial, sans-serif" font-size="18" font-weight="700">EPIDERMIS</text>
    <text x="74" y="742" fill="#204E58" font-family="Arial, sans-serif" font-size="18" font-weight="700">DERMIS</text>
  </g>
  <g id="ise-barrier" data-layer="barrier">
    <g fill="#FFFDF8" stroke="#172332" stroke-opacity=".64" stroke-width="3">
      <rect x="74" y="516" width="166" height="54" rx="18"/><rect x="254" y="516" width="166" height="54" rx="18"/><rect x="434" y="516" width="166" height="54" rx="18"/><rect x="614" y="516" width="166" height="54" rx="18"/><rect x="794" y="516" width="166" height="54" rx="18"/><rect x="974" y="516" width="166" height="54" rx="18"/><rect x="1154" y="516" width="166" height="54" rx="18"/><rect x="1334" y="516" width="192" height="54" rx="18"/>
      <rect x="-12" y="582" width="166" height="50" rx="17"/><rect x="168" y="582" width="166" height="50" rx="17"/><rect x="348" y="582" width="166" height="50" rx="17"/><rect x="528" y="582" width="166" height="50" rx="17"/><rect x="708" y="582" width="166" height="50" rx="17"/><rect x="888" y="582" width="166" height="50" rx="17"/><rect x="1068" y="582" width="166" height="50" rx="17"/><rect x="1248" y="582" width="166" height="50" rx="17"/><rect x="1428" y="582" width="184" height="50" rx="17"/>
    </g>
  </g>
  <g id="ise-threshold" data-layer="threshold" transform="translate(1020 128)">
    <rect width="500" height="250" rx="24" fill="#202A33"/>
    <text x="34" y="54" fill="#DDB09C" font-family="Arial, sans-serif" font-size="18" font-weight="700">Molecular-size reference</text>
    <text x="34" y="130" fill="#FFFDF8" font-family="Georgia, serif" font-size="62">~500 Da</text>
    <text x="34" y="169" fill="#C2B9B8" font-family="Arial, sans-serif" font-size="19">general intact-skin boundary</text>
    <path d="M34 198H466" stroke="#FFFDF8" stroke-opacity=".16" stroke-width="2"/>
    <text x="34" y="226" fill="#C2B9B8" font-family="Arial, sans-serif" font-size="15">Exp Dermatol · 2000</text>
  </g>
  <g id="ise-small-reference" data-layer="small-reference">
    <circle cx="890" cy="457" r="10" fill="#204E58"/>
    <path d="M890 446V602" stroke="#204E58" stroke-width="4" stroke-dasharray="7 10"/>
  </g>
  <g id="ise-ingredient" data-layer="ingredient" transform="translate(102 112) scale(.49)"><image href="../../../../ingredients/collagen/components/ingredient-actor.svg" width="800" height="800"/></g>
  <g transform="translate(545 157)">
    <rect width="390" height="176" rx="22" fill="#F0E0D8" stroke="#7D3155" stroke-opacity=".25" stroke-width="2"/>
    <text x="28" y="50" fill="#7D3155" font-family="Arial, sans-serif" font-size="18" font-weight="700">Collagen fixture</text>
    <text x="28" y="111" fill="#172332" font-family="Georgia, serif" font-size="47">~300,000 Da</text>
    <text x="28" y="145" fill="#6E6670" font-family="Arial, sans-serif" font-size="17">reference value used in source story</text>
  </g>
  <g id="ise-disclosure" data-layer="disclosure" transform="translate(910 776)">
    <rect width="612" height="70" rx="35" fill="#172332"/>
    <text x="30" y="31" fill="#FFFDF8" font-family="Arial, sans-serif" font-size="17" font-weight="700">Labelled, not to scale.</text>
    <text x="30" y="54" fill="#C2B9B8" font-family="Arial, sans-serif" font-size="14">General rule—not a test of every topical formula.</text>
  </g>
  <path d="M415 449L461 473L415 497" stroke="#7D3155" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M480 468L516 478L480 488" stroke="#7D3155" stroke-opacity=".5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
