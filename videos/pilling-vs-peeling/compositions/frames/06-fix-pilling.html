<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        *, *::before, *::after { box-sizing: border-box; }
        /* Root cause of the whole session's layout-overflow chase, finally
           isolated by direct measurement: box-sizing defaults to content-box,
           so any element combining an explicit height/width with padding
           (every zone in this project) renders LARGER than declared -- e.g.
           .stage's height:1920px + 192px/384px top/bottom padding rendered
           as an actual 2496px box (1920+576), pushing bottom-anchored
           content straight past the canvas and into the reserved safe zone.
           This one reset fixes it project-wide. */
        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }

        #root {
          --paper: #F7F5F0; --ink: #131516; --aqua: #59B8AE; --coral: #C97A5C;
          --ink-2: #6B6B6B; --ink-2-dark: #878B8C; --ink-3-dark: #7C8082; --mist: #F0EBE1;
          --elev-2: 0 18px 32px -20px rgba(19, 21, 22, 0.35);
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
          --safe-margin: 6px;
          --font-display: "EB Garamond", Georgia, "Times New Roman", serif;
          --font-body: "Inter", "Noto Sans KR Video", "Noto Sans KR", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --font-kr: "Noto Sans KR Video", "Noto Sans KR", sans-serif;
          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--ink); font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }

        /* Spatial plan (adapted from pilling-not-dead-skin/06-protocol.html's
           card row, now with each card demonstrating its own action instead of
           sitting static -- feedback's "three fast real demonstrations", done
           as diagram motion rather than fresh footage, per the imagery
           decision: plates carry tactile proof, diagrams carry mechanism):
           1. #root is a flex column: label row / 3-card row (flex, equal
              columns) / sub-line / flag row. */
        /* Explicit height in px, not 100% -- percentage height on an
           absolutely positioned element resolves against its containing
           block (#root) at the moment of layout, and #root's own height
           was observed racing (measuring ~2500px before settling to the
           correct 1920px a moment later) during a font/image load. A
           hardcoded px height has nothing to resolve against, closing
           that race everywhere it could otherwise recur. */
        .stage { display: flex; flex-direction: column; justify-content: center;
                 height: 1920px;
                 padding: calc(var(--safe-top) + var(--safe-margin)) var(--safe-right)
                          var(--safe-bottom) calc(var(--safe-left) + var(--safe-margin)); }

        .label-row { display: flex; align-items: center; gap: 20px; }
        .label { font-family: var(--font-mono); font-weight: 500; font-size: 36px;
                 letter-spacing: 0.1em; text-transform: uppercase; color: var(--paper); }
        .label-rule { width: 0; height: 3px; background: var(--aqua); }

        .card-row { display: flex; gap: 24px; margin-top: 52px; }
        /* --hl drives the "this card is being demonstrated now" state. Colour
           only -- no transform -- because card 3's tap beat is a GSAP `y`
           tween and a CSS transform here would be overwritten by it. */
        .card { --hl: 0; flex: 1 1 0; display: flex; flex-direction: column; align-items: center;
                gap: 28px; text-align: center;
                background: rgba(247,245,240, calc(0.06 + var(--hl) * 0.12));
                border: 1.5px solid rgba(247,245,240, calc(0.2 + var(--hl) * 0.35));
                border-radius: 20px; padding: 120px 14px; }
        .card-glyph { width: 168px; height: 168px; }
        .card-text { font-weight: 800; font-size: 32px; line-height: 1.2; color: var(--paper); }
        .card-mark { fill: none; stroke: var(--coral); stroke-width: 5.5; stroke-linecap: round; opacity: 0; }

        .sub-line { font-family: var(--font-mono); font-weight: 500; font-size: 34px;
                    color: rgba(247,245,240,0.78); margin-top: 44px; opacity: 0; }

        .flag-zone { margin-top: 36px; }
        .uf-badge { display: inline-flex; align-items: center; gap: 8px; font-weight: 600;
                    font-size: 32px; color: rgba(247,245,240,0.85); border: 1px solid rgba(247,245,240,0.3);
                    border-radius: 999px; padding: 12px 26px; background: rgba(247,245,240,0.06); opacity: 0; }
      </style>

      <div data-hf-id="hf-r0tr" id="root" data-composition-id="06-fix-pilling" data-width="1080" data-height="1920" data-duration="2.600">
        <div data-hf-id="hf-q6os" class="clip stage">
          <div data-hf-id="hf-4785" class="label-row">
            <p data-hf-id="hf-3jt8" class="label">Try this</p>
            <div data-hf-id="hf-rjzr" class="label-rule" id="s6-labelRule"></div>
          </div>

          <div data-hf-id="hf-svst" class="card-row">
            <div data-hf-id="hf-zcun" class="card" id="s6-card1">
              <svg data-hf-id="hf-ws4i" class="card-glyph" viewBox="0 0 56 56" aria-hidden="true">
                <path data-hf-id="hf-88aj" id="s6-line-top" d="M10,20 h36" stroke="#F7F5F0" stroke-width="4" stroke-linecap="round" />
                <path data-hf-id="hf-xzox" id="s6-line-bot" d="M10,32 h24" stroke="#F7F5F0" stroke-width="4" stroke-linecap="round" />
              </svg>
              <p data-hf-id="hf-iv0d" class="card-text">THIN PASSES</p>
            </div>
            <div data-hf-id="hf-ohd0" class="card" id="s6-card2">
              <svg data-hf-id="hf-tp3a" class="card-glyph" viewBox="0 0 56 56" aria-hidden="true">
                <circle data-hf-id="hf-0jkb" cx="28" cy="28" r="16" fill="none" stroke="#F7F5F0" stroke-width="4" />
                <path data-hf-id="hf-t8ra" id="s6-clock-hand" d="M28,28 L28,16" stroke="#F7F5F0" stroke-width="4" stroke-linecap="round" fill="none" />
              </svg>
              <p data-hf-id="hf-jlmo" class="card-text">LET IT SETTLE</p>
            </div>
            <div data-hf-id="hf-rgml" class="card" id="s6-card3">
              <!-- Round 5: card 3 used to be a bare coral X over the text "PAT,
                   DON'T RUB" -- no "pat" glyph at all, while cards 1 and 2 each
                   carry an affirmative one. A fast viewer reads a full-card X as
                   negating the whole card ("do not pat"), the exact inversion of
                   the instruction. Split into two halves so the negation is
                   scoped: the press is affirmed in paper, and the coral mark
                   sits ON the rub stroke only. Deliberately NOT the green
                   check an external QC pass asked for -- coral is this video's
                   single accent spend, and a second accent competing in one
                   frame is its own defect. -->
              <svg data-hf-id="hf-u3eb" class="card-glyph" viewBox="0 0 56 56" aria-hidden="true">
                <!-- PAT is three DISCRETE taps; RUB is ONE CONTINUOUS
                     back-and-forth stroke. The discrete/continuous contrast is
                     what carries the instruction, so the marks differ in kind,
                     not just in label. Both are full-brightness paper: an
                     earlier pass dimmed the rub stroke to 0.4 and the coral
                     read as a free-floating negation again, because the thing
                     it was crossing had become invisible underneath it. -->
                <circle data-hf-id="hf-gyk9" cx="15" cy="16" r="5" fill="#F7F5F0" />
                <circle data-hf-id="hf-tn1l" cx="28" cy="16" r="5" fill="#F7F5F0" />
                <circle data-hf-id="hf-lipo" cx="41" cy="16" r="5" fill="#F7F5F0" />
                <path data-hf-id="hf-33jg" d="M14,41 Q21,32 28,41 T42,41" stroke="#F7F5F0" stroke-width="4" fill="none" stroke-linecap="round" />
                <!-- A slash sized to the rub stroke's own width, not an X over
                     the whole glyph: the negation has to be visibly attached to
                     one mark or it reads as negating the card. -->
                <path data-hf-id="hf-iiei" class="card-mark" id="s6-card-mark" d="M15,48 L41,30" />
              </svg>
              <p data-hf-id="hf-6519" class="card-text">PAT, DON’T RUB</p>
            </div>
          </div>

          <p data-hf-id="hf-kg5a" class="sub-line" id="s6-subLine">Same total SPF — just thinner passes.</p>

          <div data-hf-id="hf-erdh" class="flag-zone">
            <div data-hf-id="hf-to9c" class="uf-badge" id="s6-flag">○ Advice, not a tested fix.</div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        // Frame zero: "TRY THIS" and all three cards settled -- each demo IS
        // the entrance beat for its own card, so nothing pops in separately.
        // svgOrigin (SVG user units), not transformOrigin in px: the glyph is now
        // rendered at 168px for a 0 0 56 56 viewBox, so '28px' would resolve to
        // 9.33 user units and the hand would sweep about the wrong point.
        tl.set('#s6-clock-hand', { svgOrigin: '28 28' }, 0);
        tl.set('#s6-card-mark', { svgOrigin: '28 39' }, 0);

        // Round 4: the three demos used to animate 12px strokes inside a 56px
        // glyph -- ~48px^2 of change on a 2,073,600px canvas, measured at
        // 0.0001-0.012 mean |dLuma| per 8fps step: tweens that fire and that
        // no viewer can see. That same sub-perceptual drift is also what kept
        // check-static-hold.py's PSNR run from ever reaching its frozen
        // threshold, so the scene reported clean while carrying no visible
        // beat for 1.2s. Glyphs are now 3x larger and each card highlights
        // while its own tip is demonstrated, so the motion encodes WHICH tip
        // is being shown instead of decorating a static row.

        // Demo 1 (t0.10-0.70): thinner passes -- the top line shrinks to the
        // bottom line's length, echoing "less material per pass."
        tl.to('#s6-card1', { '--hl': 1, duration: 0.30, ease: 'power2.out' }, 0.10);
        tl.to('#s6-line-top', { attr: { d: 'M10,20 h24' }, duration: 0.5, ease: 'power2.inOut' }, 0.10);
        tl.to('#s6-card1', { '--hl': 0, duration: 0.30, ease: 'power2.inOut' }, 0.70);

        // Demo 2 (t0.80-1.45): let it settle -- the clock hand sweeps a
        // near-full turn while card 2 holds the highlight.
        tl.to('#s6-card2', { '--hl': 1, duration: 0.30, ease: 'power2.out' }, 0.80);
        tl.to('#s6-clock-hand', { rotation: 300, duration: 0.55, ease: 'power2.inOut' }, 0.85);
        tl.to('#s6-card2', { '--hl': 0, duration: 0.30, ease: 'power2.inOut' }, 1.45);

        // Demo 3 (t1.55-2.20): pat, don't rub -- two quick taps, then the
        // coral mark (this video's one coral spend) pops.
        tl.to('#s6-card3', { '--hl': 1, duration: 0.30, ease: 'power2.out' }, 1.55);
        tl.to('#s6-card3', { y: -8, duration: 0.14, yoyo: true, repeat: 3, ease: 'power1.inOut' }, 1.60);
        tl.fromTo('#s6-card-mark', { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 1.85);
        tl.to('#s6-card3', { '--hl': 0, duration: 0.30, ease: 'power2.inOut' }, 2.20);

        tl.to('#s6-subLine', { opacity: 1, duration: 0.3 }, 1.95);
        tl.to('#s6-flag', { opacity: 1, duration: 0.4 }, 2.20);

        tl.to('#s6-labelRule', { width: 64, duration: 0.4, ease: "power2.inOut" }, 2.05);

        tl.to({}, { duration: 2.600 }, 0); // full-span anchor
        window.__timelines["06-fix-pilling"] = tl;
      </script>
    </template>
  </body>
</html>
