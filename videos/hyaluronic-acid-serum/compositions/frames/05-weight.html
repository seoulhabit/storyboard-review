<script>
(function () {
  var card = document.getElementById('mwt-card');
  var kicker = document.getElementById('mwt-kicker');
  var tag = document.getElementById('mwt-tag');
  var washWrap = document.getElementById('mwt-washwrap');
  var air = document.getElementById('mwt-air');
  var surface = document.getElementById('mwt-surface');
  var stratum1 = document.getElementById('mwt-stratum1');
  var stratum2 = document.getElementById('mwt-stratum2');
  var coil = document.getElementById('mwt-coil');
  var hmwLeader = document.getElementById('mwt-hmw-leader');
  var hmwLabel = document.getElementById('mwt-hmw-labelgrp');
  var frags = [1, 2, 3, 4, 5].map(function (n) { return document.getElementById('mwt-frag' + n); });
  var lmwLeader = document.getElementById('mwt-lmw-leader');
  var lmwLabel = document.getElementById('mwt-lmw-labelgrp');
  var aquaShaft = document.getElementById('mwt-aqua-shaft');
  var aquaHead = document.getElementById('mwt-aqua-head');
  var aquaLabel = document.getElementById('mwt-aqua-labelgrp');
  var coralShaft = document.getElementById('mwt-coral-shaft');
  var coralHead = document.getElementById('mwt-coral-head');
  var coralLabel = document.getElementById('mwt-coral-labelgrp');
  var claim = document.getElementById('mwt-claim');
  var pillRow = document.getElementById('mwt-pillrow');

  // Prime every line-drawn stroke: dasharray = its own length, fully offset (invisible).
  [surface, stratum1, stratum2, coil, hmwLeader, lmwLeader, aquaShaft, coralShaft].forEach(function (el) {
    var len = el.getTotalLength ? el.getTotalLength() : 800;
    gsap.set(el, { strokeDasharray: len, strokeDashoffset: len });
  });

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  // Scene 1 (0.0–1.2s): card + kicker + tag settle; the bold surface line and AIR label draw first.
  tl.fromTo(card, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.6 }, 0.05);
  tl.fromTo(kicker, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, 0.25);
  tl.fromTo(tag, { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.40);
  tl.fromTo(washWrap, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.35);
  tl.to(surface, { strokeDashoffset: 0, duration: 0.55 }, 0.45);
  tl.fromTo(air, { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.75);

  // Scene 2 (1.6–3.4s): "heavy chains film the surface" — the long HMW coil draws along the top line.
  tl.to(coil, { strokeDashoffset: 0, duration: 0.9, ease: 'power2.out' }, 1.05);
  tl.to(hmwLeader, { strokeDashoffset: 0, duration: 0.25 }, 1.75);
  tl.fromTo(hmwLabel, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 }, 1.88);

  // Scene 3 (3.6–5.6s): "light ones settle into the outer layers" — the strata appear,
  // then 4–5 LMW fragments fade in between the first and second strata.
  tl.to(stratum1, { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out' }, 1.95);
  tl.to(stratum2, { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out' }, 2.10);
  frags.forEach(function (f, i) {
    tl.fromTo(f, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5 }, 4.1 + i * 0.2);
  });
  tl.to(lmwLeader, { strokeDashoffset: 0, duration: 0.25 }, 2.55);
  tl.fromTo(lmwLabel, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 }, 2.68);

  // Scene 4 (6.4–11.4s): the humectant law. On "pulls water from wherever water is",
  // the aqua down-arrow draws air → skin with its RH label.
  tl.to(aquaShaft, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.inOut' }, 2.30);
  tl.fromTo(aquaHead, { opacity: 0, scale: 0.4, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.26 }, 2.86);
  tl.fromTo(aquaLabel, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 }, 3.00);
  // "humid air" — the AIR zone label deepens once, quietly.
  tl.to(air, { fill: 'rgba(19,21,22,0.78)', duration: 0.4, ease: 'power2.inOut' }, 3.70);
  // The reversal lands LAST, on "or your own dermis" (~10.6s): the coral up-arrow draws
  // skin → air from below the second stratum — the threat made visible.
  tl.to(coralShaft, { strokeDashoffset: 0, duration: 0.55 }, 3.95);
  tl.fromTo(coralLabel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 4.20);
  tl.fromTo(coralHead, { opacity: 0, scale: 0.4, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.24 }, 4.42);

  // Scene 5 (11.4–13.534s): claim row + CITATION pill below the card; held read.
  // Non-final frame: no exit — the root crossfade is the exit.
  tl.fromTo(claim, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5 }, 4.90);
  tl.fromTo(pillRow, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45 }, 5.60);

  window.__timelines = window.__timelines || {};
  window.__timelines['05-weight'] = tl;
})();
</script>
