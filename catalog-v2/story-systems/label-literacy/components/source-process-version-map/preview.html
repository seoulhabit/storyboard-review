<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Source, Process and Version Map — Catalog V2</title>
  <link rel="stylesheet" href="../../system-tokens.css">
  <style>
    .stage{background:linear-gradient(180deg,#eef0eb,#e2e8e2)}.topline{position:absolute;z-index:5;left:4%;right:4%;top:5%;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:clamp(12px,1vw,18px);font-weight:680}.heading{text-align:right}.heading strong{display:block;font-size:clamp(20px,2.2vw,40px);font-weight:610;letter-spacing:-.045em}.heading span{color:var(--ll-ink-soft);font-size:clamp(9px,.72vw,13px)}
    .map{position:absolute;z-index:3;inset:20% 4.5% 10%;display:grid;grid-template-columns:1fr 84px 1fr 84px 1.08fr;align-items:stretch}.station{position:relative;min-width:0;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:clamp(17px,2vw,34px);border:1px solid rgba(255,255,255,.84);background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 1px rgba(23,35,50,.04)}.station.source{border-radius:70px 18px 18px 70px}.station.version{border-radius:18px 70px 70px 18px}.station-index{display:flex;justify-content:space-between;align-items:center;color:var(--ll-ink-soft);font-size:clamp(9px,.66vw,12px)}.station-index b{font-weight:500}.station-icon{width:clamp(70px,7vw,126px);height:clamp(70px,7vw,126px);display:grid;place-items:center;align-self:center;border:1px solid var(--ll-line);border-radius:50%;color:var(--ll-celadon-deep);background:rgba(255,255,255,.64);font-size:clamp(28px,3vw,52px)}.station.process .station-icon{border-radius:18px;color:var(--ll-assay)}.station.version .station-icon{color:var(--ll-aqua)}.station h2{margin:0 0 7px;font-size:clamp(22px,2vw,36px);font-weight:620;letter-spacing:-.04em}.station p{margin:0;color:var(--ll-ink-soft);font-size:clamp(10px,.78vw,14px);line-height:1.42}.connector{position:relative;display:grid;place-items:center}.connector::before{content:"";position:absolute;left:0;right:0;height:1px;background:var(--ll-ink)}.connector::after{content:"";position:absolute;right:4px;width:9px;height:9px;border-top:1px solid var(--ll-ink);border-right:1px solid var(--ll-ink);transform:rotate(45deg)}.connector span{position:relative;z-index:2;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--ll-line);border-radius:50%;background:var(--ll-paper);color:var(--ll-ink-soft);font-size:13px}
    .variables{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.variable{border:1px solid var(--ll-line);border-radius:999px;padding:5px 8px;color:var(--ll-ink-soft);font-size:clamp(8px,.58vw,11px)}.variable.unknown{border-style:dashed;color:var(--ll-signal)}.not-equal{position:absolute;z-index:6;left:50%;bottom:7%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;color:var(--ll-ink-soft);font-size:clamp(9px,.68vw,12px)}.not-equal strong{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:white;background:var(--ll-signal);font-size:16px}
    @media(max-width:840px){.heading strong{font-size:22px}.heading span{display:none}.map{inset:16% 7% 10%;grid-template-columns:1fr;grid-template-rows:1fr 38px 1fr 38px 1fr}.station{grid-template-columns:65px 1fr auto;grid-template-rows:1fr;align-items:center;padding:13px;border-radius:18px!important}.station-index{display:none}.station-icon{width:58px;height:58px;font-size:26px}.station h2{font-size:21px}.station p{font-size:10px}.variables{display:none}.connector::before{top:0;bottom:0;left:50%;right:auto;width:1px;height:auto}.connector::after{right:auto;bottom:4px;width:8px;height:8px;transform:rotate(135deg)}.connector span{width:26px;height:26px;font-size:10px}.not-equal{bottom:4%;white-space:nowrap}.ll-disclosure{display:none}}
  </style>
</head>
<body>
  <main class="ll-shell">
    <header class="ll-toolbar"><div class="ll-toolbar-copy"><strong>Source, Process and Version Map</strong><span>Three questions that must not collapse into one ingredient name.</span></div><div class="ll-switcher" role="tablist" aria-label="Ingredient fixture"><button role="tab" aria-selected="true" data-fixture="snail">Snail Mucin</button><button role="tab" aria-selected="false" data-fixture="pdrn">PDRN</button><button role="tab" aria-selected="false" data-fixture="cica">Cica demo</button></div></header>
    <section class="ll-stage stage" aria-label="Source, process and ingredient-version map">
      <div class="topline"><div class="brand">SeoulHabit ingredient review</div><div class="heading"><strong id="ingredientName"></strong><span>Identity path · product-specific gaps remain visible</span></div></div>
      <div class="map">
        <article class="station source"><div class="station-index"><b>Source</b><span class="ll-state" id="sourceState"></span></div><div class="station-icon" id="sourceIcon"></div><div><h2 id="sourceTitle"></h2><p id="sourceCopy"></p></div></article>
        <div class="connector" aria-hidden="true"><span>1</span></div>
        <article class="station process"><div class="station-index"><b>Process</b><span class="ll-state" id="processState"></span></div><div class="station-icon" id="processIcon"></div><div><h2 id="processTitle"></h2><p id="processCopy"></p></div></article>
        <div class="connector" aria-hidden="true"><span>2</span></div>
        <article class="station version"><div class="station-index"><b>Version in formula</b><span class="ll-state" id="versionState"></span></div><div class="station-icon" id="versionIcon"></div><div><h2 id="versionTitle"></h2><p id="versionCopy"></p><div class="variables" id="variables"></div></div></article>
      </div>
      <div class="not-equal"><strong>≠</strong><span>Same familiar name does not guarantee the same preparation.</span></div>
      <div class="ll-disclosure" id="disclosure"></div><div class="ll-version">Label Literacy 0.3</div>
    </section>
  </main>
  <script>
    const fixtures={
      snail:{name:"Snail Mucin",source:["◌","Animal-derived secretion filtrate","The source category is known; collection conditions require separate evidence.","known","Known"],process:["⌁","Collection + filtration","Collection or extraction method can change the measured composition.","context","Varies"],version:["≈","Snail Secretion Filtrate","Exact preparation and concentration remain product-specific.","context","Context"],variables:[["collection","known"],["filtration","known"],["concentration","unknown"]],disclosure:"The source image or category name does not establish welfare conditions, standardization, or product performance."},
      pdrn:{name:"PDRN",source:["⌬","DNA-fragment preparation","Animal-derived and plant-described variants exist; do not infer a source.","unknown","Product-specific"],process:["⋮","Purification + specification","Fragment profile and manufacturing specification may differ materially.","unknown","Not disclosed"],version:["≋","Exact label term required","PDRN, PN, Hydrolyzed DNA and Sodium DNA are not automatic synonyms.","context","Verify"],variables:[["source","unknown"],["fragment profile","unknown"],["route","known"]],disclosure:"An ingredient name alone does not establish source, fragment size, concentration, equivalence, or delivery route."},
      cica:{name:"Cica",source:["❧","Centella asiatica","The botanical source can be named without proving the extract specification.","known","Known"],process:["⌁","Extraction process","Solvent, ratio and standardization are not disclosed by the familiar name.","unknown","Not disclosed"],version:["◇","Centella Asiatica Extract","The exact declaration identifies the ingredient but not every process variable.","context","Context"],variables:[["botanical","known"],["solvent","unknown"],["standardization","unknown"]],disclosure:"Fictional source-story example. Product label and supplier documentation are required for exact preparation details."}
    };
    function state(el,data){el.className=`ll-state ${data[3]}`;el.textContent=data[4]}
    function render(key){const f=fixtures[key];document.querySelector('#ingredientName').textContent=f.name;[['source',f.source],['process',f.process],['version',f.version]].forEach(([id,data])=>{document.querySelector(`#${id}Icon`).textContent=data[0];document.querySelector(`#${id}Title`).textContent=data[1];document.querySelector(`#${id}Copy`).textContent=data[2];state(document.querySelector(`#${id}State`),data)});document.querySelector('#variables').innerHTML=f.variables.map(([name,status])=>`<span class="variable ${status}">${name}</span>`).join('');document.querySelector('#disclosure').textContent=f.disclosure}
    document.querySelectorAll('[data-fixture]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-fixture]').forEach(item=>item.setAttribute('aria-selected','false'));button.setAttribute('aria-selected','true');render(button.dataset.fixture)}));render('snail');
  </script>
</body>
</html>
