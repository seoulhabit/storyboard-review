<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fbfaf4;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="84.88" data-width="1080" data-height="1920">

      <!-- ══════════════════════════ scenes — every boundary a hard CUT ══════════════════════════
           Timings are the MEASURED VO clock (assets/voice/0N.wav durations), not estimates. -->

      <div id="el-01-open" class="scene" data-composition-id="01-open" data-composition-src="compositions/frames/01-open.html" data-start="0" data-duration="7.12" data-track-index="0"></div>
      <audio id="el-01-open-voice" src="assets/voice/01.wav" data-start="0" data-duration="7.12" data-track-index="10" data-volume="1"></audio>

      <div id="el-02-name" class="scene" data-composition-id="02-name" data-composition-src="compositions/frames/02-name.html" data-start="7.12" data-duration="6.24" data-track-index="1"></div>
      <audio id="el-02-name-voice" src="assets/voice/02.wav" data-start="7.12" data-duration="6.24" data-track-index="10" data-volume="1"></audio>

      <!-- ch3+ch4 merged, one actor (the composition column), two internal phases -->
      <div id="el-03-mixture" class="scene" data-composition-id="03-mixture" data-composition-src="compositions/frames/03-mixture.html" data-start="13.36" data-duration="34.56" data-track-index="0"></div>
      <audio id="el-03-mixture-voice-a" src="assets/voice/03.wav" data-start="13.36" data-duration="17.92" data-track-index="10" data-volume="1"></audio>
      <audio id="el-03-mixture-voice-b" src="assets/voice/04.wav" data-start="31.28" data-duration="16.64" data-track-index="10" data-volume="1"></audio>

      <div id="el-04-method" class="scene" data-composition-id="04-method" data-composition-src="compositions/frames/04-method.html" data-start="47.92" data-duration="12.40" data-track-index="1"></div>
      <audio id="el-04-method-voice" src="assets/voice/05.wav" data-start="47.92" data-duration="12.40" data-track-index="10" data-volume="1"></audio>

      <div id="el-05-use" class="scene" data-composition-id="05-use" data-composition-src="compositions/frames/05-use.html" data-start="60.32" data-duration="12.16" data-track-index="0"></div>
      <audio id="el-05-use-voice" src="assets/voice/06.wav" data-start="60.32" data-duration="12.16" data-track-index="10" data-volume="1"></audio>

      <div id="el-06-verdict" class="scene" data-composition-id="06-verdict" data-composition-src="compositions/frames/06-verdict.html" data-start="72.48" data-duration="12.40" data-track-index="1"></div>
      <audio id="el-06-verdict-voice" src="assets/voice/07.wav" data-start="72.48" data-duration="12.40" data-track-index="10" data-volume="1"></audio>

      <!-- BGM — quiet forest-editorial bed, no swell (this video's register is measured) -->
      <audio id="el-bgm" src="assets/bgm/track.loop.mp3" data-start="0" data-duration="84.88" data-track-index="11" data-volume="0.10"></audio>

      <!-- captions — single global karaoke system -->
      <div id="el-captions" class="scene" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="84.88" data-track-index="2"></div>

      <!-- SFX — fewer, more meaningful motifs (4 cues total; v1 shipped ~26) -->
      <audio id="el-sfx-cut1" src="assets/sfx/whoosh-soft-scene-1-2-hard-cut.mp3" data-start="1.60" data-duration="1.42" data-track-index="20" data-volume="0.32"></audio>
      <audio id="el-sfx-title" src="assets/sfx/click-soft-title-lands.mp3" data-start="7.27" data-duration="0.26" data-track-index="21" data-volume="0.35"></audio>
      <audio id="el-sfx-variable" src="assets/sfx/sparkle-payoff-word.mp3" data-start="28.16" data-duration="3.33" data-track-index="22" data-volume="0.28"></audio>
      <audio id="el-sfx-cta" src="assets/sfx/sparkle-subscribe-text-lands.mp3" data-start="78.58" data-duration="3.33" data-track-index="23" data-volume="0.30"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── Every scene boundary is a HARD CUT (Short, per [S6/A-8]). Visibility is keyed off
      //    data-start/data-duration, which are contiguous, so no cut needs a tween at all —
      //    the only entry is the full-span anchor so main.duration() == 84.88 (Studio master). ──
      (function () { var tl = window.__timelines["main"];
        tl.to({}, { duration: 84.88 }, 0);
      })();
    </script>
  </body>
</html>
