[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storyboard-review"
version = "0.1.0"
description = "Generate a drag-and-drop HTML storyboard for reviewing and reordering video clips and images."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Sumit Choudhary" }]
keywords = ["video", "editing", "review", "storyboard", "ffmpeg"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/storyboard-review"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.11", "pre-commit>=3.8"]

[project.scripts]
storyboard = "storyboard:main"

[tool.hatch.build.targets.wheel]
include = ["storyboard.py"]

[tool.ruff]
target-version = "py39"
line-length = 100
# storyline.py is a separate, not-yet-packaged tool living in this same
# folder — out of scope here, so leave it out of lint scope too.
#
# videos/*/scripts/ are the same case one level down: per-video build
# generators, packaged with nothing, imported by nothing outside their own
# project. The package here ships storyboard.py alone (see the wheel target
# above) and mypy is scoped to it, so holding a scene-spec file to the
# package's profile buys nothing and costs something — 22 of the 46 findings
# on the first such project wanted `dict(css=..., body=...)` scene specs
# rewritten as dict literals, which is strictly harder to read in a file whose
# whole job is to be read as data.
#
# catalog/tooling/ is deliberately NOT excluded. Those are shared checkers that
# other projects copy, so they stay in scope and their findings get fixed.
extend-exclude = ["storyline.py", "videos/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
files = ["storyboard.py"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
