      <style>
        /* box-sizing reset FIRST -- without it any element combining an
           explicit height with padding (.stage: height 1920 + 192/384
           vertical padding) lays out at 2496px and pushes bottom-anchored
           content past the canvas into the reserved zone. Invisible from
           source; only getBoundingClientRect() vs getComputedStyle() on a
           real render shows it. */
        *, *::before, *::after { box-sizing: border-box; }
        /* Margin reset. box-sizing alone is NOT enough: the UA stylesheet's
           default `p { margin: 1em 0 }` / `h1 { margin: .67em 0 }` scale with
           FONT SIZE, so a 170px headline carried ~114px of phantom margin above
           and below it and a 42px card question carried ~42px. Measured on a real
           snapshot: gate cards rendered 280/393px tall against ~194px of actual
           content, which pushed card 03 to y=1513 -- past the content box (1360)
           and nearly to the safe line (1536). One reset, six scenes. */
        h1, h2, h3, p, figure, blockquote { margin: 0; }

        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "Noto Sans KR Video"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/NotoSansKR-500-subset.woff2") format("woff2"); font-display: block; }

        /* Tokens inlined from assets/tokens/tokens.css -- a <link> to the
           shared file is confirmed not to resolve custom properties through
           this render pipeline (measured empty on a compiled render), so the
           values are copied with that file as the single source of truth. */
        #root {
          --paper: #F7F5F0; --ink: #131516; --mist: #F0EBE1;
          --ink-2: #6B6B6B; --ink-3: #9C978D;
          --coral: #C97A5C; --celadon: #93B896; --moss: #4F6B52;
          --cap-lane: 176px;
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --font-kr: "Noto Sans KR Video", "Noto Sans KR", sans-serif;
          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--paper); font-family: var(--font-body);
        }

        /* Spatial plan
           1. .stage is ONE flex column with real --safe-* padding on all four
              sides and an explicit px height (not 100% -- a percentage height
              on an absolutely positioned child resolves against #root at
              layout time, which was observed racing during font/image load).
           2. The hero is a 2-column CSS GRID (annotation | bottle), not two
              absolutely-positioned siblings -- it survives a string-length
              change and an aspect flip.
           3. The ONLY absolute element is the plate's Ken Burns wrapper, and
              it lives inside .plate-panel's own overflow:hidden clipped
              context, so it can never push the safe box outward. That is why
              this scene needs no --safe-*-zoomed math. */
        .stage {
          display: flex; flex-direction: column; height: 1920px;
          /* --cap-lane reserves the burned-in caption band (y 1360-1520) so no
             scene's own content can sit under it. Content bottom is 1360, not
             1536 -- the lane sits between the content box and --safe-bottom. */
          padding: var(--safe-top) var(--safe-right)
                   calc(var(--safe-bottom) + var(--cap-lane)) var(--safe-left);
          gap: 30px;
        }

        .kicker { font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.14em;
                  color: var(--ink-2); text-transform: uppercase; flex: 0 0 auto;
                  opacity: 0; }

        /* 156px, not 170: at 170 the rendered word measured 899px against an
           846px content column and pushed the '?' to x=971, 53px inside the
           right reserved zone. 846/899 = 0.941 -> 160px is the ceiling;
           156px leaves a real margin. */
        .headline { font-weight: 800; font-size: 156px; line-height: 0.90;
                    letter-spacing: -0.045em; color: var(--ink); flex: 0 0 auto;
                    white-space: nowrap; }
        .headline .q { color: var(--coral); }

        /* Underline draws under the word -- width is the animated property,
           so it is a real rendered pixel change, not an opacity nudge. */
        .rule { height: 8px; background: var(--celadon); width: 0; flex: 0 0 auto; }

        /* Payoff bar: ink on coral measures 5.60:1. Paper on coral is only
           3.00:1, so the bar deliberately carries DARK text. */
        .payoff { flex: 0 0 auto; align-self: flex-start; background: var(--coral);
                  padding: 16px 26px; clip-path: inset(0 100% 0 0); }
        .payoff span { display: block; font-family: var(--font-mono); font-size: 42px;
                       letter-spacing: 0.05em; color: var(--ink); text-transform: uppercase;
                       white-space: nowrap; }

        .hero { flex: 1 1 auto; min-height: 0; display: grid;
                grid-template-columns: 1fr 440px; gap: 34px; align-items: stretch; }

        .annot { display: flex; flex-direction: column; justify-content: flex-end;
                 gap: 18px; padding-bottom: 8px; min-width: 0; }
        .annot-row { font-family: var(--font-mono); font-size: 32px; line-height: 1.3;
                     color: var(--ink-2); opacity: 0; }
        .annot-row b { display: block; color: var(--ink); font-weight: 500; }
        .annot-kr { font-family: var(--font-kr); }

        .plate-panel { height: 100%; position: relative;
                       overflow: hidden; background: var(--ink); }
        .plate-zoom { position: absolute; inset: 0; transform-origin: 50% 46%; }
        .plate-zoom img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Debug overlay -- toggled by adding .debug-layout to #root, never
           shipped on. Frame zero is checked for tint before every render. */
        #root.debug-layout * { outline: 1px solid rgba(255,0,0,0.6) !important; }
        #root.debug-layout .stage { outline: 2px solid #00E5FF !important; }
        #root.debug-layout .plate-panel { outline: 2px solid #FFD400 !important; }
        #root.debug-layout::after {
          content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 99;
          background:
            linear-gradient(to left,   rgba(255,0,168,.22) 15%, transparent 15%),
            linear-gradient(to top,    rgba(255,0,168,.22) 20%, transparent 20%),
            linear-gradient(to bottom, rgba(255,0,168,.22) 10%, transparent 10%);
        }
      </style>

          <div data-hf-id="hf-tsi3" class="rule" id="h-rule"></div>

          <div data-hf-id="hf-hie8" class="hero">
            <div data-hf-id="hf-qtj4" class="annot">
              <p data-hf-id="hf-ompl" class="annot-row" id="h-a1"><b data-hf-id="hf-luuu">[ FIG. 01 ]</b>Serum, as sold</p>
              <p data-hf-id="hf-ust1" class="annot-row" id="h-a2"><b data-hf-id="hf-asz0" class="annot-kr">세럼 · 30mL</b>Label states a category<br data-hf-id="hf-x5px">and a volume. Nothing else.</p>
            </div>
            <figure data-hf-id="hf-d6me" class="plate-panel">
              <div data-hf-id="hf-3hbi" class="plate-zoom" id="h-zoom">

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        // Frame zero is COMPOSED: headline and bottle are already at rest.
        // Only the kicker/annotations/payoff arrive, so the literal t=0 export
        // frame is a finished poster, not a mid-fade.
        tl.set('#h-word', { opacity: 1 }, 0);

        // Continuous Ken Burns for the whole scene -- the plate is never a
        // motionless still (asset-protocol rule 5). Clipped by .plate-panel,
        // so it cannot move the safe box.
        tl.fromTo('#h-zoom', { scale: 1.0 }, { scale: 1.035, duration: 4.45, ease: 'none' }, 0);

        // t0.20 kicker, t0.45/0.75 annotations -- a staggered read down the
        // left column while the voice says "that viral exosome serum".
        tl.to('#h-kicker', { opacity: 1, duration: 0.35 }, 0.20);
        tl.fromTo('#h-a1', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.40 }, 0.45);
        tl.fromTo('#h-a2', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.40 }, 0.75);

        // t1.45 THE PAYOFF -- a coral wipe, inside the ~2s retention window.
        // clip-path (not opacity) so it reads as a bar being struck across.
        tl.to('#h-payoff', { clipPath: 'inset(0 0% 0 0)', duration: 0.42, ease: 'power2.inOut' }, 1.45);

        // t2.55 celadon rule draws under the word; t3.35 a slow settle push on
        // the payoff keeps the back half of the scene alive.
        tl.to('#h-rule', { width: 470, duration: 0.55, ease: 'power2.inOut' }, 2.55);
        tl.to('#h-payoff', { x: 14, duration: 0.85, ease: 'power1.inOut' }, 3.35);

        tl.to({}, { duration: 4.450 }, 0); // full-span anchor -- always last
        window.__timelines["01-hook"] = tl;
      </script>
