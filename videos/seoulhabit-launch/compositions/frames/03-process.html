<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Noto Sans KR Video";
          font-weight: 500;
          font-style: normal;
          src: url("assets/fonts/NotoSansKR-500-subset.woff2") format("woff2");
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 500;
          font-style: normal;
          src: url("assets/fonts/NotoSansKR-500-subset.woff2") format("woff2");
        }
        #root {
          --paper: #F7F5F0;
          --mist: #F0EBE1;
          --ink: #131516;
          --ink-2: #6B6B6B;
          --aqua: #59B8AE;
          --rule: #E3E3E3;
          --font-body: "Inter", "Noto Sans KR Video", "Noto Sans KR", system-ui, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --t-body: 36px;
          --t-label: 24px; /* was 22 — matches the real design system's --t-label exactly (mono, "data label, kicker") */

          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper);
          color: var(--ink);
          font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }

        .proc-kicker {
          top: 620px;
          left: 0;
          width: 100%;
          text-align: center;
          font-family: var(--font-mono);
          font-size: var(--t-label);
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: var(--ink-2);
          opacity: 0;
        }

        .proc-search-bar {
          top: 780px;
          left: 80px;
          width: 920px;
          height: 108px;
          background: var(--mist);
          border: 1px solid var(--rule);
          border-radius: 54px;
          display: flex;
          align-items: center;
          padding: 0 44px;
          box-shadow: 0 18px 32px -20px rgba(19,21,22,.25);
        }
        .proc-search-text {
          font-family: var(--font-mono);
          font-size: var(--t-body);
          color: var(--ink);
          white-space: pre;
        }
        .proc-cursor {
          display: inline-block;
          width: 3px;
          height: 38px;
          background: var(--aqua);
          margin-left: 4px;
          vertical-align: -7px;
        }
        .proc-result {
          top: 950px;
          left: 80px;
          width: 920px;
          text-align: center;
          font-family: var(--font-mono);
          font-size: var(--t-label);
          letter-spacing: 0.04em;
          color: #595959;
          opacity: 0;
        }
      </style>

      <div data-hf-id="hf-a74q" id="root" data-composition-id="03-process" data-width="1080" data-height="1920" data-duration="12.2">
        <div data-hf-id="hf-30v9" id="proc-kicker" class="clip proc-kicker" data-start="0" data-duration="12.2" data-track-index="0">습 SeoulHabit · Research</div>

        <div data-hf-id="hf-oi5d" id="proc-search-bar" class="clip proc-search-bar" data-start="0" data-duration="12.2" data-track-index="1">
          <span data-hf-id="hf-irtn" class="proc-search-text" id="proc-search-text"></span><span data-hf-id="hf-k671" class="proc-cursor" id="proc-cursor"></span>
        </div>

        <div data-hf-id="hf-f3cx" id="proc-result" class="clip proc-result" data-start="0" data-duration="12.2" data-track-index="2">→ simple, bite-sized insights</div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#proc-kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);

        // ---- queries typed sequentially (context-sensitive-cursor / discrete-text-sequence) ----
        const QUERIES = [
          "what does snail mucin actually do?",
          "centella vs cica — same thing?",
          "heartleaf for redness?",
        ];
        const TYPE_START = [0.8, 5.2, 9.4];
        const CHAR_DUR = 0.037; // ~18% faster per-char reveal (YouTube Shorts pacing feedback)

        const SEQUENCE = [];
        QUERIES.forEach((q, qi) => {
          const start = TYPE_START[qi];
          for (let c = 1; c <= q.length; c++) {
            SEQUENCE.push({ t: start + (c - 1) * CHAR_DUR, text: q.slice(0, c) });
          }
          if (qi < QUERIES.length - 1) {
            const clearAt = start + q.length * CHAR_DUR + 1.4;
            SEQUENCE.push({ t: clearAt, text: "" });
          }
        });
        SEQUENCE.sort((a, b) => a.t - b.t);

        function entryAt(time) {
          for (let i = SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= SEQUENCE[i].t) return SEQUENCE[i];
          }
          return { text: "" };
        }

        const textEl = document.getElementById("proc-search-text");
        const driver = { t: 0 };
        tl.to(driver, {
          t: 12.2, duration: 12.2, ease: "none",
          onUpdate: () => { textEl.textContent = entryAt(driver.t).text; },
        }, 0);

        const blink = { p: 0 };
        tl.to(blink, {
          p: Math.PI * 2 * 12,
          duration: 12.2, ease: "none",
          onUpdate: () => {
            document.getElementById("proc-cursor").style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        }, 0);

        const RESULT_IN = [2.675, 6.895, 10.735];
        const resultEl = "#proc-result";
        RESULT_IN.forEach((t, i) => {
          tl.fromTo(resultEl, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
          if (i < RESULT_IN.length - 1) {
            tl.to(resultEl, { opacity: 0, duration: 0.3, ease: "power2.inOut" }, t + 1.7);
          }
        });

        // Clear the whole search block before the scene's cross-fade tail begins
        // (local 11.7/global 25.7, retimed 2026-08-29 — was local 12.0/global 30.0),
        // so it never overlaps Frame 4's incoming plate.
        tl.to(["#proc-kicker", "#proc-search-bar", "#proc-result"], {
          opacity: 0, duration: 0.4, ease: "power2.inOut",
        }, 11.3);

        tl.to({}, { duration: 12.2 }, 0); // full-span anchor

        window.__timelines["03-process"] = tl;
      </script>
    </template>
  </body>
</html>
