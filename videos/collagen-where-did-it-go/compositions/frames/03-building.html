  <script>
    window.__timelines = window.__timelines || {};
    // No `defaults: {ease}` -- every tween names its own. See _preamble.py.
    var tl = gsap.timeline({ paused: true });
    var EASE = {"arrive": "power2.out", "slam": "back.out(1.7)", "wipe": "power4.inOut", "count": "none", "swap": "expo.inOut", "exit": "power2.in", "hold": "sine.inOut", "camera": "power2.inOut"};

    var NS = "http://www.w3.org/2000/svg";
    function el(t, a, parent) { var n = document.createElementNS(NS, t);
      for (var k in a) n.setAttribute(k, a[k]); if (parent) parent.appendChild(n); return n; }
    function txt(parent, x, y, s, cls, anchor) {
      var t = el("text", { x:x, y:y, "class":cls || "", "text-anchor":anchor || "start" }, parent);
      t.textContent = s; return t; }

    // pathFollow: move `node` along `pathEl` between progress `from` and `to`
    // WITHOUT MotionPathPlugin and WITHOUT onUpdate. The path is SAMPLED at
    // build time into a chain of short linear x/y (and rotation) tweens, so the
    // pose at any timeline time is a plain property tween -- a pure function of
    // time under any seek. (An onUpdate proxy was tried first: the runtime seeks
    // with callbacks suppressed, and frame zero rendered the molecule at the END
    // of its run.) Convention: the node is DRAWN at the path's start point, so
    // the translation is (q - p0). Returns the end pose for the caller's next
    // fromTo. Easing is applied to the sampled progress, so the motion keeps its
    // curve while every sub-tween stays linear.
    function pathFollow(tl, node, pathEl, at, dur, ease, o) {
      o = o || {}; var from = o.from == null ? 0 : o.from, to = o.to == null ? 1 : o.to;
      var L = pathEl.getTotalLength(), p0 = pathEl.getPointAtLength(0);
      var ox = o.ox == null ? p0.x : o.ox, oy = o.oy == null ? p0.y : o.oy;
      var N = o.samples || Math.max(12, Math.round(dur * 30)), ef = gsap.parseEase(ease || "none");
      function pose(p) {
        var q = pathEl.getPointAtLength(p * L), r = { x:q.x - ox, y:q.y - oy };
        if (o.rotate) { var a = pathEl.getPointAtLength(Math.min(L, p * L + 4)),
                            b = pathEl.getPointAtLength(Math.max(0, p * L - 4));
                        r.rotation = Math.atan2(a.y - b.y, a.x - b.x) * 57.2958; }
        return r;
      }
      var start = pose(from);
      // frame zero, and any cold seek before `at`. A node that is walked by TWO
      // pathFollows (tract, then a branch) must pass { set:false } on the second:
      // two zero-duration sets at t=0 render in insertion order and the LATER
      // one wins every frame before `at` (measured: dispatch dots drawn at the
      // tract exit before "absorbed").
      if (o.set !== false) tl.set(node, start, 0);
      var prev = start;
      for (var i = 1; i <= N; i++) {
        var p = from + (to - from) * ef(i / N), nxt = pose(p);
        var t0 = at + dur * (i - 1) / N;
        tl.fromTo(node, prev, Object.assign({ duration: dur / N, ease: "none" }, nxt), t0);
        prev = nxt;
      }
      return prev;
    }
    // stroke draw-in; dasharray set from the measured length
    function drawIn(tl, sel, at, dur, stagger, ease) {
      gsap.utils.toArray(sel).forEach(function (p, i) {
        var L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
        tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur,
                  ease: ease || "power4.inOut" }, at + i * (stagger || 0));
      });
    }
    // numeral count -- ease none, or it lies. A PROPERTY tween on innerText
    // with a modifier (no onUpdate), so any seek renders the right numeral.
    function count(tl, id, from, to, at, dur, fmt) {
      var node = document.getElementById(id);
      var f = fmt || function (n) { return n.toLocaleString("en-GB"); };
      node.textContent = f(from);
      tl.fromTo(node, { innerText: from }, { innerText: to, duration: dur, ease: "none",
                modifiers: { innerText: function (v) { return f(Math.round(parseFloat(v))); } } }, at);
    }
    // a panel that must not leak its copy before its wash: CSS .late holds it at
    // opacity 0; reveal() switches it on right as the wash begins
    function reveal(tl, sel, at) { tl.to(sel, { opacity:1, duration:0.1 }, at); }

      var w = gsap.utils.toArray(sel + " .kt-word");
      if (mode === "slam") tl.fromTo(w, { opacity:0, scale:1.6 }, { opacity:1, scale:1,
            duration:0.32, stagger:step, ease:"back.out(1.7)" }, at);

            stagger:step, ease:"power2.out" }, at);
    }

    // The building: 5 storeys, an X-brace pair per storey (the collagen),
    // stable ids so a later phase MOVES a beam instead of redrawing it.
    // o.door adds the ground-floor door; o.into = parent group.
    function drawBuilding(svg, o) {
      o = o || {}; var P = o.into || svg;
      var STOREYS = 5, X0 = 90, X1 = 530, TOP = 150, H = 108;
      el("rect", { x:60, y:TOP+STOREYS*H+8, width:500, height:26, rx:4, "class":"b-slab", id:"b-slab" }, P);
      el("rect", { x:X0, y:TOP, width:X1-X0, height:STOREYS*H, rx:6, "class":"b-shell", id:"b-shell" }, P);
      for (var s = 0; s < STOREYS; s++) {
        var y = TOP + s*H, yb = y + H;
        el("line", { x1:X0, y1:yb, x2:X1, y2:yb, "class":"b-floor", id:"floor-"+s }, P);
        el("line", { x1:X0+16, y1:yb-6, x2:X1-16, y2:y+6, "class":"beam", id:"beam-"+s+"a" }, P);
        el("line", { x1:X1-16, y1:yb-6, x2:X0+16, y2:y+6, "class":"beam", id:"beam-"+s+"b" }, P);

        // knocks loose (04-demolition tweens it away; it never draws otherwise)
        shard(P, "shard-"+s+"a", X0+16, yb-6, X1-16, y+6);
        shard(P, "shard-"+s+"b", X1-16, yb-6, X0+16, y+6);

          el("rect", { x:X0+34+w*140, y:y+30, width:74, height:46, rx:3, "class":"b-win", id:"win-"+s+"-"+w }, P);
      }
      if (o.door) el("rect", { x:280, y:620, width:60, height:70, rx:3, "class":"b-door", id:"b-door" }, P);
    }
    function shard(P, id, x1, y1, x2, y2) {
      var mx = (x1 + x2) / 2, my = (y1 + y2) / 2, L = Math.hypot(x2 - x1, y2 - y1),
          ux = (x2 - x1) / L, uy = (y2 - y1) / L;
      el("line", { x1:(mx - 35 * ux).toFixed(1), y1:(my - 35 * uy).toFixed(1),
                   x2:(mx + 35 * ux).toFixed(1), y2:(my + 35 * uy).toFixed(1),
                   "class":"shard", id:id }, P);
    }
    // the same six beams the demolition cuts, in the order it cuts them
    var CUT_ORDER = ["4a","4b","3a","2b","3b","1a"];
    function setBeamsCut(tl, ids, offset) {
      ids.forEach(function (k) {
        var e = document.getElementById("beam-" + k);
        e.style.strokeDashoffset = "640"; e.style.opacity = "0.25";
        tl.set("#beam-" + k, { strokeDashoffset:640, opacity:0.25 }, 0);
      });
    }

    var svg = document.getElementById("stageC"), bwrap = document.getElementById("bwrap");
    drawBuilding(svg, { door:true, into:bwrap });
    // ---- unit 3: the building assembles from the slab up ----------------------
    tl.fromTo("#world", { scale:1.04 }, { scale:1, duration:1.2, ease:EASE.camera }, 0);
    gsap.set(["#b-door", ".b-floor", ".b-win"], { opacity:0 });
    gsap.set(".beam", { strokeDashoffset:640 });
    // frame zero already shows the slab and the shell: the iris opens on a site, not a void
    tl.fromTo("#b-shell", { scaleY:0.94, transformOrigin:"50% 100%" }, { scaleY:1, duration:0.6, ease:EASE.arrive }, 0.791 - 0.2);
    // GROUND UP: floors are laid bottom-first (stagger from:"end" -- DOM order is
    // top-down), each drawn across rather than faded in; the door is hung last
    tl.fromTo(".b-floor", { scaleX:0, transformOrigin:"0% 50%" },
              { scaleX:1, opacity:0.55, duration:0.32, stagger:{ each:0.07, from:"end" }, ease:EASE.arrive }, 0.791 + 0.15);
    tl.fromTo(".b-win", { opacity:0, scale:0.6 }, { opacity:1, scale:1, duration:0.3,
              stagger:{ each:0.03, from:"end" }, ease:EASE.arrive }, 0.791 + 0.45);
    tl.fromTo("#b-door", { scaleY:0, opacity:1, transformOrigin:"50% 100%" },
              { scaleY:1, duration:0.35, ease:EASE.arrive }, 0.791 + 0.9);
    // the collagen: beams DRAW in with the word
    tl.to(".beam", { strokeDashoffset:0, duration:0.55, stagger:{ each:0.10, from:"end" }, ease:EASE.wipe }, 2.286 - 0.1);
    reveal(tl, "#chip-beams", 2.286 + 0.2);
    tl.fromTo("#chip-beams-wash", { scaleX:0 }, { scaleX:1, duration:0.4, ease:EASE.wipe }, 2.286 + 0.2);
    // "the structure INSIDE it": the camera goes in, and comes back out as the
    // building is described holding. The beams drawing between these two words
    // is a stroke-dashoffset reveal -- real motion that a bounding-box tracker
    // cannot see at all, which is why 2.25s here read as frozen.
    tl.to("#world", { scale:1.07, y:18, duration:1.0, ease:EASE.camera }, 3.129 - 0.15);
    tl.to("#world", { scale:1, y:0, duration:0.6, ease:EASE.camera }, 5.161);

    // ---- unit 4: the demolition crew --------------------------------------------
    // "As we age, collagen production slows" -- the braces dim, and the agent of
    // the next sentence RISES into frame while it is still being said. A dim on
    // six thin lines is a real pixel change but moves no bounding box, so this
    // stretch read as 2.25s frozen; the sun arriving is both the missing motion
    // and the cause of everything that follows it.
    tl.to(".beam", { opacity:0.6, duration:0.6, ease:EASE.hold }, 6.303);
    tl.fromTo("#sun", { y:-300, scale:1, opacity:1, transformOrigin:"50% 50%" },
              { y:0, duration:1.9, ease:EASE.arrive }, 6.303 + 0.2);
    tl.to("#sun", { scale:1.12, duration:0.28, yoyo:true, repeat:1, ease:EASE.slam }, 8.952 - 0.1);
    tl.fromTo("#sky-wash", { scaleX:0 }, { scaleX:1, duration:0.5, ease:EASE.wipe }, 8.952 - 0.1);
    tl.to("#rays", { opacity:1, duration:0.1 }, 10.675);
    drawIn(tl, ".ray", 10.675, 0.5, 0.10, EASE.wipe);
    // camera pushes INTO the storeys being cut, then comes home on "sunscreen"
    tl.to("#world", { scale:1.18, x:83, y:23, duration:1.1, ease:EASE.camera }, 11.379 - 0.2);
    // each cut: the beam flashes at the cut point, retracts, and a SHARD of it
    // falls away -- UV is a cutting force, not an eraser
    CUT_ORDER.forEach(function (k, i) {
      var at = 11.379 + i * 0.34;
      tl.to("#beam-" + k, { stroke:"#C97A5C", duration:0.10, ease:EASE.slam }, at);
      tl.to("#beam-" + k, { strokeDashoffset:640, opacity:0.25, duration:0.42, ease:EASE.wipe }, at + 0.04);
      tl.fromTo("#shard-" + k, { opacity:1, y:0, rotation:0 },
                { y:110, rotation:(i % 2 ? 26 : -22), opacity:0, duration:0.6,
                  transformOrigin:"50% 50%", ease:EASE.exit }, at + 0.08);
    });
    tl.to("#bwrap", { skewX:-1.4, y:9, duration:0.6, ease:EASE.swap }, 12.332 + 0.3);
    reveal(tl, "#uv", 13.428 - 0.1);
    tl.fromTo("#uv-wash", { scaleX:0 }, { scaleX:1, duration:0.5, ease:EASE.wipe }, 13.428 - 0.1);
    kineticWords(tl, "#uv-1", 13.428, 0.08, "slam");
    kineticWords(tl, "#uv-2", 14.832, 0.08, "slam");
    tl.to("#sun", { scale:1.12, duration:0.25, yoyo:true, repeat:1, ease:EASE.slam }, 14.832);
    tl.fromTo("#cite-uv", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.35, ease:EASE.arrive }, 10.675 + 0.3);

    // ---- unit 5: the boundary ----------------------------------------------------
    tl.to("#world", { scale:1, x:0, y:0, duration:1.0, ease:EASE.camera }, 15.585 - 0.1);
    drawIn(tl, "#shield", 17.159 - 0.1, 0.9, 0, EASE.wipe);
    tl.to("#shield-fill", { opacity:0.30, duration:0.7, ease:EASE.wipe }, 17.789);
    // the boundary CLOSES around the building as it is named -- 2.2s of
    // identical frames sat here while the shield was merely present
    tl.fromTo(["#shield", "#shield-fill"], { scale:1.09, transformOrigin:"50% 50%" },
              { scale:1, duration:1.1, ease:EASE.arrive }, 18.556 - 0.2);
    // the rays STOP at the boundary; the sun band cools
    gsap.utils.toArray(".ray").forEach(function (r) {
      var L = r.getTotalLength();
      tl.to(r, { strokeDashoffset:L * 0.45, duration:0.6, ease:EASE.swap }, 17.789 + 0.1);
    });
    // the sky cools as the boundary is drawn (the only transform in a stretch of
    // stroke-dashoffset reveals, which a bounding-box motion tracker cannot see)
    tl.to("#sky-wash", { scaleX:0, transformOrigin:"100% 50%", duration:0.6, ease:EASE.exit }, 17.159 - 0.1);
    tl.to("#uv", { opacity:0.35, duration:0.5, ease:EASE.exit }, 17.789 + 0.1);
    reveal(tl, "#preserve", 20.564);
    tl.fromTo("#preserve-wash", { scaleX:0 }, { scaleX:1, duration:0.45, ease:EASE.wipe }, 20.564);
    tl.to("#chip-beams", { opacity:0.35, duration:0.4, ease:EASE.exit }, 20.564);
    // PRESERVING holds: the shield takes one pulse as it is named, and the camera
    // pulls back to take in the whole protected building -- the reframe the line
    // asks for, and the only bounding-box motion in a stretch whose other beats
    // are all stroke-dashoffset (invisible to the motion checker, which found
    // 2.32s frozen here before this leg existed).
    tl.to("#shield-fill", { opacity:0.42, duration:0.3, yoyo:true, repeat:1, ease:EASE.slam }, 20.564 + 0.1);
    tl.to("#world", { scale:0.955, duration:1.0, ease:EASE.camera }, 20.564 + 0.4);
    // REPLACING is tried, and fails: a cut beam starts to redraw and falls back.
    // The tail of the file is this attempt, not an idle drift.
    tl.fromTo("#beam-4a", { strokeDashoffset:640 }, { strokeDashoffset:430, duration:0.45, ease:EASE.arrive }, 22.860 - 0.1);
    tl.to("#beam-4a", { strokeDashoffset:640, duration:0.35, ease:EASE.exit }, 22.860 + 0.3);
    tl.to("#bwrap", { y:14, duration:0.45, ease:EASE.swap }, 22.860 + 0.3);
    tl.to("#world", { scale:1, duration:0.55, ease:EASE.camera }, 22.860 + 0.4);
    tl.to("#bwrap", { y:9, duration:0.4, ease:EASE.arrive }, 23.754);

    // departure: push under the iris wipe into the next file
    tl.to("#world", { scale:1.06, duration:0.55, ease:"power2.inOut" }, 24.037);

    tl.to({}, { duration: 24.587 }, 0);   // full-span anchor -- always last
    window.__timelines["03-building"] = tl;
  </script>
