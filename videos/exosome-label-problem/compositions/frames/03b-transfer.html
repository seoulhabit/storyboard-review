<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        *, *::before, *::after { box-sizing: border-box; }
        h1, h2, h3, p, figure, blockquote, ul, ol, dl { margin: 0; }

        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }

        /* PAPER GROUND -- paper-scoped --ink-2 for secondary text (4.89:1). */
        #root {
          --paper: #F7F5F0; --ink: #131516; --mist: #F0EBE1;
          --ink-2: #6B6B6B; --ink-3: #9C978D;
          --celadon: #93B896; --moss: #4F6B52; --rule-strong: #D9D3C6;
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--paper); font-family: var(--font-body);
        }

        /* Spatial plan
           1. .stage is one flex column, explicit 1920px height, real --safe-*
              padding, space-between across three zones (head / stack / close).
           2. The stack is a VERTICAL type list with a rail running down its
              left gutter -- deliberately NOT 03a's three-across tile grid. The
              two halves share a ground, so structure is what has to carry the
              cut, and a column against a row does that.
           3. The rail is the ONE absolutely positioned element and it is a
              child of .stack, not of the clip, so it is measured against
              .stack's own box and can never reach the canvas edge.
           4. No transform sits outside the padded box -- no --safe-*-zoomed. */
        .stage {
          display: flex; flex-direction: column; justify-content: space-between;
          height: 1920px;
          padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }

        .kicker { font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.14em;
                  text-transform: uppercase; color: var(--ink-2); opacity: 0; }
        .head h1 { font-weight: 800; font-size: 76px; line-height: 1.06;
                   letter-spacing: -0.03em; color: var(--ink); margin-top: 20px; }

        .stack { position: relative; padding-left: 76px;
                 display: flex; flex-direction: column; gap: 34px; }
        .rail { position: absolute; left: 18px; top: 14px; width: 5px; height: 0;
                background: var(--celadon); }
        .node { position: absolute; left: 8px; width: 25px; height: 25px;
                border-radius: 50%; background: var(--celadon); opacity: 0; }
        #tr-n1 { top: 22px; } #tr-n2 { top: 137px; } #tr-n3 { top: 252px; }
        .mat { font-weight: 800; font-size: 66px; line-height: 1.0;
               letter-spacing: -0.02em; color: var(--ink); }
        .mat b { display: block; font-family: var(--font-mono); font-weight: 500;
                 font-size: 32px; letter-spacing: 0.06em; color: var(--ink-2);
                 margin-top: 8px; }

        .verdict { align-self: flex-start; background: var(--ink); width: 0;
                   overflow: hidden; height: 84px; }
        .verdict span { display: block; font-family: var(--font-mono); font-size: 36px;
                        line-height: 84px; padding: 0 26px; letter-spacing: 0.05em;
                        color: var(--paper); text-transform: uppercase; white-space: nowrap; }

        .close p { font-weight: 800; font-size: 54px; line-height: 1.18; color: var(--ink);
                   opacity: 0; }
        .close-foot { display: flex; justify-content: flex-end; margin-top: 24px; }
        .cite { transform-origin: 100% 50%; width: max-content;
                font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.04em;
                color: var(--ink); border: 2px solid rgba(79,107,82,0.45);
                background: rgba(147,184,150,0.20); border-radius: 999px;
                padding: 10px 22px; white-space: nowrap; opacity: 0; }

        #root.debug-layout * { outline: 1px solid rgba(255,0,0,0.6) !important; }
        #root.debug-layout .stage { outline: 2px solid #00E5FF !important; }
        #root.debug-layout::after {
          content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 99;
          background:
            linear-gradient(to left,   rgba(255,0,168,.22) 15%, transparent 15%),
            linear-gradient(to top,    rgba(255,0,168,.22) 20%, transparent 20%),
            linear-gradient(to bottom, rgba(255,0,168,.22) 10%, transparent 10%);
        }
      </style>

      <div id="root" data-composition-id="03b-transfer"
           data-width="1080" data-height="1920" data-duration="5.670">
        <div class="stage">

          <div class="head">
            <p class="kicker" id="tr-kicker">These are different materials</p>
            <h1>Evidence for one<br>isn&rsquo;t evidence<br>for the others.</h1>
          </div>

          <div class="stack">
            <div class="rail" id="tr-rail"></div>
            <span class="node" id="tr-n1"></span>
            <span class="node" id="tr-n2"></span>
            <span class="node" id="tr-n3"></span>
            <p class="mat" id="tr-m1">Cell-derived<b>stem cell · platelet · milk</b></p>
            <p class="mat" id="tr-m2">Plant<b>leaf, root extract</b></p>
            <p class="mat" id="tr-m3">Ferment<b>bacteria derived</b></p>
          </div>

          <div class="close">
            <div class="verdict" id="tr-verdict" data-layout-allow-overflow><span>Proof does not transfer</span></div>
            <p id="tr-close" style="margin-top:28px">Studied separately.<br>Sold under one word.</p>
            <div class="close-foot">
              <span class="cite" id="tr-cite">J Nanobiotechnology · 2025</span>
            </div>
          </div>

        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        // Headline and the three material names are composed at t=0: this scene
        // opens on the list 03a just finished building, so the cut reads as a
        // change of view on the same three things, not a fresh start.

        tl.to('#tr-kicker', { opacity: 1, duration: 0.28, ease: 'none' }, 0.12);

        // 0.35 the celadon rail draws DOWN the gutter, joining the three names --
        // the proposition that evidence flows between them.
        tl.to('#tr-rail', { height: 300, duration: 0.70, ease: 'power2.inOut' }, 0.35);
        tl.to('#tr-n1', { opacity: 1, duration: 0.20, ease: 'none' }, 0.55);
        tl.to('#tr-n2', { opacity: 1, duration: 0.20, ease: 'none' }, 0.82);
        tl.to('#tr-n3', { opacity: 1, duration: 0.20, ease: 'none' }, 1.09);

        // 1.75 the bar strikes and the rail dims underneath it: the proposition
        // is withdrawn. This is the beat the whole scene exists for.
        tl.to('#tr-verdict', { width: 600, duration: 0.46, ease: 'power2.inOut' }, 1.75);
        tl.to(['#tr-rail','#tr-n1','#tr-n2','#tr-n3'],
              { opacity: 0.20, duration: 0.40, ease: 'none' }, 1.95);

        // 2.55-3.15 the three names step back in sequence -- still there, but no
        // longer linked. Three real state changes through the scene's middle.
        tl.to('#tr-m1', { opacity: 0.42, x: 14, duration: 0.30, ease: 'power2.inOut' }, 2.55);
        tl.to('#tr-m2', { opacity: 0.42, x: 14, duration: 0.30, ease: 'power2.inOut' }, 2.85);
        tl.to('#tr-m3', { opacity: 0.42, x: 14, duration: 0.30, ease: 'power2.inOut' }, 3.15);

        tl.fromTo('#tr-close', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.32 }, 3.70);
        tl.fromTo('#tr-cite', { opacity: 0, scale: 0.94 },
                              { opacity: 1, scale: 1, duration: 0.34, ease: 'back.out(2)' }, 4.45);
        tl.to('#tr-verdict', { x: 22, duration: 0.60, ease: 'power2.out' }, 4.95);

        tl.to({}, { duration: 5.670 }, 0); // full-span anchor -- always last
        window.__timelines["03b-transfer"] = tl;
      </script>
    </template>
  </body>
</html>
