      ratio, and every inner .clip data-duration synced to the beat total (the defect
      recorded in BRIEF.md render QA).
      Beat 2 carries a 1.173s tail rather than 1.0s: its ambient fragment drift, scaled
      proportionally, ends at 12.793s and would be clipped by a 12.677s beat.

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];

        // 1 -> 2 : cut (no tween — matches this beat's punchy tech-glitch SFX cut)

        // 2 -> 3 : crossfade
        tl.to("#el-02-identity", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 19.401);
        tl.fromTo("#el-03-history", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 19.401);

        // 3 -> 4 : crossfade (continuous "just under the surface" world)
        tl.to("#el-03-history", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 29.916);
        tl.fromTo("#el-04-mechanism", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 29.916);

        // 4 -> 5 : crossfade
        tl.to("#el-04-mechanism", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 44.923);
        tl.fromTo("#el-05-fibroblast", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 44.923);

        tl.to({}, { duration: 61.153 }, 0); // full-span anchor — main.duration() == composition total
