<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingredient Identity Map — Catalog V2</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    :root{--rice:#f3f4ef;--ink:#172332;--soft:#526071;--line:rgba(23,35,50,.16);--perilla:#7f9d88;--assay:#6358a7;--signal:#e15f52;--amber:#a67b35}
    html,body{min-height:100%}body{margin:0;padding:clamp(16px,2vw,30px);background:#d7dcd8;color:var(--ink);font-family:"Avenir Next","Noto Sans KR","Helvetica Neue",Arial,sans-serif}button{font:inherit}
    .shell{width:min(1600px,100%);margin:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:14px}.toolbar-copy{display:grid;gap:2px}.toolbar-copy strong{font-size:15px}.toolbar-copy span{font-size:13px;color:var(--soft)}
    .switcher{display:flex;padding:4px;border:1px solid rgba(23,35,50,.24);border-radius:999px;background:rgba(255,255,255,.42)}.switcher button{border:0;border-radius:999px;padding:8px 15px;color:var(--soft);background:transparent;cursor:pointer}.switcher button[aria-selected="true"]{color:white;background:var(--ink)}button:focus-visible{outline:3px solid var(--assay);outline-offset:3px}
    .stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid rgba(23,35,50,.17);border-radius:24px;background:radial-gradient(circle at 77% 42%,rgba(99,88,167,.12),transparent 27%),linear-gradient(112deg,#e5e9e3 0 29%,var(--rice) 29%);box-shadow:0 28px 70px rgba(23,35,50,.15)}
    .stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(23,35,50,.025) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(rgba(23,35,50,.025) 1px,transparent 1px) 0 0/48px 48px}
    .masthead{position:absolute;z-index:5;top:4.3%;left:4%;right:4%;display:flex;justify-content:space-between;font-size:clamp(11px,.85vw,16px)}.brand{font-weight:680}.note{max-width:43ch;color:var(--soft);text-align:right;line-height:1.35}
    .content{position:absolute;z-index:2;inset:12% 4% 6%;display:grid;grid-template-columns:minmax(290px,.7fr) minmax(0,1.8fr);gap:clamp(34px,4vw,76px)}
    .hero{display:grid;align-content:center;gap:clamp(18px,2vw,32px)}.consumer-label{color:var(--soft);font-size:clamp(12px,.85vw,16px)}h1{margin:0;font-size:clamp(52px,7vw,132px);font-weight:620;letter-spacing:-.075em;line-height:.82;overflow-wrap:anywhere}.hero-rule{width:70%;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--perilla),var(--assay),var(--signal))}.hero-copy{max-width:28ch;margin:0;color:var(--soft);font-size:clamp(14px,1.18vw,22px);line-height:1.4}
    .dossier{position:relative;display:grid;grid-template-rows:auto 1fr auto;min-height:0;padding:clamp(24px,2.3vw,42px);overflow:hidden;border:1px solid rgba(255,255,255,.9);border-radius:22px;background:rgba(255,255,255,.68);box-shadow:inset 0 0 0 1px rgba(23,35,50,.05),0 20px 58px rgba(23,35,50,.09);backdrop-filter:blur(14px)}
    .dossier::before{content:"";position:absolute;z-index:0;top:0;bottom:0;left:0;width:10px;background:linear-gradient(var(--perilla),var(--assay) 58%,var(--signal))}.dossier-title{position:relative;z-index:2;display:flex;justify-content:space-between;gap:20px;padding-bottom:16px;border-bottom:1px solid var(--line);font-size:clamp(12px,.85vw,16px)}.dossier-title span:last-child{color:var(--soft);text-align:right}
    .identity-stack{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,1fr);align-items:stretch;padding:clamp(14px,1.4vw,24px) 0}.layer{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-width:0;padding:clamp(13px,1.25vw,22px);border-right:1px solid var(--line)}.layer:last-child{border-right:0}.layer-name{color:var(--soft);font-size:clamp(10px,.68vw,13px)}.layer-value{align-self:center;font-size:clamp(14px,1.2vw,22px);font-weight:620;letter-spacing:-.025em;line-height:1.1;overflow-wrap:anywhere}.state{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:clamp(9px,.62vw,12px)}.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--state-color,var(--perilla))}.layer[data-state="not_disclosed"]{--state-color:var(--signal)}.layer[data-state="not_established"]{--state-color:#7d8791}.layer[data-state="requires_context"]{--state-color:var(--assay)}
    .scan-line{position:absolute;z-index:4;top:20%;bottom:17%;left:21%;width:3px;background:linear-gradient(transparent,var(--assay) 16% 84%,transparent);box-shadow:0 0 20px rgba(99,88,167,.7);opacity:0;transform:translateX(0);pointer-events:none}.dossier.scanning .scan-line{animation:scan 1.5s cubic-bezier(.3,.75,.25,1) forwards}@keyframes scan{0%{opacity:0;transform:translateX(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateX(51vw)}}
    .identity-lock{position:relative;z-index:2;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:clamp(14px,1.3vw,22px);border-radius:14px;color:white;background:var(--ink)}.lock-mark{display:grid;place-items:center;width:clamp(36px,3vw,52px);aspect-ratio:1;border:2px solid var(--perilla);border-radius:50%;color:var(--perilla);font-size:1.35em}.lock-copy{font-size:clamp(13px,1.1vw,20px);font-weight:550;line-height:1.3}.scan-button{border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:9px 14px;color:white;background:transparent;cursor:pointer}
    @media(max-width:840px){body{padding:12px}.toolbar{align-items:flex-start;flex-direction:column}.stage{aspect-ratio:9/16;min-height:780px}.note{display:none}.content{inset:9% 5% 4%;grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:18px}.hero{gap:9px}.consumer-label{font-size:11px}h1{font-size:56px;line-height:.9}.hero-copy{font-size:12px}.dossier{padding:17px}.identity-stack{grid-template-columns:1fr;padding:8px 0}.layer{grid-template-columns:.7fr 1.5fr .8fr;grid-template-rows:auto;align-items:center;min-height:64px;padding:9px 5px;border-right:0;border-bottom:1px solid var(--line)}.layer:last-child{border-bottom:0}.layer-value{font-size:12px}.state{font-size:9px}.identity-lock{grid-template-columns:auto 1fr;padding:10px}.scan-button{display:none}.lock-copy{font-size:11px}.scan-line{display:none}}
    @media(prefers-reduced-motion:reduce){.dossier.scanning .scan-line{animation:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="toolbar"><div class="toolbar-copy"><strong>Ingredient Identity Map</strong><span>Working Catalog V2 component · one consumer name, five identity fields</span></div><div class="switcher" role="tablist" aria-label="Ingredient fixture"><button type="button" role="tab" aria-selected="true" data-fixture="cica">Cica demo</button><button type="button" role="tab" aria-selected="false" data-fixture="snail">Snail Mucin</button><button type="button" role="tab" aria-selected="false" data-fixture="pdrn">PDRN</button></div></header>
    <section class="stage" aria-label="Ingredient identity component preview">
      <div class="masthead"><div class="brand">SeoulHabit identity review</div><div class="note">Identity fields remain separate. A familiar hero name does not certify a specific material or its performance.</div></div>
      <div class="content">
        <div class="hero"><div class="consumer-label">What the shopper sees</div><h1 id="consumerName">Cica</h1><div class="hero-rule"></div><p class="hero-copy" id="heroCopy"></p></div>
        <article class="dossier" id="dossier"><div class="dossier-title"><span>Ingredient identity record</span><span id="disclosure"></span></div><div class="identity-stack" id="identityStack"></div><div class="identity-lock"><div class="lock-mark">ID</div><div class="lock-copy" id="lockCopy"></div><button class="scan-button" id="scanButton" type="button">Scan the record</button></div><div class="scan-line"></div></article>
      </div>
    </section>
  </main>
  <script>
    const fixtures={
      cica:{name:"Cica",copy:"A useful consumer shorthand. The exact label and material details still need to be checked.",disclosure:"Fictional source-story demonstration",lock:"“Cica” identifies a topic. It does not identify the exact tested preparation.",layers:[["Consumer name","Cica","known"],["Label declaration","Centella Asiatica Extract","requires_context"],["Source","Centella asiatica plant","requires_context"],["Process or form","Not disclosed","not_disclosed"],["Studied-material match","Not established","not_established"]]},
      snail:{name:"Snail Mucin",copy:"The consumer category is broader than the specific secretion preparations used in small studies.",disclosure:"Governed Snail Mucin pack fixture",lock:"Read the selected product label; do not assume every filtrate has the same process or evidence.",layers:[["Consumer name","Snail mucin","known"],["Preferred pack term","Snail Secretion Filtrate","requires_context"],["Source","Animal-derived secretion","known"],["Process or form","Can vary","requires_context"],["Studied-material match","Product-specific","not_established"]]},
      pdrn:{name:"PDRN",copy:"Market and label terms can overlap without proving the same source, fragment profile, formula, or route.",disclosure:"Governed PDRN pack fixture",lock:"PDRN, PN, Hydrolyzed DNA, Sodium DNA, and Phyto-PDRN are not automatic synonyms.",layers:[["Consumer name","PDRN","known"],["Exact declaration","Photo required","not_disclosed"],["Source","Product-specific","not_disclosed"],["Fragment or form","Product-specific","not_disclosed"],["Studied-material match","Not established","not_established"]]}
    };
    const stateLabels={known:"known",not_disclosed:"not disclosed",not_established:"not established",requires_context:"context required"};
    function render(key){const f=fixtures[key];document.querySelector("#consumerName").textContent=f.name;document.querySelector("#heroCopy").textContent=f.copy;document.querySelector("#disclosure").textContent=f.disclosure;document.querySelector("#lockCopy").textContent=f.lock;document.querySelector("#identityStack").innerHTML=f.layers.map(([name,value,state])=>`<div class="layer" data-state="${state}"><div class="layer-name">${name}</div><div class="layer-value">${value}</div><div class="state">${stateLabels[state]}</div></div>`).join("");}
    document.querySelectorAll("[data-fixture]").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll("[data-fixture]").forEach(item=>item.setAttribute("aria-selected","false"));button.setAttribute("aria-selected","true");render(button.dataset.fixture)}));
    document.querySelector("#scanButton").addEventListener("click",()=>{const dossier=document.querySelector("#dossier");dossier.classList.remove("scanning");void dossier.offsetWidth;dossier.classList.add("scanning")});
    render("cica");
  </script>
</body>
</html>
