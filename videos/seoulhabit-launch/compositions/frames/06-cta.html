      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Lockup: slide-up crossfade (endcard pattern) — settled before the pill beat.
        tl.fromTo(
          "#cta-lockup",
          { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" },

        // Follow pill: the frame's one voltage moment — a --d-snap (180ms) emphasis

        tl.set("#cta-cursor", { x: 680, y: 1000 }, 1.0);
        tl.to("#cta-cursor", { opacity: 1, duration: 0.15 }, 1.05);
        tl.to("#cta-cursor", { x: 527, y: 801, duration: 0.35, ease: "power2.inOut" }, 1.05);
        tl.to("#cta-cursor", { scale: 0.7, duration: 0.12, ease: "power2.out" }, 1.5);
        tl.to("#cta-cursor", { scale: 1, duration: 0.15, ease: "power2.out" }, 1.62);
        tl.to("#cta-cursor", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 1.9);

        tl.to({}, { duration: 9 }, 0); // full-span anchor

        window.__timelines["06-cta"] = tl;
