      <style>

        @font-face { font-family: "EB Garamond"; font-weight: 400; font-style: normal;
          src: url("assets/fonts/eb-garamond-400.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 100 900; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "Noto Sans KR Video"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/NotoSansKR-500-subset.woff2") format("woff2"); font-display: block; }

        #root {
          --paper: #F7F5F0; --ink: #131516; --aqua: #59B8AE; --leaf: #6F8F72; --coral: #C97A5C;
          --highlighter: #E0A32B; --ink-2: #6B6B6B; --ink-3: #9C978D;
          --white: #FCFBF9;
          --font-display: "EB Garamond", Georgia, "Times New Roman", serif;
          --font-body: "Inter", "Noto Sans KR Video", "Noto Sans KR", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --font-kr: "Noto Sans KR Video", sans-serif;
          --t-hero: 96px; --t-figure: 60px; --t-frame: 50px; --t-body: 32px; --t-label: 24px; --t-chip: 22px; --t-floor: 20px;
          --safe-top: 120px; --safe-bottom: 360px; --safe-left: 60px; --safe-right: 162px;
          --e-out: cubic-bezier(0.215,0.61,0.355,1); --e-in: cubic-bezier(0.55,0.055,0.675,0.19); --e-inout: cubic-bezier(0.455,0.03,0.515,0.955);
          --d-snap: 180ms; --d-fast: 400ms; --d-base: 500ms;
          --elev-2: 0 18px 32px -20px rgba(19,21,22,0.35);

          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--paper); font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }

        /* full-bleed macro plate -- the presenter for this video (frame.md § Faceless) */
        .hero-media { position: absolute; inset: 0; background: var(--paper); overflow: hidden; }
        .hero-media img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* legibility scrim behind the headline stack, per tokens.css --scrim-top */
        .hero-scrim-top { background: linear-gradient(to bottom, rgba(247,245,240,0.92) 0%, rgba(247,245,240,0.55) 55%, rgba(247,245,240,0) 100%); }

        /* top offset is --safe-top + 130px, not --safe-top alone: at 120px
           the title's cap-height sits inside YouTube Shorts' own ~10% (192px)
           top UI zone (search/camera icons), which is tighter than this
           channel's --safe-top token. Scene-local rather than raising the
           shared token -- that token is identical across all four channel
           projects and changing it is a channel-level decision. */
        .headline-zone { position: absolute; top: calc(var(--safe-top) + 130px); left: var(--safe-left); right: var(--safe-right);
          bottom: auto; display: flex; flex-direction: column; gap: 14px; }
        .h-line { font-family: var(--font-body); font-weight: 800; font-size: var(--t-hero); line-height: 1.02;
          letter-spacing: -0.018em; color: var(--ink); --p: 0; opacity: var(--p);
          transform: translateY(calc((1 - var(--p)) * 24px)); }
        .h-or-row { display: flex; align-items: center; gap: 16px; --p: 0; opacity: var(--p);
          transform: translateY(calc((1 - var(--p)) * 16px)); }
        .h-or-rule { flex: 1 1 auto; height: 2px; background: var(--aqua); opacity: 0.55; }
        /* filled chip, not aqua-on-paper text: aqua's own text-on-light contrast
           measured 2.17:1 against the required 3:1 (WCAG AA, large text) --
           ink-on-aqua clears that easily while keeping this frame's one aqua
           accent exactly where the design calls for it. */
        .h-or { font-family: var(--font-mono); font-weight: 500; font-size: 40px; letter-spacing: 0.06em;
          color: var(--ink); background: var(--aqua); padding: 6px 18px; border-radius: 6px; }
        .subhead { font-family: var(--font-body); font-weight: 700; font-size: var(--t-body); line-height: 1.3;
          color: var(--ink); margin-top: 6px; --p: 0; opacity: var(--p);
          transform: translateY(calc((1 - var(--p)) * 16px)); }

      </style>

        <div data-hf-id="hf-47xh" class="clip hero-scrim-top"></div>

          <div data-hf-id="hf-1orh" class="h-or-row" id="f1-or-row"><div data-hf-id="hf-sad1" class="h-or-rule"></div><div data-hf-id="hf-rhmf" class="h-or">OR</div><div data-hf-id="hf-mqi1" class="h-or-rule"></div></div>
          <div data-hf-id="hf-g1y1" class="h-line" id="f1-line-b">CENTELLA?</div>
          <div data-hf-id="hf-v0rv" class="subhead" id="f1-subhead">If your skin is red and angry, stop guessing.</div>
        </div>

      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // frame zero: the palette photo (both substances already visible side by side)
        // is the primary hook claim and is settled from t=0 -- mandatory rule 4. The
        // headline stack is a supporting label that builds in over the first 0.4s,

        tl.fromTo("#f1-hero img", { scale: 1.05 }, { scale: 1.0, duration: 5.260, ease: "none" }, 0);
        tl.fromTo("#f1-line-a", { "--p": 0 }, { "--p": 1, duration: 0.4, ease: "power3.out" }, 0.05);
        tl.fromTo("#f1-or-row", { "--p": 0 }, { "--p": 1, duration: 0.35, ease: "power3.out" }, 0.18);
        tl.fromTo("#f1-line-b", { "--p": 0 }, { "--p": 1, duration: 0.4, ease: "power3.out" }, 0.28);
        tl.fromTo("#f1-subhead", { "--p": 0 }, { "--p": 1, duration: 0.4, ease: "power3.out" }, 0.42);

        tl.to({}, { duration: 5.260 }, 0);
        window.__timelines["01-hook"] = tl;
      </script>
    </template>
