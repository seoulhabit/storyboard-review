<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  /* ---- scene 1: leaves settle + snail glides in from the left ---- */
  tl.fromTo(".wis-leaves", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);

  tl.fromTo(
    "#wis-snail-wrap",
    { x: -820 },
    { x: 0, duration: 2.25, ease: "power2.out" },
    0.10
  );

  // quiet trail echoes, lagging behind and fading before the snail settles
  tl.fromTo("#wis-echo-1", { x: -900, opacity: 0.32 }, { x: -160, opacity: 0, duration: 1.55, ease: "power2.out" }, 0.28);
  tl.fromTo("#wis-echo-2", { x: -950, opacity: 0.22 }, { x: -260, opacity: 0, duration: 1.5, ease: "power2.out" }, 0.42);

  /* ---- scene 2: label per-word reveal (waterfall whip-in), synced to VO ---- */
  tl.set("#wis-word-1", { opacity: 1, y: 40 }, 2.50);
  tl.to("#wis-word-1", { y: 0, duration: 0.16, ease: "power4.out" }, 2.50);

  tl.set("#wis-word-2", { opacity: 1, y: 45 }, 2.64);
  tl.to("#wis-word-2", { y: 0, duration: 0.15, ease: "power4.out" }, 2.64);

  tl.set("#wis-word-3", { opacity: 1, y: 42 }, 2.77);
  tl.to("#wis-word-3", { y: 0, duration: 0.14, ease: "power4.out" }, 2.77);

  /* ---- scene 3: ONE diagonal clip-path wipe clears the snail+label group ---- */
  const wipeEl = document.getElementById("wis-scene-a");
  const wipeDriver = { p: 0 };
  function wisWipePolygon(p) {
    const start = -60;
    const end = 140;
    const linePos = start + p * (end - start);
    const slant = 35;
    const topX = linePos;
    const bottomX = linePos - slant;
    return "polygon(" + topX + "% -20%, 140% -20%, 140% 120%, " + bottomX + "% 120%)";
  }
  wipeEl.style.clipPath = wisWipePolygon(0);
  tl.to(
    wipeDriver,
    {
      p: 1,
      duration: 0.6,
      ease: "power2.in",
      onUpdate: () => { wipeEl.style.clipPath = wisWipePolygon(wipeDriver.p); },
    },
    5.0
  );

  /* composition card revealed as the wipe clears */
  tl.fromTo("#wis-card", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 5.15);
  tl.fromTo("#wis-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, 5.45);

  // items land as the VO names each, citation chip lands last after the claim
  tl.fromTo("#wis-item-1", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 6.5);
  tl.fromTo("#wis-item-2", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 7.3);

  /* ---- scene 4: subordinate reassurance line, lower third, its own citation ---- */
  tl.fromTo("#wis-sub-line1", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 8.6);
  tl.fromTo("#wis-sub-line2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 9.0);

  /* subtle breathing on the settled card through the final hold (sine-wave-loop, low end) */
  const cardEl = document.getElementById("wis-card");
  const breathPhase = { p: 0 };
  const BREATH_CYCLES = 1.5;
  tl.to(
    breathPhase,
    {
      p: Math.PI * 2 * BREATH_CYCLES,
      duration: 2.4,
      ease: "none",
      onUpdate: () => {
        const s = Math.sin(breathPhase.p);
        cardEl.style.transform = "translateY(" + (s * 2) + "px) scale(" + (1 + s * 0.01) + ")";
      },
    },
    9.7
  );

  window.__timelines["03-what-is"] = tl;
</script>
