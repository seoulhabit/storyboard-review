<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "EB Garamond";
          font-weight: 400;
          font-style: normal;
          src: url("assets/fonts/eb-garamond-400.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "JetBrains Mono";
          font-weight: 100 900;
          font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2");
          font-display: block;
        }
        #root {
          --paper: #F7F5F0;
          --white: #FCFBF9;
          --ink: #131516;
          --ink-2: #6B6B6B;
          --ink-3: #9C978D;
          --aqua: #59B8AE;
          --font-display: "EB Garamond", Georgia, "Times New Roman", serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --t-label: 24px;
          --elev-2: 0 18px 32px -20px rgba(19, 21, 22, 0.35);

          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper);
          font-family: var(--font-mono);
        }
        .clip { position: absolute; inset: 0; }

        .tear-card {
          top: 240px; left: 90px; width: 900px; height: 1200px;
          transform-origin: 0 0;
          background: var(--white);
          border-radius: 16px;
          box-shadow: var(--elev-2);
          padding: 56px 48px;
          opacity: 0;
          transform: translateY(40px);
        }
        .tear-brand { font-family: var(--font-display); font-size: 40px; color: var(--ink); margin-bottom: 6px; }
        .tear-sub { font-family: var(--font-mono); font-size: var(--t-label); color: var(--ink-2); margin-bottom: 32px; }
        .tear-row {
          font-family: var(--font-mono);
          font-size: 27px;
          color: var(--ink-2);
          padding: 10px 0;
          border-bottom: 1px solid rgba(19,21,22,0.08);
        }
        .tear-row.tear-hero { color: var(--ink); font-weight: 700; }
        .tear-row.tear-below { color: var(--ink-2); filter: blur(1.5px); }

        .tear-mark-circle {
          position: absolute;
          left: -14px; top: 2px; width: 240px; height: 52px;
          border: 4px solid var(--aqua);
          border-radius: 999px;
          opacity: 0;
        }
        .tear-mark-strike {
          position: absolute;
          left: 0; top: 50%; width: 0%; height: 4px;
          background: var(--ink);
        }
        .tear-row-wrap { position: relative; }

        /* reading-progress scan bar: a real render (postrender/check-blank-frames.py)
           showed delaying every row's reveal to its VO onset reintroduced the exact
           near-white-card low-contrast defect the original build already fixed — so the
           rows fill fast again (below) for contrast, and this bar instead carries the
           1.3-5.9s gap with motion that encodes "we're reading down toward Niacinamide". */
        .tear-scan {
          position: absolute; left: 0; right: 0; top: 171px; height: 65px;
          background: rgba(89, 184, 174, 0.10);
          border-left: 3px solid var(--aqua);
          opacity: 0;
        }

        .tear-disclaimer {
          top: 1480px; left: 90px; width: 900px;
          text-align: center;
          font-family: var(--font-mono);
          font-size: var(--t-label);
          color: var(--ink-2);
          opacity: 0;
        }
      </style>

      <div data-hf-id="hf-tear-root" id="root" data-composition-id="06-teardown" data-width="1080" data-height="1920" data-duration="19.02">
        <div data-hf-id="hf-tear-card" id="tear-card" class="clip tear-card" data-start="0" data-duration="19.02">
          <div data-hf-id="hf-tear-brand" class="tear-brand" id="tear-brand">GLOW SERUM</div>
          <div data-hf-id="hf-tear-sub" class="tear-sub" id="tear-sub">PROPOLIS + NIACINAMIDE — INCI ORDER</div>

          <div data-hf-id="hf-tear-r1" class="tear-row tear-hero" id="tear-row-1">Propolis Extract</div>
          <div data-hf-id="hf-tear-r2" class="tear-row" id="tear-row-2">Dipropylene Glycol</div>
          <div data-hf-id="hf-tear-r3" class="tear-row" id="tear-row-3">Glycerin</div>
          <div data-hf-id="hf-tear-r4" class="tear-row" id="tear-row-4">Butylene Glycol</div>
          <div data-hf-id="hf-tear-r5" class="tear-row" id="tear-row-5">Water</div>
          <div data-hf-id="hf-tear-scan" class="tear-scan" id="tear-scan"></div>
          <div data-hf-id="hf-tear-r6wrap" class="tear-row-wrap">
            <div data-hf-id="hf-tear-r6" class="tear-row tear-hero" id="tear-row-6">Niacinamide (2%)</div>
            <div data-hf-id="hf-tear-mark" class="tear-mark-circle" id="tear-mark-circle"></div>
          </div>
          <div data-hf-id="hf-tear-r7" class="tear-row" id="tear-row-7">1,2-Hexanediol</div>
          <div data-hf-id="hf-tear-r8" class="tear-row" id="tear-row-8">Centella Asiatica Extract</div>
          <div data-hf-id="hf-tear-r9" class="tear-row" id="tear-row-9">Calophyllum Inophyllum Seed Oil</div>
          <div data-hf-id="hf-tear-r10wrap" class="tear-row-wrap">
            <div data-hf-id="hf-tear-r10" class="tear-row tear-hero" id="tear-row-10">Ethylhexylglycerin</div>
            <div data-hf-id="hf-tear-strike" class="tear-mark-strike" id="tear-mark-strike" data-layout-allow-occlusion></div>
          </div>
          <div data-hf-id="hf-tear-r11" class="tear-row tear-below" id="tear-row-11">Dextrin</div>
          <div data-hf-id="hf-tear-r12" class="tear-row tear-below" id="tear-row-12">Pentylene Glycol</div>
          <div data-hf-id="hf-tear-r13" class="tear-row tear-below" id="tear-row-13">Tocopherol</div>
          <div data-hf-id="hf-tear-r14" class="tear-row tear-below" id="tear-row-14">Xanthan Gum, Carbomer</div>
        </div>
        <div data-hf-id="hf-tear-disc" id="tear-disclaimer" class="clip tear-disclaimer" data-start="0" data-duration="19.02">Real published order (incidecoder.com) — general reference, not a brand endorsement.</div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // card drop-in (SFX whoosh-thud.mp3)
        tl.fromTo("#tear-card", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.15);

        // Fast fill for contrast (rows 1-10 populate the near-white card by ~1.14s, same
        // pacing as the original build — delaying this to match each VO onset reintroduced
        // the exact near-white/low-contrast defect the original fix addressed). The reading
        // scan bar below carries the 1.3-5.9s gap instead, so the card isn't just visible,
        // it's doing something while the VO reads down toward Niacinamide.
        const ROWS = ["#tear-row-1", "#tear-row-2", "#tear-row-3", "#tear-row-4", "#tear-row-5", "#tear-row-6", "#tear-row-7", "#tear-row-8", "#tear-row-9", "#tear-row-10"];
        ROWS.forEach((id, i) => {
          tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power3.out" }, 0.6 + i * 0.06);
        });

        // Reading-progress bar: one continuous move from row 1 to row 6 while VO says
        // "Beauty of Joseon Glow Serum. We've got propolis extract making up the bulk, and
        // our active niacinamide..." (local 1.31-6.19) — real motion tied to the actual
        // line, not decoration added to pass a scanner.
        tl.fromTo("#tear-scan", { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.3 }, 1.3);
        tl.to("#tear-scan", { y: 327, duration: 4.3, ease: "power1.inOut" }, 1.6);
        tl.to("#tear-scan", { opacity: 0, duration: 0.25 }, 5.85);

        // aqua circle on Niacinamide (2%) — this frame's one aqua highlight (SFX marker-squeak.mp3),
        // retimed from 9.2 to 6.4 to land right as the word is actually spoken (6.19-6.84)
        // and while the push-in (below) is still settled on this row, not already panned away.
        tl.fromTo("#tear-mark-circle", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 6.4);
        // re-emphasize Ethylhexylglycerin (already visible since ~1.02s) right as it's
        // actually named — "Boom. Ethylhexylglycerin." local 9.99-11.94.
        tl.to("#tear-row-10", { scale: 1.05, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "0 50%" }, 9.85);

        // ink strike under Ethylhexylglycerin — kept ink-weight, not coral (coral's one voltage
        // moment is spent in Frame 4). Local 12.9 matches "Everything below it." (11.94-13.33).
        tl.to("#tear-mark-strike", { width: "100%", duration: 0.2, ease: "power2.in" }, 12.9);

        // trailing rows fade/blur in AFTER the pull-back (13.8, see push-in below) so they're
        // actually inside frame when revealed, timed to "Dextrin, xanthan gum, tocopherol"
        // (13.38-15.93) rather than 2.7s ahead of it.
        const TAIL = ["#tear-row-11", "#tear-row-12", "#tear-row-13", "#tear-row-14"];
        TAIL.forEach((id, i) => {
          tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power3.out" }, 13.9 + i * 0.25);
        });
        tl.to(TAIL, { filter: "blur(1.5px)", duration: 0.4, ease: "power2.inOut" }, 15.0);

        // dynamic zoom: push in on Niacinamide, then pan down to land on Ethylhexylglycerin,
        // exactly as the VO names each word (transcribed via `hyperframes transcribe` —
        // "Niacinamide" 6.28-6.94s, "Boom, ethylhexylglycerin" 10.34-12.30s). Full 14-row
        // list is unreadable at native size on mobile; #tear-card's transform-origin is 0 0
        // and these constants are pre-computed from its layout, not measured at tween time.
        tl.fromTo("#tear-card", { scale: 1, x: 0, y: 0 }, { scale: 1.8, x: -26.4, y: -376.1, duration: 0.4, ease: "power2.inOut" }, 6.05);
        tl.to("#tear-card", { y: -760.58, duration: 0.5, ease: "power2.inOut" }, 9.75);
        tl.to("#tear-card", { scale: 1, x: 0, y: 0, duration: 0.5, ease: "power2.inOut" }, 13.3);

        tl.fromTo("#tear-disclaimer", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power3.out" }, 15.5);

        tl.to(["#tear-card", "#tear-disclaimer"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 18.2);

        tl.to({}, { duration: 19.02 }, 0);
        window.__timelines["06-teardown"] = tl;
      </script>
    </template>
  </body>
</html>
