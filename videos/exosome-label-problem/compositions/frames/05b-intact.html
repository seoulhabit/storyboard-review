<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        *, *::before, *::after { box-sizing: border-box; }
        h1, h2, h3, p, figure, blockquote, ul, ol, dl { margin: 0; }

        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }

        /* PAPER GROUND. The coral refusal bar carries INK text at 5.71:1 --
           coral is a fill here, never read-type (2.95:1 as text on paper). */
        #root {
          --paper: #F7F5F0; --ink: #131516; --mist: #F0EBE1;
          --ink-2: #6B6B6B; --ink-3: #9C978D;
          --coral: #C97A5C; --rule-strong: #D9D3C6; --brick: #DCD5C6; --brick-edge: #BCB4A2;
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--paper); font-family: var(--font-body);
        }

        /* Spatial plan
           1. .stage is one flex column, explicit 1920px height, real --safe-*
              padding, space-between across three zones (head / compare / foot).
           2. .compare is a 2-column GRID: an INTACT wall beside real skin. 05a
              is a single full-bleed wall, so the pair reads as one-object then
              two-object -- structure carries the cut, since both halves share
              the paper ground.
           3. The skin plate's Ken Burns wrapper is the only absolute element
              and it lives inside .skin-panel's overflow:hidden context, so no
              --safe-*-zoomed math is needed. */
        .stage {
          display: flex; flex-direction: column; justify-content: space-between;
          height: 1920px;
          padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }

        .kicker { font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.14em;
                  text-transform: uppercase; color: var(--ink-2); opacity: 0; }
        .head h1 { font-weight: 800; font-size: 74px; line-height: 1.08;
                   letter-spacing: -0.03em; color: var(--ink); margin-top: 18px; }

        .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .col { display: flex; flex-direction: column; gap: 14px; }
        .col-label { font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.06em;
                     text-transform: uppercase; color: var(--ink); opacity: 0; }
        .col-sub { font-family: var(--font-mono); font-size: 32px; line-height: 1.3;
                   color: var(--ink-2); opacity: 0; }

        /* The wall here is INTACT -- no channels, no shards. That contrast with
           05a is the scene's whole argument. */
        .wall { position: relative; overflow: hidden; height: 430px; background: var(--mist);
                border: 3px solid var(--rule-strong); padding: 24px 0;
                display: flex; flex-direction: column; justify-content: center; gap: 12px; }
        .course { display: flex; gap: 10px; padding: 0 14px; }
        .course.off { padding-left: 58px; }
        .brick { height: 104px; flex: 1 1 auto; background: var(--brick);
                 border: 2px solid var(--brick-edge); }

        .skin-panel { position: relative; overflow: hidden; height: 430px;
                      background: #1A1A1A; border: 3px solid var(--rule-strong); }
        .skin-zoom { position: absolute; inset: 0; }
        .skin-zoom img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .verdict { background: var(--coral); width: 0; overflow: hidden; height: 84px; }
        .verdict span { display: block; font-family: var(--font-mono); font-size: 36px;
                        line-height: 84px; padding: 0 26px; letter-spacing: 0.05em;
                        color: var(--ink); text-transform: uppercase; white-space: nowrap; }
        .close { font-weight: 800; font-size: 52px; line-height: 1.18; color: var(--ink);
                 margin-top: 26px; opacity: 0; }
        .foot-row { display: flex; justify-content: flex-end; margin-top: 22px; }
        .cite { transform-origin: 100% 50%; width: max-content;
                font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.04em;
                color: var(--ink); border: 2px solid rgba(19,21,22,0.28);
                background: rgba(19,21,22,0.06); border-radius: 999px;
                padding: 10px 22px; white-space: nowrap; opacity: 0; }

        #root.debug-layout * { outline: 1px solid rgba(255,0,0,0.6) !important; }
        #root.debug-layout .stage { outline: 2px solid #00E5FF !important; }
        #root.debug-layout .skin-panel, #root.debug-layout .wall { outline: 2px solid #FFD400 !important; }
        #root.debug-layout::after {
          content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 99;
          background:
            linear-gradient(to left,   rgba(255,0,168,.22) 15%, transparent 15%),
            linear-gradient(to top,    rgba(255,0,168,.22) 20%, transparent 20%),
            linear-gradient(to bottom, rgba(255,0,168,.22) 10%, transparent 10%);
        }
      </style>

      <div id="root" data-composition-id="05b-intact"
           data-width="1080" data-height="1920" data-duration="4.420">
        <div class="stage">

          <div class="head">
            <p class="kicker" id="in-kicker">On your face</p>
            <h1>Nothing has been<br>opened.</h1>
          </div>

          <div class="compare">
            <div class="col">
              <div class="wall">
                <div class="course"><i class="brick"></i><i class="brick"></i><i class="brick"></i></div>
                <div class="course off"><i class="brick"></i><i class="brick"></i></div>
                <div class="course"><i class="brick"></i><i class="brick"></i><i class="brick"></i></div>
              </div>
              <p class="col-label" id="in-l1">Intact barrier</p>
              <p class="col-sub" id="in-s1">No channels,<br>no device</p>
            </div>
            <div class="col">
              <figure class="skin-panel">
                <div class="skin-zoom" id="in-zoom" data-layout-allow-overflow>
                  <img src="assets/plates/05-intact-skin-crop.png" alt=""
                       width="900" height="600" loading="eager" decoding="sync">
                </div>
              </figure>
              <p class="col-label" id="in-l2">A daily serum</p>
              <p class="col-sub" id="in-s2">Sits on top<br>of all of it</p>
            </div>
          </div>

          <div>
            <div class="verdict" id="in-verdict" data-layout-allow-overflow><span>Not the same test</span></div>
            <p class="close" id="in-close">Promising there does not<br>mean proven here.</p>
            <div class="foot-row">
              <span class="cite" id="in-cite">Facial Plast Surg Clin N Am · 2026</span>
            </div>
          </div>

        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        // Headline, the intact wall and the skin plate are all composed at t=0.
        // The cut from 05a lands on a wall that is suddenly WHOLE again -- that
        // reversal is the beat, and it only works if the wall is already there.

        // Continuous Ken Burns on the skin, clipped by .skin-panel.
        tl.fromTo('#in-zoom', { scale: 1.0 }, { scale: 1.075, duration: 3.55, ease: 'none' }, 0);

        tl.to('#in-kicker', { opacity: 1, duration: 0.26, ease: 'none' }, 0.12);
        tl.fromTo('#in-l1', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.28 }, 0.45);
        tl.fromTo('#in-s1', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.28 }, 0.70);
        tl.fromTo('#in-l2', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.28 }, 1.05);
        tl.fromTo('#in-s2', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.28 }, 1.30);

        // 1.85 the coral refusal bar strikes -- the one moment this pair of
        // scenes spends coral on, landing under "that doesn't prove".
        tl.to('#in-verdict', { width: 470, duration: 0.42, ease: 'power2.inOut' }, 1.85);
        tl.fromTo('#in-close', { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.32 }, 2.45);
        tl.fromTo('#in-cite', { opacity: 0, scale: 0.94 },
                              { opacity: 1, scale: 1, duration: 0.32, ease: 'back.out(2)' }, 3.10);

        // 3.55 a closing push on the skin plate: the last second stays alive.
        tl.to('#in-zoom', { scale: 1.13, duration: 0.85, ease: 'power2.out' }, 3.55);
        tl.to('#in-verdict', { x: 20, duration: 0.60, ease: 'power2.out' }, 3.70);

        tl.to({}, { duration: 4.420 }, 0); // full-span anchor -- always last
        window.__timelines["05b-intact"] = tl;
      </script>
    </template>
  </body>
</html>
