      <style>

        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 100 900; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }

        #root {
          --paper: #F7F5F0; --ink: #131516; --aqua: #59B8AE; --coral: #C97A5C;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --t-figure: 60px; --t-label: 24px;
          --safe-top: 120px; --safe-bottom: 360px; --safe-left: 60px; --safe-right: 162px;
          --cap-band-top: 1360px;  /* mirrors captions.html:34 -- rail must clear this */
          --e-out: cubic-bezier(0.215,0.61,0.355,1);
          --d-fast: 400ms;
          --elev-2: 0 18px 32px -20px rgba(19,21,22,0.35);

          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--ink); font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }

        /* full-bleed generated macro video -- the presenter for this beat
           (frame.md § Media exception). Muted, framework-owned playback:
           the engine seeks currentTime directly, same idiom as
           seoulhabit-launch/assets/broll/*.mp4. */
        .hero-video { position: absolute; inset: 0; background: var(--ink); overflow: hidden; }
        .hero-video video { width: 100%; height: 100%; object-fit: cover; display: block; }

        .rail-scrim { background: linear-gradient(to top, rgba(19,21,22,0.70) 0%, rgba(19,21,22,0.50) 40%, rgba(19,21,22,0) 65%); }

        /* verdict rail -- persistent 2-row focus-advance mechanism, adapted from
           RoutineLadder's mechanism (one row in focus, driven by t) but not the
           component itself (frame.md § Component reuse: two rows, not six rungs). */
        .verdict-rail { position: absolute; left: var(--safe-left); right: var(--safe-right);
          top: calc(var(--cap-band-top) - 180px); bottom: auto; display: flex; flex-direction: column; gap: 18px; }
        .v-row { display: flex; align-items: center; gap: 16px; --p: 0; opacity: var(--p);
          transform: translateX(calc((1 - var(--p)) * -28px)); }
        .v-from { font-family: var(--font-body); font-weight: 800; font-size: var(--t-figure);
          letter-spacing: -0.01em; color: var(--paper); }
        .v-arrow { font-family: var(--font-mono); font-size: 32px; color: var(--paper); opacity: 0.55; }
        .v-to { font-family: var(--font-mono); font-weight: 500; font-size: var(--t-label);
          letter-spacing: 0.06em; color: var(--ink); background: var(--aqua);
          padding: 10px 20px; border-radius: 6px; box-shadow: var(--elev-2); }

      </style>

      <div data-hf-id="hf-9l3n" id="root" data-composition-id="02-string-test" data-width="1080" data-height="1920" data-duration="4.940">

        <div data-hf-id="hf-td8c" class="clip hero-video"><video data-hf-id="hf-r3l7" id="f2-video" class="clip" src="assets/broll/02-string-test.mp4" width="1076" height="1928" data-start="0" data-duration="4.940" data-track-index="1" muted playsinline></video></div>
        <div data-hf-id="hf-cwov" class="clip rail-scrim"></div>

        <div data-hf-id="hf-il16" class="clip verdict-rail">
          <div data-hf-id="hf-brp0" class="v-row" id="f2-row-snail">
            <div data-hf-id="hf-4epk" class="v-from">SNAIL</div>
            <div data-hf-id="hf-qcoo" class="v-arrow">→</div>
            <div data-hf-id="hf-atn1" class="v-to">GLOW</div>
          </div>
        </div>

      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Frame zero here is the hard-cut handoff from Frame 1 -- the video's own
        // first frame (fingertips approaching the pool) is already the composed
        // claim; the verdict row is a supporting label that builds in shortly after.
        tl.fromTo("#f2-row-snail", { "--p": 0 }, { "--p": 1, duration: 0.4, ease: "power3.out" }, 0.3);

        tl.to({}, { duration: 4.940 }, 0);
        window.__timelines["02-string-test"] = tl;
      </script>
    </template>
  </body>
