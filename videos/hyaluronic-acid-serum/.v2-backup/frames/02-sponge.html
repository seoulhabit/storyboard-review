  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Setup — measure the aqua (hydrated) outline once, synchronously
      // (getTotalLength, never guessed), before any tween references it.
      var aquaOutline = document.querySelector(".sponge-outline-aqua");
      if (aquaOutline) {
        var aquaLen = aquaOutline.getTotalLength();
        aquaOutline.style.strokeDasharray = String(aquaLen);
        aquaOutline.style.strokeDashoffset = String(aquaLen);
      }

      // Scene 1 (0.0-1.8s) — "Picture your skin cells like a sponge."
      // The whole fist+sponge group pops in together, centered, close-up.
      // Hero clearly visible well before t=0.5s.
      tl.fromTo(
        ".sponge-hero",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.08
      );

      // "DRY" pill arrives just after, beside the hero.
      tl.fromTo(
        ".sponge-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.45
      );

      // Scene 2 (1.8-4.0s) — "Dry, they shrivel." Deliberate stillness:
      // cracks and pores hold static, nothing animates in this window.

      // Scene 3 (4.0-6.3s) — "Add hyaluronic acid, and they bounce right
      // back." The SAME fist/sponge transforms in place: cracks clear,
      // pores enlarge, the outline redraws in aqua (svg-path-draw), and
      // the label crossfades — a direct transformation, not a new object.
      tl.to(".sponge-crack", { opacity: 0, duration: 0.5, ease: "power2.out" }, 4.0);

      var pores = Array.prototype.slice.call(document.querySelectorAll(".sponge-pore"));
      pores.forEach(function (pore, i) {
        var targetR = parseFloat(pore.getAttribute("data-r-hydrated"));
        tl.to(pore, { attr: { r: targetR }, duration: 0.7, ease: "power2.out" }, 4.1 + i * 0.03);
      });

      tl.to(".sponge-outline-ink", { opacity: 0, duration: 0.6, ease: "power2.out" }, 4.3);

      if (aquaOutline) {
        tl.to(aquaOutline, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 4.2);
      }

      // Hard toggle, not a crossfade: both spans occupy the identical box (inset:0),
      // so any temporal overlap between the two opacity fades reads as garbled
      // double-printed text ("DRY"+"HYDRATED" stacked) — same fix as the caption
      // pill's whole-group fade. Instant swap, no window where both are visible.
      tl.set(".sponge-badge-dry-text", { opacity: 0 }, 4.6);
      tl.set(".sponge-badge-hydrated-text", { opacity: 1 }, 4.6);

      // Scene 4 (6.3-7.654s) — hold, fist + hydrated sponge fully settled.
      // Only the aqua outline carries a low-amplitude sine jitter
      // (sine-wave-loop) — nothing else moves.
      var jitterPhase = { p: 0 };
      var JITTER_START = 6.4;
      var TOTAL_DURATION = 7.654;
      var JITTER_DUR = TOTAL_DURATION - JITTER_START;
      var CYCLES = 0.8; // period ≈ 1.57s, within range for a short idle window
      var Y_AMP_PX = 2.5;
      tl.to(
        jitterPhase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: JITTER_DUR,
          ease: "none",
          onUpdate: function () {
            if (!aquaOutline) return;
            var s = Math.sin(jitterPhase.p);
            aquaOutline.style.transform = "translateY(" + (s * Y_AMP_PX).toFixed(2) + "px)";
          },
        },
        JITTER_START
      );

      window.__timelines["02-sponge"] = tl;
    })();
  </script>
