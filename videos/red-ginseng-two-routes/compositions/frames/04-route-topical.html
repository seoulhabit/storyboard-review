<script>
(function () {
  var root = document.getElementById('root');
  var world = document.getElementById('route-topical-world');
  var diagramBox = root.querySelector('.route-topical-diagram-box');
  var deepGlow = document.getElementById('route-topical-deep-glow');
  var surfaceGlow = document.getElementById('route-topical-surface-glow');
  var wrinkleJagged = document.getElementById('route-topical-wrinkle-jagged');
  var wrinkleSmooth = document.getElementById('route-topical-wrinkle-smooth');
  var wrinkleSmooth2 = document.getElementById('route-topical-wrinkle-smooth-2');
  var droplet = document.getElementById('route-topical-droplet');
  var ripple = document.getElementById('route-topical-ripple');
  var dropletBlurNode = document.getElementById('route-topical-droplet-blur');
  var smoothTag = document.getElementById('route-topical-smooth-tag');
  var timerTag = document.getElementById('route-topical-timer-tag');
  var tagsRow = document.getElementById('route-topical-tags');
  var citation = document.getElementById('route-topical-citation');
  var rowFrame = document.getElementById('route-topical-row-frame');
  var rowClaim = document.getElementById('route-topical-row-claim');
  var rowRoute = document.getElementById('route-topical-row-route');
  var rowStudy = document.getElementById('route-topical-row-study');
  var rowNote = document.getElementById('route-topical-row-note');

  // ---- setup: measure + seed (synchronous, deterministic) ----
  var jaggedLen = wrinkleJagged.getTotalLength();
  wrinkleJagged.style.strokeDasharray = String(jaggedLen);
  wrinkleJagged.style.strokeDashoffset = String(jaggedLen);

  var smoothLen = wrinkleSmooth.getTotalLength();
  wrinkleSmooth.style.strokeDasharray = String(smoothLen);
  wrinkleSmooth.style.strokeDashoffset = String(smoothLen);

  var smooth2Len = wrinkleSmooth2.getTotalLength();
  wrinkleSmooth2.style.strokeDasharray = String(smooth2Len);
  wrinkleSmooth2.style.strokeDashoffset = String(smooth2Len);

  var dropletBlur = { v: 14 };
  function writeDropletBlur() { dropletBlurNode.setAttribute('stdDeviation', '0 ' + dropletBlur.v); }
  writeDropletBlur();

  var tl = gsap.timeline({ paused: true });

  // Scene 1 (0.0-1.2s): camera continues rising into the upper strata; deep dermis dims below.
  tl.fromTo(world, { y: 58, scale: 1.045 }, { y: 0, scale: 1, duration: 1.15, ease: 'power3.out', transformOrigin: '50% 50%' }, 0);
  tl.fromTo(deepGlow, { opacity: 0.85 }, { opacity: 0.06, duration: 1.1, ease: 'power2.out' }, 0);
  tl.to(wrinkleJagged, { strokeDashoffset: 0, duration: 0.7, ease: 'power2.out' }, 0.3);

  // Scene 2 (1.2-2.6s): amber serum droplet impacts from above; FRAME reveals.
  tl.fromTo(droplet, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'power1.out' }, 1.2);
  tl.to(droplet, { attr: { cy: 42 }, duration: 0.42, ease: 'power4.out' }, 1.2);
  tl.to(dropletBlur, { v: 0, duration: 0.42, ease: 'power4.out', onUpdate: writeDropletBlur }, 1.2);
  tl.fromTo(rowFrame, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 1.3);
  tl.to(droplet, { opacity: 0, duration: 0.15, ease: 'power1.in' }, 1.62);
  tl.fromTo(ripple, { attr: { r: 4 }, opacity: 0.9 }, { attr: { r: 74 }, opacity: 0, duration: 0.5, ease: 'power2.out' }, 1.62);

  // Scene 3 (2.6-4.4s): blue light blooms in the uppermost strata only; CLAIM reveals.
  tl.fromTo(surfaceGlow, { opacity: 0, scale: 0.85 }, { opacity: 0.32, scale: 1, duration: 0.9, ease: 'power2.out', transformOrigin: '47% 5%' }, 2.6);
  tl.fromTo(rowClaim, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 2.7);
  (function () {
    var phase = { p: 0 };
    tl.to(phase, {
      p: Math.PI * 2 * 2,
      duration: 6.0,
      ease: 'none',
      onUpdate: function () {
        var s = Math.sin(phase.p);
        surfaceGlow.style.opacity = String(0.32 + s * 0.035);
        surfaceGlow.style.transform = 'scale(' + (1 + s * 0.02) + ')';
      }
    }, 3.5);
  })();

  // Scene 4 (4.4-6.2s): the jagged wrinkle line smooths under the blue pulse; ROUTE, then STUDY.
  tl.to(wrinkleJagged, { strokeDashoffset: jaggedLen, duration: 0.5, ease: 'power2.out' }, 4.4);
  tl.fromTo(rowRoute, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 4.5);
  tl.to(wrinkleSmooth, { strokeDashoffset: 0, duration: 0.55, ease: 'power2.out' }, 4.78);
  tl.to(wrinkleSmooth2, { strokeDashoffset: 0, duration: 0.55, ease: 'power2.out' }, 4.85);

  tl.fromTo(rowStudy, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 5.3);
  tl.fromTo(timerTag, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, 5.4);

  // Scene 5 (6.2-8.2s): Note reveals; aqua-tinted surface/dermis tags fade in.
  tl.fromTo(rowNote, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 6.3);
  tl.fromTo(tagsRow, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 6.8);

  // Scene 6 (8.2-9.2s): CITATION lands in mono, coral bracket accent.
  tl.fromTo(citation, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 8.3);

  // Scene 7 (9.2-10.0s): held read, settles still; subtle jitter only.
  (function () {
    var jitter = { p: 0 };
    tl.to(jitter, {
      p: Math.PI * 2 * 1.3,
      duration: 0.8,
      ease: 'none',
      onUpdate: function () {
        var s = Math.sin(jitter.p);
        diagramBox.style.transform = 'translateY(' + (s * 1.5) + 'px)';
      }
    }, 9.2);
  })();
