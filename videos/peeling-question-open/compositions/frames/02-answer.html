<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }

        #root {
          --paper: #F7F5F0; --ink: #131516; --ink-soft: #211F1B; --leaf: #6F8F72;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
          --safe-margin: 4px;
          /* Cadence-floor zoom added 2026-09-01 (QC verification round) -- same
             derived-token pattern as 04-evidence.html/05-boundary.html: the padded
             edge must be computed from THIS scene's own scale/origin, not a flat
             token, because the Ken Burns transform sits outside the padded box and
             maps its edge outward by the same factor it scales the box. */
          --zoom-max: 1.02; --zoom-origin-x: 540px; --zoom-origin-y: 864px;
          --safe-bottom-zoomed: calc(1920px - (var(--zoom-origin-y)
            + (1920px - var(--safe-bottom) - var(--safe-margin) - var(--zoom-origin-y)) / var(--zoom-max)));
          --safe-right-zoomed: calc(1080px - (var(--zoom-origin-x)
            + (1080px - var(--safe-right) - var(--safe-margin) - var(--zoom-origin-x)) / var(--zoom-max)));

          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--ink-soft); font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }
        .frame-zoom { position: absolute; inset: 0; transform-origin: var(--zoom-origin-x) var(--zoom-origin-y); }

        /* Spatial plan:
           1. Full-bleed flex column, centered both axes -- the stamp card is the
              single dominant focal point, no competing element.
           2. The card's two text lines and the rule beneath are stacked flex
              children of one inner column inside the card, not independently
              positioned.
           3. The micro-label sits as a fourth flex child of the outer stage,
              below the card -- not absolutely placed against the card. */
        .stage { display: flex; flex-direction: column; align-items: center;
                 justify-content: center; height: 100%; gap: 40px;
                 padding: var(--safe-top) var(--safe-right-zoomed) var(--safe-bottom-zoomed) var(--safe-left); }

        .stamp-card { display: flex; flex-direction: column; align-items: center; gap: 20px;
                      padding: 56px 72px; border-radius: 20px;
                      border: 3px solid var(--paper); background: rgba(247,245,240,0.06);
                      opacity: 0; }
        .kicker { font-family: var(--font-mono); font-weight: 500; font-size: 40px; letter-spacing: 0.10em;
                  color: rgba(247,245,240,0.72); text-transform: uppercase; }
        .verdict { font-family: var(--font-body); font-weight: 800; font-size: 132px;
                   line-height: 1; color: var(--paper); }
        .rule { width: 120px; height: 4px; background: var(--leaf); transform: scaleX(0);
                transform-origin: 50% 50%; }
        .micro-label { font-family: var(--font-mono); font-weight: 500; font-size: 32px; letter-spacing: 0.04em;
                       color: rgba(247,245,240,0.55); opacity: 0; text-align: center; }
      </style>

      <div id="root" data-composition-id="02-answer" data-width="1080" data-height="1920" data-duration="3.200">
        <div class="clip frame-zoom" id="zoom">
          <div class="stage">
            <div class="stamp-card" id="stamp-card">
              <div class="kicker">SHORT ANSWER:</div>
              <div class="verdict">NO.</div>
            </div>
            <div class="rule" id="rule"></div>
            <div class="micro-label" id="micro-label">Not the way most people mean it.</div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        gsap.set('#stamp-card', { transformOrigin: '50% 50%' });

        // Continuous zoom -- the cadence floor across the full scene, added
        // 2026-08-31 QC verification round (this scene's own per-region scan
        // showed only a 0.50s hold, under the 1.5s ceiling -- this is added
        // hardening, not a fix for a measured defect, matching scenes 3/4/5's
        // existing device rather than leaving this scene as the one with no
        // ambient motion under its beats).
        tl.fromTo('#zoom', { scale: 1 }, { scale: 1.02, duration: 3.200, ease: "none" }, 0);

        // Impact stamp, not a fade: accelerating-in scale-down from an oversized,
        // slightly rotated "from" state -- power2.in over 0.16s. This target is
        // hit by only one fromTo, so no tl.set(...,0) baseline is required (the
        // seek-bleed risk applies only to elements hit by MULTIPLE fromTo calls).
        tl.fromTo('#stamp-card', { opacity: 0, scale: 1.35, rotation: -3 },
                                  { opacity: 1, scale: 1, rotation: 0, duration: 0.16, ease: "power2.in" }, 0.15);
        // Bounded settle wobble -- resolves inside the scene, never infinite.
        tl.to('#stamp-card', { scale: 0.98, duration: 0.12, ease: "power1.inOut", yoyo: true, repeat: 1 }, 0.31);

        tl.to('#rule', { scaleX: 1, duration: 0.30, ease: "power2.out" }, 0.60);

        // Bounded idle drift across the back half of the scene -- this scene's
        // cadence gap-filler for 1.2s-3.2s, real small motion that resolves.
        tl.to('#stamp-card', { rotation: 0.6, duration: 0.50, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.20);

        tl.to('#micro-label', { opacity: 0.7, duration: 0.30 }, 2.40);

        tl.to({}, { duration: 3.200 }, 0);
        window.__timelines["02-answer"] = tl;
      </script>
    </template>
  </body>
</html>
