<template id="captions-template" data-composition-id="captions" data-width="1080" data-height="1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<style data-brand-tokens>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('assets/fonts/bricolage-grotesque-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }
  :root {
    --cream: #fbfaf4; --ink: #0f2016; --pink: #b9835a;
    --font-display: "Bricolage Grotesque", system-ui, serif;
    /* Fix for finding #5: source project's band (top:1600/height:320 on a 1920 canvas)
       sits ENTIRELY inside the reserved bottom-20% zone (y >= 1536). This band is
       derived from the actual safe-bottom token so it clears y=1536 with margin. */
    --safe-bottom: 384px; --cap-band-height: 320px;
    --cap-band-top: calc(1920px - var(--safe-bottom) - var(--cap-band-height) - 48px); /* = 1168px */
  }
</style>

<style>
  #captions-root { position: absolute; inset: 0; pointer-events: none; }
  #root.debug-layout .caption-stage { outline: 3px dashed lime !important; }
  .caption-stage { position: absolute; left: 0; right: 0; top: var(--cap-band-top);
    height: var(--cap-band-height); display: flex; align-items: center; justify-content: center; }
  .caption-group { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; opacity: 0; padding: 0 60px; }
  .caption-pill { max-width: 84%; padding: 18px 38px; background: rgba(15,32,22,.88);
    border: 2px solid var(--pink); border-radius: 8px; }
  .caption-line { font-family: var(--font-display); font-weight: 500; color: var(--cream);
    font-size: 46px; line-height: 1.2; text-align: center; }
</style>

<div id="root" class="clip" data-composition-id="captions" data-width="1080" data-height="1920">
  <div id="captions-root">
    <div class="caption-stage">
      <!-- Max two lines, 3-6 words/line. Full spoken sentence, distinct from each
           scene's decorative on-screen headline (not a verbatim repeat). -->
      <div class="caption-group" id="cap-01"><div class="caption-pill"><div class="caption-line">You're putting it<br>on dry skin.</div></div></div>
      <div class="caption-group" id="cap-02"><div class="caption-pill"><div class="caption-line">It panics and pulls<br>moisture back out.</div></div></div>
      <div class="caption-group" id="cap-03"><div class="caption-pill"><div class="caption-line">Mist. Pat — never rub.<br>Then seal it in.</div></div></div>
      <div class="caption-group" id="cap-04"><div class="caption-pill"><div class="caption-line">Glycolic acid, allantoin,<br>hyaluronic acid.</div></div></div>
      <div class="caption-group" id="cap-05"><div class="caption-pill"><div class="caption-line">A 1960s burn cure<br>is now a beauty staple.</div></div></div>
      <div class="caption-group" id="cap-06"><div class="caption-pill"><div class="caption-line">Mist first.<br>Then apply.</div></div></div>
    </div>
  </div>
</div>

<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  function group(id, inAt, outAt) {
    tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, inAt);
    tl.to(id, { opacity: 0, duration: 0.2, ease: "power2.in" }, outAt);
  }
  // Windows match the parent index.html scene boundaries exactly.
  group("#cap-01", 0.15, 1.85);
  group("#cap-02", 2.3, 7.7);
  group("#cap-03", 8.3, 15.6);
  group("#cap-04", 16.3, 23.6);
  group("#cap-05", 24.3, 29.6);
  group("#cap-06", 30.3, 33.8);

  tl.to({}, { duration: 34.0 }, 0); // anchor
  window.__timelines["captions"] = tl;
})();
</script>
</template>
