<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Noto Sans KR Video";
          font-weight: 500;
          font-style: normal;
          src: url("assets/fonts/NotoSansKR-500-subset.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 500;
          font-style: normal;
          src: url("assets/fonts/NotoSansKR-500-subset.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "EB Garamond";
          font-weight: 400;
          font-style: normal;
          src: url("assets/fonts/eb-garamond-400.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "JetBrains Mono";
          font-weight: 100 900;
          font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2");
          font-display: block;
        }
        #root {
          --ink: #131516;
          --paper: #F7F5F0;
          --white: #FCFBF9;
          --aqua: #59B8AE;
          --ink-2: #6B6B6B;
          --font-display: "EB Garamond", Georgia, "Times New Roman", serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --font-kr: "Noto Sans KR Video", "Noto Sans KR", sans-serif;
          --t-frame: 50px;
          --t-body: 32px;
          --t-label: 28px;
          --elev-2: 0 18px 32px -20px rgba(19, 21, 22, 0.35);
          --safe-top: 120px;
          --safe-bottom: 360px;
          --safe-left: 60px;
          --safe-right: 162px;

          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--ink);
          font-family: var(--font-mono);
        }
        .clip { position: absolute; inset: 0; }

        .hb-kicker { top: 150px; left: 0; width: 100%; text-align: center; font-family: var(--font-display); font-size: 52px; color: var(--paper); opacity: 0; }

        /* VO-synced subtitle fills what was a literal blank canvas from 1.0-7.2 (the old
           kicker faded at 1.0, cards didn't pop until a fixed 6.4s grid starting at 0.8 —
           meaning frame 1's content was already gone 6+s before the VO even named it). */
        .hb-subtitle { top: 220px; left: var(--safe-left); width: 858px; }
        .hb-subtitle-line {
          font-family: var(--font-mono);
          font-size: 54px;
          font-weight: 500;
          line-height: 1.3;
          color: var(--paper);
          text-align: center;
        }
        .hb-subtitle-word { display: inline-block; margin-right: 0.24em; opacity: 0; }

        /* height reduced 1500->1180 and padding widened so card 3's bottom clears
           safe-bottom (1920-360=1560) — it was landing at ~1608-1820, under the Shorts
           title/channel/audio strip. */
        .hb-cards { top: 320px; left: 0; width: 100%; height: 1180px; display: flex; flex-direction: column; justify-content: space-evenly; gap: 24px; padding: 0 190px 0 80px; }
        .hb-card {
          background: var(--white);
          border-radius: 16px;
          box-shadow: var(--elev-2);
          padding: 44px 48px;
          opacity: 0;
          transform: scale(0.92) translateY(18px);
        }
        .hb-inci { font-family: var(--font-mono); font-size: 30px; color: var(--ink-2); }
        .hb-common { font-family: var(--font-display); font-size: 56px; color: var(--ink); margin: 8px 0 6px; position: relative; display: inline-block; }
        .hb-common-underline { position: absolute; left: 0; right: 0; bottom: -4px; height: 4px; background: var(--aqua); transform: scaleX(0); transform-origin: left center; }
        .hb-kr { font-family: var(--font-kr); font-size: var(--t-label); color: var(--ink-2); margin-right: 10px; }
        .hb-func { font-family: var(--font-mono); font-size: var(--t-label); color: var(--ink-2); }
      </style>

      <div data-hf-id="hf-hb-root" id="root" data-composition-id="07-hanbang-rapidfire" data-width="1080" data-height="1920" data-duration="21.34">
        <div data-hf-id="hf-hb-kicker" id="hb-kicker" class="clip hb-kicker" data-start="0" data-duration="21.34">THE HANBANG CHEAT SHEET</div>

        <div data-hf-id="hf-hb-subtitle" id="hb-subtitle" class="clip hb-subtitle" data-start="0" data-duration="21.34">
          <div data-hf-id="hf-hb-subtitle-line" class="hb-subtitle-line" id="hb-subtitle-line"></div>
        </div>

        <div data-hf-id="hf-hb-cards" id="hb-cards" class="clip hb-cards" data-start="0" data-duration="21.34">
          <div data-hf-id="hf-hb-c1" class="hb-card" id="hb-card-1">
            <div data-hf-id="hf-hb-c1inci" class="hb-inci">Snail Secretion Filtrate</div>
            <div data-hf-id="hf-hb-c1common" class="hb-common" id="hb-common-1">Snail Mucin<div data-hf-id="hf-hb-c1u" class="hb-common-underline" id="hb-underline-1"></div></div>
            <div data-hf-id="hf-hb-c1func" class="hb-func">barrier repair</div>
          </div>
          <div data-hf-id="hf-hb-c2" class="hb-card" id="hb-card-2">
            <div data-hf-id="hf-hb-c2inci" class="hb-inci">Panax Root</div>
            <div data-hf-id="hf-hb-c2common" class="hb-common" id="hb-common-2">Ginseng<div data-hf-id="hf-hb-c2u" class="hb-common-underline" id="hb-underline-2"></div></div>
            <div data-hf-id="hf-hb-c2func" class="hb-func">firming</div>
          </div>
          <div data-hf-id="hf-hb-c3" class="hb-card" id="hb-card-3">
            <div data-hf-id="hf-hb-c3inci" class="hb-inci">Artemisia Princeps</div>
            <div data-hf-id="hf-hb-c3common" class="hb-common" id="hb-common-3"><span data-hf-id="hf-hb-c3kr" class="hb-kr">쑥</span>Mugwort<div data-hf-id="hf-hb-c3u" class="hb-common-underline" id="hb-underline-3"></div></div>
            <div data-hf-id="hf-hb-c3func" class="hb-func">calming, anti-acne</div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#hb-kicker", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
        tl.to("#hb-kicker", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 3.2);

        // Subtitle word-reveal on REAL onsets (renders/transcript.json, local = absolute -
        // 84.9) for "Korean skincare uses traditional herbs with wildly confusing INCI
        // names." This is what used to be dead canvas: the old kicker faded at 1.0s and
        // nothing else was on screen until card 1 popped at a flat 0.8s (before this VO
        // line had even started) — a literal blank frame for over a second, and a static
        // hold everywhere else in the scene besides.
        const SUBTITLE_WORDS = [
          { word: "Korean", start: 1.77 }, { word: "skincare", start: 2.07 }, { word: "uses", start: 2.54 },
          { word: "traditional", start: 2.77 }, { word: "herbs", start: 3.41 }, { word: "with", start: 3.72 },
          { word: "wildly", start: 4.29 }, { word: "confusing", start: 5.14 }, { word: "INCI", start: 6.50 },
          { word: "names.", start: 6.98 },
        ];
        const subtitleEl = document.getElementById("hb-subtitle-line");
        SUBTITLE_WORDS.forEach((entry) => {
          const span = document.createElement("span");
          span.className = "hb-subtitle-word";
          span.textContent = entry.word;
          subtitleEl.appendChild(span);
          entry.el = span;
        });
        SUBTITLE_WORDS.forEach((entry) => {
          tl.fromTo(entry.el, { opacity: 0, y: 10, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "power3.out" }, entry.start);
        });
        tl.to("#hb-subtitle", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 7.3);

        // Three flashcards, retimed from a flat 6.4s grid ([0.8, 7.2, 13.6], which popped
        // card 1 six-plus seconds before the VO named it, per the audit) to the REAL onset
        // of each Hanbang term (local: "Snail" 7.77, "Panax" 11.76, "Artemisia" 15.77),
        // landing just ahead of the word so the reveal reads as anticipation, not lag.
        const CARD_STARTS = [7.6, 11.6, 15.6];
        const CARD_IDS = ["#hb-card-1", "#hb-card-2", "#hb-card-3"];
        const UNDERLINE_IDS = ["#hb-underline-1", "#hb-underline-2", "#hb-underline-3"];
        CARD_IDS.forEach((id, i) => {
          tl.fromTo(id, { opacity: 0, scale: 0.92, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.18, ease: "power2.out" }, CARD_STARTS[i]);
          tl.to(UNDERLINE_IDS[i], { scaleX: 1, duration: 0.3, ease: "power3.out" }, CARD_STARTS[i] + 0.25);
        });

        tl.to(["#hb-cards"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 20.48);

        tl.to({}, { duration: 21.34 }, 0);
        window.__timelines["07-hanbang-rapidfire"] = tl;
      </script>
    </template>
  </body>
</html>
