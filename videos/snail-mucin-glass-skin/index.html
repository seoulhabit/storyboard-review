<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Snail Mucin Glass Skin</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Noto+Serif+TC:wght@700;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: 'Bricolage Grotesque', sans-serif; }

      :root{
        --ground-1:#f6f8f1;
        --ground-2:#e8efdd;
        --ground-3:#cddfb9;
        --ink-dark:#0f2016;
        --ink-moss:#2c4a34;
        --shell:#b9835a;
        --shell-deep:#8a5a37;
        --shell-deep-contrast:#aa7853;
        --shell-light:#e3bd8e;
        --body-tan:#dcb98e;
        --trail-a:#bdf0d4;
        --trail-b:#f2e3b4;
        --trail-c:#e4c8ec;
        --pearl:#fbfaf4;
        --bubble-fill:rgba(130,175,120,0.22);
      }

      #root{ position:relative; width:1080px; height:1920px; overflow:hidden; }

      .stage{
        position:absolute; inset:0; width:100%; height:100%; overflow:hidden;
        background:
          radial-gradient(640px 640px at 82% 12%, #ffffff 0%, rgba(255,255,255,0) 60%),
          radial-gradient(1200px 1200px at 14% 96%, var(--ground-3) 0%, transparent 62%),
          linear-gradient(160deg, var(--ground-1) 0%, var(--ground-2) 55%, var(--ground-3) 100%);
        font-family:'Bricolage Grotesque',sans-serif;
      }

      /* ---------- botanical ghosts ---------- */
      .leaf{ position:absolute; z-index:1; opacity:0.5; pointer-events:none; }

      /* ---------- headline ---------- */
      .headline{ position:absolute; top:170px; left:66px; width:640px; z-index:6; }
      .kicker{
        font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:26px;
        letter-spacing:0.32em; text-transform:uppercase; color:var(--shell-deep);
      }
      .headline h1{
        margin:10px 0 0; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:166px;
        line-height:0.86; letter-spacing:-0.01em;
        background:linear-gradient(160deg, var(--ink-moss) 0%, var(--ink-dark) 75%);
        -webkit-background-clip:text; background-clip:text; color:transparent;
      }
      .descriptor{
        margin:22px 0 0; max-width:520px; font-family:'Bricolage Grotesque',sans-serif; font-weight:500;
        font-size:15px; letter-spacing:0.06em; color:var(--ink-moss); line-height:1.7;
      }
      .headline h2{
        margin:26px 0 0; font-family:'Noto Serif TC',serif; font-weight:900; font-size:60px;
        color:var(--shell-deep); letter-spacing:0.05em; text-wrap:balance;
      }

      /* ---------- bubbles ---------- */
      .bubble{
        position:absolute; border-radius:50%; z-index:3; pointer-events:none;
        background:
          radial-gradient(circle at 30% 26%, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.6) 9%, rgba(255,255,255,0.1) 21%, var(--bubble-fill) 48%, rgba(130,175,120,0.10) 78%, rgba(255,255,255,0.03) 100%);
        box-shadow:
          inset -10px -14px 26px rgba(255,255,255,0.55),
          inset 10px 12px 30px rgba(70,110,60,0.14),
          0 16px 30px rgba(70,110,60,0.12);
        will-change: transform;
      }
      .bubble::after{
        content:""; position:absolute; top:13%; left:20%; width:24%; height:17%;
        background:rgba(255,255,255,0.92); border-radius:50%; filter:blur(1.5px);
      }

      .callout{
        position:absolute; border-radius:50%; z-index:6;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        text-align:center; padding-bottom:6%; gap:20px;
        background:radial-gradient(circle at 30% 26%, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.62) 9%, rgba(255,255,255,0.14) 22%, var(--bubble-fill) 50%, rgba(130,175,120,0.10) 80%, rgba(255,255,255,0.04) 100%);
        box-shadow: inset -12px -16px 30px rgba(255,255,255,0.55), inset 12px 14px 34px rgba(70,110,60,0.14), 0 18px 34px rgba(70,110,60,0.14);
        transform-origin:center center;
      }
      .callout .num{
        font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
        color:var(--shell-deep-contrast); line-height:1.1; font-variant-numeric:tabular-nums;
        display:inline-block; transform-origin:center center;
      }
      .callout .label{
        font-family:'Noto Serif TC',serif; font-weight:900; color:var(--shell-deep);
        margin-top:2px;
      }
      .callout .cap{
        font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:13px;
        letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-moss); opacity:0.75; margin-top:4px;
      }

      /* ---------- bottle ---------- */
      .bottle-outer{
        position:absolute; top:270px; right:80px; width:315px; z-index:4;
        transform-origin:center center;
      }
      .bottle{
        position:relative; width:100%;
        transform:rotate(-3deg); transform-origin:50% 20%;
        filter:drop-shadow(-14px 26px 30px rgba(60,90,55,0.22));
      }
      .snail-anim{ transform-box: fill-box; transform-origin: center; }

      /* ---------- resolve-hold ambient glow (optional polish) ---------- */
      .bottle-glow{
        position:absolute; z-index:2; border-radius:50%; pointer-events:none;
        background: radial-gradient(circle, rgba(189,240,212,0.6) 0%, rgba(242,227,180,0.4) 45%, rgba(228,200,236,0) 75%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-fps="30" data-width="1080" data-height="1920">
      <div class="stage clip" id="scene" data-start="0" data-duration="10">

        <!-- botanical ghost leaves -->
        <svg class="leaf" data-layout-allow-overflow style="top:1300px; left:-60px; width:420px; height:420px;" viewBox="0 0 420 420" fill="none">
          <path d="M20,400 C40,220 160,60 400,20 C360,180 260,340 20,400Z" fill="var(--ground-3)" opacity="0.55"/>
        </svg>
        <svg class="leaf" data-layout-allow-overflow style="top:-40px; right:260px; width:260px; height:260px;" viewBox="0 0 260 260" fill="none">
          <path d="M10,10 C90,10 250,40 250,180 C150,180 10,120 10,10Z" fill="var(--ground-3)" opacity="0.4"/>
        </svg>

        <!-- headline -->
        <div class="headline">
          <div class="kicker" id="kicker" style="opacity:0;">Snail</div>
          <h1 id="hero-mucin" style="opacity:0;">Mucin</h1>
          <div class="descriptor" id="descriptor"><span class="term" id="term1" style="opacity:0; filter:blur(14px);">Glycoprotein</span><span class="term-sep" id="sep1" style="opacity:0; filter:blur(14px);">&nbsp;&middot;&nbsp;</span><span class="term" id="term2" style="opacity:0; filter:blur(14px);">Hyaluronic Acid</span><span class="term-sep" id="sep2" style="opacity:0; filter:blur(14px);">&nbsp;&middot;&nbsp;</span><span class="term" id="term3" style="opacity:0; filter:blur(14px);">Allantoin Complex</span></div>
          <h2 id="cn-subhead" style="opacity:0;">蝸牛黏液精華</h2>
        </div>

        <!-- ambient bloom behind bottle (resolve-hold polish, one-time, no breathe) -->
        <div class="bottle-glow" id="bottle-glow" style="top:480px; left:610px; width:460px; height:460px; opacity:0;"></div>

        <!-- bottle illustration -->
        <div class="bottle-outer" id="bottle-group" style="opacity:0;">
          <div class="bottle">
            <svg viewBox="0 0 320 900" width="100%" fill="none">
              <defs>
                <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="190" gradientUnits="userSpaceOnUse">

                  <circle cx="188" cy="470" r="6" opacity="0.8"/>

                  <circle cx="120" cy="655" r="3.5" opacity="0.65"/>

                      fill="url(#trailGrad)" fill-opacity="0"/>

                <path d="M212,270 C196,254 172,250 154,260 C136,270 130,290 142,304 C156,320 184,320 202,306 C214,296 220,282 212,270Z" fill="var(--body-tan)"/>
                <path d="M148,262 C138,250 124,246 112,252" stroke="#8a6a44" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M156,272 C148,258 134,252 120,256" stroke="#8a6a44" stroke-width="3" fill="none" stroke-linecap="round"/>
                <circle cx="112" cy="252" r="3.4" fill="#8a6a44"/>
                <circle cx="120" cy="256" r="3.4" fill="#8a6a44"/>
                <ellipse cx="170" cy="286" rx="9" ry="5.5" fill="#ffffff" opacity="0.35"/>

                <circle cx="219" cy="244" r="46" fill="url(#shellGradA)"/>
                <circle cx="223" cy="241" r="35" fill="none" stroke="var(--shell-deep)" stroke-width="4" opacity="0.5"/>
                <circle cx="227" cy="238" r="25" fill="none" stroke="var(--shell-deep)" stroke-width="3.6" opacity="0.5"/>
                <circle cx="230" cy="236" r="16" fill="none" stroke="var(--shell-deep)" stroke-width="3.2" opacity="0.55"/>
                <circle cx="233" cy="234" r="8" fill="none" stroke="var(--shell-deep)" stroke-width="2.6" opacity="0.6"/>
                <circle cx="235" cy="232" r="3" fill="var(--shell-deep)" opacity="0.75"/>

                <circle cx="81" cy="486" r="8" fill="none" stroke="var(--shell-deep)" stroke-width="2.4" opacity="0.6"/>

        <!-- scattered bokeh bubbles -->
        <div class="bubble" style="top:140px; left:870px; width:38px; height:38px;"></div>
        <div class="bubble" style="top:110px; left:970px; width:26px; height:26px;"></div>
        <div class="bubble" style="top:520px; left:600px; width:34px; height:34px;"></div>
        <div class="bubble" style="top:600px; left:660px; width:22px; height:22px;"></div>
        <div class="bubble" style="top:660px; left:40px; width:52px; height:52px;"></div>
        <div class="bubble" style="top:800px; left:70px; width:96px; height:96px;"></div>
        <div class="bubble" style="top:980px; left:995px; width:50px; height:50px;"></div>
        <div class="bubble" style="top:1180px; left:460px; width:44px; height:44px;"></div>
        <div class="bubble" style="top:1230px; left:850px; width:30px; height:30px;"></div>
        <div class="bubble" style="top:1280px; left:150px; width:56px; height:56px;"></div>
        <div class="bubble" style="top:1480px; left:445px; width:42px; height:42px;"></div>
        <div class="bubble" style="top:1560px; left:985px; width:58px; height:58px;"></div>

        <!-- callout: active compounds -->
        <div class="callout" id="callout-actives" style="top:1330px; left:70px; width:340px; height:340px; opacity:0;">
          <div style="display:flex; align-items:baseline; gap:10px;">
            <span class="num" id="actives-num" style="font-size:126px;">00</span>
            <span class="label" id="actives-label" style="font-size:38px; opacity:0;">活性成分</span>
          </div>
          <div class="cap" id="actives-cap" style="opacity:0;">Key Actives</div>
        </div>

        <!-- callout: skin benefits -->
        <div class="callout" id="callout-benefits" style="top:1365px; left:660px; width:300px; height:300px; opacity:0;">
          <div style="display:flex; align-items:baseline; gap:10px;">
            <span class="num" id="benefits-num" style="font-size:110px;">00</span>
            <span class="label" id="benefits-label" style="font-size:34px; opacity:0;">肌膚功效</span>
          </div>
          <div class="cap" id="benefits-cap" style="opacity:0;">Skin Benefits</div>
        </div>

      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        // ---- SVG stroke-draw setup: measure real path length, never guess ----
        document.querySelectorAll('.trail-stroke').forEach((p) => {
          const len = p.getTotalLength();
          p.style.strokeDasharray = String(len);
          p.style.strokeDashoffset = String(len);
        });

        const activesNumEl = document.getElementById('actives-num');
        const benefitsNumEl = document.getElementById('benefits-num');
        const glowA = document.getElementById('trail-glow-a');
        const glowB = document.getElementById('trail-glow-b');
        const bubbleEls = gsap.utils.toArray('.bubble');

        const tl = gsap.timeline({ paused: true });

        // ============================================================
        // Scene 1 — hook-headline (0 – 1.8s)
        // ============================================================

        // kicker "Snail" — fade_in + slide_bottom, lands ~0.15s
        tl.fromTo('#kicker', { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.15, ease: 'power4.out' }, 0);

        // hero "Mucin" — kinetic-beat-slam scale+blur entrance (power4.out, ~0.4s).
        // Opacity/blur clear fast with NO overshoot (they must never cross their
        // held bounds); the restrained back.out(1.5) settle carries scale only,
        // resolving by ~0.9s — a deliberately smaller overshoot than the base
        // vocabulary table's back.out(2.2), which reads too playful here.
        tl.fromTo('#hero-mucin', { opacity: 0, filter: 'blur(10px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power4.out' }, 0);
        tl.fromTo('#hero-mucin', { scale: 1.4 }, { scale: 1, duration: 0.9, ease: 'back.out(1.5)' }, 0);

        // illustrated bottle — spring-pop-entrance calm variant (scale 0->1, power3.out, Y_RISE<=12px)
        tl.fromTo('#bottle-group', { scale: 0, y: 12, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0);

        // snail A (large, upper) then snail B (small, lower) — same calm spring-pop, staggered ~0.12s
        tl.fromTo('#snail-a', { scale: 0, y: 10, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.35, ease: 'power3.out' }, 0.05);
        tl.fromTo('#snail-b', { scale: 0, y: 8, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.35, ease: 'power3.out' }, 0.17);

        // twin slime trails — svg-path-draw: stroke draws on first (power2.out,
        // measured getTotalLength, never back.out), glow-fill cross-fades in
        // just behind each stroke (power1.out); trail B staggered to ~70% of
        // trail A's draw duration so the pair reads as continuous motion.
        tl.to('#trail-stroke-a', { strokeDashoffset: 0, duration: 0.6, ease: 'power2.out' }, 0.4);
        tl.to('#trail-glow-a', { fillOpacity: 0.55, duration: 0.75, ease: 'power1.out' }, 0.55);
        tl.to('#trail-stroke-b', { strokeDashoffset: 0, duration: 0.58, ease: 'power2.out' }, 0.82);
        tl.to('#trail-glow-b', { fillOpacity: 0.5, duration: 0.65, ease: 'power1.out' }, 0.95);

        // ============================================================
        // Scene 2 — build-descriptor (1.8 – 3.2s)
        // ============================================================
        // word_reveal stagger, each settling via fade_blur (depth-of-field-blur's
        // filter tween discipline) — co-equal weight, no scale/bounce on any term.
        tl.fromTo('#term1, #sep1', { opacity: 0, filter: 'blur(14px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.55, ease: 'power1.out' }, 1.8);
        tl.fromTo('#term2, #sep2', { opacity: 0, filter: 'blur(14px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.55, ease: 'power1.out' }, 1.98);
        tl.fromTo('#term3', { opacity: 0, filter: 'blur(14px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.55, ease: 'power1.out' }, 2.16);

        // ============================================================
        // Scene 3 — build-subhead-cn (3.2 – 4.4s)
        // ============================================================
        // unadorned bridge beat — slide_bottom + fade_in only, base primitives
        tl.fromTo('#cn-subhead', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power4.out' }, 3.2);

        // ============================================================
        // Scene 4 — punch-stat-actives (4.4 – 5.9s)
        // ============================================================
        tl.fromTo('#callout-actives', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'power3.out' }, 4.4);

        const activesCount = { value: 0 };
        tl.to(activesCount, {
          value: 5, duration: 0.55, ease: 'power2.out',
          onUpdate: () => { activesNumEl.textContent = String(Math.round(activesCount.value)).padStart(2, '0'); },
        }, 4.5);
        tl.fromTo('#actives-num', { scale: 0.55 }, { scale: 1, duration: 0.55, ease: 'power2.out' }, 4.5);
        tl.fromTo('#actives-label, #actives-cap', { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power2.out' }, 4.65);

        // ============================================================
        // Scene 5 — punch-stat-benefits (5.9 – 7.2s) — matched mirror pair,
        // deliberately NOT varied: call-and-response repetition is the intent.
        // ============================================================
        tl.fromTo('#callout-benefits', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'power3.out' }, 5.9);

        const benefitsCount = { value: 0 };
        tl.to(benefitsCount, {
          value: 4, duration: 0.55, ease: 'power2.out',
          onUpdate: () => { benefitsNumEl.textContent = String(Math.round(benefitsCount.value)).padStart(2, '0'); },
        }, 6.0);
        tl.fromTo('#benefits-num', { scale: 0.55 }, { scale: 1, duration: 0.55, ease: 'power2.out' }, 6.0);
        tl.fromTo('#benefits-label, #benefits-cap', { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power2.out' }, 6.15);

        // ============================================================
        // Scene 6 — resolve-hold (7.2 – 10.0s)
        // ============================================================
        // No new entrances — nothing from scenes 1-5 exits. The hold IS the
        // deliverable (titlecard-reveal's stillness discipline), not a gap.

        // optional polish: a single bloom-and-hold behind the bottle, peak
        // opacity <=0.3, no ongoing breathe (avoids a second competing motif).
        tl.fromTo('#bottle-glow', { opacity: 0, scale: 0.85 }, { opacity: 0.22, scale: 1, duration: 1.0, ease: 'power2.out' }, 7.2);

        const HOLD_START = 7.2;
        const HOLD_DUR = 10.0 - HOLD_START; // 2.8s

        // bokeh bubbles — sine-wave-loop onUpdate form, low amplitude, damped
        // /sqrt(N) since ~12 run concurrently, periods staggered so they read
        // as one collective breath rather than competing jitter.
        const bubblePeriods = [2.1, 1.9, 2.4, 2.6, 2.2, 2.0, 2.3, 2.5, 2.15, 1.95, 2.35, 2.45];
        const BASE_PERIOD = 2.2;
        const bubbleAmpScale = 0.01 / Math.sqrt(bubbleEls.length);
        const bubbleAmpY = 2.5 / Math.sqrt(bubbleEls.length);
        const bubblePhase = { p: 0 };
        tl.to(bubblePhase, {
          p: Math.PI * 2 * (HOLD_DUR / BASE_PERIOD),
          duration: HOLD_DUR,
          ease: 'none',
          onUpdate: () => {
            bubbleEls.forEach((el, i) => {
              const period = bubblePeriods[i % bubblePeriods.length];
              const localPhase = bubblePhase.p * (BASE_PERIOD / period) + i * 0.6;
              const s = Math.sin(localPhase);
              el.style.transform = `translateY(${(s * bubbleAmpY).toFixed(2)}px) scale(${(1 + s * bubbleAmpScale).toFixed(4)})`;
            });
          },
        }, HOLD_START);

        // dominant-motif reprise: bounded sine shimmer on the trail glow
        // opacity — NOT an infinite shimmer-sweep (that variant is reserved
        // for in-progress status text, not a finished, resolved trail).
        const shimmerPhase = { p: 0 };
        tl.to(shimmerPhase, {
          p: Math.PI * 2 * 1.3,
          duration: HOLD_DUR,
          ease: 'none',
          onUpdate: () => {
            const s = Math.sin(shimmerPhase.p);
            glowA.style.fillOpacity = (0.55 + s * 0.05).toFixed(3);
            glowB.style.fillOpacity = (0.5 + Math.sin(shimmerPhase.p + Math.PI / 2) * 0.05).toFixed(3);
          },
        }, HOLD_START);

        tl.seek(0);
        window.__timelines['main'] = tl;
      })();
    </script>
  </body>
</html>
