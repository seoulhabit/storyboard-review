  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const TOTAL = 8.542;

    const faceEl = document.querySelector(".magnet-face");
    const fistEl = document.querySelector(".magnet-fist");
    const dropletEls = document.querySelectorAll(".magnet-droplet");
    const fineLineEl = document.querySelector(".magnet-fineline");
    const fineLinePath = document.querySelector(".magnet-fineline-path");
    const textEl = document.querySelector(".magnet-caption-text");
    const cursorEl = document.querySelector(".magnet-caption-cursor");

    // ---- Scene 1 (0.0-2.0s) ----
    // Face settles centered — hero visible well before t=0.5s; opacity resolves fast while the
    // position/scale settle continues a touch longer.
    tl.fromTo(faceEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);
    tl.fromTo(faceEl, { y: -45, scale: 0.94 }, { y: 0, scale: 1, duration: 0.8, ease: "power2.out" }, 0);

    // Fist enters to an "approach" position just off the cheek (also visible by t<=0.5s), then
    // pats the cheek twice — press to contact, release, press again and HOLD in contact. That
    // held contact point (x:0, y:0 — the fist's resting position) is what Scene 2's droplets
    // converge onto and what Scene 3's fine line sits beside.
    tl.fromTo(
      fistEl,
      { opacity: 0, x: 170, y: 250, scale: 0.94 },
      { opacity: 1, x: 55, y: 70, scale: 1, duration: 0.4, ease: "power2.out" },
      0.1
    );
    tl.to(fistEl, { x: 0, y: 0, scale: 0.97, duration: 0.2, ease: "power2.out" }, 0.55); // pat 1: press
    tl.to(fistEl, { x: 55, y: 70, scale: 1, duration: 0.22, ease: "power2.inOut" }, 0.78); // pat 1: release
    tl.to(fistEl, { x: 0, y: 0, scale: 0.97, duration: 0.2, ease: "power2.out" }, 1.25); // pat 2: press
    tl.to(fistEl, { scale: 1, duration: 0.2, ease: "power1.out" }, 1.45); // pat 2: settle + hold

    // ---- Scene 2 (2.0-5.2s) ----
    // center-outward-expansion run in reverse: each droplet starts at its data-target-x/y edge
    // offset and eases to 0,0 (the fist's contact point on the cheek), shrinking and fading as
    // it's absorbed. Stagger capped tight (0.09s) so the group reads as one convergence beat.
    const ENTRY_AT = 2.35;
    const STAGGER = 0.09;
    const DROP_DUR = 1.5;
    dropletEls.forEach((el, i) => {
      const tx = Number(el.dataset.targetX);
      const ty = Number(el.dataset.targetY);
      const start = ENTRY_AT + i * STAGGER;
      tl.fromTo(
        el,
        { xPercent: -50, yPercent: -50, x: tx, y: ty, scale: 0.8, opacity: 0 },
        { x: 0, y: 0, scale: 0.3, duration: DROP_DUR, ease: "power2.out" },
        start
      );
      tl.to(el, { opacity: 1, duration: 0.15, ease: "power1.out" }, start);
      tl.to(el, { opacity: 0, duration: 0.3, ease: "power1.in" }, start + DROP_DUR - 0.3);
    });

    // ---- Scene 3 (5.2-8.542s) ----
    // The fist withdraws — a mid-shot action, not the frame's own exit (the root push-slide-up
    // is the exit). Fine line eases down in stroke-weight and flattens; non-scaling-stroke keeps
    // the drawn line crisp while scaleY alone does the flattening.
    tl.to(fistEl, { x: 260, y: 300, opacity: 0, duration: 0.55, ease: "power2.in" }, 5.2);

    tl.fromTo(fineLineEl, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 5.3);
    tl.to(fineLineEl, { scaleY: 0.22, duration: 1.4, ease: "power2.inOut" }, 5.7);
    tl.to(fineLinePath, { attr: { "stroke-width": 2 }, duration: 1.4, ease: "power2.inOut" }, 5.7);

    // "Moisture Magnet" — discrete-text-sequence: keystrokes, a word-break pause, one bulk
    // finish, then holds with a blinking cursor.
    const SEQUENCE = [
      { t: 6.0, text: "" },
      { t: 6.08, text: "M" },
      { t: 6.16, text: "Mo" },
      { t: 6.24, text: "Moi" },
      { t: 6.32, text: "Mois" },
      { t: 6.4, text: "Moist" },
      { t: 6.48, text: "Moistu" },
      { t: 6.56, text: "Moistur" },
      { t: 6.64, text: "Moisture" },
      { t: 7.04, text: "Moisture Magnet" },
    ];
    function textAt(time) {
      for (let i = SEQUENCE.length - 1; i >= 0; i--) {
        if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
      }
      return "";
    }
    const typeDriver = { t: 6.0 };
    tl.to(typeDriver, {
      t: TOTAL,
      duration: TOTAL - 6.0,
      ease: "none",
      onUpdate: () => {
        textEl.textContent = textAt(typeDriver.t);
      },
    }, 6.0);

    // Cursor blink — deterministic sine square wave tied to timeline position, never wall clock.
    const BLINK_START = 5.2;
    const blink = { p: 0 };
    tl.to(blink, {
      p: Math.PI * 2 * 5,
      duration: TOTAL - BLINK_START,
      ease: "none",
      onUpdate: () => {
        cursorEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
      },
    }, BLINK_START);

    window.__timelines["04-magnet"] = tl;
  </script>
