<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "EB Garamond";
          font-weight: 400;
          font-style: normal;
          src: url("assets/fonts/eb-garamond-400.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "JetBrains Mono";
          font-weight: 100 900;
          font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2");
          font-display: block;
        }
        #root {
          --ink: #131516;
          --paper: #F7F5F0;
          --coral: #C97A5C;
          --aqua: #59B8AE;
          --ink-3: #9C978D;
          --font-display: "EB Garamond", Georgia, "Times New Roman", serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --t-frame: 50px;
          --t-body: 32px;

          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--ink);
          font-family: var(--font-mono);
        }
        .clip { position: absolute; inset: 0; }

        .opl-label { top: 220px; left: 0; width: 100%; text-align: center; }
        .opl-label-text {
          font-family: var(--font-display);
          font-size: 68px;
          color: var(--paper);
        }
        .opl-underline { width: 320px; height: 4px; background: var(--aqua); margin: 18px auto 0; transform: scaleX(0); }

        /* padding widened from 0 120px (edges 120..960, past safe-right's reserved
           918) to clear both safe-left (60) and safe-right (162) with margin. */
        .opl-list { top: 480px; left: 0; width: 100%; padding: 0 180px 0 80px; transform-origin: 0 0; }
        .opl-row {
          font-family: var(--font-mono);
          font-size: 38px;
          padding: 16px 0;
          color: var(--paper);
          border-bottom: 1px solid rgba(247,245,240,0.12);
          opacity: 0;
          transform: translateY(10px);
        }
        .opl-row.opl-below { color: var(--ink-3); }

        .opl-rule {
          width: 100%;
          height: 6px;
          margin: 4px 0 10px;
          background: var(--coral);
          transform: scaleX(0);
          transform-origin: left center;
        }
      </style>

      <div data-hf-id="hf-opl-root" id="root" data-composition-id="04-one-percent-line" data-width="1080" data-height="1920" data-duration="13.1">
        <div data-hf-id="hf-opl-label" id="opl-label" class="clip opl-label" data-start="0" data-duration="13.1">
          <div data-hf-id="hf-opl-labeltext" class="opl-label-text" id="opl-label-text">THE 1% LINE</div>
          <div data-hf-id="hf-opl-underline" class="opl-underline" id="opl-underline"></div>
        </div>

        <div data-hf-id="hf-opl-list" id="opl-list" class="clip opl-list" data-start="0" data-duration="13.1">
          <div data-hf-id="hf-opl-r1" class="opl-row" id="opl-row-1">WATER</div>
          <div data-hf-id="hf-opl-r2" class="opl-row" id="opl-row-2">GLYCERIN</div>
          <div data-hf-id="hf-opl-r3" class="opl-row" id="opl-row-3">NIACINAMIDE</div>
          <div data-hf-id="hf-opl-r4" class="opl-row" id="opl-row-4">CENTELLA ASIATICA EXTRACT</div>
          <div data-hf-id="hf-opl-rline" class="opl-rule" id="opl-rule-line"></div>
          <div data-hf-id="hf-opl-r5" class="opl-row opl-below" id="opl-row-5">PHENOXYETHANOL</div>
          <div data-hf-id="hf-opl-r6" class="opl-row opl-below" id="opl-row-6">FRAGRANCE</div>
          <div data-hf-id="hf-opl-r7" class="opl-row opl-below" id="opl-row-7">TOCOPHEROL</div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#opl-label-text", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
        tl.to("#opl-underline", { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.55);

        const ABOVE = ["#opl-row-1", "#opl-row-2", "#opl-row-3", "#opl-row-4"];
        ABOVE.forEach((id, i) => {
          tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.4 + i * 0.22);
        });

        // the coral rule slams across — this video's ONE voltage moment.
        // It sits in normal document flow directly above PHENOXYETHANOL,
        // so no runtime offset math is needed.
        tl.fromTo("#opl-rule-line", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.16, ease: "power2.in" }, 6.4);

        // dynamic zoom: the full 7-row list reads too small on mobile, so push in on the
        // above-the-line cluster while VO explains ordering, then pan down to land on the
        // rule slam, then pull back out for the close. transform-origin is 0 0 on #opl-list;
        // constants below are pre-computed from its layout (see STORYBOARD.md build history),
        // not measured at tween time.
        tl.fromTo("#opl-list", { scale: 1, x: 0, y: 0 }, { scale: 1.55, x: -36, y: 141.22, duration: 0.45, ease: "power2.inOut" }, 1.5);
        tl.to("#opl-list", { y: -274.65, duration: 0.5, ease: "power2.inOut" }, 5.95);
        tl.to("#opl-list", { scale: 1, x: 0, y: 0, duration: 0.5, ease: "power2.inOut" }, 11.5);

        const BELOW = ["#opl-row-5", "#opl-row-6", "#opl-row-7"];
        BELOW.forEach((id, i) => {
          tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.7 + i * 0.22);
        });
        // below-line rows desaturate + drift down/fade once the rule lands
        BELOW.forEach((id, i) => {
          tl.to(id, { y: 24, opacity: 0.35, duration: 0.5, ease: "power2.inOut" }, 6.6 + i * 0.1);
        });

        // VO local 7.41-11.48: "After 1%, brands can scramble them in any order." This was
        // a flat 4.4s freeze (7.3->11.5) between the rule-slam settling and the pull-out —
        // fill it with motion that literally IS the sentence. A vertical swap crossed the
        // two rows' text boxes mid-transition (lint: content_overlap on row 6/7), so the
        // scramble reads laterally instead — opposite x-jitter, no shared space to cross.
        tl.to("#opl-row-6", { x: 26, duration: 0.4, ease: "power2.inOut" }, 8.6);
        tl.to("#opl-row-7", { x: -26, duration: 0.4, ease: "power2.inOut" }, 8.6);
        tl.to("#opl-row-6", { x: 0, duration: 0.4, ease: "power2.inOut" }, 9.4);
        tl.to("#opl-row-7", { x: 0, duration: 0.4, ease: "power2.inOut" }, 9.4);
        tl.to("#opl-row-5", { x: 10, duration: 0.3, ease: "power1.inOut", yoyo: true, repeat: 1 }, 9.9);

        tl.to(["#opl-label", "#opl-list"], { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 12.3);

        tl.to({}, { duration: 13.1 }, 0);
        window.__timelines["04-one-percent-line"] = tl;
      </script>
    </template>
  </body>
</html>
