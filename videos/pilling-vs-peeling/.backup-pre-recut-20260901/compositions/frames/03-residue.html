<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }

        #root {
          --paper: #F7F5F0; --ink: #131516; --ink-2: #6B6B6B; --aqua: #59B8AE;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
          --safe-margin: 6px;

          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--ink); font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }

        /* Spatial plan (same-family reuse of pilling-not-dead-skin/04-stack.html's
           2-band shed diagram, extended to 3 bands per this brief's own layering
           list -- serum, moisturizer, SPF):
           1. #root is a single flex column: caption zone (top) / diagram zone
              (flex:1, centered SVG) / chip zone (bottom).
           2. The three-band stack + shedding pills are one self-contained SVG;
              nothing outside it gets its own independent absolute position. */
        .stage { display: flex; flex-direction: column; height: 100%;
                 padding: calc(var(--safe-top) + var(--safe-margin)) var(--safe-right)
                          var(--safe-bottom) calc(var(--safe-left) + var(--safe-margin)); }

        .caption-zone { flex: 0 0 auto; display: flex; flex-direction: column; gap: 16px; }
        .caption-line { font-weight: 800; font-size: 46px; line-height: 1.25;
                         color: var(--paper); max-width: 780px; opacity: 0; }

        .diagram-zone { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; }
        .diagram-zone svg { width: 820px; height: 500px; display: block; }
        .band { fill: none; stroke: var(--paper); stroke-width: 2.4; opacity: 0; }
        .band-fill-top { fill: rgba(247,245,240,0.10); }
        .band-fill-mid { fill: rgba(247,245,240,0.075); }
        .band-fill-bot { fill: rgba(247,245,240,0.05); }
        .band-label { font-family: var(--font-mono); font-size: 28px; font-weight: 500;
                      letter-spacing: 0.08em; fill: rgba(247,245,240,0.72); opacity: 0; }
        .pill { fill: rgba(247,245,240,0.85); opacity: 0; }

        .chip-zone { flex: 0 0 auto; padding-top: 12px; }
        .chip { font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.04em;
                color: rgba(247,245,240,0.85); border: 1.5px solid rgba(247,245,240,0.3);
                border-radius: 999px; padding: 8px 20px; display: inline-block; opacity: 0; }
      </style>

      <div id="root" data-composition-id="03-residue" data-width="1080" data-height="1920" data-duration="3.200">
        <div class="clip stage">
          <div class="caption-zone">
            <p class="caption-line" id="cap3a">PRODUCT RESIDUE</p>
            <p class="caption-line" id="cap3b" style="font-family: var(--font-mono); font-weight: 500; font-size: 32px; color: var(--ink-2);">Rolls into balls while you layer.</p>
          </div>
          <div class="diagram-zone">
            <svg viewBox="0 0 820 500">
              <rect class="band band-fill-top" id="bandTop" x="20" y="40" width="780" height="90" rx="10"/>
              <text class="band-label" id="labelTop" x="40" y="92">SPF</text>
              <rect class="band band-fill-mid" id="bandMid" x="20" y="200" width="780" height="90" rx="10"/>
              <text class="band-label" id="labelMid" x="40" y="252">MOISTURIZER</text>
              <rect class="band band-fill-bot" id="bandBot" x="20" y="360" width="780" height="90" rx="10"/>
              <text class="band-label" id="labelBot" x="40" y="412">SERUM</text>

              <circle class="pill" id="pillA0" cx="60" cy="145" r="8"/>
              <circle class="pill" id="pillA1" cx="230" cy="145" r="10"/>
              <circle class="pill" id="pillA2" cx="400" cy="145" r="7"/>
              <circle class="pill" id="pillA3" cx="570" cy="145" r="9"/>
              <circle class="pill" id="pillA4" cx="740" cy="145" r="8"/>

              <circle class="pill" id="pillB0" cx="100" cy="305" r="9"/>
              <circle class="pill" id="pillB1" cx="280" cy="305" r="7"/>
              <circle class="pill" id="pillB2" cx="460" cy="305" r="10"/>
              <circle class="pill" id="pillB3" cx="640" cy="305" r="8"/>
            </svg>
          </div>
          <div class="chip-zone">
            <div class="chip" id="chip3">Skin Res Technol &middot; 2024</div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        // t0.0: all three bands settle in fast.
        tl.to(['#bandTop', '#bandMid', '#bandBot'], { opacity: 1, duration: 0.22 }, 0);
        tl.to(['#labelTop', '#labelMid', '#labelBot'], { opacity: 1, duration: 0.22 }, 0.08);

        tl.to('#cap3a', { opacity: 1, duration: 0.28 }, 0.35);
        tl.to('#chip3', { opacity: 1, duration: 0.3 }, 1.5);
        tl.to('#cap3b', { opacity: 1, duration: 0.28 }, 2.3);

        // t1.1-2.9: pills detach from both seams, staggered -- the scene's continuous
        // back-half motion, deterministic (bounded duration per pill, no loop/rAF).
        var pillsA = ['#pillA0','#pillA1','#pillA2','#pillA3','#pillA4'];
        var pillsB = ['#pillB0','#pillB1','#pillB2','#pillB3'];
        pillsA.forEach(function (id, i) {
          var t = 1.1 + i * 0.22;
          tl.set(id, { opacity: 1 }, t);
          tl.to(id, { y: 40 + (i % 3) * 8, rotation: (i % 2 === 0 ? 1 : -1) * (16 + i * 3),
                      opacity: 0, duration: 0.8, ease: "power2.in" }, t);
        });
        pillsB.forEach(function (id, i) {
          var t = 1.3 + i * 0.24;
          tl.set(id, { opacity: 1 }, t);
          tl.to(id, { y: 38 + (i % 3) * 8, rotation: (i % 2 === 0 ? -1 : 1) * (16 + i * 3),
                      opacity: 0, duration: 0.8, ease: "power2.in" }, t);
        });

        tl.to({}, { duration: 3.200 }, 0); // full-span anchor
        window.__timelines["03-residue"] = tl;
      </script>
    </template>
  </body>
</html>
