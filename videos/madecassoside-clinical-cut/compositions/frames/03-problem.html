<script>
(function () {
  // Same seed as 02-setup → the identical knot, carried over already crested.
  function lcg(seed) { var s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  var rnd = lcg(20260829);
  var NS = 'http://www.w3.org/2000/svg';
  var knot = document.getElementById('pr-knot');
  var CX = 320, CY = 280;
  var strandEls = [];
  for (var i = 0; i < 14; i++) {
    var a0 = rnd() * Math.PI * 2, a1 = rnd() * Math.PI * 2, a2 = rnd() * Math.PI * 2;
    var r0 = 26 + rnd() * 64, r1 = 20 + rnd() * 70, r2 = 24 + rnd() * 60;
    var x0 = CX + Math.cos(a0) * r0, y0 = CY + Math.sin(a0) * r0 * 0.8;
    var x1 = CX + Math.cos(a1) * (r1 + 40), y1 = CY + Math.sin(a1) * r1;
    var x2 = CX + Math.cos(a2) * r2, y2 = CY + Math.sin(a2) * r2 * 0.85;
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M' + x0.toFixed(1) + ',' + y0.toFixed(1) +
      ' Q' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' ' + x2.toFixed(1) + ',' + y2.toFixed(1));
    p.setAttribute('stroke', i % 3 === 0 ? '#131516' : 'rgba(19,21,22,0.55)');
    p.setAttribute('stroke-width', (2.6 + rnd() * 1.6).toFixed(1));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke-linecap', 'round');
    knot.appendChild(p);
    strandEls.push(p);
    rnd(); // consume the entry-angle draw so the sequence matches 02-setup exactly
  }

  var field = document.getElementById('pr-field');
  var caption = document.getElementById('pr-caption');
  var shape = document.getElementById('pr-shape');
  var texture = document.getElementById('pr-texture');
  var bracket = document.getElementById('pr-bracket');
  var occl = document.getElementById('pr-occlusion');
  var jars = document.getElementById('pr-jars');
  var strike = document.getElementById('pr-strike');
  var card = document.getElementById('pr-card');

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  // Local cues (real take): raised@1.56 · hypertrophic@2.00-3.26 · scar@3.26-3.88 ·
  // Generic@4.19 · lock@6.11-6.47 · moisture@6.70-7.41 · don't@8.08-8.39 · structure@9.09-10.06.
  gsap.set(strike, { scaleX: 0, transformOrigin: '138px 444px' });
  gsap.set(document.getElementById('pr-knot'), { y: -20, scale: 1.3, svgOrigin: '320 280' });
  gsap.set(shape, { attr: { 'stroke-dasharray': 1, 'stroke-dashoffset': 1 }, opacity: 0 });
  gsap.set(texture, { opacity: 0 });

  // "raised": the scar's actual silhouette draws in first — an irregular, nodular mass, not
  // a smooth dome — then the bracket measures it and the surface-texture ticks settle in.
  tl.to(shape, { opacity: 1, duration: 0.2 }, 1.20);
  tl.to(shape, { attr: { 'stroke-dashoffset': 0 }, duration: 0.85, ease: 'power2.inOut' }, 1.20);
  tl.to(texture, { opacity: 1, duration: 0.4 }, 1.85);

  // The tangle carries its restless wobble over from 02-setup — same small bounded motion,
  // same index-derived phase/rate, continuing for the whole beat (the tension under the
  // occlusion film doesn't resolve until the mechanism beat's snap).
  strandEls.forEach(function (el, i) {
    var phase = i * 1.31;
    var freq = 1.5 + (i % 4) * 0.3;
    var amp = 1.6 + (i % 3) * 0.3;
    var w = { p: 0 };
    tl.to(w, { p: 9.400, duration: 9.400, ease: 'none', onUpdate: function () {
      gsap.set(el, { x: Math.sin(w.p * freq + phase) * amp, y: Math.cos(w.p * freq * 0.7 + phase) * amp * 0.6 });
    } }, 0);
  });

  // "raised": bracket rises from the surface to the knot apex.
  tl.to(bracket, { opacity: 1, duration: 0.4 }, 1.56);
  tl.fromTo(bracket, { y: 30 }, { y: 0, duration: 0.6, ease: 'power2.out' }, 1.56);

  // "hypertrophic scar": label lands.
  tl.fromTo(caption, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5 }, 2.00);

  // "Generic healing ointments": jar shelf appears.
  tl.fromTo(jars, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55 }, 4.19);

  // "lock in moisture": occlusion film draws over the knot — tangle unchanged beneath.

  tl.fromTo(occl, { attr: { 'stroke-dashoffset': 520 } }, { attr: { 'stroke-dashoffset': 0 }, duration: 1.0, ease: 'power2.inOut' }, 6.11);

  // claim card
  tl.fromTo(card, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6 }, 4.80);
