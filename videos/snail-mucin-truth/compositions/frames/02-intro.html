<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // Scene 1 (0.0-2.0s) — namedrop: "SNAIL" then "MUCIN" reveal per-word,
    // blur (--dof) + opacity + small rise, staggered ~0.22s apart. Hero
    // legible well before t<=0.5s per the hero-visibility floor.
    tl.fromTo(
      "#fr02WordSnail",
      { opacity: 0, y: 16, "--dof": "14px" },
      { opacity: 1, y: 0, "--dof": "0px", duration: 0.5, ease: "power3.out" },
      0.0
    );
    tl.fromTo(
      "#fr02WordMucin",
      { opacity: 0, y: 16, "--dof": "14px" },
      { opacity: 1, y: 0, "--dof": "0px", duration: 0.55, ease: "power3.out" },
      0.22
    );

    // Scene 2 (2.0-4.0s) — the title settles down slightly toward center
    // as the "101" mono chip spring-pops beside it (one composed beat).
    tl.fromTo(
      "#fr02TitleOuter",
      { y: 0 },
      { y: 48, duration: 0.6, ease: "power2.inOut" },
      2.0
    );
    tl.fromTo(
      "#fr02Chip",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      2.0
    );

    // Scene 3 (4.0-7.0s) — three signpost rows land one per spoken clause,
    // each a quick, near-instant pop-in (in-place token-cycle register: a
    // snappy, un-eased-looking arrival, not a slow fade) — a short list
    // that accumulates rather than replaces.
    var rows = ["#fr02Row1", "#fr02Row2", "#fr02Row3"];
    var rowTimes = [4.0, 5.0, 6.0];
    rows.forEach(function (sel, i) {
      tl.fromTo(
        sel,
        { opacity: 0, scale: 0.94, y: 14 },
        { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "power3.out" },
        rowTimes[i]
      );
    });

    // Scene 4 (7.0-9.012s) — the whole shot (title + chip + all three rows)
    // holds together; subtle jitter only, bounded sine drive, one cycle.
    var fr02Phase = { p: 0 };
    var fr02ShotGroupEl = document.getElementById("fr02ShotGroup");
    var IDLE_START = 7.0;
    var IDLE_DUR = 9.012 - IDLE_START;
    tl.to(
      fr02Phase,
      {
        p: Math.PI * 2 * 1,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function () {
          var s = Math.sin(fr02Phase.p);
          fr02ShotGroupEl.style.transform = "translateY(" + (s * 2.5).toFixed(2) + "px)";
        },
      },
      IDLE_START
    );

    window.__timelines["02-intro"] = tl;
  })();
</script>
