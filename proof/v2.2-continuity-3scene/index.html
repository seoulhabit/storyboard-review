<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
<head>
  <meta charset="UTF-8">
  <title>proof-3scene-v22</title>
  <style>
    /* Mandatory rule: border-box reset first, every composition.
       The shipped blank template carries this same reset
       (templates/blank/index.html). An explicit height plus padding under the
       CSS default renders LARGER than declared and pushes bottom-anchored
       content out of the safe zone. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { width: 1080px; height: 1920px; overflow: hidden; background: #101314; }
    .scene { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <!-- GENERATED from 03-beat-sheet.json by scripts/beats_to_composition.py.
       Do not hand-edit timing here; edit the beat sheet and re-run. -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="9.000"
       data-width="1080" data-height="1920">

    <div class="scene clip" id="scene-s01" data-composition-id="s01"
         data-composition-src="compositions/frames/01-s01.html"
         data-start="0.000" data-duration="3.500"
         data-track-index="0"></div>
    <div class="scene clip" id="scene-s02" data-composition-id="s02"
         data-composition-src="compositions/frames/02-s02.html"
         data-start="2.500" data-duration="4.100"
         data-track-index="1"></div>
    <div class="scene clip" id="scene-s03" data-composition-id="s03"
         data-composition-src="compositions/frames/03-s03.html"
         data-start="5.400" data-duration="3.600"
         data-track-index="0"></div>
  </div>

  <!-- GSAP from CDN is the shipped template's own pattern
       (templates/blank/index.html loads gsap from jsdelivr). -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    // The root timeline's only job is scene handoff; each sub-composition owns
    // its own beats. docs/gsap.md: paused, registered on window.__timelines.
    // No timeline `defaults: { ease }` anywhere — every tween names its own
    // ease, because an inherited ease is an uncounted one [S6/A-10].
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // push-slide LEFT 0.500s: s01 -> s02, overlap opens at 2.500s
    tl.to('#scene-s01', { x: -1080, duration: 0.500, ease: "power3.inOut" }, 2.500);
    tl.fromTo('#scene-s02', { x: 1080, opacity: 1 }, { x: 0, duration: 0.500, ease: "power3.inOut" }, 2.500);
    // blur-crossfade 0.600s: s02 -> s03, overlap opens at 5.400s
    tl.to('#scene-s02', { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.600, ease: "power2.inOut" }, 5.400);
    tl.fromTo('#scene-s03', { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.600, ease: "power2.inOut" }, 5.400);
    tl.to({}, { duration: 9.000, ease: 'none' }, 0);   // anchor: tl.duration() === root duration
    window.__timelines['main'] = tl;
  </script>
</body>
</html>
