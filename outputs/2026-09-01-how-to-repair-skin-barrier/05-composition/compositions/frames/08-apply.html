<template>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@500;700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  #root{
    --ink:#131516; --paper:#F7F5F0; --ground:#101314; --card:#FBF9F5;
    --aqua:#59B8AE; --coral:#C97A5C; --celadon:#93B896;
    --muted:rgba(247,245,240,.62); --line-dark:rgba(247,245,240,.14); --line:rgba(19,21,22,.12);
    --ink-faint:rgba(19,21,22,.62);
    --safe-t:192px; --safe-b:384px; --safe-r:162px; --safe-l:72px;
    --display:'EB Garamond',Georgia,serif; --body:'Inter','Noto Sans KR',system-ui,sans-serif;
    position:relative;width:1080px;height:1920px;overflow:hidden;
    background:var(--ground);font-family:var(--body);
  }
  .clip{position:absolute;inset:0}
  .stage{padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
         display:flex;flex-direction:column;justify-content:center}
  /* The channel's display face. Serif, 400 — not a bold sans. */
  .display{font-family:var(--display);font-weight:400;line-height:1.08;
           letter-spacing:-.015em;color:var(--paper);margin:0}
  .d-xl{font-size:132px} .d-lg{font-size:104px} .d-md{font-size:78px}
  .label{font-weight:700;text-transform:uppercase;letter-spacing:.08em;
         font-size:32px;color:var(--muted)}
  .label-aqua{color:var(--aqua)}
  .body{font-weight:500;line-height:1.4;font-size:46px;color:var(--paper)}
  .rule{height:2px;background:var(--aqua);transform-origin:0 50%;width:100%}
  .flag{font-weight:500;font-size:34px;letter-spacing:.04em;color:var(--muted)}
  .cite{font-weight:700;font-size:32px;letter-spacing:.10em;text-transform:uppercase;color:var(--aqua)}
  /* uc-card — position:absolute on the rule is REQUIRED (PDRN Round-4 bug class) */
  .uc-card{position:absolute;background:var(--card);border:1px solid var(--line);
           border-radius:28px;box-shadow:0 24px 64px rgba(0,0,0,.34)}

  .split{margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .half{border:1px solid var(--line-dark);border-radius:24px;padding:44px 34px;min-height:392px;
        display:flex;flex-direction:column;gap:26px;background:rgba(247,245,240,.03)}
  .half .h-key{font-size:30px;font-weight:700;letter-spacing:.10em;color:var(--muted)}
  .half .h-val{font-family:var(--display);font-weight:400;font-size:62px;line-height:1.1;
               color:var(--paper);position:relative;display:inline-block}
  /* the one coral moment in the frame */
  .stop .h-key{color:var(--coral)}
  .strike{position:absolute;left:-6px;top:calc(50% - 3px);height:5px;width:calc(100% + 12px);
          background:var(--coral);border-radius:3px}
  .start .h-key{color:var(--celadon)}
</style>

<div id="root" data-composition-id="apply" data-width="1080" data-height="1920"
     data-duration="5.287">
  <div class="clip stage">
    <div class="flag" id="ap-flag">○ UNSOURCED — no record in this system</div>
    <div class="label" id="ap-lab" style="margin-top:22px">THE USUAL ADVICE</div>
    <div class="split" id="ap-split">
      <div class="half stop" id="ap-stop">
        <div class="h-key">STOP</div>
        <div class="h-val">Over-exfoliating<span class="strike" id="ap-strike"></span></div>
      </div>
      <div class="half start" id="ap-start">
        <div class="h-key">START</div>
        <div class="h-val">Cica, daily,<br>on damp skin</div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var tl = gsap.timeline({ paused:true, defaults:{ ease:"power3.out" } });
  gsap.set(["#ap-stop","#ap-start"],{opacity:0,y:22});
  gsap.set("#ap-strike",{scaleX:0,transformOrigin:"0 50%"});
  gsap.set("#ap-lab",{opacity:0});
  tl.to("#ap-lab",{opacity:1,duration:.35},0.55);
  tl.to("#ap-stop",{opacity:1,y:0,duration:.45},1.05);
  tl.to("#ap-strike",{scaleX:1,duration:.5,ease:"power2.inOut"},1.95);
  tl.to("#ap-stop",{opacity:.62,duration:.5},2.55);
  tl.to("#ap-start",{opacity:1,y:0,duration:.45},2.75);
  // Origin pinned to the RIGHT edge so the pulse grows inward. A centred scale
  // pushed ink into the Shorts button rail at t=44.0s -- caught by
  // catalog/tooling/check-safe-area.py, which measures TRANSFORMED pixels; the
  // padding was compliant the whole time, which is why source review misses this.
  tl.to("#ap-start",{scale:1.018,transformOrigin:"100% 50%",duration:.5,ease:"power1.inOut"},3.85);
  tl.to("#ap-start",{scale:1,duration:.55,ease:"power1.inOut"},4.40);
  tl.to({},{duration:5.287},0);
  window.__timelines = window.__timelines || {};
  window.__timelines["apply"] = tl;
})();
</script>
</template>
