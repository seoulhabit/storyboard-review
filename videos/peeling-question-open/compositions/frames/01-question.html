<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "EB Garamond"; font-weight: 400; font-style: normal;
          src: url("assets/fonts/eb-garamond-400.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }

        #root {
          --paper: #F7F5F0; --ink: #131516; --moss: #4F6B52;
          --font-display: "EB Garamond", Georgia, serif;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;

          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--moss); font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }

        /* Spatial plan:
           1. Full-bleed flex column, justify-content:flex-end -- the frosted panel
              fills the upper safe area, headline sits low in the safe column as a
              second flex child. Not two independent absolute blocks.
           2. Inside the panel, the texture layer and the peel sheet are both
              position:absolute; inset:0 -- the one sanctioned use, since they are
              layered motion planes inside the panel's own stacking context, not a
              layout relationship with the panel itself.
           3. The two headline lines are stacked flex children of one inner column
              (.text-stack), not independently positioned. */
        .stage { display: flex; flex-direction: column; justify-content: flex-end;
                 height: 100%; gap: 48px;
                 padding: var(--safe-top) var(--safe-right) calc(var(--safe-bottom) + 40px) var(--safe-left); }

        .glass-panel { position: relative; flex: 1; border-radius: 32px; overflow: hidden;
                       background: rgba(251,249,245,0.16);
                       backdrop-filter: blur(25px) saturate(1.15);
                       -webkit-backdrop-filter: blur(25px) saturate(1.15);
                       border: 1px solid rgba(255,255,255,0.30); }

        .panel-texture { position: absolute; inset: 0;
                          background:
                            radial-gradient(circle at 28% 22%, rgba(255,255,255,0.30), transparent 42%),
                            radial-gradient(circle at 72% 64%, rgba(255,255,255,0.16), transparent 46%),
                            linear-gradient(150deg, rgba(247,245,240,0.10), rgba(19,21,22,0.06)); }

        /* The peeling sheet: a translucent film clipped from the bottom (revealing
           the panel texture beneath as it "detaches"), hinged at its own bottom
           edge for the rotationX lift, with a static mask gradient (not tweened)
           fading its trailing edge to translucent so the curl reads as thin film,
           not an opaque flap -- same static-mask pattern as
           centella-cica-vs-snail-mucin/04-twist.html's proven swipe-fade edge. */
        .peel-sheet { position: absolute; inset: 0;
                      background: linear-gradient(180deg, rgba(247,245,240,0.62), rgba(247,245,240,0.22));
                      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 62%, transparent 100%);
                      mask-image: linear-gradient(180deg, #000 0%, #000 62%, transparent 100%);
                      transform-origin: 50% 100%; transform-style: preserve-3d;
                      filter: drop-shadow(0 0 0 rgba(19,21,22,0)); }

        .text-stack { display: flex; flex-direction: column; gap: 4px; text-align: left; }
        .h-line { font-family: var(--font-display); font-size: 108px; line-height: 1.12;
                  color: var(--paper); opacity: 0; }
      </style>

      <div id="root" data-composition-id="01-question" data-width="1080" data-height="1920" data-duration="1.800">
        <div class="clip stage">
          <div class="glass-panel">
            <div class="panel-texture"></div>
            <div class="peel-sheet" id="peel-sheet"></div>
          </div>
          <div class="text-stack">
            <div class="h-line" id="h-line-1">If it peels,</div>
            <div class="h-line" id="h-line-2">it works?</div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

        // Frame zero: the sheet is already mid-peel (clip-path bottom 42% already
        // clipped away, rotationX already tilted 10deg off the surface) -- the
        // hook's visual claim reads instantly on the scroll-stop frame, not as a
        // sheet that starts flat and only begins lifting after the cut.
        // Registered inside the timeline (tl.set, not a bare gsap.set) -- verified
        // necessary elsewhere in this project (03-reaction.html's void-box reveal
        // rendered fully drawn from frame zero when its own initial state was only
        // set via a bare gsap.set() outside the timeline). This element is hit by
        // two further .to() calls at different positions, the same risk shape.
        tl.set('#peel-sheet', { clipPath: 'inset(0 0 42% 0)', rotationX: -10, y: -4 }, 0);

        // Continuous peel sweep across the FULL scene -- this project's cadence
        // gap-filler for the 1.8s hold, not just a beat cluster in the first 0.3s.
        tl.to('#peel-sheet', { clipPath: 'inset(0 0 68% 0)', rotationX: -22, y: -14,
                                duration: 1.800, ease: "none" }, 0);
        tl.to('#peel-sheet', { filter: 'drop-shadow(0 10px 18px rgba(19,21,22,0.30))',
                                duration: 0.70, ease: "power1.inOut" }, 1.10);

        tl.to('#h-line-1', { opacity: 1, duration: 0.35 }, 0.30);
        tl.to('#h-line-2', { opacity: 1, duration: 0.35 }, 0.85);

        tl.to({}, { duration: 1.800 }, 0);
        window.__timelines["01-question"] = tl;
      </script>
    </template>
  </body>
</html>
