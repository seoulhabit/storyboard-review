    <template>
      <style>
        @font-face {
          font-family: "Noto Sans KR Video";
          font-weight: 500;
          font-style: normal;
          src: url("assets/fonts/NotoSansKR-500-subset.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 500;
          font-style: normal;
          src: url("assets/fonts/NotoSansKR-500-subset.woff2") format("woff2");
          font-display: block;
        }
        @font-face {
          font-family: "EB Garamond";
          font-weight: 400;
          font-style: normal;
          src: url("assets/fonts/eb-garamond-400.woff2") format("woff2");

        }
        @font-face {
          font-family: "Inter";
          font-weight: 800;

          src: url("assets/fonts/inter-800.woff2") format("woff2");

        #root {
          --paper: #F7F5F0;
          --ink: #131516;
          --ink-2: #6B6B6B;
          --ink-3: #9C978D;
          --aqua: #59B8AE;
          --highlighter: #E0A32B;
          --font-display: "EB Garamond", Georgia, "Times New Roman", serif;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --font-kr: "Noto Sans KR Video", "Noto Sans KR", sans-serif;
          --t-label: 24px;
          --t-caption: 24px;
          --safe-top: 120px;
          --safe-bottom: 360px;
          --safe-left: 60px;
          --safe-right: 162px;

          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: var(--paper);
          font-family: var(--font-mono);
        }
        .clip { position: absolute; inset: 0; }

        /* padding widened from 0 90px (edges 90..990, past safe-right's reserved 918)
           to clear both safe-left (60) and safe-right (162) with margin. */
        .cta-grid {
          top: 200px; left: 0; width: 100%; height: 600px;
          padding: 0 172px 0 80px;
          display: grid;
          grid-template-columns: 1fr 1fr;
          grid-auto-rows: min-content;
          align-content: center;
          gap: 28px;
          overflow: hidden;
        }
        /* display:flex + align-items:center added — CSS grid rows stretch every cell to
           match the row's tallest chip (a 2-line chip next to a 1-line one), and without
           vertical centering the shorter chip's text stayed top-aligned in the extra
           height, reading as cramped/misaligned relative to its row partner.
           IMPORTANT: a chip whose content mixes raw text with a child element (the
           "=" chips below) MUST wrap all of it in one inner <span> — a flex container
           splits mixed inline content into separate anonymous flex items at each element
           boundary and collapses the whitespace between them ("Root " + "=" + " Ginseng"
           ran together as "Root=Ginseng" the first time this was tried without the
           wrapper). The inner span keeps it one flex item with normal text flow inside. */
        .cta-chip {
          display: flex;
          align-items: center;
          font-family: var(--font-mono);
          font-size: 26px;
          line-height: 1.3;
          color: var(--ink);
          background: rgba(19,21,22,0.06);
          border-radius: 10px;
          padding: 24px 22px;
          opacity: 0;
        }
        .cta-chip-wide { grid-column: 1 / -1; }
        .cta-kicker {
          grid-column: 1 / -1;
          font-family: var(--font-mono);
          font-size: var(--t-label);
          letter-spacing: 0.1em;
          color: rgb(146, 142, 132);
          text-align: center;
          opacity: 0;
        }
        .cta-kicker-hanbang { margin-top: 4px; }
        .cta-chip-dark { background: var(--ink); color: var(--paper); font-weight: 500; border-radius: 12px; }
        .cta-chip-hb { background: rgba(89,184,174,0.08); border-left: 4px solid var(--aqua); border-radius: 4px 10px 10px 4px; padding-left: 18px; }
        /* Same already-approved ingredient-photography stills used in Frame 4b/7 —
           reused again here, not regenerated. Round-3 feedback specifically pointed at
           this recap section as still reading text-only despite the assets existing.
           Sized up 64->88px (round-6 feedback: still read as an afterthought at 64px
           next to the chip's own text) — the chip's own height is already text-driven
           (3-4 wrapped lines at 26px comfortably exceeds 88px), so this doesn't grow
           the grid's total footprint, just the image's presence within it. */
        .cta-chip-thumb {
          width: 88px; height: 88px;
          border-radius: 10px;
          object-fit: cover;
          flex-shrink: 0;
          margin-right: 18px;
          background: var(--paper);
        }
        .cta-chip-eq { font-weight: 700; }

        .cta-headline { top: 1020px; left: 0; width: 100%; text-align: center; }
        .cta-headline-text {
          display: inline-block;
          font-family: var(--font-body);
          font-weight: 800;
          font-size: 84px;
          color: var(--ink);
          opacity: 0;
        }
        /* Countdown digits share the headline's exact slot (absolute over it) rather
           than mutating its text via a timeline callback — every other content swap in
           this project (word reveals, card flips) uses separate opacity-toggled
           elements, not imperative DOM mutation from a GSAP .call(), so this stays
           consistent with the established, proven pattern rather than depending on
           .call()-during-seek behavior nothing else here relies on.
           Sized up from 96->140px (round-3 feedback: the countdown itself, sitting
           alone in an otherwise-static frame, read as visually thin/anticlimactic —
           the mechanic was working, it just wasn't hitting hard enough). Still clears
           the lockup below with margin at this size. */
        .cta-countdown-digit {
          position: absolute; top: 0; left: 0; width: 100%;
          font-family: var(--font-body);
          font-weight: 800;
          font-size: 140px;
          color: var(--ink);
          opacity: 0;
        }
        /* Ink tick-ring behind each digit — a bounded expand+fade stroke (no blur/glow)
           giving each countdown beat a real "impact" moment instead of just a number
           swap, without adding more visual clutter than a single reused ring. */
        .cta-countdown-ring {
          position: absolute; top: -30px; left: 50%; margin-left: -110px;
          width: 220px; height: 220px;
          border-radius: 50%;
          border: 4px solid var(--ink);
          opacity: 0;
        }

        .cta-lockup { top: 1240px; left: 0; width: 100%; text-align: center; opacity: 0; }
        .cta-kr { font-family: var(--font-kr); font-size: 64px; color: var(--ink); }
        .cta-brand { font-family: var(--font-display); font-size: 44px; color: var(--ink); margin-top: 8px; }

        .cta-disclaimer { top: 1440px; left: 0; width: 100%; text-align: center; padding: 0 120px; }
        .cta-disclaimer-text { font-family: var(--font-mono); font-size: var(--t-caption); color: var(--ink-3); opacity: 0; }
      </style>

      <div data-hf-id="hf-cta-root" id="root" data-composition-id="08-cta-endcard" data-width="1080" data-height="1920" data-duration="9.8">
        <div data-hf-id="hf-cta-grid" id="cta-grid" class="clip cta-grid" data-start="0" data-duration="9.8">
          <div data-hf-id="hf-cta-kt" class="cta-kicker" id="cta-kicker-truths">THE RECAP</div>
          <div data-hf-id="hf-cta-g1" class="cta-chip cta-chip-dark" id="cta-chip-1">Water-first = mostly water</div>
          <div data-hf-id="hf-cta-g2" class="cta-chip cta-chip-dark" id="cta-chip-2">Watch for the 1% line</div>
          <div data-hf-id="hf-cta-kh" class="cta-kicker cta-kicker-hanbang" id="cta-kicker-hanbang">HANBANG, TRANSLATED</div>
          <div data-hf-id="hf-cta-g3" class="cta-chip cta-chip-hb" id="cta-chip-3"><img data-hf-id="hf-cta-g3thumb" class="cta-chip-thumb" src="assets/images/ingredient-snail-mucin.png" alt="" width="1400" height="1400" loading="eager" decoding="sync"><span data-hf-id="hf-668c">Snail Secretion Filtrate <span data-hf-id="hf-onba" class="cta-chip-eq">=</span> Snail Mucin</span></div>
          <div data-hf-id="hf-cta-g4" class="cta-chip cta-chip-hb" id="cta-chip-4"><img data-hf-id="hf-cta-g4thumb" class="cta-chip-thumb" src="assets/images/ingredient-ginseng.png" alt="" width="1400" height="1400" loading="eager" decoding="sync"><span data-hf-id="hf-vz54">Panax Root <span data-hf-id="hf-3y16" class="cta-chip-eq">=</span> Ginseng</span></div>
          <div data-hf-id="hf-cta-g5" class="cta-chip cta-chip-hb cta-chip-wide" id="cta-chip-5"><img data-hf-id="hf-cta-g5thumb" class="cta-chip-thumb" src="assets/images/ingredient-mugwort.png" alt="" width="1400" height="1400" loading="eager" decoding="sync"><span data-hf-id="hf-87k9">Artemisia Princeps <span data-hf-id="hf-4cc7" class="cta-chip-eq">=</span> Mugwort</span></div>
        </div>

        <div data-hf-id="hf-cta-headline" id="cta-headline" class="clip cta-headline" data-start="0" data-duration="9.8">
          <div data-hf-id="hf-cta-headtext" class="cta-headline-text" id="cta-headline-text">SCREENSHOT THIS</div>
          <div data-hf-id="hf-cta-countring" class="cta-countdown-ring" id="cta-countdown-ring"></div>
          <div data-hf-id="hf-cta-count3" class="cta-countdown-digit" id="cta-count-3">3</div>
          <div data-hf-id="hf-cta-count2" class="cta-countdown-digit" id="cta-count-2">2</div>
          <div data-hf-id="hf-cta-count1" class="cta-countdown-digit" id="cta-count-1">1</div>
        </div>

        <div data-hf-id="hf-cta-lockup" id="cta-lockup" class="clip cta-lockup" data-start="0" data-duration="9.8">
          <div data-hf-id="hf-cta-kr" class="cta-kr">습</div>
          <div data-hf-id="hf-cta-brand" class="cta-brand">SeoulHabit</div>
        </div>

        <div data-hf-id="hf-cta-disc" id="cta-disclaimer" class="clip cta-disclaimer" data-start="0" data-duration="9.8">
          <div data-hf-id="hf-cta-disctext" class="cta-disclaimer-text" id="cta-disclaimer-text">General label-reading guide — not sourced claims, not medical advice.</div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Explicit baseline for the countdown ring — three separate fromTo() calls
        // targeting the same element/property later in the timeline (one per digit)
        // left the ring visibly bleeding through at ~0.7 opacity for the first ~7s of
        // the scene (a real defect a viewer caught mid-frame). A bare gsap.set() call
        // outside the timeline did NOT fix it — the render engine seeks this timeline
        // directly to arbitrary times without necessarily passing through t=0 first,
        // and a set() call made outside the timeline isn't part of what the timeline
        // itself evaluates when computing a property's value at a given seek position.
        // tl.set(...) registers the baseline AS a timeline tween at position 0, so it's
        // actually in the sequence GSAP evaluates on every seek, not just a one-time
        // side effect at script load.
        tl.set("#cta-countdown-ring", { opacity: 0, scale: 0.4 }, 0);

        tl.fromTo("#cta-kicker-truths", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power3.out" }, 0.05);
        tl.fromTo("#cta-kicker-hanbang", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power3.out" }, 0.32);

        const CHIPS = ["#cta-chip-1", "#cta-chip-2", "#cta-chip-3", "#cta-chip-4", "#cta-chip-5"];
        CHIPS.forEach((id, i) => {
          tl.fromTo(id, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.15 + i * 0.1);
        });

        tl.fromTo("#cta-headline-text", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 0.9);
        // finite pulse (2 reps), resolves well before the frame ends — no infinite loop
        tl.to("#cta-headline-text", { scale: 1.05, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.4);

        tl.fromTo("#cta-lockup", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.2);
        tl.fromTo("#cta-disclaimer-text", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power3.out" }, 4.7);

        // VO ends locally at ~6.88 ("...in the comments."); everything after that was a
        // flat 4.75s freeze to the scene's end (5.05->9.8). A highlight sweep across the
        // recap chips plus a second headline pulse gives that tail real beats instead of a
        // static hold, and the final settled frame — bold centered headline on paper,
        // bottles/hero-stat-shaped negative space above it — is composed to hand back
        // toward Frame 1's own frame zero for a clean loop on replay.
        CHIPS.forEach((id, i) => {
          tl.to(id, { scale: 1.04, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1 }, 5.6 + i * 0.35);
        });

        // "Screenshot in 3... 2... 1..." countdown — round-2 feedback: a visible/audible
        // countdown forces a pause or rewind, both strong retention signals. Digits
        // share the headline's slot as separate opacity-toggled elements (see CSS
        // comment) rather than mutating its text. SFX ticks are separate <audio>
        // elements scheduled in index.html (shutter-click.mp3 x3 — "screenshot" pun
        // intended). "SCREENSHOT THIS" fades out once the countdown starts and does
        // not return — the video ends on "1", which is the point, not a rough edge.
        tl.to("#cta-headline-text", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 7.3);
        const COUNTDOWN = [
          { id: "#cta-count-3", start: 7.5 },
          { id: "#cta-count-2", start: 8.1 },
          { id: "#cta-count-1", start: 8.7 },
        ];
        COUNTDOWN.forEach((step, i) => {
          tl.fromTo(step.id, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, step.start);
          if (i < COUNTDOWN.length - 1) {
            tl.to(step.id, { opacity: 0, duration: 0.15, ease: "power2.in" }, step.start + 0.45);
          }
          // ink tick-ring: one reused element, re-triggered fresh on each digit so the
          // beat reads as a real countdown tick, not just a number appearing.
          tl.fromTo("#cta-countdown-ring", { opacity: 0.7, scale: 0.4 }, { opacity: 0, scale: 1, duration: 0.4, ease: "power2.out" }, step.start);
        });
        // "1" gets an extra landing punch and holds to the scene's own end.
        tl.to("#cta-count-1", { scale: 1.08, duration: 0.3, ease: "power2.out" }, 8.85);

        tl.to({}, { duration: 9.8 }, 0);
        window.__timelines["08-cta-endcard"] = tl;
      </script>
    </template>
  </body>
</html>
