<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Skincare Ingredient Glossary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d1f1c;
      }
      body {
        font-family: "Inter", sans-serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d1f1c;
      }

      /* ---------- persistent background ---------- */
      .bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(160deg, #122b26 0%, #0f2420 45%, #0a1816 100%);
      }
      .bg-glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.35;
      }

      /* ---------- progress rail ---------- */
      .progress-wrap {
        position: absolute;
        top: 64px;
        left: 72px;
        right: 72px;
        height: 6px;
        z-index: 50;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-fill {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #7ed0a6, #e8b84b);
        transform-origin: 0% 50%;
        will-change: transform;
      }

      /* ---------- shared full-frame scene box ---------- */
      .clip {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 90px;
      }

      /* ---------- title & outro scenes ---------- */
      .kicker {
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #7ed0a6;
        will-change: transform, opacity;
      }
      .display-h1 {
        margin-top: 22px;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        font-size: 96px;
        line-height: 1.04;
        color: #f6f4ee;
        will-change: transform, opacity;
      }
      .display-sub {
        margin-top: 34px;
        max-width: 760px;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 34px;
        line-height: 1.5;
        color: rgba(246, 244, 238, 0.78);
        will-change: transform, opacity;
      }
      .disclaimer {
        position: absolute;
        bottom: 70px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 20px;
        letter-spacing: 0.04em;
        color: rgba(246, 244, 238, 0.4);
        will-change: opacity;
      }

      /* ---------- ingredient card ---------- */
      .card-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 880px;
      }
      .card-index {
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 0.28em;
        color: rgba(246, 244, 238, 0.5);
        margin-bottom: 28px;
      }
      .icon-badge {
        width: 208px;
        height: 208px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at 34% 28%,
          color-mix(in srgb, var(--accent) 55%, white) 0%,
          var(--accent) 55%,
          color-mix(in srgb, var(--accent) 78%, black) 100%
        );
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
        will-change: transform, opacity;
      }
      .icon-badge svg {
        width: 116px;
        height: 116px;
      }
      .ing-name {
        margin-top: 36px;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        font-size: 68px;
        line-height: 1.08;
        color: #f6f4ee;
        will-change: transform, opacity;
      }
      .ing-sub {
        margin-top: 10px;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent, #7ed0a6);
        will-change: transform, opacity;
      }
      .info-block {
        margin-top: 40px;
        max-width: 820px;
        will-change: transform, opacity;
      }
      .info-label {
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent, #7ed0a6);
        margin-bottom: 10px;
      }
      .info-text {
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 33px;
        line-height: 1.45;
        color: rgba(246, 244, 238, 0.92);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="76"
      data-width="1080"
      data-height="1920"
    >
      <div class="bg">
        <div class="bg-glow" style="width: 620px; height: 620px; top: -160px; left: -180px; background: #7ed0a6;" data-layout-allow-overflow="true"></div>
        <div class="bg-glow" style="width: 560px; height: 560px; bottom: -180px; right: -160px; background: #e8b84b;" data-layout-allow-overflow="true"></div>
        <div class="bg-glow" style="width: 420px; height: 420px; top: 780px; right: -140px; background: #5fb8d6; opacity: 0.2;" data-layout-allow-overflow="true"></div>
      </div>

      <div class="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>

      <section id="scene-title" class="clip" data-start="0" data-duration="2.5" data-track-index="1">
        <div class="kicker" id="title-kicker">The Glossary</div>
        <h1 class="display-h1" id="title-h1">20 Skincare<br />Ingredients</h1>
        <p class="display-sub" id="title-sub">What they are — and what they're actually good for.</p>
      </section>

      <section id="scene-outro" class="clip" data-start="72.5" data-duration="3.5" data-track-index="1">
        <div class="kicker" id="outro-kicker">Now You Know</div>
        <h1 class="display-h1" id="outro-h1" style="font-size: 76px;">Know What<br />You're Applying</h1>
        <p class="display-sub" id="outro-sub">20 actives, decoded — from acids to antioxidants.</p>
        <div class="disclaimer" id="outro-disclaimer">Educational overview only — not medical advice.</div>
      </section>
    </div>

    <script>
      // ---------------------------------------------------------------
      // Content data — transcribed from the reference ingredient chart.
      // ---------------------------------------------------------------
      var ICON = function (inner, opts) {
        opts = opts || {};
        var fillMode = opts.textIcon
          ? 'fill="#fff" stroke="none"'
          : 'fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"';
        return '<svg viewBox="0 0 100 100" ' + fillMode + '>' + inner + "</svg>";
      };

      var INGREDIENTS = [
        {
          name: "AHA / BHA",
          sub: "Exfoliating Acids",
          what: "Exfoliating acids — AHAs smooth the surface, BHAs unclog pores.",
          best: "Acne, blackheads, rough texture, and dullness.",
          accent: "#E8935A",
          icon: ICON('<path d="M42 14 H58 V38 L77 76 Q80 84 71 84 H29 Q20 84 23 76 L42 38 Z"/><line x1="37" y1="56" x2="63" y2="56"/>'),
        },
        {
          name: "Centella Asiatica",
          sub: "Cica",
          what: "A medicinal herb with healing and anti-inflammatory properties.",
          best: "Wound healing, barrier repair, and stressed skin.",
          accent: "#6FA97B",
          icon: ICON('<path d="M50 86 C19 75 14 39 50 14 C86 39 81 75 50 86 Z"/><path d="M50 86 V28"/>'),
        },
        {
          name: "Bamboo Extract",
          sub: "",
          what: "A mineral-rich extract from bamboo stalks.",
          best: "Hydrating, calming, and refreshing the skin.",
          accent: "#8BC79A",
          icon: ICON('<rect x="30" y="14" width="15" height="72" rx="7"/><line x1="30" y1="38" x2="45" y2="38"/><line x1="30" y1="62" x2="45" y2="62"/><rect x="55" y="14" width="15" height="72" rx="7"/><line x1="55" y1="30" x2="70" y2="30"/><line x1="55" y1="55" x2="70" y2="55"/>'),
        },
        {
          name: "Green Tea",
          sub: "",
          what: "A calming antioxidant with antibacterial and oil-controlling properties.",
          best: "Soothing acne-prone skin and preventing oxidative stress.",
          accent: "#7A9D54",
          icon: ICON('<path d="M22 44 H70 V60 Q70 80 46 80 Q22 80 22 60 Z"/><path d="M70 47 Q86 47 86 58 Q86 69 70 67"/><path d="M38 34 Q33 24 40 16"/><path d="M54 34 Q49 24 56 16"/>'),
        },
        {
          name: "Birch Sap",
          sub: "Betula Extract",
          what: "Tree sap used in place of water in skincare formulations.",
          best: "Lightweight hydration, soothing sensitivity, and supporting the barrier.",
          accent: "#C9A876",
          icon: ICON('<path d="M50 14 C66 40 76 55 76 68 A26 26 0 0 1 24 68 C24 55 34 40 50 14 Z"/><line x1="37" y1="58" x2="48" y2="58"/><line x1="55" y1="67" x2="66" y2="67"/>'),
        },
        {
          name: "Ginseng",
          sub: "",
          what: "A root extract revered in Korean tradition for its rejuvenating effects.",
          best: "Boosting circulation, reducing signs of fatigue, and improving skin tone.",
          accent: "#D6A24A",
          icon: ICON('<path d="M50 14 V44"/><path d="M50 44 L29 82"/><path d="M50 44 L50 84"/><path d="M50 44 L71 82"/><path d="M37 28 L50 39"/><path d="M63 28 L50 39"/>'),
        },
        {
          name: "Bifida Ferment Lysate",
          sub: "Probiotic Ferment",
          what: "A fermented probiotic ingredient.",
          best: "Strengthening the skin barrier, elasticity, and reducing sensitivity.",
          accent: "#E08A8A",
          icon: ICON('<circle cx="30" cy="30" r="10"/><circle cx="70" cy="30" r="10"/><circle cx="50" cy="72" r="10"/><line x1="30" y1="30" x2="70" y2="30"/><line x1="30" y1="30" x2="50" y2="72"/><line x1="70" y1="30" x2="50" y2="72"/>'),
        },
        {
          name: "Hyaluronic Acid",
          sub: "",
          what: "A moisture-binding molecule that holds 1000x its weight in water.",
          best: "Intense hydration, plumping, and maintaining skin elasticity.",
          accent: "#5FB8D6",
          icon: ICON('<path d="M50 12 C67 39 80 55 80 69 A30 30 0 0 1 20 69 C20 55 33 39 50 12 Z"/>'),
        },
        {
          name: "Ceramides",
          sub: "",
          what: "Lipid molecules that form the skin's protective barrier.",
          best: "Strengthening the barrier, retaining moisture, and reducing sensitivity.",
          accent: "#A9A5D9",
          icon: ICON('<rect x="15" y="27" width="31" height="17" rx="3"/><rect x="54" y="27" width="31" height="17" rx="3"/><rect x="35" y="52" width="31" height="17" rx="3"/>'),
        },
        {
          name: "Niacinamide",
          sub: "Vitamin B3",
          what: "A multi-tasking vitamin that strengthens the skin barrier.",
          best: "Pore refinement, oil control, and evening out tone.",
          accent: "#E8B84B",
          icon:
            '<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="5.5" stroke-linejoin="round"><polygon points="50,13 79,31 79,69 50,87 21,69 21,31"/><text x="50" y="61" font-family="Inter, sans-serif" font-size="30" font-weight="800" text-anchor="middle" fill="#fff" stroke="none">B3</text></svg>',
        },
        {
          name: "Peptides",
          sub: "",
          what: "Chains of amino acids that support collagen and elastin production.",
          best: "Smoothing wrinkles, firming skin, and improving resilience.",
          accent: "#9B7FD4",
          icon: ICON('<ellipse cx="35" cy="38" rx="17" ry="11" transform="rotate(-28 35 38)"/><ellipse cx="65" cy="62" rx="17" ry="11" transform="rotate(-28 65 62)"/>'),
        },
        {
          name: "Snail Mucin",
          sub: "",
          what: "A hydrating and reparative secretion from snails, rich in enzymes and glycoproteins.",
          best: "Healing acne scars, improving texture, and enhancing skin elasticity.",
          accent: "#7ED0A6",
          icon: ICON('<path d="M33 72 A20 20 0 1 1 56 51"/><circle cx="56" cy="46" r="17"/><path d="M18 79 Q45 87 72 79"/><line x1="64" y1="31" x2="71" y2="19"/><line x1="72" y1="31" x2="78" y2="21"/>'),
        },
        {
          name: "Panthenol",
          sub: "Vitamin B5",
          what: "A moisturizing and healing vitamin.",
          best: "Soothing, softening, and repairing dry or irritated skin.",
          accent: "#4FB8A6",
          icon:
            '<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="5.5" stroke-linejoin="round"><polygon points="50,13 79,31 79,69 50,87 21,69 21,31"/><text x="50" y="61" font-family="Inter, sans-serif" font-size="30" font-weight="800" text-anchor="middle" fill="#fff" stroke="none">B5</text></svg>',
        },
        {
          name: "Soybean Extract",
          sub: "",
          what: "A fermented antioxidant-rich extract.",
          best: "Restoring balance, brightening skin tone, and anti-aging.",
          accent: "#D9C48A",
          icon: ICON('<path d="M31 26 Q16 46 26 66 Q36 85 55 82 Q75 78 78 58 Q80 36 62 21 Q45 9 31 26 Z"/><circle cx="40" cy="46" r="8"/><circle cx="58" cy="60" r="8"/>'),
        },
        {
          name: "Propolis",
          sub: "",
          what: "A resinous, antioxidant-rich compound from bees.",
          best: "Calming acne, soothing inflammation, and promoting glow.",
          accent: "#E0A23D",
          icon: ICON('<polygon points="35,19 51,28 51,45 35,54 19,45 19,28"/><polygon points="66,19 82,28 82,45 66,54 50,45 50,28"/><polygon points="50,50 66,59 66,76 50,85 34,76 34,59"/>'),
        },
        {
          name: "Retinol",
          sub: "Vitamin A",
          what: "A gold-standard anti-aging compound that promotes cell turnover.",
          best: "Wrinkles, fine lines, acne, and rough texture.",
          accent: "#D9704A",
          icon:
            '<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="5.5"><circle cx="50" cy="50" r="35"/><text x="50" y="64" font-family="Inter, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="#fff" stroke="none">A</text></svg>',
        },
        {
          name: "Royal Jelly",
          sub: "",
          what: "A nutrient-rich secretion produced by bees.",
          best: "Revitalizing dry, aging skin and improving skin nourishment.",
          accent: "#F0C24B",
          icon:
            '<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="5.5" stroke-linejoin="round"><polygon points="50,14 77,29 77,63 50,78 23,63 23,29"/><path d="M50 39 C55 47 58 52 58 57 A8 8 0 0 1 42 57 C42 52 45 47 50 39 Z" fill="#fff" stroke="none"/></svg>',
        },
        {
          name: "Mugwort",
          sub: "Artemisia",
          what: "A soothing herb long used in Korean medicine.",
          best: "Calming sensitive skin, reducing redness, and detoxifying.",
          accent: "#7A8F6B",
          icon: ICON('<line x1="50" y1="86" x2="50" y2="18"/><path d="M50 34 Q30 29 25 13"/><path d="M50 34 Q70 29 75 13"/><path d="M50 55 Q31 50 27 37"/><path d="M50 55 Q69 50 73 37"/>'),
        },
        {
          name: "Rice Extract",
          sub: "",
          what: "A gentle brightening and moisturizing ingredient used for centuries in Korea.",
          best: "Dullness, dryness, and restoring luminosity.",
          accent: "#D4B896",
          icon: ICON('<ellipse cx="35" cy="46" rx="9" ry="17" transform="rotate(-20 35 46)"/><ellipse cx="56" cy="40" rx="9" ry="17" transform="rotate(-4 56 40)"/><ellipse cx="66" cy="59" rx="9" ry="17" transform="rotate(16 66 59)"/><ellipse cx="42" cy="66" rx="9" ry="17" transform="rotate(26 42 66)"/>'),
        },
        {
          name: "Vitamin C",
          sub: "",
          what: "A brightening antioxidant that protects against environmental stressors.",
          best: "Dullness, hyperpigmentation, and uneven tone.",
          accent: "#F0954A",
          icon: ICON('<circle cx="50" cy="50" r="35"/><line x1="50" y1="50" x2="50" y2="16"/><line x1="50" y1="50" x2="79" y2="34"/><line x1="50" y1="50" x2="79" y2="66"/><line x1="50" y1="50" x2="50" y2="84"/><line x1="50" y1="50" x2="21" y2="66"/><line x1="50" y1="50" x2="21" y2="34"/>'),
        },
      ];

      // ---------------------------------------------------------------
      // Build one card section per ingredient as a direct child of #root
      // so it gets the framework's automatic full-frame clip layout.
      // ---------------------------------------------------------------
      var root = document.getElementById("root");
      var outro = document.getElementById("scene-outro");
      var CARD_START = 2.5;
      var CARD_DUR = 3.5;
      var cardStarts = [];

      INGREDIENTS.forEach(function (ing, i) {
        var start = CARD_START + i * CARD_DUR;
        cardStarts.push(start);

        var section = document.createElement("section");
        section.className = "clip";
        section.id = "card-" + i;
        section.setAttribute("data-start", start.toFixed(2));
        section.setAttribute("data-duration", CARD_DUR.toFixed(2));
        section.setAttribute("data-track-index", "1");

        var subLine = ing.sub ? '<div class="ing-sub" id="sub-' + i + '">' + ing.sub + "</div>" : "";

        section.innerHTML =
          '<div class="card-inner" id="inner-' + i + '" style="--accent:' + ing.accent + '">' +
          '<div class="card-index">' + String(i + 1).padStart(2, "0") + " / " + INGREDIENTS.length + "</div>" +
          '<div class="icon-badge" id="icon-' + i + '">' + ing.icon + "</div>" +
          '<h2 class="ing-name" id="name-' + i + '">' + ing.name + "</h2>" +
          subLine +
          '<div class="info-block" id="what-' + i + '">' +
          '<div class="info-label">What It Is</div>' +
          '<div class="info-text">' + ing.what + "</div>" +
          "</div>" +
          '<div class="info-block" id="best-' + i + '">' +
          '<div class="info-label">Best For</div>' +
          '<div class="info-text">' + ing.best + "</div>" +
          "</div>" +
          "</div>";

        root.insertBefore(section, outro);
      });

      // ---------------------------------------------------------------
      // Timeline — one paused GSAP timeline for the whole composition.
      // ---------------------------------------------------------------
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Continuous progress rail across the full 76s runtime.
      tl.fromTo(
        "#progress-fill",
        { scaleX: 0 },
        { scaleX: 1, duration: 76, ease: "none" },
        0
      );

      // ---- Title scene (0 - 2.5s) ----
      tl.fromTo("#title-kicker", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.12);
      tl.fromTo("#title-h1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.28);
      tl.fromTo("#title-sub", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.58);
      tl.fromTo("#scene-title .kicker, #scene-title .display-h1, #scene-title .display-sub", { opacity: 1 }, { opacity: 0, duration: 0.32, ease: "power2.in" }, 2.10);

      // ---- Ingredient cards ----
      INGREDIENTS.forEach(function (ing, i) {
        var start = cardStarts[i];
        tl.fromTo("#icon-" + i, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, start + 0.05);
        tl.fromTo("#name-" + i, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, start + 0.24);
        if (ing.sub) {
          tl.fromTo("#sub-" + i, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, start + 0.42);
        }
        tl.fromTo("#what-" + i, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, start + 0.46);
        tl.fromTo("#best-" + i, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, start + 0.68);
        // Exit: fade the whole card out before its clip window closes.
        tl.fromTo("#inner-" + i, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, start + CARD_DUR - 0.45);
      });

      // ---- Outro scene (72.5 - 76s) ----
      tl.fromTo("#outro-kicker", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 72.62);
      tl.fromTo("#outro-h1", { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 72.8);
      tl.fromTo("#outro-sub", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 73.1);
      tl.fromTo("#outro-disclaimer", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 73.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
