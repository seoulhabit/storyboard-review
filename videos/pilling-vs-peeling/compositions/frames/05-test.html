<!DOCTYPE html>

    <meta charset="UTF-8">
  </head>

    <template>
      <style>
        *, *::before, *::after { box-sizing: border-box; }
        /* Root cause of the whole session's layout-overflow chase, finally
           isolated by direct measurement: box-sizing defaults to content-box,
           so any element combining an explicit height/width with padding
           (every zone in this project) renders LARGER than declared -- e.g.
           .stage's height:1920px + 192px/384px top/bottom padding rendered
           as an actual 2496px box (1920+576), pushing bottom-anchored
           content straight past the canvas and into the reserved safe zone.
           This one reset fixes it project-wide. */
        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }

        #root {
          --paper: #F7F5F0; --ink: #131516; --aqua: #59B8AE; --coral: #C97A5C;
          --ink-2: #6B6B6B; --ink-2-dark: #878B8C; --ink-3-dark: #7C8082; --mist: #F0EBE1;
          --elev-2: 0 18px 32px -20px rgba(19, 21, 22, 0.35);
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
          --safe-margin: 6px;
          --font-display: "EB Garamond", Georgia, "Times New Roman", serif;
          --font-body: "Inter", "Noto Sans KR Video", "Noto Sans KR", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --font-kr: "Noto Sans KR Video", "Noto Sans KR", sans-serif;
          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--paper); font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }

        /* Spatial plan (this project's signature moment -- the callback the
           original 02-split/06-clue pair used to set up, now paid off with a
           moving wipe instead of a static bisector):
           1. #root is a flex column: panel zone (flex:1, one fixed-size panel)
              / sub-line row / flag row.
           2. Inside the panel: a base plate (bare skin, always visible) and a
              wipe-mask (fixed-px width, overflow hidden) holding the SAME
              plate plus a drawn residue overlay -- F1 identity-by-construction,
              no second generation needed for consistency. Text labels sit
              ABOVE both image layers as their own absolute children of the
              panel (mandatory-rule-2 exception -- not a stand-in for the
              layout, just the one class of element that legitimately needs
              its own position), so they stay legible regardless of wipe state. */
        /* Explicit height in px, not 100% -- percentage height on an
           absolutely positioned element resolves against its containing
           block (#root) at the moment of layout, and #root's own height
           was observed racing (measuring ~2500px before settling to the
           correct 1920px a moment later) during a font/image load. A
           hardcoded px height has nothing to resolve against, closing
           that race everywhere it could otherwise recur. */
        .stage { display: flex; flex-direction: column; height: 1920px;
                 padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
                 justify-content: center; gap: 32px; }

        .panel-zone { display: flex; justify-content: center; }
        .panel { position: relative; width: 840px; height: 900px; border-radius: 24px;
                overflow: hidden; background: #1A1A1A; }
        .base-layer, .layered-content { position: absolute; top: 0; left: 0;
                                        width: 840px; height: 900px; }
        .base-layer img, .layered-content img { width: 100%; height: 100%;
                                                 object-fit: cover; display: block; }
        .layered-content { position: relative; }
        /* Round 6: this was 0.08 -- a difference of ~14 luma on a light plate,
           which is why an 840px wipe across a 900px panel registered ZERO beats:
           the "after layering" side was, to both a viewer and a frame diff, the
           same picture as the bare side. The comparison has to be visible before
           its pacing means anything.

           The layered side also uses its OWN plate (04-layered-skin.png, the
           base plate desaturated/dulled to read as product film). Both sides
           previously pointed at 04-base-skin.png, which lint had long flagged
           as duplicate_media_discovery_risk; that warning was real and worth
           clearing, but it was NOT what made this scene invisible -- swapping
           in a distinct plate changed nothing on its own. The actual cause is
           recorded on .wipe-mask below. */
        .layered-scrim { position: absolute; inset: 0; background: rgba(19,21,22,0.13); }
        .crumb-overlay { position: absolute; inset: 0; }
        .crumb { fill: rgba(19,21,22,0.62); }

        /* The reveal is driven by clip-path over a full-width layer, NOT by
           animating width on an overflow:hidden box. That earlier mechanism was
           correct CSS -- a plain browser and `hyperframes snapshot` both drew it
           -- but under hardware GPU capture (ANGLE/Metal) the compositor never
           updated the clip, so the entire layered subtree was absent from every
           captured frame while the DOM reported the right geometry the whole
           time. Rendering with --no-browser-gpu produced the correct picture
           from identical source, which is what isolated it. clip-path on a
           custom property is compositor-safe and matches the --hl / --act /
           --bf pattern this project already drives everywhere else. */
        .wipe-mask { --wipe: 0; position: absolute; top: 0; left: 0;
                    height: 900px; width: 840px;
                    clip-path: inset(0 calc((840 - var(--wipe)) * 1px) 0 0); }
        .wipe-edge { position: absolute; top: 0; left: calc(var(--wipe) * 1px - 10px);
                    width: 10px; height: 100%; background: var(--aqua); }

        .label { position: absolute; top: 36px; font-weight: 800; font-size: 42px;
                 color: var(--ink); text-shadow: 0 2px 12px rgba(247,245,240,0.85),
                 0 0 24px rgba(247,245,240,0.85); z-index: 5; }
        #s5-label-bare { right: 36px; text-align: right; opacity: 1; }
        #s5-label-layered { left: 36px; opacity: 0; }

        .sub-row { display: flex; justify-content: space-between; max-width: 840px;
                  margin: 0 auto; width: 100%; }
        .sub { font-family: var(--font-mono); font-weight: 500; font-size: 32px;
              color: var(--ink-2); opacity: 0; }

        .flag-zone { display: flex; justify-content: center; }
        .uf-badge { display: inline-flex; align-items: center; gap: 8px; font-weight: 600;
                    font-size: 32px; color: rgba(19,21,22,0.85); border: 1px solid rgba(19,21,22,0.28);
                    border-radius: 999px; padding: 12px 26px; background: rgba(19,21,22,0.05); opacity: 0; }
      </style>

      <div data-hf-id="hf-debm" id="root" data-composition-id="05-test" data-width="1080" data-height="1920" data-duration="3.000">
        <div data-hf-id="hf-q6os" class="clip stage">
          <div data-hf-id="hf-de69" class="panel-zone">
            <div data-hf-id="hf-owjm" class="panel">
              <div data-hf-id="hf-coxr" class="base-layer">
                <img data-hf-id="hf-psbq" src="assets/plates/04-base-skin.png" alt="" width="1200" height="1200" loading="eager" decoding="sync">
              </div>
              <div data-hf-id="hf-m4l8" class="wipe-mask" id="s5-wipe">
                <div data-hf-id="hf-b0vo" class="layered-content">
                  <img data-hf-id="hf-ifmx" src="assets/plates/04-layered-skin.png" alt="" width="1200" height="1200" loading="eager" decoding="sync">
                  <div data-hf-id="hf-h8a5" class="layered-scrim"></div>
                  <svg data-hf-id="hf-is4o" class="crumb-overlay" viewBox="0 0 840 900" preserveAspectRatio="xMidYMid slice">
                    <!-- Clumped, not evenly spaced: residue collects in
                         patches. Everything at cx<336 survives the wipe's
                         retreat, so the held final frame keeps the payload. -->
                    <circle data-hf-id="hf-hrf2" class="crumb" cx="110" cy="395" r="30" />
                    <circle data-hf-id="hf-gq2j" class="crumb" cx="152" cy="366" r="22" />
                    <circle data-hf-id="hf-ihfz" class="crumb" cx="93" cy="434" r="19" />

                    <circle data-hf-id="hf-p4gp" class="crumb" cx="176" cy="530" r="34" />
                    <circle data-hf-id="hf-m0es" class="crumb" cx="219" cy="556" r="24" />
                    <circle data-hf-id="hf-p3ey" class="crumb" cx="149" cy="572" r="20" />

                    <circle data-hf-id="hf-0rpf" class="crumb" cx="300" cy="430" r="27" />
                    <circle data-hf-id="hf-jy38" class="crumb" cx="333" cy="408" r="18" />

                    <circle data-hf-id="hf-xti6" class="crumb" cx="520" cy="470" r="31" />
                    <circle data-hf-id="hf-s8fv" class="crumb" cx="557" cy="445" r="21" />
                    <circle data-hf-id="hf-sns2" class="crumb" cx="641" cy="540" r="26" />

                    <circle data-hf-id="hf-60dc" class="crumb late" id="s5-late-1" cx="250" cy="332" r="0" />
                    <circle data-hf-id="hf-v9ws" class="crumb late" id="s5-late-2" cx="85" cy="500" r="0" />
                    <circle data-hf-id="hf-8sz2" class="crumb late" id="s5-late-3" cx="286" cy="638" r="0" />
                  </svg>
                </div>
                <div data-hf-id="hf-augh" class="wipe-edge"></div>
              </div>
              <p data-hf-id="hf-hbsq" class="label" id="s5-label-bare">BARE SKIN</p>
              <p data-hf-id="hf-99g8" class="label" id="s5-label-layered">AFTER<br data-hf-id="hf-x5px">LAYERING</p>
            </div>
          </div>

          <div data-hf-id="hf-z2g1" class="sub-row">
            <p data-hf-id="hf-n4ay" class="sub" id="s5-sub-bare">Flakes? → Peeling.</p>
            <p data-hf-id="hf-i6af" class="sub" id="s5-sub-layered">Crumbs? → Pilling.</p>
          </div>

          <div data-hf-id="hf-erdh" class="flag-zone">
            <div data-hf-id="hf-8z8y" class="uf-badge" id="s5-flag">○ A clue — not a diagnosis.</div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        // t0.35-1.05: the wipe travels left-to-right across the full panel,
        // revealing the layered state.
        tl.set('#s5-wipe', { '--wipe': 0 }, 0);
        tl.to('#s5-wipe', { '--wipe': 840, duration: 0.70, ease: "power2.inOut" }, 0.35);
        tl.to('#s5-label-layered', { opacity: 1, duration: 0.3 }, 1.05);

        // Round 6 cadence: scene 05 measured 0/23 beats and a 2.88s quiet run --
        // the worst in the video. Root cause was content, not timing (see the
        // scrim note above). With the two sides now genuinely different, the
        // wipe out and back are real beats on their own; these two add the
        // middle and tail beats so no run exceeds the 1.6s ceiling.
        var lateCrumbs = [['#s5-late-1',24],['#s5-late-2',27],['#s5-late-3',25]];
        lateCrumbs.forEach(function (e) { tl.set(e[0], { attr: { r: 0 } }, 0); });
        // ~1.20 — more residue collects while the full comparison is held open.
        lateCrumbs.forEach(function (e, i) {
          tl.to(e[0], { attr: { r: e[1] }, duration: 0.26, ease: 'back.out(1.7)' },
                1.20 + i * 0.09);
        });
        // ~2.50 — the surviving crumbs roll, after the wipe has settled back.
        tl.set('.crumb', { x: 0, y: 0 }, 0);
        tl.to('.crumb', { x: 16, y: 11, duration: 0.42, ease: 'power1.inOut',
                          stagger: 0.03 }, 2.50);

        tl.to('#s5-sub-bare', { opacity: 1, duration: 0.3 }, 1.30);
        tl.to('#s5-sub-layered', { opacity: 1, duration: 0.3 }, 1.50);

        // t1.75-2.35: the wipe travels back to ~40%, leaving a genuine
        // side-by-side -- the comparison actually lands here.
        tl.to('#s5-wipe', { '--wipe': 336, duration: 0.60, ease: "power2.inOut" }, 1.75);

        tl.to('#s5-flag', { opacity: 1, duration: 0.4 }, 2.10);

        tl.to({}, { duration: 3.000 }, 0); // full-span anchor
        window.__timelines["05-test"] = tl;
      </script>
    </template>
