      <style>
        @font-face { font-family: "EB Garamond"; font-weight: 400; font-style: normal;
          src: url("assets/fonts/eb-garamond-400.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }

        #root {
          --paper: #F7F5F0; --ink: #131516; --ink-2: #6B6B6B; --aqua: #59B8AE; --mist: #F0EBE1;
          --font-display: "EB Garamond", Georgia, serif;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --safe-top: 120px; --safe-bottom: 384px; --safe-left: 60px; --safe-right: 162px;
          --safe-margin: 4px;
          /* This scene's own Ken-Burns wrapper (see .frame-zoom below) maps the padded
             box's edge outward by the same factor it scales the box -- derives the
             padded edge that lands ON --safe-bottom AFTER that scale, as a function of
             this scene's actual scale/origin. Replaces the old hand-tuned "+35px"
             allowance, which was sized against the pre-2026-08-31 --safe-bottom (360px)
             and still overshot the real (20%) line by 7px -- see 03-truth.html's
             file-level note for the measured math this mirrors, and frame.md Post-render
             review fixes round 6. */
          --zoom-max: 1.03; --zoom-origin-x: 540px; --zoom-origin-y: 864px;
          --safe-bottom-zoomed: calc(1920px - (var(--zoom-origin-y)
            + (1920px - var(--safe-bottom) - var(--safe-margin) - var(--zoom-origin-y)) / var(--zoom-max)));
          --safe-right-zoomed: calc(1080px - (var(--zoom-origin-x)
            + (1080px - var(--safe-right) - var(--safe-margin) - var(--zoom-origin-x)) / var(--zoom-max)));
          --elev-2: 0 18px 32px -20px rgba(19,21,22,0.35);

          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--paper); font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }

        /* Spatial plan:
           1. Full-bleed paper #root, one .frame-zoom wrapper (continuous slow scale)
              holding a flex column: header zone / objects row (flex:1) / chips zone.
           2. Objects row is a flex row of 3 equal columns; each column is a plain flex
              column (icon circle over label), normal document flow, not absolute.
           3. Chips zone is a flex row of 2 chips, centered by flex gap. */
        .frame-zoom { position: absolute; inset: 0; transform-origin: var(--zoom-origin-x) var(--zoom-origin-y); }
        /* Bottom (and right) padding now use the zoom-derived safe edges (see the
           --safe-*-zoomed tokens above) instead of the flat "+35px" allowance --
           objects-row's flex:1 still absorbs whatever space the header block leaves
           above it, so the top offset (+30px, unrelated to this scene's safe-area bug)
           is unchanged. */
        .stage { display: flex; flex-direction: column; height: 100%;
                 padding: calc(var(--safe-top) + 30px) var(--safe-right-zoomed) var(--safe-bottom-zoomed) var(--safe-left); }

        .header-zone { text-align: center; display: flex; flex-direction: column; gap: 18px; }
        .kicker { font-family: var(--font-mono); font-weight: 500; font-size: 32px;
                  letter-spacing: 0.08em; color: var(--ink-2); opacity: 0; }
        /* --t-hero, was 54px -- wraps across several lines at the 858px safe column;
           header-zone has no fixed height (see markup: <br> removed so the phrase
           reflows naturally instead of forcing an awkward mid-clause break), and
           objects-row below is flex:1 so it simply absorbs whatever space remains. */
        .headline { font-family: var(--font-display); font-size: 96px; line-height: 1.18;
                    color: var(--ink); opacity: 0; }

        /* 3*220 + 2*44 = 748px already clears the narrowed ~845px safe column (was
           858px) with room to spare -- unlike Frames 3/4, this row needed no re-fit
           once --safe-right-zoomed replaced the flat --safe-right. */
        .objects-row { flex: 1; display: flex; align-items: center; justify-content: center;
                        gap: 44px; }
        .object-col { display: flex; flex-direction: column; align-items: center; gap: 24px;
                      opacity: 0; transform: scale(0.85); }
        .icon-circle { width: 220px; height: 220px; border-radius: 50%; background: var(--mist);
                       box-shadow: var(--elev-2); display: flex; align-items: center; justify-content: center; }
        .icon-circle svg { width: 108px; height: 108px; stroke: var(--ink); stroke-width: 1.7;
                           fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .object-label { font-family: var(--font-mono); font-weight: 500; font-size: 32px;
                        letter-spacing: 0.05em; color: var(--ink); text-align: center; }

        .chips-zone { display: flex; justify-content: center; gap: 20px; padding-top: 8px; }
        .chip { font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.04em;
                color: var(--ink-2); border: 1.5px solid rgba(19,21,22,0.25); border-radius: 999px;
                padding: 8px 20px; opacity: 0; }
      </style>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        // Continuous slow push across the entire scene -- covers the tail after the
        // last chip lands so nothing sits truly static.
        tl.fromTo('#zoom', { scale: 1 }, { scale: 1.03, duration: 6.000, ease: "none" }, 0);

        // Kicker+headline tightened (blank-frame scan flagged a 0.4s near-empty
        // opening at the old 0/0.2 start) so the header block resolves faster.
        tl.to('#kicker', { opacity: 1, duration: 0.22 }, 0);
        tl.to('#headline', { opacity: 1, duration: 0.32 }, 0.1);

        tl.to('#obj-1', { opacity: 1, scale: 1, duration: 0.42 }, 0.55);
        tl.to('#obj-2', { opacity: 1, scale: 1, duration: 0.42 }, 1.35);
        tl.to('#obj-3', { opacity: 1, scale: 1, duration: 0.42 }, 2.15);

        tl.to('#chip-1', { opacity: 1, duration: 0.3 }, 2.95);
        tl.to('#chip-2', { opacity: 1, duration: 0.3 }, 3.55);

        tl.to({}, { duration: 6.000 }, 0);
        window.__timelines["05-reset"] = tl;
