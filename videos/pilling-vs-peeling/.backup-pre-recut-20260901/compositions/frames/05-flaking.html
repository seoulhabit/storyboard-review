<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "EB Garamond"; font-weight: 400; font-style: normal;
          src: url("assets/fonts/eb-garamond-400.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "Inter"; font-weight: 800; font-style: normal;
          src: url("assets/fonts/inter-800.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }

        #root {
          --paper: #F7F5F0; --ink: #131516; --aqua: #59B8AE; --ink-2: #9C978D;
          --font-display: "EB Garamond", Georgia, serif;
          --font-body: "Inter", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
          --safe-margin: 6px;

          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--ink); font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }

        /* Spatial plan (catalog/visual-components/barrier-wall/, fourth independent
           context for this mechanism in the repo):
           1. #root is a single flex column: headline zone / diagram zone (flex:1,
              centered SVG) / foot zone (qualifier + chip).
           2. Bricks, wash, and shards are one self-contained SVG; nothing outside
              it gets its own independent absolute position. */
        .stage { display: flex; flex-direction: column; height: 100%;
                 padding: calc(var(--safe-top) + var(--safe-margin)) var(--safe-right)
                          var(--safe-bottom) calc(var(--safe-left) + var(--safe-margin)); }

        .headline-zone { flex: 0 0 auto; text-align: center; }
        .h-line { display: block; font-family: var(--font-display); font-size: 72px;
                  line-height: 1.15; color: var(--paper); }
        #h2 { opacity: 0; }

        .diagram-zone { flex: 1; display: flex; align-items: center; justify-content: center; }
        .diagram-zone svg { width: 780px; height: 480px; display: block; }

        .wall-brick { fill: rgba(247,245,240,0.07); stroke: rgba(247,245,240,0.55); stroke-width: 2.4; }
        #course-top, #course-mid, #course-bot { opacity: 1; }
        .wash { fill: rgba(247,245,240,0.16); opacity: 0; }
        .wash-line { stroke: var(--aqua); stroke-width: 2.4; stroke-dasharray: 6 6; opacity: 0; }
        .shard { fill: rgba(247,245,240,0.14); stroke: rgba(247,245,240,0.55); stroke-width: 2; opacity: 0; }
        .wall-label { font-family: var(--font-mono); font-size: 30px; font-weight: 500;
                      letter-spacing: 0.08em; fill: rgba(247,245,240,0.7); }

        .foot-zone { display: flex; flex-direction: column; align-items: center; gap: 20px;
                     text-align: center; padding-top: 8px; }
        .qualifier { font-family: var(--font-mono); font-size: 34px; line-height: 1.35;
                     color: rgba(247,245,240,0.75); max-width: 820px; opacity: 0; }
        .chip { font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.04em;
                color: rgba(247,245,240,0.85); border: 1.5px solid rgba(247,245,240,0.35);
                border-radius: 999px; padding: 8px 20px; opacity: 0; }
      </style>

      <div id="root" data-composition-id="05-flaking" data-width="1080" data-height="1920" data-duration="3.200">
        <div class="clip stage">
          <div class="headline-zone">
            <span class="h-line" id="h1">Peeling is different &mdash;</span>
            <span class="h-line" id="h2">actual skin flaking.</span>
          </div>

          <div class="diagram-zone">
            <svg viewBox="0 0 700 480" aria-hidden="true">
              <g id="wash-group">
                <rect class="wash" id="wash" x="60" y="-30" width="580" height="110" rx="10" />
                <line class="wash-line" id="wash-line" x1="60" y1="80" x2="640" y2="80" />
              </g>
              <g id="wall">
                <g id="course-top">
                  <rect class="wall-brick" id="bt-1" x="60"  y="120" width="130" height="58" rx="9" />
                  <rect class="wall-brick" id="bt-2" x="206" y="120" width="130" height="58" rx="9" />
                  <rect class="wall-brick" id="bt-3" x="352" y="120" width="130" height="58" rx="9" />
                  <rect class="wall-brick" id="bt-4" x="498" y="120" width="142" height="58" rx="9" />
                </g>
                <g id="course-mid">
                  <rect class="wall-brick" x="60"  y="192" width="70"  height="58" rx="9" />
                  <rect class="wall-brick" x="146" y="192" width="130" height="58" rx="9" />
                  <rect class="wall-brick" x="292" y="192" width="130" height="58" rx="9" />
                  <rect class="wall-brick" x="438" y="192" width="130" height="58" rx="9" />
                  <rect class="wall-brick" x="584" y="192" width="56"  height="58" rx="9" />
                </g>
                <g id="course-bot">
                  <rect class="wall-brick" x="60"  y="264" width="130" height="58" rx="9" />
                  <rect class="wall-brick" x="206" y="264" width="130" height="58" rx="9" />
                  <rect class="wall-brick" x="352" y="264" width="130" height="58" rx="9" />
                  <rect class="wall-brick" x="498" y="264" width="142" height="58" rx="9" />
                </g>
              </g>
              <path class="shard" id="shard-1" d="M112,108 l28,-8 l7,18 l-26,9 Z" />
              <path class="shard" id="shard-2" d="M320,102 l24,4 l-4,20 l-24,-6 Z" />
              <path class="shard" id="shard-3" d="M528,106 l26,-4 l6,18 l-28,6 Z" />
              <text class="wall-label" id="wall-label" x="350" y="392" text-anchor="middle">SKIN BARRIER</text>
            </svg>
          </div>

          <div class="foot-zone">
            <div class="qualifier" id="qualifier">dryness &middot; tightness &middot; redness &middot; stinging</div>
            <div class="chip" id="chip">FDA &middot; 21 CFR 333.350</div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        var bricksTop = ['bt-1','bt-2','bt-3','bt-4'].map(function (id) { return document.getElementById(id); });
        var shards = ['shard-1','shard-2','shard-3'].map(function (id) { return document.getElementById(id); });

        // Wall, label, AND h1 already settled at frame zero (mandatory rule 4) --
        // the wall diagram alone measured too low-contrast against ink to clear
        // the post-render blank-frame scan on its own (subtle fill/stroke by
        // design, per the catalog component's own aesthetic); h1 gives frame
        // zero real text weight immediately. h2 is this scene's entrance beat.
        tl.to('#h2', { opacity: 1, duration: 0.3 }, 0.30);

        // The barrier separates: wash descends, shards detach and drift.
        tl.to(['#wash', '#wash-line'], { y: 0, opacity: 1, duration: 0.45, ease: "power2.inOut" }, 1.1);
        shards.forEach(function (s, i) {
          tl.to(s, { opacity: 1, duration: 0.18 }, 1.4 + i * 0.22);
          tl.to(s, { y: 26 + i * 6, rotation: 7 - i * 5, opacity: 0, duration: 0.7, ease: "power2.in" }, 1.58 + i * 0.22);
        });
        bricksTop.forEach(function (b, i) {
          tl.to(b, { opacity: 0.5, duration: 0.4 }, 1.55 + i * 0.1);
        });

        tl.to('#qualifier', { opacity: 1, duration: 0.35 }, 2.30);
        tl.to('#chip', { opacity: 1, duration: 0.3 }, 2.75);

        gsap.set('#wash', { y: -110 });
        gsap.set('#wash-line', { y: -110 });

        tl.to({}, { duration: 3.200 }, 0); // full-span anchor
        window.__timelines["05-flaking"] = tl;
      </script>
    </template>
  </body>
</html>
