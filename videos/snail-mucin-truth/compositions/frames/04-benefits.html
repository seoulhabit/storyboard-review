<script>
  (function () {
    // --- measure + prime every stroke-draw path (checks + connecting spine) ---
    var drawEls = document.querySelectorAll(
      "#root[data-composition-id='04-benefits'] .f04-benefits-check, " +
      "#root[data-composition-id='04-benefits'] .f04-benefits-spine-line"
    );
    drawEls.forEach(function (p) {
      var len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
    });

    // --- prime pop/mask starting states (fromTo-safe: seek to any frame is correct) ---
    gsap.set(
      ["#f04-benefits-marker-1", "#f04-benefits-marker-2", "#f04-benefits-marker-3",
       "#f04-benefits-chip-1", "#f04-benefits-chip-2", "#f04-benefits-chip-3"],
      { scale: 0, opacity: 0 }
    );

    var tl = gsap.timeline({ paused: true });

    var POP_DUR = 0.5;
    var CHECK_DUR = 0.35;
    var WIPE_DUR = 0.5;
    var CHIP_POP_DUR = 0.4;
    var HEADS = [0.35, 4.5, 8.0]; // item 1 lands early (hero visible well before t=0.5s); items 2/3 on their Scene 3 / 4 VO cues

    HEADS.forEach(function (t, i) {
      var n = i + 1;
      // marker: smooth spring-pop (scale 0 -> 1, power3.out — no bounce)
      tl.fromTo(
        "#f04-benefits-marker-" + n,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: POP_DUR, ease: "power3.out" },
        t
      );
      // check icon draws in as the marker settles
      tl.to(
        "#f04-benefits-check-" + n,
        { strokeDashoffset: 0, duration: CHECK_DUR, ease: "power2.out" },
        t + 0.15
      );
      // headword: pill mask-wipe (clip-path inset reveal)
      tl.to(
        "#f04-benefits-head-mask-" + n,
        { clipPath: "inset(0 0% 0 0)", duration: WIPE_DUR, ease: "power2.out" },
        t + 0.05
      );
      // support line: same wipe, a beat behind the headword — the claim lands as one beat
      tl.to(
        "#f04-benefits-support-mask-" + n,
        { clipPath: "inset(0 0% 0 0)", duration: WIPE_DUR, ease: "power2.out" },
        t + 0.15
      );
      // citation chip: lands ~0.3s after the text finishes — claim, then its source
      var textEnd = t + 0.15 + WIPE_DUR;
      tl.fromTo(
        "#f04-benefits-chip-" + n,
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: CHIP_POP_DUR, ease: "power3.out" },
        textEnd + 0.3
      );
    });

    // connecting spine: grows to meet each new marker as it arrives
    var spine = document.getElementById("f04-benefits-spine-path");
    var spineLen = spine.getTotalLength();
    var half = spineLen / 2;
    tl.to(spine, { strokeDashoffset: spineLen - half, duration: 0.6, ease: "power2.out" }, 3.9);
    tl.to(spine, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 7.4);

    // settled hold: one quiet collective breath on the list once all three have landed
    // (2 legs of 1.2s = 2.4s, landing at 11.9s — inside the 11.964s total)
    var idleStart = 9.5;
    tl.to(
      "#root[data-composition-id='04-benefits'] .f04-benefits-content",
      { y: -3, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 },
      idleStart
    );

    window.__timelines = window.__timelines || {};
    window.__timelines["04-benefits"] = tl;
  })();
</script>
