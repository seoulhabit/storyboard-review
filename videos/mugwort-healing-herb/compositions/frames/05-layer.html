  .lz-field { position:relative; width:100%; height:480px; border:1px solid rgba(19,21,22,0.14); border-radius:32px; background:transparent; overflow:hidden; }
  .lz-field-zoom { width:100%; height:100%; }
  .lz-tag { position:absolute; bottom:24px; left:36px; font-weight:700; font-size:3.0cqw; letter-spacing:0.06em; color:#555555; text-align:left; }

  .lz-row { display:flex; gap:20px; opacity:0; }

    border:1px solid rgba(19,21,22,0.16); border-radius:999px; padding:14px 30px; opacity:0; }

  .uc-unsourced { font-family:'Inter',sans-serif; font-weight:600; font-size:3.0cqw; color:rgba(19,21,22,0.85);
    border:1px solid rgba(19,21,22,0.28); border-radius:999px; padding:12px 26px; background:rgba(19,21,22,0.05); opacity:0; }

  /* The essence bottle plate — reappears from beat 4 so the product stays consistent across
     the protocol/layer pair. Anchored to the field's empty top-right corner (the diagram's
     own rows all sit in the horizontal 140-500/vertical 100-460 viewBox band) rather than a
     hand-picked pixel coordinate guessed against the SVG's viewBox — an earlier version at
     left:530/top:322 collided directly with the SERUM/ESSENCE rows once the field's actual

  .lz-plate { position:absolute; top:16px; right:16px; width:104px; aspect-ratio:3/4; border-radius:12px; overflow:hidden; background:#EFEAE1; opacity:0; }
  .lz-plate-zoom { width:100%; height:100%; }

  .lz-plate::after { content:""; position:absolute; inset:0; background:#F7F5F0; mix-blend-mode:multiply; opacity:0.06; pointer-events:none; }
</style>
<div data-composition-id="05-layer" id="root" data-width="1080" data-height="1920" data-duration="8.534">

      <div class="lz-field-zoom" id="lz-field-zoom" data-layout-allow-overflow="true">
        <svg id="lz-svg" viewBox="0 0 640 520" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <!-- skin baseline -->
          <path d="M100,452 H540" stroke="#131516" stroke-width="5" stroke-linecap="round" />
          <text x="516" y="440" text-anchor="end" font-family="Inter" font-weight="700" font-size="18" fill="rgba(19,21,22,0.68)" letter-spacing="2">SKIN</text>
          <!-- routine slabs, top-down: cream / serum / essence -->
          <g id="lz-cream">

            <text x="320" y="164" text-anchor="middle" font-family="Inter" font-weight="700" font-size="22" fill="rgba(19,21,22,0.68)" letter-spacing="2">2 · CREAM</text>
          </g>
          <g id="lz-serum">
            <rect x="140" y="228" width="360" height="72" rx="14" fill="none" stroke="rgba(19,21,22,0.45)" stroke-width="3.5" />
            <text x="320" y="272" text-anchor="middle" font-family="Inter" font-weight="700" font-size="22" fill="rgba(19,21,22,0.68)" letter-spacing="2">1 · SERUM</text>
          </g>
          <g id="lz-essence" opacity="0">
            <rect x="140" y="336" width="360" height="72" rx="14" fill="rgba(89,184,174,0.14)" stroke="#59B8AE" stroke-width="4" />

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var caption = document.getElementById('lz-caption');
  var fieldZoom = document.getElementById('lz-field-zoom');
  var essence = document.getElementById('lz-essence');
  var plate = document.getElementById('lz-plate');
  var plateZoom = document.getElementById('lz-plate-zoom');
  var row = document.getElementById('lz-row');
  var pills = [document.getElementById('lz-p1'), document.getElementById('lz-p2'), document.getElementById('lz-p3')];
  var blooms = [document.getElementById('lz-b1'), document.getElementById('lz-b2'), document.getElementById('lz-b3')];
  var unsourced = document.getElementById('lz-unsourced');

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  // Cues (tightened take): first@0.50 · placement@1.20-1.76 · floods@2.07-2.39 ·
  // No sting@5.92-6.53 · no flush@6.71-7.46 · no fight@7.46-8.38.

  tl.fromTo(caption, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, 0.10);

  // "first layer placement": the essence slab slides in beneath the routine, nearest the skin.
  gsap.set(essence, { x: -420 });
  tl.to(essence, { opacity: 1, duration: 0.2 }, 0.50);
  tl.to(essence, { x: 0, duration: 1.1, ease: 'power3.out' }, 0.50);

  // The same essence-bottle plate from beat 4 reappears here — product consistency across
  // the two beats that are actually talking about the same first-layer step.
  tl.fromTo(plate, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 }, 0.9);

  // The absorption framing has no record in this system — flagged on screen while it is said.
  tl.to(unsourced, { opacity: 1, duration: 0.4 }, 1.20);

  // "floods": bloom rings expand from the essence layer through the skin line.
  blooms.forEach(function (b, i) {
    tl.to(b, { opacity: 1, duration: 0.2 }, 2.07 + i * 0.45);
    tl.to(b, { attr: { r: 90 + i * 30 }, duration: 1.6, ease: 'power2.out' }, 2.07 + i * 0.45);
    tl.to(b, { opacity: 0, duration: 0.5 }, 3.17 + i * 0.45);
  });

  // "No sting, no flush, no fight": three pills land on the beat.
  tl.to(row, { opacity: 1, duration: 0.2 }, 5.85);
  tl.fromTo(pills[0], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 5.92);
  tl.fromTo(pills[1], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 6.71);
  tl.fromTo(pills[2], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 7.46);

  // Slow camera pull runs the full remaining duration (was capped at t=6.3, leaving the
  // last ~2.2s of the scene motionless after the last pill landed) — plus the plate's own
  // small continuous Ken Burns, so the tail always carries measurable pixel change.
  gsap.set(fieldZoom, { scale: 1.04 });
  tl.to(fieldZoom, { scale: 1.0, duration: 7.734, ease: 'power1.inOut' }, 0.8);
  gsap.set(plateZoom, { scale: 1.07 });
  tl.to(plateZoom, { scale: 1.0, duration: 7.634, ease: 'power1.inOut' }, 0.9);

  tl.to({}, { duration: 8.534 }, 0); // span anchor

  window.__timelines = window.__timelines || {};
  window.__timelines['05-layer'] = tl;
})();
</script>
