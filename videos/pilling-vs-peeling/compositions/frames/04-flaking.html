    <template>
      <style>
        *, *::before, *::after { box-sizing: border-box; }
        /* Root cause of the whole session's layout-overflow chase, finally
           isolated by direct measurement: box-sizing defaults to content-box,
           so any element combining an explicit height/width with padding
           (every zone in this project) renders LARGER than declared -- e.g.
           .stage's height:1920px + 192px/384px top/bottom padding rendered
           as an actual 2496px box (1920+576), pushing bottom-anchored
           content straight past the canvas and into the reserved safe zone.
           This one reset fixes it project-wide. */
        @font-face { font-family: "EB Garamond"; font-weight: 400; font-style: normal;
          src: url("assets/fonts/eb-garamond-400.woff2") format("woff2"); font-display: block; }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal;
          src: url("assets/fonts/jetbrains-mono-500.woff2") format("woff2"); font-display: block; }

        #root {
          --paper: #F7F5F0; --ink: #131516; --aqua: #59B8AE; --coral: #C97A5C;
          --ink-2: #6B6B6B; --ink-2-dark: #878B8C; --ink-3-dark: #7C8082; --mist: #F0EBE1;
          --elev-2: 0 18px 32px -20px rgba(19, 21, 22, 0.35);
          --safe-top: 192px; --safe-bottom: 384px; --safe-left: 72px; --safe-right: 162px;
          --safe-margin: 6px;
          --font-display: "EB Garamond", Georgia, "Times New Roman", serif;
          --font-body: "Inter", "Noto Sans KR Video", "Noto Sans KR", system-ui, -apple-system, Helvetica, Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
          --font-kr: "Noto Sans KR Video", "Noto Sans KR", sans-serif;
          position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: var(--ink); font-family: var(--font-body);
        }
        .clip { position: absolute; inset: 0; }

        /* Spatial plan: real plate + BarrierWall (catalog/visual-components/
           barrier-wall/), connected by an intra-scene match cut -- a lifted
           flake on the plate becomes the wall's first detaching shard at the
           same screen position.
           1. #root is a flex column: headline zone (top) / media zone (flex:1,
              one fixed box holding plate panel and diagram stacked, toggled by
              opacity) / foot zone (qualifier + chip, bottom).
           2. Chip never co-resident with the plate (this project's own rule). */
        /* Explicit fixed heights on every zone, not flex-grow. A flex:1
           media-zone whose size depends on measuring headline/foot-zone's
           TEXT content first is exactly the kind of layout the skill warns
           can shift when a font/image finishes loading a moment after first
           layout -- confirmed here via direct measurement: .stage captured
           at 2502px (582px too tall, pushing foot-zone off-canvas) at one
           instant, then settling to the correct 1920px moments later with no
           further changes. Fixed pixel heights removed the dependency on
           any content being measured before layout, closing the race. */
        /* Explicit height in px, not 100% -- percentage height on an
           absolutely positioned element resolves against its containing
           block (#root) at the moment of layout, and #root's own height
           was observed racing (measuring ~2500px before settling to the
           correct 1920px a moment later) during a font/image load. A
           hardcoded px height has nothing to resolve against, closing
           that race everywhere it could otherwise recur. */
        .stage { display: flex; flex-direction: column; height: 1920px;
                 padding: calc(var(--safe-top) + var(--safe-margin)) var(--safe-right)
                          var(--safe-bottom) calc(var(--safe-left) + var(--safe-margin)); }

        .headline-zone { flex: 0 0 190px; text-align: center; min-height: 0; }
        .h-line { display: block; font-family: var(--font-display); font-size: 72px;
                  line-height: 1.15; color: var(--paper); }

        .media-zone { flex: 0 0 1010px; display: flex; align-items: center; justify-content: center; min-height: 0; }
        .media-box { position: relative; width: 780px; height: 480px; }
        .media-plate { position: absolute; inset: 0; border-radius: 20px; overflow: hidden;
                       background: #1A1A1A; }
        .plate-zoom { position: absolute; inset: 0; transform-origin: 50% 55%; }
        .plate-zoom img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .lift-fleck { position: absolute; left: 46%; top: 20%; width: 26px; height: 20px;
                     background: rgba(247,245,240,0.7); border-radius: 3px; opacity: 0;
                     transform: rotate(-12deg); }

        .diagram { position: absolute; inset: 0; opacity: 0; }
        .diagram svg { width: 100%; height: 100%; display: block; }
        /* --bf is the loosening state. The bricks are mostly OUTLINE (fill was
           a flat 0.07), so dimming them -- what round 4 did -- moved almost no
           ink: their whole visible mass is a 2.4px stroke, about 900px per
           brick. Filling the course instead changes ~1.7% of the canvas, which
           is both a real beat and the more accurate picture: these are the
           bricks that have come loose. */
        .wall-brick { --bf: 0.07; fill: rgba(247,245,240,var(--bf));
                      stroke: rgba(247,245,240,0.55); stroke-width: 2.4; }
        .wash { fill: rgba(247,245,240,0.16); opacity: 0; }
        .wash-line { stroke: var(--aqua); stroke-width: 2.4; stroke-dasharray: 6 6; opacity: 0; }
        .shard { fill: rgba(247,245,240,0.14); stroke: rgba(247,245,240,0.55); stroke-width: 2; opacity: 0; }
        .wall-label { font-family: var(--font-mono); font-size: 32px; font-weight: 500;
                      letter-spacing: 0.08em; fill: rgba(247,245,240,0.7); }

        .foot-zone { flex: 0 0 138px; display: flex; flex-direction: column; align-items: center;
                    gap: 20px; text-align: center; padding-top: 8px; min-height: 0; }
        .qualifier { font-family: var(--font-mono); font-size: 34px; line-height: 1.35;
                     color: rgba(247,245,240,0.78); max-width: 820px; opacity: 0; }
        .chip { font-family: var(--font-mono); font-size: 34px; letter-spacing: 0.04em;
                color: rgba(247,245,240,0.85); border: 1.5px solid rgba(247,245,240,0.35);
                border-radius: 999px; padding: 8px 20px; opacity: 0; }
      </style>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        var shards = ['#s4-shard-1','#s4-shard-2','#s4-shard-3'];

        // Frame zero: plate settled, headline settled.
        tl.fromTo('#s4-zoom', { scale: 1.0 }, { scale: 1.02, duration: 0.90, ease: 'none' }, 0);

        // t0.30: a flake lifts off the plate -- the match target for shard-1.
        tl.to('#s4-fleck', { opacity: 1, y: -6, rotation: -4, duration: 0.4, ease: 'power2.out' }, 0.30);

        // t0.90: MATCH CUT -- plate swaps for the barrier wall at the same box.
        tl.to('#s4-plate', { opacity: 0, scale: 0.97, duration: 0.10, ease: 'power1.in' }, 0.90);
        tl.to('#s4-diagram', { opacity: 1, duration: 0.10 }, 0.92);

        tl.to(['#s4-wash', '#s4-wash-line'], { y: 0, opacity: 1, duration: 0.45, ease: "power2.inOut" }, 1.10);
        shards.forEach(function (s, i) {
          tl.to(s, { opacity: 1, duration: 0.18 }, 1.30 + i * 0.22);
          tl.to(s, { y: 26 + i * 6, rotation: 7 - i * 5, opacity: 0, duration: 0.7, ease: "power2.in" }, 1.48 + i * 0.22);
        });
        // Round 6 cadence: scene 04 measured 1/21 beats and 1.75s of dead air
        // (1.10-2.72 local) because every element authored into that window --
        // three small shards and an opacity dim on four outlined bricks -- was
        // far under the 1.0 mean |dLuma| threshold. The top course now does the
        // thing the scene is actually about: it comes loose, then sheds.
        var topCourse = ['#s4-bt-1','#s4-bt-2','#s4-bt-3','#s4-bt-4'];
        topCourse.forEach(function (id) {
          tl.set(id, { '--bf': 0.07, y: 0, rotation: 0, opacity: 1,
                       svgOrigin: '350 149' }, 0);
        });
        // ~1.50 — the course loosens (fills), the scene's first real beat.
        topCourse.forEach(function (id, i) {
          tl.to(id, { '--bf': 0.55, duration: 0.30, ease: 'power2.out' }, 1.50 + i * 0.05);
        });
        // ~2.05 — it sheds: down and away, leaving the barrier a course short.
        topCourse.forEach(function (id, i) {
          tl.to(id, { y: 104 + i * 9, rotation: (i % 2 ? 7 : -6), opacity: 0,
                      duration: 0.55, ease: 'power2.in' }, 2.05 + i * 0.05);
        });

        tl.to('#s4-qualifier', { opacity: 1, duration: 0.35 }, 2.10);
        // t2.45: chip lands 1.55s after the plate left screen.
        tl.to('#s4-chip', { opacity: 1, duration: 0.3 }, 2.45);

        gsap.set('#s4-wash', { y: -110 });
        gsap.set('#s4-wash-line', { y: -110 });

        tl.to({}, { duration: 2.800 }, 0); // full-span anchor
        window.__timelines["04-flaking"] = tl;
      </script>
