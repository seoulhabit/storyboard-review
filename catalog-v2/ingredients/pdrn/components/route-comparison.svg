<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc" data-component="pdrn-route-comparison" data-version="1.0.0">
  <title id="title">PDRN route comparison</title>
  <desc id="desc">An editorial comparison separating evidence for topical, procedure-assisted, and injected PDRN routes.</desc>
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#131516" flood-opacity="0.08"/></filter>
    <linearGradient id="serum" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff4ef"/><stop offset="1" stop-color="#9dcec5"/></linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="#F7F5F0"/>

  <g id="header">
    <text x="72" y="82" fill="#4F6B52" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">PDRN · EVIDENCE MAP</text>
    <text x="70" y="164" fill="#131516" font-family="Georgia, 'Times New Roman', serif" font-size="67">Route changes</text>
    <text x="70" y="230" fill="#131516" font-family="Georgia, 'Times New Roman', serif" font-size="67">what a study proves.</text>
    <line x1="72" y1="268" x2="1008" y2="268" stroke="#131516" stroke-opacity="0.14"/>
  </g>

  <g id="route-topical" transform="translate(72 310)" filter="url(#card-shadow)">
    <rect width="936" height="244" rx="28" fill="#FFFEFB" stroke="#59B8AE" stroke-width="3"/>
    <g id="topical-icon" transform="translate(34 38)">
      <rect x="23" y="35" width="92" height="118" rx="24" fill="none" stroke="#315D56" stroke-width="5"/>
      <rect x="44" y="5" width="50" height="43" rx="10" fill="#315D56"/>
      <path d="M138 50 C160 74 160 110 138 137" fill="none" stroke="#59B8AE" stroke-width="9" stroke-linecap="round"/>
      <path d="M153 58 C176 82 176 104 153 128" fill="none" stroke="#59B8AE" stroke-opacity="0.42" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="228" y="58" fill="#315D56" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" letter-spacing="4">01 · TOPICAL</text>
    <text x="228" y="105" fill="#131516" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Specific eye-cream evidence</text>
    <text x="228" y="147" fill="#59605C" font-family="Arial, Helvetica, sans-serif" font-size="23">0.1% PDRN-850K · n=31 · 28 days · split-face</text>
    <rect x="228" y="174" width="366" height="44" rx="22" fill="#E3F0ED"/>
    <text x="411" y="203" text-anchor="middle" fill="#315D56" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="2">PROMISING · FORMULA-SPECIFIC</text>
    <text x="900" y="211" text-anchor="end" fill="#7B817D" font-family="Arial, Helvetica, sans-serif" font-size="16">PLOS ONE · 2026</text>
  </g>

  <g id="route-assisted" transform="translate(72 582)" filter="url(#card-shadow)">
    <rect width="936" height="244" rx="28" fill="#FFFEFB" stroke="#131516" stroke-opacity="0.22" stroke-width="2"/>
    <g id="assisted-icon" transform="translate(34 38)">
      <path d="M9 100 H159" stroke="#131516" stroke-width="7" stroke-linecap="round"/>
      <path d="M33 100 v42 M68 100 v42 M103 100 v42 M138 100 v42" stroke="#C97A5C" stroke-width="5" stroke-linecap="round"/>
      <circle cx="33" cy="156" r="7" fill="#C97A5C" fill-opacity="0.4"/><circle cx="68" cy="156" r="7" fill="#C97A5C" fill-opacity="0.4"/><circle cx="103" cy="156" r="7" fill="#C97A5C" fill-opacity="0.4"/><circle cx="138" cy="156" r="7" fill="#C97A5C" fill-opacity="0.4"/>
    </g>
    <text x="228" y="58" fill="#8B4F39" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" letter-spacing="4">02 · PROCEDURE-ASSISTED</text>
    <text x="228" y="105" fill="#131516" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Needs its own evidence record</text>
    <text x="228" y="147" fill="#59605C" font-family="Arial, Helvetica, sans-serif" font-size="23">Microneedling or barrier disruption changes delivery.</text>
    <rect x="228" y="174" width="408" height="44" rx="22" fill="#F2E9E4"/>
    <text x="432" y="203" text-anchor="middle" fill="#8B4F39" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="2">NO DEFAULT CLAIM IN THIS PACK</text>
  </g>

  <g id="route-injected" transform="translate(72 854)" filter="url(#card-shadow)">
    <rect width="936" height="244" rx="28" fill="#FFFEFB" stroke="#6F8F72" stroke-width="3"/>
    <g id="injected-icon" transform="translate(34 38)">
      <path d="M16 134 L116 34" stroke="#4F6B52" stroke-width="13" stroke-linecap="round"/>
      <path d="M101 25 L128 52" stroke="#4F6B52" stroke-width="7" stroke-linecap="round"/>
      <path d="M9 143 L1 151" stroke="#C97A5C" stroke-width="4" stroke-linecap="round"/>
      <rect x="46" y="75" width="72" height="30" rx="7" transform="rotate(-45 82 90)" fill="url(#serum)" stroke="#315D56" stroke-width="3"/>
    </g>
    <text x="228" y="58" fill="#4F6B52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" letter-spacing="4">03 · INJECTED · MEDICAL</text>
    <text x="228" y="105" fill="#131516" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Human ulcer trial</text>
    <text x="228" y="147" fill="#59605C" font-family="Arial, Helvetica, sans-serif" font-size="23">n=216 randomized · IM + perilesional · diabetic foot</text>
    <rect x="228" y="174" width="376" height="44" rx="22" fill="#E9EFE7"/>
    <text x="416" y="203" text-anchor="middle" fill="#4F6B52" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="2">HUMAN RCT · DIFFERENT ROUTE</text>
    <text x="900" y="211" text-anchor="end" fill="#7B817D" font-family="Arial, Helvetica, sans-serif" font-size="16">JCEM · 2014</text>
  </g>

  <g id="boundary" transform="translate(72 1140)">
    <rect width="936" height="142" rx="24" fill="#131516"/>
    <circle cx="62" cy="71" r="27" fill="#C97A5C"/>
    <text x="62" y="80" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">!</text>
    <text x="112" y="58" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">DO NOT BORROW ACROSS ROUTES</text>
    <text x="112" y="96" fill="#CDD2CF" font-family="Arial, Helvetica, sans-serif" font-size="22">An injected medical result does not become proof for a cosmetic serum.</text>
  </g>
  <text x="72" y="1321" fill="#6D746F" font-family="Arial, Helvetica, sans-serif" font-size="16">PDRN-SCI-2014-DIABETIC-ULCER · PDRN-SCI-2026-TOPICAL-850K</text>
</svg>
