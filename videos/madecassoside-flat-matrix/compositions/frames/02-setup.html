<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  // Deterministic seeded strand field — pure function of index, no Math.random().
  function lcg(seed) { var s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  var rnd = lcg(20260829);
  var NS = 'http://www.w3.org/2000/svg';
  var knot = document.getElementById('st-knot');
  var strands = [];
  var CX = 320, CY = 320;
  for (var i = 0; i < 14; i++) {
    var a0 = rnd() * Math.PI * 2, a1 = rnd() * Math.PI * 2, a2 = rnd() * Math.PI * 2;
    var r0 = 26 + rnd() * 64, r1 = 20 + rnd() * 70, r2 = 24 + rnd() * 60;
    var x0 = CX + Math.cos(a0) * r0, y0 = CY + Math.sin(a0) * r0 * 0.8;
    var x1 = CX + Math.cos(a1) * (r1 + 40), y1 = CY + Math.sin(a1) * r1;
    var x2 = CX + Math.cos(a2) * r2, y2 = CY + Math.sin(a2) * r2 * 0.85;
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M' + x0.toFixed(1) + ',' + y0.toFixed(1) +
      ' Q' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' ' + x2.toFixed(1) + ',' + y2.toFixed(1));
    p.setAttribute('stroke', i % 3 === 0 ? '#E4574D' : 'rgba(228,87,77,0.72)');
    p.setAttribute('stroke-width', (2.6 + rnd() * 1.6).toFixed(1));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke-linecap', 'round');
    knot.appendChild(p);
    // entry vector: fly in from outside the box toward final position
    var ea = rnd() * Math.PI * 2;
    strands.push({ el: p, fx: Math.cos(ea) * 420, fy: Math.sin(ea) * 420 - 160 });
  }

  var box = document.getElementById('st-stage-box');
  var surfL = document.getElementById('st-surface-l');
  var surfR = document.getElementById('st-surface-r');
  var kicker = document.getElementById('st-kicker');
  var caption = document.getElementById('st-caption');
  var card = document.getElementById('st-card');
  var knotG = document.getElementById('st-knot');

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  // Local VO cues: tears@0.81 · pimple@1.74 · panics@2.97 · dumps@4.36 · chaotic@4.68 ·
  // collagen@5.97 · plug-the-hole@6.68-7.78.
  gsap.set(knotG, { scale: 1.45, svgOrigin: '320 320' }); // QA round: unscaled knot read too small at phone size
  tl.fromTo(box, { scale: 1.02 }, { scale: 1.0, duration: 0.4 }, 0);

  // "tears": the surface splits open — raw red edges + an inflammation bloom fill the
  // stage until the collagen dump arrives (QA round: the first half read empty without them).
  var tearL = document.getElementById('st-tear-l');
  var tearR = document.getElementById('st-tear-r');
  var inflame = document.getElementById('st-inflame');
  tl.to(surfL, { x: -34, duration: 0.4, ease: 'power2.out' }, 0.81);
  tl.to(surfR, { x: 34, duration: 0.4, ease: 'power2.out' }, 0.81);
  tl.to(tearL, { x: -34, duration: 0.4, ease: 'power2.out' }, 0.81);
  tl.to(tearR, { x: 34, duration: 0.4, ease: 'power2.out' }, 0.81);
  tl.to([tearL, tearR], { opacity: 1, duration: 0.3 }, 0.85);
  tl.to(inflame, { opacity: 1, duration: 0.7, ease: 'power1.inOut' }, 0.95);
  // "panics": one bounded inflammation pulse, then it settles.
  tl.to(inflame, { scale: 1.16, duration: 0.4, ease: 'power1.inOut' }, 2.97);
  tl.to(inflame, { scale: 1.0, opacity: 0.75, duration: 0.6, ease: 'power1.inOut' }, 3.40);

  // "panics": kicker lands, one bounded stage shudder.
  tl.to(kicker, { opacity: 1, duration: 0.35 }, 2.97);
  (function () {
    var j = { p: 0 };
    tl.to(j, { p: Math.PI * 3, duration: 0.42, ease: 'none', onUpdate: function () {
      gsap.set(box, { x: Math.sin(j.p) * 4 });
    } }, 2.97);
    tl.set(box, { x: 0 }, 3.42);
  })();

  // "dumps ... chaotic unorganized collagen": strands pour in, staggered.
  strands.forEach(function (s, i) {
    var t0 = 4.36 + i * 0.11;
    tl.fromTo(s.el, { x: s.fx, y: s.fy, opacity: 0 },
      { x: 0, y: 0, opacity: 1, duration: 0.55, ease: 'power2.out' }, t0);
  });
  tl.fromTo(caption, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45 }, 4.68);

  // "plug the hole": the knot crests up through the tear.
  tl.to(knotG, { y: -46, duration: 0.85, ease: 'power2.inOut' }, 6.68);
  tl.to([surfL, surfR], { x: 0, duration: 0.9, ease: 'power2.inOut' }, 6.80);

  // claim card rises; slow push-in across the tail.

  tl.to(box, { scale: 1.06, duration: 3.6, ease: 'power1.inOut' }, 5.00);

  tl.to({}, { duration: 8.600 }, 0); // span anchor

  window.__timelines = window.__timelines || {};

})();
