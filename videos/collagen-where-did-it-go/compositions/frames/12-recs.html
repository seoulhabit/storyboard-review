    window.__timelines = window.__timelines || {};
    // No `defaults: {ease}` -- every tween names its own. See _preamble.py.
    var tl = gsap.timeline({ paused: true });
    var EASE = {"arrive": "power2.out", "slam": "back.out(1.7)", "wipe": "power4.inOut", "count": "none", "swap": "expo.inOut", "exit": "power2.in", "hold": "sine.inOut", "camera": "power2.inOut"};

    function el(t, a, parent) { var n = document.createElementNS(NS, t);

    function txt(parent, x, y, s, cls, anchor) {
      var t = el("text", { x:x, y:y, "class":cls || "", "text-anchor":anchor || "start" }, parent);
      t.textContent = s; return t; }

    // pathFollow: move `node` along `pathEl` between progress `from` and `to`
    // WITHOUT MotionPathPlugin and WITHOUT onUpdate. The path is SAMPLED at
    // build time into a chain of short linear x/y (and rotation) tweens, so the
    // pose at any timeline time is a plain property tween -- a pure function of
    // time under any seek. (An onUpdate proxy was tried first: the runtime seeks
    // with callbacks suppressed, and frame zero rendered the molecule at the END
    // of its run.) Convention: the node is DRAWN at the path's start point, so
    // the translation is (q - p0). Returns the end pose for the caller's next
    // fromTo. Easing is applied to the sampled progress, so the motion keeps its
    // curve while every sub-tween stays linear.
    function pathFollow(tl, node, pathEl, at, dur, ease, o) {
      o = o || {}; var from = o.from == null ? 0 : o.from, to = o.to == null ? 1 : o.to;
      var L = pathEl.getTotalLength(), p0 = pathEl.getPointAtLength(0);
      var ox = o.ox == null ? p0.x : o.ox, oy = o.oy == null ? p0.y : o.oy;
      var N = o.samples || Math.max(12, Math.round(dur * 30)), ef = gsap.parseEase(ease || "none");
      function pose(p) {
        var q = pathEl.getPointAtLength(p * L), r = { x:q.x - ox, y:q.y - oy };
        if (o.rotate) { var a = pathEl.getPointAtLength(Math.min(L, p * L + 4)),
                            b = pathEl.getPointAtLength(Math.max(0, p * L - 4));
                        r.rotation = Math.atan2(a.y - b.y, a.x - b.x) * 57.2958; }
        return r;
      }
      var start = pose(from);
      // frame zero, and any cold seek before `at`. A node that is walked by TWO
      // pathFollows (tract, then a branch) must pass { set:false } on the second:
      // two zero-duration sets at t=0 render in insertion order and the LATER
      // one wins every frame before `at` (measured: dispatch dots drawn at the
      // tract exit before "absorbed").
      if (o.set !== false) tl.set(node, start, 0);
      var prev = start;
      for (var i = 1; i <= N; i++) {
        var p = from + (to - from) * ef(i / N), nxt = pose(p);
        var t0 = at + dur * (i - 1) / N;
        tl.fromTo(node, prev, Object.assign({ duration: dur / N, ease: "none" }, nxt), t0);
        prev = nxt;
      }
      return prev;
    }
    // stroke draw-in; dasharray set from the measured length
    function drawIn(tl, sel, at, dur, stagger, ease) {
      gsap.utils.toArray(sel).forEach(function (p, i) {
        var L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
        tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur,
                  ease: ease || "power4.inOut" }, at + i * (stagger || 0));
      });
    }
    // numeral count -- ease none, or it lies. A PROPERTY tween on innerText
    // with a modifier (no onUpdate), so any seek renders the right numeral.
    function count(tl, id, from, to, at, dur, fmt) {
      var node = document.getElementById(id);
      var f = fmt || function (n) { return n.toLocaleString("en-GB"); };
      node.textContent = f(from);
      tl.fromTo(node, { innerText: from }, { innerText: to, duration: dur, ease: "none",
                modifiers: { innerText: function (v) { return f(Math.round(parseFloat(v))); } } }, at);
    }

    // opacity 0; reveal() switches it on right as the wash begins
    function reveal(tl, sel, at) { tl.to(sel, { opacity:1, duration:0.1 }, at); }

      var w = gsap.utils.toArray(sel + " .kt-word");
      if (mode === "slam") tl.fromTo(w, { opacity:0, scale:1.6 }, { opacity:1, scale:1,
            duration:0.32, stagger:step, ease:"back.out(1.7)" }, at);

            stagger:step, ease:"power2.out" }, at);

    // dashed epidermis/dermis boundary, an optional dermis hatch (aqua braces

    // function of o.w / o.h -- no PRNG. Adapted from catalog skin-band +
    // barrier-wall.
    //   o = { id, w, h, surf, boundary, brickRows, door:{col}, hatch:{n, cut:[i]},
    //         orient:"top"|"left", x, y, labels:true }

    // band stands vertically at o.x with width o.h and height o.w.
    function drawBarrier(svg, o) {

        inner = el("g", { transform:"translate(" + o.x + " 0) rotate(-90) translate(-" + o.w + " 0)" }, g);
      } else if (o.x || o.y) {

      el("rect", { x:0, y:bnd, width:w, height:h - bnd, "class":"bar-band", id:o.id + "-derm" }, inner);

      // rendered around the SVG origin, not the rect's edge. Washes are HTML divs
      // laid over the band by the file that owns it (see frames_c.py).

          var x0 = i * hx + 14, x1 = (i + 1) * hx - 14;
          var a = el("line", { x1:x0, y1:h - 14, x2:x1, y2:bnd + 14, "class":"bar-h", id:o.id + "-h-" + i }, inner);
          var b = el("line", { x1:x1, y1:h - 14, x2:x0, y2:bnd + 14, "class":"bar-h", id:o.id + "-hb-" + i }, inner);
          [a, b].forEach(function (L) { var len = Math.hypot(x1 - x0, h - bnd - 28);
            L.style.strokeDasharray = len; L.style.strokeDashoffset = 0; L.setAttribute("data-len", len); });
        }
        (o.hatch.cut || []).forEach(function (i) {
          ["-h-", "-hb-"].forEach(function (s) {
            var L = document.getElementById(o.id + s + i);
            L.style.strokeDashoffset = L.getAttribute("data-len"); L.style.opacity = "0.25"; });
        });
      }
      // brick courses (running bond)
      var BW = 130, BH = 58, J = 16, rows = o.brickRows == null ? 2 : o.brickRows;
      for (var r = 0; r < rows; r++) {
        var yb = surf + 10 + r * (BH + J), off = (r % 2) ? -73 : 0, c = 0;
        for (var xb = off; xb < w; xb += BW + J, c++) {
          if (o.door && r === 0 && c === o.door.col) {
            el("line", { x1:xb + 20, y1:yb, x2:xb + 20, y2:yb + BH, "class":"bar-jamb" }, inner);
            el("line", { x1:xb + BW - 20, y1:yb, x2:xb + BW - 20, y2:yb + BH, "class":"bar-jamb" }, inner);
            el("rect", { x:xb + 20, y:yb, width:BW - 40, height:BH, "class":"bar-doorgap", id:o.id + "-door" }, inner);
            continue;
          }
          el("rect", { x:Math.max(0, xb), y:yb, width:Math.min(w, xb + BW) - Math.max(0, xb), height:BH, rx:9,
                       "class":"bar-brick", id:o.id + "-b-" + r + "-" + c }, inner);
        }
      }
      // surface wave and boundary
      var d = "";
      for (var k = 0; k <= 24; k++) {
        var x = w * k / 24, y = surf + 7 * Math.sin(2.2 * 6.2832 * x / w) + 3 * Math.sin(5.1 * 6.2832 * x / w);
        d += (k ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1) + " ";
      }
      el("path", { d:d, "class":"bar-surface", id:o.id + "-surface" }, inner);
      el("line", { x1:0, y1:bnd, x2:w, y2:bnd, "class":"bar-boundary", id:o.id + "-boundary" }, inner);
      if (o.labels !== false) {
        if (o.orient === "left") {
          txt(g, o.x + surf + 22, 52, "EPIDERMIS", "bar-label");
          txt(g, o.x + h - 22, 52, "DERMIS", "bar-label", "end");
        } else {
          txt(inner, 22, surf - 16, "EPIDERMIS", "bar-label");
          txt(inner, 22, h - 18, "DERMIS", "bar-label");
        }
      }
      return g;
    }
    // Live UV damage / repair on the dermis hatch fibers drawBarrier already
    // drew (each fiber's own length is on data-len, set when it was drawn).
    // snapMeshFibers ANIMATES a fiber retracting + dimming -- "ultraviolet
    // light helps break that mesh down", spoken live, not a build-time
    // pre-cut. repairMeshFibers draws one back in, for the recommendations
    // scene's "protein and vitamin C ... retinoids ... encouraging collagen
    // production" -- one or two fibers, never the whole mesh at once: the
    // claim is stronger evidence for PRODUCTION, not a rebuilt structure.
    function snapMeshFibers(id, indices, tl, at, stagger) {
      indices.forEach(function (i, k) {
        ["-h-", "-hb-"].forEach(function (s) {
          var L = document.getElementById(id + s + i);
          if (!L) return;
          var len = parseFloat(L.getAttribute("data-len"));
          tl.to(L, { strokeDashoffset: len, opacity: 0.18, duration: 0.42, ease: "power2.in" },
                at + k * (stagger || 0));
        });
      });
    }
    function repairMeshFibers(id, indices, tl, at, dur) {
      indices.forEach(function (i) {
        ["-h-", "-hb-"].forEach(function (s) {
          var L = document.getElementById(id + s + i);
          if (!L) return;
          tl.to(L, { strokeDashoffset: 0, opacity: 0.55, duration: dur || 0.6, ease: "power2.out" }, at);
        });
      });
    }

    var svg = document.getElementById("skinSvg");
    drawBarrier(svg, { id:"skin", w:1728, h:918, surf:65, boundary:280, brickRows:2, hatch:{ n:10, cut:[2, 5, 8] }, labels:false });
    // shield/film are appended AFTER drawBarrier so they paint ON TOP of its
    // opaque epidermis/dermis backgrounds and brick course -- static markup
    // placed before the JS call was silently invisible under those opaque
    // layers (confirmed on the rough-preview render: no shield tint appeared
    // at any sampled frame in this scene despite a correctly-timed tween).
    var shield = el("rect", { "class":"shield", id:"shield", x:0, y:0, width:1728, height:280, rx:0 }, svg);
    // y:18 sits AT the true surface line (surf:40 minus the wave's own
    // amplitude) -- not near the dermis boundary, where a prior draft
    // mistakenly placed it (thematically wrong: a topical film sits on the
    // surface, not deep in the tissue).
    var film = el("rect", { "class":"film", id:"film", x:700, y:48, width:260, height:16, rx:8 }, svg);

    // ---- 12-recs: each recommendation anchors to the actor itself ------------
    tl.fromTo("#world", { scale:1.05 }, { scale:1, duration:1.0, ease:EASE.camera }, 0);
    // sunscreen = a shield over the epidermis. The motion sidecar's appearsBy
    // checks opacity >= 0.5 specifically (hyperframes-cli's own documented
    // threshold) -- an initial reveal to 0.42 never crosses it at all, so the
    // checker reports "appears" only once a LATER tween happens to reach 0.5,
    // several words after the one that actually names it. Reveal straight to
    // 0.52 here; later tweens only refine within the visible range.
    tl.fromTo("#shield", { opacity:0, scaleY:0, transformOrigin:"50% 0%" },
              { opacity:0.52, scaleY:1, duration:0.35, ease:EASE.arrive }, 1.715 - 0.2);
    // measured hole: "every day, it's your best" (sunscreen settling to the
    // word "shield") carries nothing visual otherwise -- a ~3.4s gap. A
    // too-subtle pulse (0.03 scale, 0.08 opacity) does not register as
    // motion at all to the render-level checker's fingerprint -- confirmed:
    // the frozen window it reports lands EXACTLY where the subtle pulses
    // were, not where there's truly zero animation. Larger deltas here.
    tl.to("#shield", { scaleY:1.10, opacity:0.62, duration:0.7, yoyo:true, repeat:1, ease:"sine.inOut" }, 2.874);
    tl.to("#shield", { opacity:0.68, duration:0.6, yoyo:true, repeat:1, ease:EASE.hold }, 5.036 + 0.2);
    // not smoking: no new injury -- the shield simply holds, nothing repeats
    tl.to("#shield", { opacity:0.6, duration:0.4, ease:EASE.arrive }, 6.188);
    // bridge between the shield settling and the protein/vitamin-C repair
    tl.to("[id^=skin-h-],[id^=skin-hb-]", { opacity:0.78, duration:0.7, yoyo:true, repeat:1, ease:"sine.inOut" }, 6.188 + 0.7);
    // protein + vitamin C: one mesh fibre repairs
    repairMeshFibers("skin", [5], tl, 7.150, 0.6);
    tl.fromTo("#cite-smoke", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.35, ease:EASE.arrive }, 7.150 - 0.3);
    tl.to("#cite-smoke", { opacity:0.35, duration:0.35, ease:EASE.exit }, 7.150 + 0.2);
    // bridge across "for suitable users" -- the qualifier before the retinoid claim
    tl.to("#shield", { opacity:0.82, duration:0.8, yoyo:true, repeat:1, ease:"sine.inOut" }, 7.150 + 1.2);
    // camera leans toward the mesh as the retinoid claim lands
    tl.to("#world", { scale:1.06, x:0, y:-40, duration:0.8, ease:EASE.camera }, 11.596 - 0.2);
    repairMeshFibers("skin", [2], tl, 15.897, 0.7);
    tl.fromTo("#cite-ret", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.35, ease:EASE.arrive }, 12.950);
    // measured hole: "stronger evidence for" carries nothing visual before
    // the fibre repair lands on "encouraging" -- a ~2.6s gap otherwise
    tl.to("#cite-ret", { scale:1.14, duration:0.6, yoyo:true, repeat:1, ease:"sine.inOut" }, 14.463 + 0.3);
    tl.to("[id^=skin-h-],[id^=skin-hb-]", { opacity:0.6, duration:1.0, ease:EASE.arrive }, 16.782 - 0.2);
    tl.to("#world", { scale:1, x:0, y:0, duration:0.7, ease:EASE.camera }, 17.758 - 0.5);
    // cream, named last: the surface film reappears
    tl.fromTo("#film", { opacity:0.6, scaleX:0, transformOrigin:"50% 50%" },
              { scaleX:1, duration:0.5, ease:EASE.wipe }, 18.392);

    // ---- 13-verdict --------------------------------------------------------
    tl.to("#film", { scale:1.1, duration:0.3, yoyo:true, repeat:1, ease:EASE.slam }, 19.215);
    // measured hole: the opt-note reveals are real tweens but their own
    // element covers under 2% of frame area, which the checker's fingerprint
    // apparently doesn't count as "moving" -- a #world move covers the whole
    // frame regardless. Ends well before 22.993 (22.993).
    tl.to("#world", { scale:1.03, duration:1.35, yoyo:true, repeat:1, ease:"sine.inOut" }, 19.215 + 0.2);
    tl.fromTo("#opt-wash", { scaleX:0 }, { scaleX:1, duration:0.4, ease:EASE.wipe }, 20.706 - 0.15);
    tl.fromTo("#opt-chip", { opacity:0, scale:0.8 }, { opacity:1, scale:1, duration:0.3, ease:EASE.arrive }, 21.085);
    tl.to("#final", { opacity:1, duration:0.1 }, 21.925 - 0.15);
    tl.fromTo("#final-wash", { scaleX:0 }, { scaleX:1, duration:0.6, ease:EASE.wipe }, 21.925 - 0.15);
    kineticWords(tl, "#final-kt", 19.215 - 0.1, 0.05, "rise");

    // departure: push under the curtain wipe into the next file
    tl.to("#world", { scale:1.06, duration:0.90, ease:"power2.inOut" }, 22.993);

    tl.to({}, { duration: 23.893 }, 0);   // full-span anchor -- always last
    window.__timelines["12-recs"] = tl;
  </script>
</template>
