    <style>
      #root {

    --endscreen-right:640px; --endscreen-bottom:200px;
}

    .stage { position:relative; width:100%; height:100%;
             padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); }
    /* The stage's single child fills the SAFE BOX exactly, so clipping it clips
       at the safe line. Confirmed necessary: on the first full render the hard
       safe-area gate found 81 frames with ink in a reserved zone, all of them
       entrance-transform transients (a panel offset x:-90 from a resting edge
       that IS the safe line) or scale-up transients. Containment beats a bigger
       margin -- a margin is sized against today's token and goes stale silently. */
    .stage > * { overflow: hidden; }
    .flexmin { min-height:0; }

    /* Citation chip: `Journal · Year` ONLY. Never an internal id or a PMID --

            background:var(--mist); }
    .cite.on-ink { color:var(--ink-2-dark); border-color:var(--rule-dark);
                   background:var(--ink-soft); }

    /* ---- panel-scale beat primitives -------------------------------------
       Act 1 measured 4-5.8% active steps against 11.7-23.1% on shipped 9:16
       projects. Cause: on a 1920-wide frame a headline sits in a grid cell, so
       a text fade changes ~0.7% of the pixels. These move a whole panel or
       column instead -- 15-50% per beat -- which is what actually reads. */
    .panel { position:relative; background:var(--mist); border-radius:var(--r-3);
             padding:var(--s-6); min-height:0; overflow:hidden; }
    .panel.on-ink { background:var(--ink-soft); }
    /* A full-panel colour wash. scaleX from the left = a large area changing. */
    .wash { position:absolute; inset:0; transform:scaleX(0); transform-origin:0% 50%;
            border-radius:inherit; z-index:0; }
    /* Every following sibling of a wash sits ABOVE it. The earlier rule was
       scoped to .panel children only, so .arm/.stt/.action labels rendered
       UNDER their own wash (check: text_occluded, a hard error).
       CAVEAT this rule cannot cover: a BARE TEXT NODE has no element to carry
       position/z-index, so a wash paints straight over it and the card renders
       EMPTY -- confirmed on three cards, caught by the region-aware content-void
       check and verified by frame extraction. Always wrap copy in an element
       inside a washed container; the `:empty` guard below makes a stray case
       visible in review instead of silently blank. */
    .wash ~ * { position:relative; z-index:1; }
    .wash:only-child { outline:3px dashed #C97A5C; }   /* a wash with no sibling
                                                          content is authoring error */
    .wash.aqua { background:var(--aqua); } .wash.coral { background:var(--coral); }
    .wash.moss { background:var(--moss); } .wash.mist { background:var(--mist); }
    /* --rule-strong, for washing a panel that is ALREADY --mist. `.wash.mist` on
       a --mist panel is the same colour on the same colour: it renders nothing,
       and a scene relying on it as a beat holds silently. Measured on scene 08. */
    /* Full-canvas layer, for a scene that stacks TWO complete grounds and
       reveals one over the other (09-exclusion: paper "tidy version" under
       an ink "honest correction", swept in by clip-path). Each .world fills
       its own .stage internally -- this class only pins position/overflow so
       stacking two of them under #root does not double the safe-area padding. */
    .world { position:absolute; inset:0; overflow:hidden; }
    .wash.dim  { background:var(--ink-3); }   /* 82-luma step off --mist; a
       --rule-strong wash was only 20 luma and barely registered as a beat */
    /* WASH COLOUR IS BOUND TO TEXT COLOUR. A wash replaces what sits behind the
       text, so the token that passed against the panel's ORIGINAL ground can fail
       against the wash -- measured: --ink-2 on aqua is 2.26:1, and --paper on aqua
       is ~1.9:1. Two safe pairings only:
         light ground -> .wash.aqua    + --ink text   (7.76:1)
         dark  ground -> .wash.moss    + --paper text (5.42:1)
       Anything else must be re-measured against the wash, not the panel. */
    .wash.aqua ~ *, .wash.coral ~ *, .washed-light { color:var(--ink) !important; }
    .wash.moss ~ *, .washed-dark  { color:var(--paper) !important; }
    .wash.dim ~ *  { color:var(--ink) !important; }

    /* A panel-sized strike: covers the whole card, not a 5px line through a word. */
    .void { position:absolute; inset:0; background:var(--coral); opacity:0;
            border-radius:inherit; }
    .p-title { font-family:var(--font-body); font-weight:800; font-size:var(--t-frame);

    .kicker { font-family:var(--font-mono); font-size:var(--t-label);

    .kicker.on-ink { color:var(--ink-3-dark); }
    .hero { font-family:var(--font-display); font-size:var(--t-hero);

    .col { display:flex; flex-direction:column; min-height:0; }
    .grow { flex:1 1 0; min-height:0; }

    /* Debug overlay -- toggled by a class on #root, never on <body>.

    #root.debug-layout::after {

    .g16 { display:grid; grid-template-columns:42fr 58fr; gap:var(--s-8);

    .cohort { display:grid; grid-template-columns:repeat(13,1fr); gap:7px; }
    .cohort i { display:block; width:100%; aspect-ratio:1/1; border-radius:50%;
                background:var(--ink-3); }

    /* top/left/right are offset from #root's own edge (the chband div is a
       sibling of .stage, not nested inside it), so the safe-area tokens are
       spelled out explicitly here -- never 0, which would bleed the wash to
       the true canvas edge. See the hard safe-area gate note above. */
    /* top:calc(safe-top + 3px), not bare var(--safe-top): the hard safe-area
       gate measured this band's own rendered edge 2px into the reserved zone
       (rounded-corner antialiasing/H.264 edge blur softening a couple of
       rows outward beyond the CSS-computed line) -- a small buffer absorbs
       that without being visible. */
    .chband { position:absolute; top:calc(var(--safe-top) + 3px); left:var(--safe-left);
              right:var(--safe-right); height:112px;
              display:flex; align-items:center; overflow:hidden;
              border-radius:var(--r-3); z-index:10; padding:0 var(--s-6); }
    .chband .kicker { position:relative; z-index:1; font-size:var(--t-frame);
                       letter-spacing:var(--tr-mono); }

    #root { color:var(--paper); }
    .plate { position:absolute; inset:0; overflow:hidden; z-index:0; }
    .plate > video, .plate > img { position:absolute; left:0; top:0;

             transform-origin:50% 50%; }
    .scrim { position:absolute; inset:0; z-index:1; pointer-events:none; }
    .scrim.l { background:linear-gradient(90deg, rgba(19,21,22,.88) 0%,
               rgba(19,21,22,.72) 36%, rgba(19,21,22,.18) 60%, rgba(19,21,22,0) 74%); }
    .scrim.r { background:linear-gradient(270deg, rgba(19,21,22,.88) 0%,

    .scrim.b { background:linear-gradient(0deg, rgba(19,21,22,.90) 0%,

    .flash { position:absolute; inset:0; z-index:3; background:#DCEFEC; opacity:0;

    .stage { position:relative; z-index:2; }

    /* CONCEPTUAL VISUALIZATION chip -- top-right, inside the safe box. */

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

  // 104 dots filling a 58% column is the biggest single area change in the video.
  // The count-up rides it; the GRID is the beat. Chapter opener: first spoken
  // beat bound to 0.350. Count-up ENDS on the word that names the number, so
  // the counter never finishes before or after "a hundred and four" is said.
  var grid = document.getElementById('t-grid');
  for (var i = 0; i < 104; i++) {
    var d = document.createElement('i'); d.id = 'ct-' + i; grid.appendChild(d);
    tl.set('#ct-' + i, { opacity:0, scale:0.3, transformOrigin:'50% 50%' }, 0);
    tl.to('#ct-' + i, { opacity:1, scale:1, duration:0.30 }, 0.350 + i*0.022);
  }
  var counter = { v:0 }, el = document.getElementById('t-n');
  tl.set('#t-n', { opacity:0 }, 0);   // restates the CSS default, never the sole source
  tl.to('#t-n', { opacity:1, duration:0.30 }, 0.350);
  tl.to(counter, { v:104, duration:(7.570 - 0.350), ease:'power1.out',
                   onUpdate:function(){ el.textContent = Math.round(counter.v); } }, 0.350);
  tl.fromTo('#t-h', { opacity:0, y:34 }, { opacity:1, y:0, duration:0.55 }, 7.570+0.70);
  // split the cohort into the two arms -- a whole-grid recolour, on the word
  // that introduces the comparison arm ("against the same cream without it").
  for (var j = 0; j < 104; j++) {
    tl.to('#ct-' + j, { backgroundColor: (j % 2 ? '#59B8AE' : '#9C978D'),
                        duration:0.50 }, 9.920 + (j % 13) * 0.05);
  }
  tl.fromTo('#t-cite', { opacity:0 }, { opacity:1, duration:0.45 }, 9.920+1.50);
  // The grid physically SPLITS into its two arms -- a whole-column move, where
  // recolouring 104 small dots measured as nothing.
  tl.to('#t-grid', { scaleX:0.92, x:-26, transformOrigin:'50% 50%', duration:1.50,
                     ease:'power2.inOut' }, 9.920+2.70);
  tl.to('#t-grid', { scaleY:1.10, duration:1.80, ease:'power2.inOut' }, 9.920+5.70);

  // Chapter band: washes in over the wipe, recedes at 1.6s -- see CHBAND_CSS.
  tl.fromTo('#ch-wash', { scaleX:0 }, { scaleX:1, duration:0.45, ease:'power2.inOut' }, 0.05);
  tl.to('#ch-band', { opacity:0, y:-26, duration:0.50, ease:'power2.inOut' }, 1.6);
  tl.fromTo('#gi', { scale:1.16, x:80, y:0 }, { scale:1.0, x:-80, y:40, duration:12.700, ease:'none' }, 0);

    tl.to({}, { duration: 12.658 }, 0);   // full-span anchor -- always last
    window.__timelines["16-trial104"] = tl;
  </script>
